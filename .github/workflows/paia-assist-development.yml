name: PAIA Assist Source Development Evidence
on:
  workflow_dispatch:
  push:
    branches: ['evidence/assist-development-20261018']
    paths:
      - '.github/workflows/paia-assist-development.yml'
      - 'extension/scripts/capture-assist-development.mjs'
permissions:
  contents: read
jobs:
  source-development:
    if: github.ref == 'refs/heads/evidence/assist-development-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: extension
    env:
      CI: '1'
      PAIA_HEADLESS: '1'
      PLAYWRIGHT_MODULE: playwright
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Use existing hosted Chrome and font dependencies
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-color-emoji
      - name: Check default-off Assist and insert a saved prompt without sending
        run: |
          set -o pipefail
          mkdir -p work/assist-development
          node scripts/capture-assist-development.mjs 2>&1 | tee work/assist-development/capture.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assist-development-${{ github.sha }}-${{ github.run_attempt }}
          path: extension/work/assist-development/
          if-no-files-found: error
          retention-days: 7
