name: Website v5 isolated workspace
on:
  push:
    branches: ['website/context-motion-v5']
    paths: ['.github/workflows/paia-website-v5-workspace.yml', '.v5-transfer/READY']
permissions:
  contents: write
concurrency:
  group: website-v5-isolated
  cancel-in-progress: false
jobs:
  workspace:
    if: github.ref == 'refs/heads/website/context-motion-v5'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Repair only the verified website visual defect
        run: |
          mkdir -p /tmp/website-v5-proof
          python .v5-transfer/repair.py
          python website/build.py --check
      - name: Prepare website browser
        run: |
          python -m pip install -r website/requirements.txt Pillow==11.3.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk fonts-liberation
      - name: Affected actual HTTP regression
        env:
          WEBSITE_TEST_OUTPUT: /tmp/website-v5-proof/tests
        run: python website/test.py --smoke 2>&1 | tee /tmp/website-v5-proof/tests.log
      - name: Actual HTTP final visual and motion evidence
        run: python website/review_motion.py --output /tmp/website-v5-proof/visual 2>&1 | tee /tmp/website-v5-proof/visual.log
      - name: Commit only repaired website source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/website/site.css website/test.py
          git diff --cached --stat > /tmp/website-v5-proof/changes.txt
          git diff --cached --quiet || git commit -m 'fix(website): preserve Chinese title contrast on the context stage'
          git push origin HEAD:website/context-motion-v5
          git rev-parse HEAD > /tmp/website-v5-proof/implemented-head.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: website-v5-proof
          path: /tmp/website-v5-proof/
          retention-days: 7
          if-no-files-found: error
