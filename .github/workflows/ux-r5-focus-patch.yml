name: UX-R5 focus preservation patch

on:
  push:
    branches: [ux-r5]
    paths:
      - '.github/workflows/ux-r5-focus-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-r5
          fetch-depth: 0
      - name: Preserve Topic view switch focus
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('extension/ui/thoughts.js')
          text=p.read_text()
          old="const topicId=this.id;this.pendingView=view;$('ai-presentation-toggle').checked=view==='ai';$('ai-presentation-toggle').disabled=true;"
          new="const topicId=this.id,restoreFocus=document.activeElement===$('ai-presentation-toggle');this.pendingView=view;$('ai-presentation-toggle').checked=view==='ai';$('ai-presentation-toggle').disabled=true;"
          if text.count(old)!=1: raise SystemExit(f'first match count={text.count(old)}')
          text=text.replace(old,new,1)
          old="try{await change;}finally{this.viewSwitchPromise=null;this.pendingView=null;$('ai-presentation-toggle').checked=this.view==='ai';$('ai-presentation-toggle').disabled=false;}"
          new="try{await change;}finally{this.viewSwitchPromise=null;this.pendingView=null;$('ai-presentation-toggle').checked=this.view==='ai';$('ai-presentation-toggle').disabled=false;if(restoreFocus&&this.id===topicId)$('ai-presentation-toggle').focus({preventScroll:true});}"
          if text.count(old)!=1: raise SystemExit(f'second match count={text.count(old)}')
          p.write_text(text.replace(old,new,1))
          PY
      - name: Syntax guard
        run: node --check extension/ui/thoughts.js
      - name: Commit patch and remove staging workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ux-r5-focus-patch.yml
          git add extension/ui/thoughts.js
          git commit -m 'fix(ux-r5): preserve focus across Topic view switch'
          git push origin HEAD:ux-r5
