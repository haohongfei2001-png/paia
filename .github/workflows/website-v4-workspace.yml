name: Website v4 workspace
on:
  push:
    branches: ['website/scroll-context-v4']
    paths: ['.github/workflows/website-v4-workspace.yml', '.v4-transfer/READY', '.v4-transfer/repair.py']
permissions:
  contents: write
concurrency:
  group: website-v4-workspace
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  workspace:
    if: github.repository == 'haohongfei2001-png/paia' && github.ref == 'refs/heads/website/scroll-context-v4'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Restore exact authored website sources
        run: |
          mkdir -p /tmp/website-v4-proof
          cat .v4-transfer/*.part > /tmp/v4.tar.xz
          echo '1a521afe3bd074b0a18f34ec70ef65b595a7f2fe069275efa904723042f212f4  /tmp/v4.tar.xz' | sha256sum -c -
          python - <<'PY'
          import tarfile
          with tarfile.open('/tmp/v4.tar.xz') as t:
              t.extractall('.',filter='data')
          PY
          python .v4-transfer/repair.py
          git restore -- .github/workflows/paia-website.yml
      - name: Install authoring and browser tools
        run: |
          python -m pip install -r website/requirements.txt Pillow==11.3.0 pymupdf==1.26.7 'fonttools[woff]'
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-liberation fonts-noto-cjk
      - name: Prepare local assets and generate all pages
        id: build
        run: |
          python website/prepare_assets.py
          python website/build.py
          python website/render_social.py
          python website/build.py --check
          cp assets/website/asset-lock.json /tmp/website-v4-proof/asset-lock.json
      - name: Real HTTP website regression
        id: tests
        env:
          WEBSITE_TEST_OUTPUT: /tmp/website-v4-proof/tests
          WEBSITE_TEST_PROGRESS: '1'
        run: python website/test.py 2>&1 | tee /tmp/website-v4-proof/tests.log
      - name: Actual website PDF and motion frames
        id: pdf
        if: always() && steps.build.outcome == 'success'
        run: python -X faulthandler -u website/export_pdf.py --output /tmp/website-v4-proof 2>&1 | tee /tmp/website-v4-proof/pdf.log
      - name: Commit verified website sources on the same branch
        if: steps.tests.outcome == 'success' && steps.pdf.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- website assets en zh '*.html' sitemap.xml robots.txt WEBSITE_DESIGN.md
          if git diff --cached --name-only | grep -E -q '^(extension/|.github/)'; then echo 'Writer scope violation'; exit 1; fi
          git diff --cached --stat > /tmp/website-v4-proof/changes.txt
          git diff --cached --quiet || git commit -m 'website: implement selected art direction, native scroll collection and complete bilingual pages'
          git push origin HEAD:website/scroll-context-v4
          git rev-parse HEAD > /tmp/website-v4-proof/implemented-head.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: website-v4-proof
          path: /tmp/website-v4-proof/
          retention-days: 7
          if-no-files-found: error
