name: Website v4 workspace
on:
  push:
    branches: ['website/scroll-context-v4']
    paths: ['.github/workflows/website-v4-workspace.yml', 'website/v4-build.py', 'website/v4-check.py', 'website/v4-copy.json', 'website/v4.css', 'website/v4.js', 'website/v4-pdf.py', 'website/v4-assets.py']
permissions:
  contents: write
concurrency:
  group: website-v4-workspace
  cancel-in-progress: false
jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Export exact website source without private data
        run: |
          mkdir -p /tmp/website-v4-proof
          git rev-parse HEAD > /tmp/website-v4-proof/source-head.txt
          git archive --format=zip -o /tmp/website-v4-proof/source.zip HEAD website assets en zh '*.html' .github/workflows WEBSITE_DESIGN.md extension/docs/consumer-product-v1/STATUS.md extension/docs/consumer-product-v1/DEFERRED_FINAL_GATES.md extension/docs/consumer-product-v1/MASTER_PLAN.md extension/docs/consumer-product-v1/AUTHORITY.md extension/docs/consumer-product-v1/EXECUTION_PROTOCOL.md extension/manifest.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Browser tools
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0 pymupdf==1.26.4
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-liberation fonts-noto-cjk fonts-ebgaramond
      - name: Observe existing production (no data submission)
        if: ${{ !hashFiles('website/v4-build.py') }}
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json
          with sync_playwright() as p:
              b=p.chromium.launch()
              page=b.new_page(viewport={'width':1440,'height':1000},device_scale_factor=1)
              page.goto('https://inputarchive.com/',wait_until='networkidle')
              page.screenshot(path='/tmp/website-v4-proof/production-before.png',full_page=True)
              Path('/tmp/website-v4-proof/production-before.html').write_text(page.content())
              b.close()
          PY
      - name: Build and verify website revision
        if: ${{ hashFiles('website/v4-build.py') != '' }}
        run: |
          python website/v4-assets.py
          python website/v4-build.py
          python website/v4-check.py
          python website/v4-pdf.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- website assets en zh '*.html' sitemap.xml robots.txt
          git diff --cached --quiet || git commit -m 'website: generate and verify scroll-context production pages'
          git push origin HEAD:website/scroll-context-v4
          git archive --format=zip -o /tmp/website-v4-proof/implemented-source.zip HEAD website assets en zh '*.html' sitemap.xml robots.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: website-v4-proof
          path: /tmp/website-v4-proof/
          retention-days: 7
          if-no-files-found: error
