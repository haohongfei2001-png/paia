name: PAIA Selected Website Materialize
on:
  push:
    branches: [website/editorial-context-20260926]
    paths:
      - 'website/.selected/**'
      - '.github/workflows/website-selected-materialize.yml'
permissions:
  contents: write
concurrency:
  group: website-selected-materialize
  cancel-in-progress: true
jobs:
  materialize:
    if: github.repository == 'haohongfei2001-png/paia'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify and apply reviewed website source bundle
        run: |
          cat website/.selected/part*.b64 | tr -d '\n' > /tmp/selected.b64
          base64 -d /tmp/selected.b64 | xz -d > /tmp/selected.json
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path.cwd()
          bundle=json.loads(Path('/tmp/selected.json').read_text(encoding='utf-8'))
          expected={
            'website/home.py','website/build.py','website/test.py','website/verify_live.py',
            'website/render_social.py','website/README.md','assets/website/site.css',
            'assets/website/favicon.svg','.github/workflows/paia-website.yml'
          }
          assert set(bundle)==expected, sorted(set(bundle)^expected)
          for name,spec in bundle.items():
              p=root/name
              text=p.read_text(encoding='utf-8')
              got=hashlib.sha256(text.encode()).hexdigest()
              assert got==spec['base_sha256'], (name,got,spec['base_sha256'])
              if 'text' in spec:
                  text=spec['text']
              else:
                  for i,j,replacement in reversed(spec['ops']):
                      assert 0 <= i <= j <= len(text), (name,i,j,len(text))
                      text=text[:i]+replacement+text[j:]
              got=hashlib.sha256(text.encode()).hexdigest()
              assert got==spec['sha256'], (name,got,spec['sha256'])
              p.write_text(text,encoding='utf-8')
          print('Reviewed source bundle applied:', len(bundle), 'files')
          PY
          rm -rf website/.selected .github/workflows/website-selected-materialize.yml
      - name: Install browser and local fonts
        run: |
          python -m pip install -r website/requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk fonts-liberation
      - name: Build, render and verify exact sources
        env:
          WEBSITE_TEST_OUTPUT: website-test-artifacts
        run: |
          python website/render_social.py
          python website/build.py
          python website/build.py --check
          python website/test.py
      - name: Commit only the reviewed website boundary
        run: |
          rm -rf website-test-artifacts website/__pycache__
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          changed |= set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          bad=[p for p in changed if p.startswith('extension/') or p == 'CNAME']
          assert not bad, bad
          assert 'index.html' in changed and 'assets/website/site.css' in changed
          print('Website-only changed paths:', len(changed))
          PY
          git config user.name 'PAIA Website Build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/paia-website.yml website assets/website '*.html' en zh sitemap.xml robots.txt
          git status --short
          git commit -m 'Refound PAIA website around continuous personal context'
          git push origin HEAD:refs/heads/website/editorial-context-20260926
