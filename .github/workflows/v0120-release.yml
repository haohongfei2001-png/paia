name: PAIA v0.12.0 release verification

on:
  push:
    branches:
      - release/v0.12.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.12.0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact verified-runtime basis
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          BASE='5e8d743c16211506498f64bce5050383470e86ce'
          runtime=['adapter','content','background','core','ui','icons']
          diff=subprocess.run(['git','diff','--exit-code',BASE,'--',*[f'extension/{p}' for p in runtime]],text=True,capture_output=True)
          assert diff.returncode==0, 'v0.12.0 changes product runtime bytes:\n'+diff.stdout+diff.stderr
          current=json.loads(Path('extension/manifest.json').read_text())
          baseline=json.loads(subprocess.check_output(['git','show',f'{BASE}:extension/manifest.json'],text=True))
          assert current['version']=='0.12.0'
          assert current['version_name']=='v0.12.0 Thought Evolution & Shared Context'
          current_runtime=dict(current); baseline_runtime=dict(baseline)
          for key in ('version','version_name'):
              current_runtime.pop(key,None); baseline_runtime.pop(key,None)
          assert current_runtime==baseline_runtime, 'manifest changed beyond version/version_name'
          package=json.loads(Path('extension/package.json').read_text())
          base_package=json.loads(subprocess.check_output(['git','show',f'{BASE}:extension/package.json'],text=True))
          assert package['version']=='0.12.0'
          p=dict(package); b=dict(base_package); p.pop('version'); b.pop('version')
          assert p==b, 'package.json changed beyond version'
          out=Path('extension/work/v0120'); out.mkdir(parents=True,exist_ok=True)
          (out/'runtime-basis.json').write_text(json.dumps({
              'release':'0.12.0','verifiedRuntimeBase':BASE,
              'runtimeDirectoriesByteIdentical':runtime,
              'manifestOnlyVersionMetadataChanged':True,
              'packageOnlyVersionChanged':True
          },indent=2)+'\n')
          PY
      - name: Verify release metadata contract
        working-directory: extension
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('manifest.json').read_text())
          package=json.loads(Path('package.json').read_text())
          assert manifest['version']=='0.12.0'
          assert manifest['version_name']=='v0.12.0 Thought Evolution & Shared Context'
          assert package['version']=='0.12.0'
          assert Path('README.md').read_text().startswith('# PAIA — Personal AI Input Archive\n\n**Current release: v0.12.0')
          assert Path('README_HISTORY.md').read_text().startswith('## v0.11.1 reading closure')
          assert Path('V0120_RELEASE.md').is_file()
          PY
      - name: Verify source and development package boundaries
        working-directory: extension
        run: |
          mkdir -p work/v0120
          python3 scripts/check_package.py | tee work/v0120/source-package.log
          node scripts/check_development.mjs | tee work/v0120/development.log
      - name: Build and verify emitted v0.12.0 release
        working-directory: extension
        run: |
          python3 scripts/build_current_release.py work/v0120/release | tee work/v0120/release-build.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          release=Path('work/v0120/release')
          manifest=json.loads((release/'manifest.json').read_text())
          assert manifest['version']=='0.12.0'
          assert manifest['version_name']=='v0.12.0 Thought Evolution & Shared Context'
          assert (release/'V0120_RELEASE.md').is_file()
          assert not (release/'development').exists()
          assert not (release/'README_HISTORY.md').exists()
          assert not any(p.name.startswith('Preview PAIA') for p in release.rglob('*'))
          (Path('work/v0120')/'release-contract.json').write_text(json.dumps({
              'version':manifest['version'],'versionName':manifest['version_name'],
              'developmentExcluded':True,'releaseRecordIncluded':True
          },indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paia-v0.12.0-release-evidence-${{ github.sha }}
          path: extension/work/v0120/**
          if-no-files-found: error
          retention-days: 14
