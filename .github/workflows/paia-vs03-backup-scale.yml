name: PAIA VS-03 Backup Scale Diagnostic
on:
  pull_request:
    types: [synchronize]
    paths:
      - 'extension/tests/cpv1-03-6-backup-scale-benchmark.mjs'
      - 'extension/tests/fixtures/scale-v092.mjs'
      - 'extension/core/backup-service.js'
      - 'extension/core/backup-format.js'
      - '.github/workflows/paia-vs03-backup-scale.yml'
permissions:
  contents: read
jobs:
  backup-scale:
    if: contains(github.event.pull_request.body, 'PAIA_BACKUP_SCALE_DIAGNOSTIC')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Use hosted Chrome extension CDP
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Measure synthetic 10k Input export and restore
        env:
          CI: '1'
          PLAYWRIGHT_MODULE: playwright
          PAIA_BACKUP_SCALE_SIZE: '10000'
          PAIA_BACKUP_SCALE_REPORT: ${{ github.workspace }}/backup-scale-report.json
        run: node tests/cpv1-03-6-backup-scale-benchmark.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backup-scale-report
          path: backup-scale-report.json
          if-no-files-found: warn
