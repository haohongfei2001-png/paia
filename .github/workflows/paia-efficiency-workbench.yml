name: PAIA isolated efficiency workbench
on:
  push:
    branches: ['engineering/execution-efficiency-20261012']
    paths: ['.github/workflows/paia-efficiency-workbench.yml']
permissions:
  contents: write
concurrency:
  group: paia-efficiency-integration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/engineering/execution-efficiency-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the exact two-file deadline correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/paia264-deadline-evidence
          gh api repos/haohongfei2001-png/paia/git/blobs/8b4342c60602d7e6ac53200d143510269c99ae6b --jq .content | base64 -d > /tmp/paia264-deadline.py
          test "$(git hash-object /tmp/paia264-deadline.py)" = 8b4342c60602d7e6ac53200d143510269c99ae6b
          python /tmp/paia264-deadline.py
          git rm .github/workflows/paia-efficiency-workbench.yml
          test "$(git write-tree)" = 27d57fdf61fc9038cb1f78d46d299ec66bc2cfe4
          git diff --cached --check 660ec9fba8a27b789df0f3018c25bbbada8b1b1f
          git diff --cached --name-only 660ec9fba8a27b789df0f3018c25bbbada8b1b1f | tee /tmp/paia264-deadline-evidence/paths.txt
          test "$(wc -l < /tmp/paia264-deadline-evidence/paths.txt)" = 2
      - name: Test actual deadline launcher and all retained admission contracts
        working-directory: extension
        run: |
          set -euo pipefail
          node scripts/check-ui-refresh-ci.mjs | tee /tmp/paia264-deadline-evidence/preflight.log
          node --test --test-concurrency=1 tests/browser-corpus.test.mjs tests/*admission.test.mjs tests/*partition.test.mjs tests/*-ci.test.mjs | tee /tmp/paia264-deadline-evidence/admission.log
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run check
          node scripts/check_development.mjs
      - name: Prepare hosted full Chrome
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "PAIA_CHROME=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
          sudo python - <<'PY'
          from pathlib import Path
          for p in [Path('/etc/apt/sources.list'),*Path('/etc/apt').glob('*mirrors*.txt'),*Path('/etc/apt/sources.list.d').glob('*.list'),*Path('/etc/apt/sources.list.d').glob('*.sources')]:
            if p.is_file():
              t=p.read_text();p.write_text(t.replace('http://azure.archive.ubuntu.com/ubuntu','https://archive.ubuntu.com/ubuntu').replace('https://azure.archive.ubuntu.com/ubuntu','https://archive.ubuntu.com/ubuntu'))
          PY
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-wqy-zenhei xvfb
      - name: Run both whole UIR02 native journeys under the original combined 300s budget
        working-directory: extension
        env:
          CI: '1'
          PAIA_HEADLESS: '1'
          PLAYWRIGHT_MODULE: playwright
        run: |
          set -euo pipefail
          xvfb-run -a node --test --test-concurrency=1 tests/uir-02-archive-search-reader-chrome-e2e.test.mjs | tee /tmp/paia264-deadline-evidence/browser.log
      - name: Preserve the two verified immutable Git blobs, without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,hashlib,urllib.request,subprocess
          from pathlib import Path
          expected={'extension/tests/uir-02-archive-search-reader-chrome-e2e.test.mjs':'cbc6773f7b4f6f98f19bd3390dee1f955334d515','extension/tests/browser-corpus.test.mjs':'38862511325051e6f49f2e100312d14e3358f54f'}
          for p,sha in expected.items():
            raw=Path(p).read_bytes();assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha,p
            req=urllib.request.Request('https://api.github.com/repos/haohongfei2001-png/paia/git/blobs',data=json.dumps({'content':raw.decode(),'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},method='POST')
            with urllib.request.urlopen(req,timeout=30) as response:created=json.load(response)
            assert created['sha']==sha
          tree=subprocess.check_output(['git','write-tree'],text=True).strip();assert tree=='27d57fdf61fc9038cb1f78d46d299ec66bc2cfe4'
          Path('/tmp/paia264-deadline-evidence/identity.json').write_text(json.dumps({'base':'660ec9fba8a27b789df0f3018c25bbbada8b1b1f','tree':tree,'blobs':expected,'remoteRefsChanged':False},indent=2)+'\n')
          print('EXACT_DEADLINE_CORRECTION_PASS; no remote refs changed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paia264-deadline-validation
          path: /tmp/paia264-deadline-evidence/
          if-no-files-found: error
          retention-days: 14
