name: PAIA isolated efficiency workbench
on:
  push:
    branches: ['engineering/execution-efficiency-20261012']
    paths: ['.github/workflows/paia-efficiency-workbench.yml']
permissions:
  contents: read
concurrency:
  group: paia-efficiency-workbench-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/engineering/execution-efficiency-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply only exact reviewed changes in this isolated checkout
        run: |
          set -euo pipefail
          mkdir -p /tmp/paia-efficiency-input /tmp/paia-efficiency-evidence
          cp .paia-efficiency-code.py .paia-efficiency-docs.py .paia-efficiency-newtest.mjs .paia-efficiency-expected.json /tmp/paia-efficiency-input/
          git switch --detach b8a09bbfd4b57447c71f8b18bb1e528c65e0668e
          python /tmp/paia-efficiency-input/.paia-efficiency-code.py
          python /tmp/paia-efficiency-input/.paia-efficiency-docs.py
          cp /tmp/paia-efficiency-input/.paia-efficiency-newtest.mjs extension/tests/browser-corpus.test.mjs
          python - <<'PY'
          import json,hashlib,subprocess
          from pathlib import Path
          expected=json.loads(Path('/tmp/paia-efficiency-input/.paia-efficiency-expected.json').read_text())
          for path,digest in expected.items():
              actual=hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if actual!=digest: raise SystemExit(f'EXACT_BYTES_MISMATCH {path} expected={digest} actual={actual}')
          subprocess.run(['git','add','--',*expected],check=True)
          changed=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert sorted(changed)==sorted(expected),(changed,list(expected))
          subprocess.run(['git','diff','--cached','--check'],check=True)
          Path('/tmp/paia-efficiency-evidence/identities.json').write_text(json.dumps(expected,indent=2)+'\n')
          print('EXACT_REVIEWED_BYTES_PASS',len(expected))
          PY
      - name: Existing admission and independent counterexamples
        working-directory: extension
        run: |
          set -euo pipefail
          node scripts/check-ui-refresh-ci.mjs | tee /tmp/paia-efficiency-evidence/preflight.log
          node --test --test-concurrency=1 tests/ai-cost-current-browser-admission.test.mjs tests/cpv1-topic-05-2-root-routing.test.mjs tests/current-browser-nine-partition.test.mjs tests/d5-full-browser-partition.test.mjs tests/iah11-current-browser-admission.test.mjs tests/prompt-stage3a-route-admission.test.mjs tests/settings-removed-placement-admission.test.mjs tests/topic-return-position-ci.test.mjs tests/topic-section-actions-ci.test.mjs tests/topic-writing-ci.test.mjs tests/browser-corpus.test.mjs | tee /tmp/paia-efficiency-evidence/metadata.log
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run check
          node scripts/check_development.mjs
          npm run build:release
      - name: Prepare hosted Chrome and actual CJK fonts
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "PAIA_CHROME=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
          sudo python - <<'PY'
          from pathlib import Path
          for p in [Path('/etc/apt/sources.list'),*Path('/etc/apt').glob('*mirrors*.txt'),*Path('/etc/apt/sources.list.d').glob('*.list'),*Path('/etc/apt/sources.list.d').glob('*.sources')]:
              if p.is_file():
                  text=p.read_text()
                  p.write_text(text.replace('http://azure.archive.ubuntu.com/ubuntu','https://archive.ubuntu.com/ubuntu').replace('https://azure.archive.ubuntu.com/ubuntu','https://archive.ubuntu.com/ubuntu'))
          PY
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-wqy-zenhei xvfb
      - name: Complete original UIR-02 source and release journeys
        working-directory: extension
        env:
          CI: '1'
          PLAYWRIGHT_MODULE: playwright
          PAIA_HEADLESS: '0'
        run: |
          set -euo pipefail
          xvfb-run -a node --test --test-concurrency=1 tests/uir-02-archive-search-reader-chrome-e2e.test.mjs | tee /tmp/paia-efficiency-evidence/uir02.log
      - name: Create immutable reviewed Git objects only; do not move any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,hashlib,urllib.request,subprocess
          from pathlib import Path
          root='https://api.github.com/repos/haohongfei2001-png/paia/'
          def api(path,data=None):
              req=urllib.request.Request(root+path,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},method='GET' if data is None else 'POST')
              with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
          expected=json.loads(Path('/tmp/paia-efficiency-input/.paia-efficiency-expected.json').read_text())
          entries=[]
          for path,digest in expected.items():
              raw=Path(path).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==digest,path
              blob=api('git/blobs',{'content':raw.decode(),'encoding':'utf-8'})
              entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          observed=api('branches/main')['commit']['sha']
          tree=api('git/trees',{'base_tree':'5a60988441865e9fb3899eac752b3c08bb78cbd7','tree':entries})
          result={'base':'b8a09bbfd4b57447c71f8b18bb1e528c65e0668e','observedMain':observed,'tree':tree['sha'],'files':entries,'branchUpdated':False,'mainUpdated':False}
          Path('/tmp/paia-efficiency-evidence/publication.json').write_text(json.dumps(result,indent=2)+'\n')
          print('PUBLISH_TREE='+tree['sha'])
          print('OBSERVED_MAIN='+observed)
          print('No branch, main, PR, deployment or other writer was changed by this job.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paia-efficiency-validation
          path: |
            /tmp/paia-efficiency-evidence/
            extension/work/ui-refresh/
          retention-days: 14
          if-no-files-found: error
