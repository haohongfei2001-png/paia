name: PAIA isolated efficiency workbench
on:
  push:
    branches: ['engineering/execution-efficiency-20261012']
    paths: ['.github/workflows/paia-efficiency-workbench.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: paia-efficiency-workbench-${{ github.ref }}
  cancel-in-progress: false
jobs:
  snapshot:
    if: github.ref == 'refs/heads/engineering/execution-efficiency-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Retain exact public integration inputs without changing any remote ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/paia264-final-input
          git update-ref refs/snapshot/pr264 df979f60a6244d79644e65a65372d59917d91bb5
          git update-ref refs/snapshot/pr266 22c274049925e459b5bc67e9c6d187e848e9bca2
          git update-ref refs/snapshot/main 8e56ab340f2065b95a909a97b75b6b8eb1ce8bdb
          git bundle create /tmp/paia264-final-input/source.bundle refs/snapshot/pr264 refs/snapshot/pr266 refs/snapshot/main
          git bundle verify /tmp/paia264-final-input/source.bundle
          gh api repos/haohongfei2001-png/paia/actions/jobs/114844385818/logs > /tmp/paia264-final-input/pr266-prompt.log
          git ls-remote origin refs/heads/main refs/heads/engineering/execution-efficiency-20261012 refs/heads/codex/main8e-section-fixture-20261012 > /tmp/paia264-final-input/observed-refs.txt
          sha256sum /tmp/paia264-final-input/* > /tmp/paia264-final-input/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paia264-final-input
          path: /tmp/paia264-final-input/
          retention-days: 3
          if-no-files-found: error
