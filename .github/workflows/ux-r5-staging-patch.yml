name: UX-R5 staging patch

on:
  push:
    branches:
      - ux-r5
    paths:
      - '.github/workflows/ux-r5-staging-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-r5
          fetch-depth: 0
      - name: Apply exact patch
        run: python3 scripts/ux_r5_staging_patch.py
      - name: Syntax guard
        run: |
          node --check extension/ui/thoughts.js
          node --check extension/ui/ai-candidate.js
          node --check extension/core/organizer/ai-presentation.js
          node --check extension/core/organizer/ai-candidate.js
          node --check extension/core/backup-service.js
      - name: Commit patch and remove staging files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ux-r5-staging-patch.yml scripts/ux_r5_staging_patch.py
          git add extension/ui/thoughts.js extension/ui/thought-reader.css extension/core/backup-service.js extension/tests/ai-product-v080.test.mjs
          git commit -m 'feat(ux-r5): wire topic-scoped organize UX'
          git push origin HEAD:ux-r5
