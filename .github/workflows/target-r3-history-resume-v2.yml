name: Target R3 history resume v2

on:
  push:
    branches: [ux-r5-history-resume-fix]
    paths:
      - .github/workflows/target-r3-history-resume-v2.yml

permissions:
  contents: write

env:
  CI: '1'
  PLAYWRIGHT_MODULE: playwright

jobs:
  target:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-r5-history-resume-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Prepare Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_BIN"
          echo "PAIA_CHROME=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Run R3 history and anchor regressions
        run: >-
          xvfb-run -a node --test --test-concurrency=1
          --test-name-pattern='UX-R3 (browser history restore preempts|same-session Back restores|removed mid-topic reading anchor opens|F-LARGE)'
          tests/ux-r3-history-preemption-chrome-e2e.test.mjs
          tests/ux-r3-thought-chrome-e2e.test.mjs
      - name: Remove temporary workflow
        if: always()
        working-directory: .
        shell: bash
        run: |
          rm -f .github/workflows/target-r3-history-resume-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/target-r3-history-resume-v2.yml
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove targeted R3 verification workflow v2'
            git push origin HEAD:ux-r5-history-resume-fix
          fi
