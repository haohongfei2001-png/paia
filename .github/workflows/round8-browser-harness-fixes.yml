name: Round 8 browser harness fixes

on:
  push:
    branches:
      - round8/browser-harness-fixes
    paths:
      - .github/workflows/round8-browser-harness-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: round8/browser-harness-fixes
      - name: Harden deterministic browser fixtures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          backup=Path('extension/tests/backup-v081-chrome-e2e.test.mjs')
          text=backup.read_text(encoding='utf-8')
          old="filter:path=>!/(\\/\\.git(?:\\/|$)|\\/work(?:\\/|$)|\\/outputs(?:\\/|$))/.test(path)"
          new="filter:path=>{const rel=path.startsWith(root)?path.slice(root.length):path;return !/^(?:\\.git|work|outputs)(?:\\/|$)/.test(rel);}"
          if old not in text: raise SystemExit('backup filter target not found')
          backup.write_text(text.replace(old,new,1),encoding='utf-8')

          memory=Path('extension/tests/memory-v0100-chrome-e2e.test.mjs')
          text=memory.read_text(encoding='utf-8')
          old="await p.locator('[data-memory-topic=\"'+f.career.id+'\"] select').selectOption('allowed');await p.locator('[data-memory-topic=\"'+f.career.id+'\"] summary').click();"
          new="await p.locator('[data-memory-topic=\"'+f.career.id+'\"] select').selectOption('allowed');await eventually(async()=>(await rpc(p,'PAIA_MEMORY_STATUS')).allowed===2,'career authorization settled');await p.locator('[data-memory-topic=\"'+f.career.id+'\"] summary').click();"
          if old not in text: raise SystemExit('memory race target not found')
          memory.write_text(text.replace(old,new,1),encoding='utf-8')

          round8=Path('extension/tests/round8-shared-context-chrome-e2e.test.mjs')
          text=round8.read_text(encoding='utf-8')
          old="assert.equal((await rpc(p,'PAIA_MEMORY_BUILD',{options:{query:'ROUND8_BROWSER_SHARED'}})).items.length,0);"
          new="await eventually(async()=>{const r=await p.evaluate(x=>chrome.runtime.sendMessage(x),{type:'PAIA_MEMORY_BUILD',options:{query:'ROUND8_BROWSER_SHARED'}});if(!r.ok&&r.error==='MEMORY_STALE')return false;assert.equal(r.ok,true,JSON.stringify(r));return r.data.items.length===0;},'initial direct Input remains denied while capture state settles');"
          if old not in text: raise SystemExit('round8 stale target not found')
          round8.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit test-only fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/tests/backup-v081-chrome-e2e.test.mjs extension/tests/memory-v0100-chrome-e2e.test.mjs extension/tests/round8-shared-context-chrome-e2e.test.mjs
          git commit -m 'test: stabilize Round 8 browser acceptance harness'
          git push origin HEAD:refs/heads/round8/browser-harness-fixes
