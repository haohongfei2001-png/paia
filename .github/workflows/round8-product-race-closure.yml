name: Round 8 product race closure

on:
  push:
    branches:
      - round8/product-race-closure
    paths:
      - .github/workflows/round8-product-race-closure.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: round8/product-race-closure
      - name: Close Memory preview and linked-reading races
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          memory=Path('extension/ui/memory.js')
          text=memory.read_text(encoding='utf-8')
          old="invalidate(message=true){if(!this.preview)return;this.preview=null;this.removed.clear();$('memory-preview-body').replaceChildren();$('memory-copy').disabled=true;$('memory-markdown').disabled=true;if(message&&this.page==='preview'){this.feedback(messages.MEMORY_STALE,'stale');$('memory-size').textContent='旧预览已停用，请重新生成。';}}"
          new="invalidate(message=true){if(!this.preview)return;this.preview=null;this.removed.clear();$('memory-preview-body').replaceChildren();$('memory-copy').disabled=true;$('memory-markdown').disabled=true;if(message&&this.page==='preview'){this.feedback(messages.MEMORY_STALE,'stale');$('memory-size').textContent='旧预览已停用，请重新生成。';}}\n markPreviewStale(){if(!this.preview||this.preview.stale)return;this.preview.stale=true;$('memory-copy').disabled=true;$('memory-markdown').disabled=true;if(this.page==='preview')this.feedback('内容或授权已变化。旧预览保留供核对，但不能分享；请重新生成预览。','stale');}"
          if old not in text: raise SystemExit('memory invalidate target not found')
          text=text.replace(old,new,1)
          old="this.data=d;if(this.preview&&this.preview.generation!==d.generation)this.invalidate();"
          new="this.data=d;if(this.preview&&this.preview.generation!==d.generation)this.markPreviewStale();"
          if old not in text: raise SystemExit('memory refresh stale target not found')
          text=text.replace(old,new,1)
          old="$('memory-copy').disabled=!selected.length||p.externalAccess===false;$('memory-markdown').disabled=!selected.length||p.externalAccess===false;"
          new="$('memory-copy').disabled=!selected.length||p.externalAccess===false||p.stale===true;$('memory-markdown').disabled=!selected.length||p.externalAccess===false||p.stale===true;"
          if old not in text: raise SystemExit('memory render buttons target not found')
          text=text.replace(old,new,1)
          old="async share(format){if(this.busy||!this.preview)return;this.busy=true;const snapshot=this.preview;"
          new="async share(format){if(this.busy||!this.preview)return;if(this.preview.stale){this.feedback('旧预览仅供核对，内容或授权已经变化。请重新生成后再分享。','stale');return;}this.busy=true;const snapshot=this.preview;"
          if old not in text: raise SystemExit('memory share guard target not found')
          text=text.replace(old,new,1)
          old="if(e.code==='MEMORY_STALE')this.invalidate(false);this.feedback(messages[e.code]"
          new="if(e.code==='MEMORY_STALE')this.markPreviewStale();this.feedback(messages[e.code]"
          if old not in text: raise SystemExit('memory share catch target not found')
          text=text.replace(old,new,1)
          old="$('memory-copy').disabled=!this.preview||this.preview.externalAccess===false;$('memory-markdown').disabled=!this.preview||this.preview.externalAccess===false;"
          new="$('memory-copy').disabled=!this.preview||this.preview.externalAccess===false||this.preview.stale===true;$('memory-markdown').disabled=!this.preview||this.preview.externalAccess===false||this.preview.stale===true;"
          if old not in text: raise SystemExit('memory share finally target not found')
          memory.write_text(text.replace(old,new,1),encoding='utf-8')

          store=Path('extension/core/organizer/store.js')
          text=store.read_text(encoding='utf-8')
          old="  for(let attempt=0;attempt<3;attempt++){\n   const entry=await this.entry(id);\n   const result=await this.run(()=>this.repository.transaction(false,async t=>{"
          new="  for(let attempt=0;attempt<3;attempt++){\n   let entry;try{entry=await this.entry(id);}catch(error){if(error?.code==='INVALID_REQUEST'&&attempt<2){await new Promise(resolve=>setTimeout(resolve,0));continue;}throw error;}\n   const result=await this.run(()=>this.repository.transaction(false,async t=>{"
          if old not in text: raise SystemExit('readingEntry target not found')
          store.write_text(text.replace(old,new,1),encoding='utf-8')

          race=Path('extension/tests/reading-race-round7.test.mjs')
          text=race.read_text(encoding='utf-8')
          addition="\ntest('Round 8: reading tolerates a bounded transient invalid state while linked evidence maintenance settles',async()=>{const {s,id}=await setup();const original=s.entry.bind(s);let reads=0;s.entry=async key=>{reads++;if(reads===1){const e=Error('transient maintenance window');e.code='INVALID_REQUEST';throw e;}return original(key);};const result=await s.readingEntry(id);assert.equal(reads,2);assert.equal(result.id,id);});\n"
          if 'bounded transient invalid state' not in text: race.write_text(text+addition,encoding='utf-8')

          memtest=Path('extension/tests/memory-v0100-chrome-e2e.test.mjs')
          text=memtest.read_text(encoding='utf-8')
          old="await eventually(async()=>await p.locator('#memory-copy').isDisabled());assert.equal(await p.locator('.memory-context-entry').count(),0);await p.locator('#memory-rebuild').click();"
          new="await eventually(async()=>await p.locator('#memory-copy').isDisabled());assert.ok(await p.locator('.memory-context-entry').count()>0,'stale preview stays readable');assert.match(await p.locator('#memory-status').textContent(),/旧预览|重新生成/);await p.locator('#memory-rebuild').click();"
          if old not in text: raise SystemExit('memory stale-preview test target not found')
          text=text.replace(old,new,1).replace('stalePreviewCleared:true','stalePreviewRetainedReadOnly:true',1)
          memtest.write_text(text,encoding='utf-8')
          PY
      - name: Commit product fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/ui/memory.js extension/core/organizer/store.js extension/tests/reading-race-round7.test.mjs extension/tests/memory-v0100-chrome-e2e.test.mjs
          git commit -m 'fix: retain stale Context previews and tolerate linked-read maintenance races'
          git push origin HEAD:refs/heads/round8/product-race-closure
