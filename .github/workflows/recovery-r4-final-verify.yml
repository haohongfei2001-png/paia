name: UX-R4 final verification
on:
  push:
    branches: [recovery-r4-final-verify]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery-r4-final-verify
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply candidate changes
        run: |
          python3 -m py_compile .github/scripts/recovery_r4_final_verify.py
          python3 .github/scripts/recovery_r4_final_verify.py
          node --check extension/ui/archive.js
          node --check extension/ui/material-tray.js
          node --check extension/background/service-worker.js
          node --check extension/tests/ux-r2-reader-revisit-chrome-e2e.test.mjs
          git diff --check
      - name: Install browser dependencies
        run: |
          cd extension
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run targeted journeys
        run: |
          cd extension
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_BIN"
          PLAYWRIGHT_MODULE=playwright PAIA_CHROME="$CHROME_BIN" CHROME_PATH="$CHROME_BIN" xvfb-run -a node --test --test-concurrency=1 --test-name-pattern='overlapping startup|true dwell position|unorganized Input' tests/ux-r2-reader-revisit-chrome-e2e.test.mjs tests/ux-r4-search-reuse-chrome-e2e.test.mjs
      - name: Publish clean Recovery commit
        run: |
          git diff -- extension/ui/archive.js extension/ui/material-tray.js extension/background/service-worker.js extension/tests/ux-r2-reader-revisit-chrome-e2e.test.mjs > /tmp/product.patch
          test -s /tmp/product.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --detach 468d1dfb308409c585993357349e094e6640b5b0
          git apply /tmp/product.patch
          git add extension/ui/archive.js extension/ui/material-tray.js extension/background/service-worker.js extension/tests/ux-r2-reader-revisit-chrome-e2e.test.mjs
          git commit -m 'fix(ux-r4): close startup and purge races'
          git push origin HEAD:recovery-r4-1
