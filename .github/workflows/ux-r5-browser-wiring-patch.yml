name: UX-R5 browser wiring patch

on:
  push:
    branches:
      - ux-r5
    paths:
      - '.github/workflows/ux-r5-browser-wiring-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-r5
          fetch-depth: 0
      - run: python3 scripts/ux_r5_browser_wiring_patch.py
      - name: Syntax guard
        run: node --check extension/tests/ux-r5-ai-organize-chrome-e2e.test.mjs
      - name: Commit patch and remove staging files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ux-r5-browser-wiring-patch.yml scripts/ux_r5_browser_wiring_patch.py
          git add .github/workflows/paia-certification.yml extension/tests/ux-r5-ai-organize-chrome-e2e.test.mjs
          git commit -m 'test(browser): wire UX-R5 into certification'
          git push origin HEAD:ux-r5
