name: Patch R3 passive status priority

on:
  push:
    branches: [ux-r5]
    paths:
      - .github/workflows/patch-r3-passive-status-priority.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-r5
          fetch-depth: 0
      - name: Patch Topic restore priority and remove this workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('extension/ui/thoughts.js')
          s=p.read_text()
          replacements=[
            ("const saved=this.homePositions.get(id||'home'),sameSessionResume=!!id&&!!saved?.cursor&&(!saved.sort||saved.sort===this.readingSort),position=id?request('THOUGHT_POSITION',{position:{topicId:id}}).catch(()=>null):Promise.resolve(null);", "const saved=this.homePositions.get(id||'home'),sameSessionResume=!!id&&!!saved?.cursor&&(!saved.sort||saved.sort===this.readingSort),readPosition=()=>id?request('THOUGHT_POSITION',{position:{topicId:id}}).catch(()=>null):Promise.resolve(null);"),
            ("if(!sameSessionResume){this.resumeAnchor=await position;if(intent!==this.openIntent)return;if(this.resumeAnchor?.sort)this.readingSort=this.resumeAnchor.sort;}else this.resumeAnchor=null;", "if(!sameSessionResume){this.resumeAnchor=await readPosition();if(intent!==this.openIntent)return;if(this.resumeAnchor?.sort)this.readingSort=this.resumeAnchor.sort;}else this.resumeAnchor=null;"),
            ("if(id&&sameSessionResume){void position.then(async anchor=>{", "if(id&&sameSessionResume){void readPosition().then(async anchor=>{"),
            ("void this.updateViewStatus({strict:false,isCurrent:current}).then(()=>{", "void this.updateViewStatus({strict:false,isCurrent:current,includeOriginal:!this.id}).then(()=>{"),
            ("async updateViewStatus({strict=true,isCurrent=()=>true}={}){", "async updateViewStatus({strict=true,isCurrent=()=>true,includeOriginal=true}={}){"),
            ("const result=await readOptionalLibraryStatus(type=>request(type),{isCurrent:()=>attempt===this.statusReadSerial&&epoch===this.statusEpoch&&isCurrent()});", "const result=await readOptionalLibraryStatus(type=>request(type),{isCurrent:()=>attempt===this.statusReadSerial&&epoch===this.statusEpoch&&isCurrent(),includeOriginal});")
          ]
          for old,new in replacements:
            n=s.count(old)
            if n!=1:
              raise SystemExit(f'expected exactly one match, found {n}: {old[:80]}')
            s=s.replace(old,new)
          p.write_text(s)
          Path('.github/workflows/patch-r3-passive-status-priority.yml').unlink()
          PY
          node --check extension/ui/thoughts.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/ui/thoughts.js .github/workflows/patch-r3-passive-status-priority.yml
          git diff --cached --check
          git commit -m 'fix(reader): prioritize Topic restore over passive status'
          git push origin HEAD:ux-r5
