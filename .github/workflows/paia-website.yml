name: PAIA Website
on:
  pull_request:
    paths: ['*.html', 'en/**', 'assets/website/**', 'website/**', 'sitemap.xml', 'robots.txt', 'CNAME', '.github/workflows/paia-website.yml']
  push:
    branches: [main]
    paths: ['*.html', 'en/**', 'assets/website/**', 'website/**', 'sitemap.xml', 'robots.txt', 'CNAME', '.github/workflows/paia-website.yml']
  workflow_dispatch:
    inputs:
      verify_live:
        description: 'Read-only exact-byte and browser verification of inputarchive.com after deployment'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WEBSITE_TEST_OUTPUT: website-test-artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install test browser and local fonts
        run: |
          python -m pip install -r website/requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk fonts-liberation
      - name: Exact-source generation and website-only browser journeys
        run: |
          git rev-parse HEAD
          python website/build.py --check
          python website/test.py
          git diff --exit-code
      - name: Read-only production verification
        if: github.event_name == 'workflow_dispatch' && inputs.verify_live && github.ref == 'refs/heads/main'
        run: python website/verify_live.py
      - name: Preserve synthetic website evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: website-review-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: website-test-artifacts/
          retention-days: 14
          if-no-files-found: warn
