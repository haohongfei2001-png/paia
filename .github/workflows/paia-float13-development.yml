name: PAIA Float 1.3 R3 Development Evidence
on:
  workflow_dispatch:
  push:
    branches: ['evidence/float13-development-*']
    paths:
      - '.github/workflows/paia-float13-development.yml'
      - 'extension/scripts/capture-float13-development.mjs'
permissions:
  contents: read
jobs:
  source-development:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: extension
    env:
      CI: '1'
      PAIA_HEADLESS: '1'
      PLAYWRIGHT_MODULE: playwright
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Use the existing hosted Chrome and font dependencies
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-color-emoji
      - name: Capture actual Source surfaces and insertion without sending
        run: |
          set -o pipefail
          mkdir -p work/float13-development
          node scripts/capture-float13-development.mjs 2>&1 | tee work/float13-development/capture.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: float13-development-${{ github.sha }}
          path: extension/work/float13-development/
          if-no-files-found: error
          retention-days: 7
