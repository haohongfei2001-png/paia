name: UX-R4 periodic preview refresh fix
on:
  push:
    branches: [recovery-r4-1]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery-r4-1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch periodic preview refresh race
        run: |
          python3 - <<'PY'
          from pathlib import Path

          tray=Path('extension/ui/material-tray.js')
          s=tray.read_text()
          old="const previous=this.data,next=await this.rpc('read');if(epoch!==this.sourceEpoch)return null;this.data=next;this.rechecking=false;"
          new="const previous=this.data,wasRechecking=this.rechecking,next=await this.rpc('read');if(epoch!==this.sourceEpoch)return null;this.data=next;this.rechecking=false;"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          old2="else if(this.mode==='preview'||this.visibleChanged(previous,next))this.render();"
          new2="else if(wasRechecking||this.visibleChanged(previous,next))this.render();"
          assert s.count(old2)==1, s.count(old2)
          tray.write_text(s.replace(old2,new2,1))

          test=Path('extension/tests/ux-r4-search-reuse-chrome-e2e.test.mjs')
          s=test.read_text()
          marker="assert.equal(await p.evaluate(()=>globalThis.__uxr4StableEdit===[...document.querySelectorAll('#material-workbench button')].find(b=>b.textContent==='修改本次输出')),true,'filter maintenance notifications must not remount confirmed Preview');await p.getByRole('button',{name:'修改本次输出',exact:true}).click();"
          replacement="assert.equal(await p.evaluate(()=>globalThis.__uxr4StableEdit===[...document.querySelectorAll('#material-workbench button')].find(b=>b.textContent==='修改本次输出')),true,'filter maintenance notifications must not remount confirmed Preview');await p.evaluate(async()=>{const {getMaterialTray}=await import(chrome.runtime.getURL('ui/material-tray.js'));const tray=getMaterialTray();await tray.refresh();await tray.refresh();});assert.equal(await p.evaluate(()=>globalThis.__uxr4StableEdit===[...document.querySelectorAll('#material-workbench button')].find(b=>b.textContent==='修改本次输出')),true,'same-data periodic refresh must not remount confirmed Preview');await p.getByRole('button',{name:'修改本次输出',exact:true}).click();"
          assert s.count(marker)==1, s.count(marker)
          test.write_text(s.replace(marker,replacement,1))
          PY
          node --check extension/ui/material-tray.js
          node --check extension/tests/ux-r4-search-reuse-chrome-e2e.test.mjs
          git diff --check
      - name: Commit final implementation
        run: |
          git rm .github/workflows/recovery-r4-periodic-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/ui/material-tray.js extension/tests/ux-r4-search-reuse-chrome-e2e.test.mjs
          git commit -m 'fix(ux-r4): preserve unchanged preview across refresh'
          git push origin HEAD:recovery-r4-1
