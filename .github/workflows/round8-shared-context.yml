name: Round 8 shared working context verification

on:
  push:
    branches:
      - round8/shared-working-context
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: round8/shared-working-context
      - name: Record candidate SHA
        shell: bash
        run: echo "REVIEW_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependencies and Chromium
        working-directory: extension
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify actual Round 8 candidate
        working-directory: extension
        env:
          PAIA_HEADLESS: '1'
        run: node scripts/verify-round8.mjs
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paia-round8-evidence-${{ env.REVIEW_SHA }}
          path: extension/work/round8/**
          if-no-files-found: warn
          retention-days: 7
