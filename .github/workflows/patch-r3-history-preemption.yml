name: Patch R3 history refresh preemption

on:
  push:
    branches: [ux-r5]
    paths:
      - .github/workflows/patch-r3-history-preemption.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-r5
          fetch-depth: 0
      - name: Patch Thought refresh scheduling and remove this workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('extension/ui/thoughts.js')
          text = path.read_text()
          old = " async refresh(){if(this.refreshPromise){this.refreshQueued=true;return this.refreshPromise;}const run=(async()=>{do{this.refreshQueued=false;await this.refreshOnce();}while(this.refreshQueued);})();this.refreshPromise=run;try{return await run;}finally{if(this.refreshPromise===run)this.refreshPromise=null;}}"
          new = " async refresh(){const key=this.readKey(),active=this.refreshRun;if(active&&active.key===key){active.queued=true;return active.promise;}const run={key,queued:false,promise:null};run.promise=(async()=>{do{run.queued=false;await this.refreshOnce();}while(run.queued&&run.key===this.readKey());})();this.refreshRun=run;try{return await run.promise;}finally{if(this.refreshRun===run)this.refreshRun=null;}}"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one refresh scheduler, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          Path('.github/workflows/patch-r3-history-preemption.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/ui/thoughts.js .github/workflows/patch-r3-history-preemption.yml
          git diff --cached --check
          git commit -m 'fix(reader): preempt stale Thought refresh on route change'
          git push origin HEAD:ux-r5
