          PLAYWRIGHT_MODULE: playwright
          PAIA_SCALE_SIZES: '1000'
          PAIA_SCALE_LONG_CONTENT: '1'
        run: node tests/cpv1-02-6-scale-benchmark.mjs

  macos_reload_diagnostic:
    if: github.event.pull_request.draft == true && contains(github.event.pull_request.body, 'PAIA_VS04_TARGETED_MAC')
    name: Candidate hosted Mac extension-reload diagnostic
    runs-on: macos-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install chromium
      - name: Select hosted Mac Chrome
        run: |
          CHROME_BIN="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          if [ ! -x "$CHROME_BIN" ]; then
            CHROME_BIN="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          fi
          test -x "$CHROME_BIN"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
      - name: Diagnose old-tab refresh after extension reload
        env:
          PAIA_HEADLESS: '1'
        run: node --test tests/cpv1-01-2-reconnect-chrome-e2e.test.mjs

  direct_edit:
    if: github.event.pull_request.draft == true && contains(github.event.pull_request.body, 'PAIA_DVN_DIRECT_EDIT_BROWSER')
    name: Candidate direct-edit acceptance (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [direct-edit, reader-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Select hosted Chrome for isolated extension journeys
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
      - name: Provide Chinese glyph coverage for actual visual evidence
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-wqy-zenhei
          fc-list :lang=zh | grep -q .
      - name: Verify source and built direct editing plus complete affected Reader regressions
        env:
          PAIA_TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          mkdir -p work/qa-dvn-direct-edit
          mapfile -t FILES < <(node scripts/d5-direct-edit-matrix.mjs "${{ matrix.suite }}")
          test "${#FILES[@]}" -gt 0
          xvfb-run -a node --test --test-concurrency=1 "${FILES[@]}" 2>&1 | tee work/qa-dvn-direct-edit/test.log
      - name: Require exact-head synthetic evidence
        if: matrix.suite == 'direct-edit'
        env:
          PAIA_TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          for(const variant of ['source','release']){
            const report=JSON.parse(await readFile(`work/qa-dvn-direct-edit/${variant}-matrix.json`,'utf8'));
            assert.equal(report.status,'PASS');assert.equal(report.headSha,process.env.PAIA_TESTED_HEAD);
            assert.equal(report.noExternalRequests,true);
            assert.deepEqual(report.measurements.map(row=>row.width),[1440,1280,1024,768,390,320]);
            for(const name of [...report.measurements.map(row=>`selection-${row.width}`),'failed-direct-edit','pending-removal']){
              const png=await readFile(`work/qa-dvn-direct-edit/${variant}-${name}.png`);
              assert.ok(png.subarray(0,8).equals(Buffer.from([137,80,78,71,13,10,26,10])));
            }
          }
          JS
      - name: Retain synthetic direct-edit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-edit-${{ github.event.pull_request.head.sha }}-${{ matrix.suite }}
          path: extension/work/qa-dvn-direct-edit/
          if-no-files-found: error
          retention-days: 7

  shell_cutover:
    if: github.event.pull_request.draft == true && contains(github.event.pull_request.body, 'PAIA_DVN_SHELL_CUTOVER_BROWSER')
    name: Candidate shell-cutover acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Select hosted Chrome for isolated extension journeys
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
      - name: Verify existing shell, Navigator and Settings safety journeys
        env:
          PAIA_TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          mkdir -p work/qa-dvn-shell
          xvfb-run -a node --test --test-concurrency=1 tests/ux-r1-shell-chrome-e2e.test.mjs tests/cpv1-02-1-shell-chrome-e2e.test.mjs tests/ans-05-navigator-workspace-chrome-e2e.test.mjs tests/uir-01-shell-chrome-e2e.test.mjs 2>&1 | tee work/qa-dvn-shell/test.log
      - name: Retain synthetic direct-edit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-cutover-${{ github.event.pull_request.head.sha }}
          path: |
            extension/work/qa-dvn-shell/
            extension/work/ux-r1/
            extension/work/ux-r6/
            extension/work/ans-05-navigator/
          if-no-files-found: error
          retention-days: 7

  organize_candidate_compatibility:
    if: github.event.pull_request.draft == true && contains(github.event.pull_request.body, 'PAIA_DVN_ORGANIZE_NOTICES_BROWSER')
    name: Candidate Organize comparison compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Select hosted Chrome and canonical Chinese glyphs
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-wqy-zenhei
          fc-list :lang=zh | grep -q .
      - name: Preserve the complete five-case candidate comparison owner
        env:
          PAIA_TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          mkdir -p work/qa-dvn-notice-compatibility
          xvfb-run -a node --test --test-concurrency=1 --test-reporter=./scripts/test-report.mjs tests/uir-03-ai-candidate-chrome-e2e.test.mjs 2>&1 | tee work/qa-dvn-notice-compatibility/acceptance.log
          cp work/test-summary.json work/qa-dvn-notice-compatibility/test-summary.json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';
          const read=path=>JSON.parse(readFileSync(path)),report=read('work/qa-dvn-notice-compatibility/test-summary.json');assert.equal(report.total,5);assert.equal(report.pass,5);assert.equal(report.fail,0);assert.equal(report.skipped,0);assert.deepEqual(Object.keys(report.files),['uir-03-ai-candidate-chrome-e2e.test.mjs']);
          for(const variant of ['source','release']){const receipt=read(`work/qa-dvn-compare/${variant}.json`);assert.equal(receipt.result,'PASS');assert.equal(receipt.head,process.env.PAIA_TESTED_HEAD);assert.equal(receipt.rows.length,24);}
          JS
      - name: Retain complete comparison compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dvn-organize-comparison-compatibility
          path: |
            extension/work/qa-dvn-notice-compatibility/
            extension/work/qa-dvn-compare/
            extension/work/ux-r3/
          if-no-files-found: error
          retention-days: 7

  context_compatibility:
    if: github.event.pull_request.draft == true && (contains(github.event.pull_request.body, 'PAIA_DVN_CONTEXT_BROWSER') || contains(github.event.pull_request.body, 'PAIA_DVN_CONTEXT_COMPAT_BROWSER'))
    name: Candidate Context compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Select hosted Chrome for complete release and Topic journeys
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Verify complete Context cross-surface compatibility files
        run: |
          mkdir -p work/qa-dvn-context-compat
          set -o pipefail
          xvfb-run -a node --test --test-concurrency=1 tests/release-certification-round48-chrome-e2e.test.mjs tests/release-certification-round49-chrome-e2e.test.mjs tests/ans-01-reader-surfaces-chrome-e2e.test.mjs 2>&1 | tee work/qa-dvn-context-compat/acceptance.log
      - name: Retain compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dvn-context-compatibility
          path: |
            extension/work/qa-dvn-context-compat/
            extension/work/ans-01/
          if-no-files-found: error
          retention-days: 7

  candidate:
    name: Candidate gate
    runs-on: ubuntu-latest
    if: always() && github.event.pull_request.draft == true
    needs: [unit, contracts, release, direct_edit, shell_cutover, targeted_browser, topic_compatibility, native_popup, capture_recovery, audit_boundaries, scale_probe, macos_reload_diagnostic, context_compatibility, organize_candidate_compatibility]
    steps:
      - name: Require light candidate gates
        env:
          UNIT: ${{ needs.unit.result }}
          CONTRACTS: ${{ needs.contracts.result }}
          RELEASE: ${{ needs.release.result }}
          SHELL_CUTOVER: ${{ needs.shell_cutover.result }}
          SHELL_CUTOVER_SELECTED: ${{ contains(github.event.pull_request.body, 'PAIA_DVN_SHELL_CUTOVER_BROWSER') }}
          DIRECT_EDIT: ${{ needs.direct_edit.result }}
          DIRECT_EDIT_SELECTED: ${{ contains(github.event.pull_request.body, 'PAIA_DVN_DIRECT_EDIT_BROWSER') }}
          CONTEXT_COMPAT: ${{ needs.context_compatibility.result }}
          CONTEXT_COMPAT_SELECTED: ${{ contains(github.event.pull_request.body, 'PAIA_DVN_CONTEXT_BROWSER') || contains(github.event.pull_request.body, 'PAIA_DVN_CONTEXT_COMPAT_BROWSER') }}
          ORGANIZE_COMPAT: ${{ needs.organize_candidate_compatibility.result }}
          ORGANIZE_COMPAT_SELECTED: ${{ contains(github.event.pull_request.body, 'PAIA_DVN_ORGANIZE_NOTICES_BROWSER') }}
          TARGETED_BROWSER: ${{ needs.targeted_browser.result }}
          TOPIC_COMPAT: ${{ needs.topic_compatibility.result }}
          TOPIC_COMPAT_SELECTED: ${{ contains(github.event.pull_request.body, 'PAIA_DVN_TOPIC_BROWSER') }}
          TOPIC_SELECTED: ${{ contains(github.event.pull_request.body, 'PAIA_DVN_SETTINGS_PRESENTATION_BROWSER') || contains(github.event.pull_request.body, 'PAIA_DVN_CONTEXT_PRESENTATION_BROWSER') || contains(github.event.pull_request.body, 'PAIA_DVN_COMPOSE_BROWSER') || contains(github.event.pull_request.body, 'PAIA_DVN_TOPIC_BROWSER') || contains(github.event.pull_request.body, 'PAIA_DVN_ORGANIZE_BROWSER') || contains(github.event.pull_request.body, 'PAIA_DVN_CONTEXT_BROWSER') || contains(github.event.pull_request.body, 'PAIA_DVN_SCOPE_ORDER_BROWSER') || contains(github.event.pull_request.body, 'PAIA_DVN_ORGANIZE_NOTICES_BROWSER') || contains(github.event.pull_request.body, 'PAIA_D7_READER_DIALOGS') || contains(github.event.pull_request.body, 'PAIA_D7_CONFIRMATION_UI') || contains(github.event.pull_request.body, 'PAIA_D7_UI_COHERENCE') || contains(github.event.pull_request.body, 'PAIA_CONTENT_RETURN_DIAGNOSTIC') }}
          NATIVE_POPUP: ${{ needs.native_popup.result }}
          NATIVE_POPUP_SELECTED: ${{ contains(github.event.pull_request.body, 'PAIA_BOUNDED_POPUP_BROWSER') || contains(github.event.pull_request.body, 'PAIA_D7_UI_COHERENCE') }}
          CAPTURE_RECOVERY: ${{ needs.capture_recovery.result }}
          CAPTURE_RECOVERY_SELECTED: ${{ contains(github.event.pull_request.body, 'PAIA_CAPTURE_RECOVERY_BROWSER') }}
          AUDIT_BOUNDARIES: ${{ needs.audit_boundaries.result }}
          AUDIT_BOUNDARIES_SELECTED: ${{ contains(github.event.pull_request.body, 'PAIA_AUDIT_BOUNDARIES_BROWSER') }}
          SCALE_PROBE: ${{ needs.scale_probe.result }}
          MACOS_RELOAD_DIAGNOSTIC: ${{ needs.macos_reload_diagnostic.result }}
        run: |
          printf 'unit=%s\ncontracts=%s\nrelease=%s\n' "$UNIT" "$CONTRACTS" "$RELEASE"
          test "$UNIT" = success
          test "$CONTRACTS" = success
          test "$RELEASE" = success
          if [ "$CONTEXT_COMPAT_SELECTED" = true ]; then test "$CONTEXT_COMPAT" = success; elif [ "$CONTEXT_COMPAT" != skipped ]; then test "$CONTEXT_COMPAT" = success; fi
          if [ "$SHELL_CUTOVER_SELECTED" = true ]; then test "$SHELL_CUTOVER" = success; elif [ "$SHELL_CUTOVER" != skipped ]; then test "$SHELL_CUTOVER" = success; fi
          if [ "$DIRECT_EDIT_SELECTED" = true ]; then test "$DIRECT_EDIT" = success; elif [ "$DIRECT_EDIT" != skipped ]; then test "$DIRECT_EDIT" = success; fi
          if [ "$ORGANIZE_COMPAT_SELECTED" = true ]; then test "$ORGANIZE_COMPAT" = success; elif [ "$ORGANIZE_COMPAT" != skipped ]; then test "$ORGANIZE_COMPAT" = success; fi
          if [ "$TOPIC_SELECTED" = true ]; then test "$TARGETED_BROWSER" = success; elif [ "$TARGETED_BROWSER" != skipped ]; then test "$TARGETED_BROWSER" = success; fi
          if [ "$TOPIC_COMPAT_SELECTED" = true ]; then test "$TOPIC_COMPAT" = success; elif [ "$TOPIC_COMPAT" != skipped ]; then test "$TOPIC_COMPAT" = success; fi
          if [ "$NATIVE_POPUP_SELECTED" = true ]; then test "$NATIVE_POPUP" = success; elif [ "$NATIVE_POPUP" != skipped ]; then test "$NATIVE_POPUP" = success; fi
          if [ "$CAPTURE_RECOVERY_SELECTED" = true ]; then test "$CAPTURE_RECOVERY" = success; elif [ "$CAPTURE_RECOVERY" != skipped ]; then test "$CAPTURE_RECOVERY" = success; fi
          if [ "$AUDIT_BOUNDARIES_SELECTED" = true ]; then test "$AUDIT_BOUNDARIES" = success; elif [ "$AUDIT_BOUNDARIES" != skipped ]; then test "$AUDIT_BOUNDARIES" = success; fi
          if [ "$SCALE_PROBE" != skipped ]; then test "$SCALE_PROBE" = success; fi
          if [ "$MACOS_RELOAD_DIAGNOSTIC" != skipped ]; then test "$MACOS_RELOAD_DIAGNOSTIC" = success; fi
