name: PAIA Candidate Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'extension/**'
      - '!extension/docs/**'
      - 'native-hosts/**'
      - '.github/workflows/paia-candidate.yml'
      - '.github/workflows/paia-certification.yml'

permissions:
  contents: read

concurrency:
  group: paia-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  PAIA_TEST_CONCURRENCY: '4'
  PLAYWRIGHT_MODULE: 'playwright'

# Draft pushes are intentionally a light engineering gate. The executor owns
# targeted browser tests for the behavior it changes. Full browser/history/
# macOS certification is reserved for explicit slice/high-risk certification.
jobs:
  unit:
    if: github.event.pull_request.draft == true
    name: Candidate unit smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - name: Run owning unit contracts or complete unit suite
        env:
          EVENT_ACTION: ${{ github.event.action }}
          PREVIOUS_HEAD: ${{ github.event.before }}
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'JS'
          import {execFileSync,spawnSync} from 'node:child_process';
          import {group} from './scripts/test-groups.mjs';
          import {semanticLabRouting} from './scripts/semantic-lab-change.mjs';
          const previous=process.env.PREVIOUS_HEAD||'',head=process.env.CANDIDATE_HEAD||'';
          const sha=/^[0-9a-f]{40}$/;
          let changed=[];
          if(process.env.EVENT_ACTION==='synchronize'&&sha.test(previous)&&sha.test(head)){
            // Compare the full synchronized coherent batch, never HEAD^ alone
            // (which could omit earlier commits delivered by the same push).
            changed=execFileSync('git',['diff','--name-only',previous,head],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          }
          const owner='extension/tests/cpv1-07-historical-comparison-chrome-e2e.test.mjs';
          const historyEligible=changed.includes(owner)&&changed.every(path=>
            path===owner||path==='.github/workflows/paia-candidate.yml'||
            /^extension\/docs\/consumer-product-v1\/(STATUS|EXECUTION_PROTOCOL)\.md$/.test(path));
          const calibrationPaths=new Set([
            'extension/experiments/semantic-calibration.mjs',
            'extension/experiments/semantic-lab-index.mjs',
            'extension/tests/fixtures/cpv1-07-calibration-corpus.mjs',
            'extension/tests/cpv1-07-semantic-lab.test.mjs',
            'extension/scripts/run-official-semantic-retrieval-lab.mjs',
            '.github/workflows/paia-vs07-semantic-lab.yml',
            '.github/workflows/paia-candidate.yml',
            'extension/docs/consumer-product-v1/STATUS.md',
            'extension/docs/consumer-product-v1/EXECUTION_PROTOCOL.md'
          ]);
          const calibrationEligible=changed.includes('extension/experiments/semantic-calibration.mjs')
            &&changed.includes('extension/scripts/run-official-semantic-retrieval-lab.mjs')
            &&changed.every(path=>calibrationPaths.has(path));
          let sourceAncestor=false;
          if(process.env.EVENT_ACTION==='synchronize'&&sha.test(previous)&&sha.test(head)&&previous!==head){
            try{execFileSync('git',['merge-base','--is-ancestor',previous,head],{stdio:'pipe'});sourceAncestor=true;}
            catch{/* Unknown/replaced history retains complete original unit suite. */}
          }
          const labRouting=semanticLabRouting({action:process.env.EVENT_ACTION,
            before:previous,head,ancestor:sourceAncestor,paths:changed});
          const sourceEligible=labRouting.sourceOnly,pairedEligible=labRouting.pairedOnly===true,
            embeddingEligible=labRouting.embeddingOnly===true||labRouting.embeddingProbeOnly===true||labRouting.diagnosticOnly===true;
          const revisitPaths=new Set([
            'extension/core/revisit.js',
            'extension/ui/revisit.js',
            'extension/tests/cpv1-07-revisit-selection.test.mjs',
            'extension/tests/ux-r2-reader-revisit-chrome-e2e.test.mjs',
            '.github/workflows/paia-candidate.yml',
            'extension/docs/consumer-product-v1/STATUS.md',
            'extension/docs/consumer-product-v1/EXECUTION_PROTOCOL.md'
          ]);
          const revisitImplementation=['extension/core/revisit.js',
            'extension/tests/cpv1-07-revisit-selection.test.mjs',
            'extension/tests/ux-r2-reader-revisit-chrome-e2e.test.mjs'].every(path=>changed.includes(path));
          const revisitBrowserOnly=changed.includes('extension/tests/ux-r2-reader-revisit-chrome-e2e.test.mjs')
            &&changed.every(path=>path==='extension/tests/ux-r2-reader-revisit-chrome-e2e.test.mjs'
              ||path==='.github/workflows/paia-candidate.yml'
              ||/^extension\/docs\/consumer-product-v1\/(STATUS|EXECUTION_PROTOCOL)\.md$/.test(path));
          const revisitUI=changed.includes('extension/ui/revisit.js')
            &&changed.includes('extension/tests/ux-r2-reader-revisit-chrome-e2e.test.mjs')
            &&changed.every(path=>path==='extension/ui/revisit.js'
              ||path==='extension/tests/ux-r2-reader-revisit-chrome-e2e.test.mjs'
              ||path==='.github/workflows/paia-candidate.yml'
              ||/^extension\/docs\/consumer-product-v1\/(STATUS|EXECUTION_PROTOCOL)\.md$/.test(path));
          const revisitEligible=sourceAncestor&&changed.length>0
            &&new Set(changed).size===changed.length
            &&(revisitImplementation||revisitBrowserOnly||revisitUI)
            &&changed.every(path=>revisitPaths.has(path));
          const indexPaths=new Set([
            'extension/core/semantic-index.js','extension/tests/cpv1-07-semantic-index.test.mjs',
            '.github/workflows/paia-candidate.yml',
            'extension/docs/consumer-product-v1/STATUS.md',
            'extension/docs/consumer-product-v1/EXECUTION_PROTOCOL.md'
          ]);
          const indexEligible=sourceAncestor&&changed.length>0
            &&new Set(changed).size===changed.length
            &&['extension/core/semantic-index.js','extension/tests/cpv1-07-semantic-index.test.mjs']
              .every(path=>changed.includes(path))
            &&changed.every(path=>indexPaths.has(path));
          const eligible=indexEligible||historyEligible||calibrationEligible||sourceEligible||pairedEligible||embeddingEligible||revisitEligible;
          const files=revisitEligible?[
            'cpv1-07-revisit-selection.test.mjs','revisit-round47.test.mjs',
            'ux-r2-reader-revisit.test.mjs','cpv1-07-history-time.test.mjs'
          ]:(indexEligible||calibrationEligible||sourceEligible||pairedEligible||embeddingEligible)?[
            'cpv1-07-semantic-lab.test.mjs','cpv1-07-retrieval-evaluation.test.mjs',
            'cpv1-07-public-model-provenance.test.mjs','cpv1-07-semantic-index.test.mjs',
            'cpv1-07-semantic-material-snapshot.test.mjs'
          ]:[
            'cpv1-07-historical-comparison.test.mjs','cpv1-07-history-time.test.mjs',
            'universal-search-round46.test.mjs','ux-r4-search-history.test.mjs',
            'input-search-v090.test.mjs','search-hardening-v092.test.mjs',
            'search-service-round2.test.mjs','cpv1-02-6-input-search-cache.test.mjs',
            'history-staleness-v090.test.mjs','history-store.test.mjs'
          ];
          if(eligible&&files.some(file=>group(file)!=='unit'))throw Error('owning unit category drift');
          console.log(JSON.stringify({validationScope:indexEligible?'affected complete derived-index/snapshot/lab/evaluation/provenance unit contracts':embeddingEligible?'affected complete official-source/lab/index/evaluation/provenance unit contracts':revisitEligible?'affected complete Revisit/reading/time unit contracts':pairedEligible?'affected complete paired/lab/index/evaluation/provenance unit contracts':sourceEligible?'affected complete public-source/lab/index/evaluation/provenance unit contracts':calibrationEligible?'affected complete semantic lab/index/evaluation/provenance unit contracts':historyEligible?'affected search/history unit contracts':'complete unit suite',changed,completeCertification:false}));
          const run=(command,args)=>{const result=spawnSync(command,args,{stdio:'inherit'});if(result.status!==0)process.exit(result.status||1);};
          if(!eligible)run('npm',['run','test:unit']);
          else{
            run(process.execPath,['--test','--test-concurrency=4','--test-reporter=./scripts/test-report.mjs',...files.map(file=>'tests/'+file)]);
            run('python3',['scripts/check_package.py']);
            run(process.execPath,['scripts/check_development.mjs']);
          }
          JS

  contracts:
    if: github.event.pull_request.draft == true
    name: Candidate contracts and privacy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - name: Install Chromium for adapter contracts
        run: npx playwright install --with-deps chromium
      - name: Adapter contract
        run: node scripts/test.mjs "adapter contract"
      - name: Privacy and security
        run: node scripts/test.mjs "privacy/security"

  release:
    if: github.event.pull_request.draft == true
    name: Candidate release guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and audit release
        run: npm run build:release

  targeted_browser:
    if: github.event.pull_request.draft == true && (contains(github.event.pull_request.body, 'PAIA_VS04_TARGETED_BROWSER') || contains(github.event.pull_request.body, 'PAIA_VS05_TARGETED_BROWSER') || contains(github.event.pull_request.body, 'PAIA_VS05_AI_CANDIDATE_BROWSER') || contains(github.event.pull_request.body, 'PAIA_VS05_RUNNING_BROWSER') || contains(github.event.pull_request.body, 'PAIA_VS05_HISTORY_BROWSER') || contains(github.event.pull_request.body, 'PAIA_VS06_MANIFEST_BROWSER') || contains(github.event.pull_request.body, 'PAIA_ANS04_CURSOR_BROWSER') || contains(github.event.pull_request.body, 'PAIA_VS07_REVISIT_BROWSER') || contains(github.event.pull_request.body, 'PAIA_VS07_HISTORY_BROWSER') || contains(github.event.pull_request.body, 'PAIA_VS07_INDEX_BROWSER') || contains(github.event.pull_request.body, 'PAIA_VS07_SEARCH_REGRESSION') || contains(github.event.pull_request.body, 'PAIA_DVN_TOPIC_BROWSER') || contains(github.event.pull_request.body, 'PAIA_DVN_COMPOSE_BROWSER') || contains(github.event.pull_request.body, 'PAIA_DVN_ORGANIZE_BROWSER') || contains(github.event.pull_request.body, 'PAIA_DVN_CONTEXT_BROWSER') || contains(github.event.pull_request.body, 'PAIA_DVN_CONTEXT_PRESENTATION_BROWSER'))
    name: Candidate affected browser
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Select full hosted Chrome for extension CDP
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
      - name: Provide Chinese glyph coverage for paired Thought evidence
        if: contains(github.event.pull_request.body, 'PAIA_DVN_TOPIC_BROWSER') || contains(github.event.pull_request.body, 'PAIA_DVN_COMPOSE_BROWSER') || contains(github.event.pull_request.body, 'PAIA_VS05_AI_CANDIDATE_BROWSER') || contains(github.event.pull_request.body, 'PAIA_DVN_CONTEXT_PRESENTATION_BROWSER')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-wqy-zenhei
          fc-list :lang=zh | grep -q .
      - name: D4 explicit Context review and existing reuse regressions
        if: contains(github.event.pull_request.body, 'PAIA_DVN_CONTEXT_BROWSER')
        env:
          PAIA_TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p work/qa-dvn-context
          set -o pipefail
          xvfb-run -a node --test --test-concurrency=1 tests/desktop-vnext-context-chrome-e2e.test.mjs tests/uir-04-context-chrome-e2e.test.mjs tests/ux-r4-search-reuse-chrome-e2e.test.mjs tests/uis-02-page-scoped-search-chrome-e2e.test.mjs tests/uis-04-cleanup-chrome-e2e.test.mjs 2>&1 | tee work/qa-dvn-context/acceptance.log
      - name: Retain D4 synthetic source and release evidence
        if: always() && contains(github.event.pull_request.body, 'PAIA_DVN_CONTEXT_BROWSER')
        uses: actions/upload-artifact@v4
        with:
          name: dvn-context-candidate
          path: |
            extension/work/qa-dvn-context/
            extension/work/ux-r4/
          if-no-files-found: error
          retention-days: 7

      - name: D5 Context preview presentation and complete owning journeys
        if: contains(github.event.pull_request.body, 'PAIA_DVN_CONTEXT_PRESENTATION_BROWSER')
        env:
          PAIA_TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          mkdir -p work/qa-dvn-context-presentation
          xvfb-run -a node --test --test-concurrency=1 --test-reporter=./scripts/test-report.mjs tests/desktop-vnext-context-chrome-e2e.test.mjs tests/uir-04-context-chrome-e2e.test.mjs 2>&1 | tee work/qa-dvn-context-presentation/acceptance.log
          cp work/test-summary.json work/qa-dvn-context-presentation/test-summary.json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';
          const report=JSON.parse(readFileSync('work/qa-dvn-context-presentation/test-summary.json'));assert.equal(report.total,5);assert.equal(report.pass,5);assert.equal(report.fail,0);assert.equal(report.skipped,0);assert.deepEqual(Object.keys(report.files).sort(),['desktop-vnext-context-chrome-e2e.test.mjs','uir-04-context-chrome-e2e.test.mjs']);
          for(const variant of ['source','release']){const receipt=JSON.parse(readFileSync(`work/qa-dvn-context-presentation/${variant}.json`));assert.equal(receipt.result,'PASS');assert.equal(receipt.head,process.env.PAIA_TESTED_HEAD);assert.equal(receipt.rows.length,30);assert.equal(receipt.preferences.length,11);assert.equal(receipt.targets.length,2);}
          JS
      - name: Retain D5 Context paired presentation evidence
        if: always() && contains(github.event.pull_request.body, 'PAIA_DVN_CONTEXT_PRESENTATION_BROWSER')
        uses: actions/upload-artifact@v4
        with:
          name: dvn-context-presentation-candidate
          path: |
            extension/work/qa-dvn-context-presentation/
            extension/work/qa-dvn-context/
            extension/work/ux-r4/
          if-no-files-found: error

      - name: D3 trusted scope and first/update adoption boundary
        if: contains(github.event.pull_request.body, 'PAIA_DVN_ORGANIZE_BROWSER')
        env:
          PAIA_TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p work/qa-dvn-organize
          set -o pipefail
          xvfb-run -a node --test --test-concurrency=1 tests/cpv1-05-dvn-organize-chrome-e2e.test.mjs tests/ux-r5-ai-organize-chrome-e2e.test.mjs tests/ux-r5-ai-update-chrome-e2e.test.mjs tests/ux-r5-certification-chrome-e2e.test.mjs tests/uir-03-ai-candidate-chrome-e2e.test.mjs tests/uir-03-ai-presentation-chrome-e2e.test.mjs tests/uir-03-preview-mask-chrome-e2e.test.mjs 2>&1 | tee work/qa-dvn-organize/acceptance.log
      - name: Diagnose existing removed-anchor regression
        if: contains(github.event.pull_request.body, 'PAIA_DVN_ORGANIZE_BROWSER')
        run: xvfb-run -a node --test --test-name-pattern="UX-R3 removed mid-topic reading anchor" tests/ux-r3-thought-chrome-e2e.test.mjs
      - name: Verify existing page-scoped search readiness
        if: contains(github.event.pull_request.body, 'PAIA_DVN_ORGANIZE_BROWSER')
        run: xvfb-run -a node --test tests/uis-02-page-scoped-search-chrome-e2e.test.mjs tests/uis-04-cleanup-chrome-e2e.test.mjs
      - name: Retain D3 synthetic source and release evidence
        if: always() && contains(github.event.pull_request.body, 'PAIA_DVN_ORGANIZE_BROWSER')
        uses: actions/upload-artifact@v4
        with:
          name: dvn-organize-candidate
          path: |
            extension/work/qa-dvn-organize/
            extension/work/ux-r5/
            extension/work/ux-r3/
          if-no-files-found: error
          retention-days: 7

      - name: D5 compose command ownership and existing creation regressions
        if: contains(github.event.pull_request.body, 'PAIA_DVN_COMPOSE_BROWSER')
        env:
          PAIA_TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          mkdir -p work/qa-dvn-compose
          xvfb-run -a node --test --test-concurrency=1 --test-reporter=./scripts/test-report.mjs --test-name-pattern="UX-R3 independent today draft|UX-R3 real Reader|UX-R3 advanced whole/partial" tests/ux-r3-thought-chrome-e2e.test.mjs 2>&1 | tee work/qa-dvn-compose/acceptance.log
          cp work/test-summary.json work/qa-dvn-compose/test-summary.json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';
          const report=JSON.parse(readFileSync('work/qa-dvn-compose/test-summary.json'));assert.equal(report.total,23);assert.equal(report.pass,23);assert.equal(report.fail,0);assert.equal(report.skipped,0);assert.deepEqual(Object.keys(report.files),['ux-r3-thought-chrome-e2e.test.mjs']);
          const names=['newer-text','reopened-draft','lost-ack','changed-retry','malformed-ack','malformed-success','ime-settlement'].map(name=>'compose-ack-'+name).concat(['compose-topic-owner','compose-relation-digest','compose-add-owner']);
          for(const variant of ['source','release'])for(const name of names){const receipt=JSON.parse(readFileSync(`work/ux-r3/${name}-${variant}.json`));assert.equal(receipt.stage,'PASS');assert.equal(receipt.head,process.env.PAIA_TESTED_HEAD);}
          JS
      - name: Retain D5 compose synthetic ownership evidence
        if: always() && contains(github.event.pull_request.body, 'PAIA_DVN_COMPOSE_BROWSER')
        uses: actions/upload-artifact@v4
        with:
          name: compose-owner-${{ github.event.pull_request.head.sha }}
          path: |
            extension/work/qa-dvn-compose/
            extension/work/ux-r3/
          if-no-files-found: error
          retention-days: 7

      - name: D2 exact root and existing Topic read regressions
        if: contains(github.event.pull_request.body, 'PAIA_DVN_TOPIC_BROWSER')
        env:
          PAIA_TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          mkdir -p work/qa-dvn-topic-root
          xvfb-run -a node --test --test-concurrency=1 tests/cpv1-02-dvn-topic-root-chrome-e2e.test.mjs tests/cpv1-02-dvn-topic-years-chrome-e2e.test.mjs tests/cpv1-02-dvn-topic-content-chrome-e2e.test.mjs tests/ans-07-library-root-chrome-e2e.test.mjs tests/ans-08-topic-continuous-chrome-e2e.test.mjs tests/ans-08-topic-edit-preservation-chrome-e2e.test.mjs tests/uir-03-thought-original-chrome-e2e.test.mjs 2>&1 | tee work/qa-dvn-topic-root/acceptance.log
          xvfb-run -a node --test --test-name-pattern="UX-R3 independent today draft|UX-R3 real Reader" tests/ux-r3-thought-chrome-e2e.test.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';
          for(const variant of ['source','release']){const receipt=JSON.parse(readFileSync(`work/qa-dvn-topic-root/${variant}.json`));assert.equal(receipt.status,'PASS');assert.equal(receipt.headSha,process.env.PAIA_TESTED_HEAD);assert.equal(receipt.matrix.length,12);assert.equal(receipt.zeroProviderCalls,true);}
          for(const variant of ['source','release']){const receipt=JSON.parse(readFileSync(`work/qa-dvn-topic-root/${variant}-dense.json`));assert.equal(receipt.status,'PASS');assert.equal(receipt.headSha,process.env.PAIA_TESTED_HEAD);assert.equal(receipt.topics,300);assert.ok(receipt.retainedBodies<=120);assert.equal(receipt.zeroProviderCalls,true);}
          JS
      - name: Retain D2 synthetic root evidence
        if: always() && contains(github.event.pull_request.body, 'PAIA_DVN_TOPIC_BROWSER')
        uses: actions/upload-artifact@v4
        with:
          name: topic-root-${{ github.event.pull_request.head.sha }}
          path: |
            extension/work/qa-dvn-topic-root/
            extension/work/qa-dvn-topic-years/
            extension/work/qa-dvn-topic-content/
            extension/work/uir-03/
            extension/work/ans-07/
            extension/work/ans-08/
          if-no-files-found: error
          retention-days: 7

      - name: Fixed Context manifest and exact preview release
        if: contains(github.event.pull_request.body, 'PAIA_VS06_MANIFEST_BROWSER')
        run: xvfb-run -a node --test --test-name-pattern="UX-R4 unorganized Input -> exact editable preview|UX-R4 real worker Grant once|VS06 whole-group chooser|VS06 authorized supplements|VS06 budget packages|VS06 workspace permission round-trip|VS06 readable edited preview|VS06 Passport workspace" tests/ux-r4-search-reuse-chrome-e2e.test.mjs
      - name: ANS-04 scoped cursor certification regression
        if: contains(github.event.pull_request.body, 'PAIA_ANS04_CURSOR_BROWSER')
        run: xvfb-run -a node --test tests/ans-04-navigation-query-chrome-e2e.test.mjs

      - name: VS07 existing search maintenance regression
        if: contains(github.event.pull_request.body, 'PAIA_VS07_SEARCH_REGRESSION')
        run: xvfb-run -a node --test --test-name-pattern="UX-R4 real Search pages retain 3 fixed refs" tests/ux-r4-search-reuse-chrome-e2e.test.mjs

      - name: VS07 finite Revisit priority and exclusion journeys
        if: contains(github.event.pull_request.body, 'PAIA_VS07_REVISIT_BROWSER')
        run: xvfb-run -a node --test --test-name-pattern="VS07 Revisit explains a finite priority set|VS07 Revisit finds worked material beyond|VS07 Revisit revokes delayed real reads|UX-R2 topic exclusion removes related Input previews|UX-R2 live capture scope" tests/ux-r2-reader-revisit-chrome-e2e.test.mjs


      - name: VS07 native IndexedDB complete snapshot and index lifecycle
        if: contains(github.event.pull_request.body, 'PAIA_VS07_INDEX_BROWSER')
        run: xvfb-run -a node --test tests/cpv1-07-semantic-storage-chrome-e2e.test.mjs

      - name: VS07 historical expression comparison and stale-scope journeys
        if: contains(github.event.pull_request.body, 'PAIA_VS07_HISTORY_BROWSER')
        run: |
          xvfb-run -a node --test tests/cpv1-07-historical-comparison-chrome-e2e.test.mjs
