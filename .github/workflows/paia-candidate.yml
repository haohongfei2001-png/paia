          CONTEXT_COMPAT: ${{ needs.context_compatibility.result }}
          CONTEXT_COMPAT_SELECTED: ${{ contains(github.event.pull_request.body, 'PAIA_DVN_CONTEXT_BROWSER') || contains(github.event.pull_request.body, 'PAIA_DVN_CONTEXT_COMPAT_BROWSER') }}
          TARGETED_BROWSER: ${{ needs.targeted_browser.result }}
          TOPIC_SELECTED: ${{ contains(github.event.pull_request.body, 'PAIA_DVN_CONTEXT_PRESENTATION_BROWSER') || contains(github.event.pull_request.body, 'PAIA_DVN_COMPOSE_BROWSER') || contains(github.event.pull_request.body, 'PAIA_DVN_TOPIC_BROWSER') || contains(github.event.pull_request.body, 'PAIA_DVN_ORGANIZE_BROWSER') || contains(github.event.pull_request.body, 'PAIA_DVN_CONTEXT_BROWSER') }}
          NATIVE_POPUP: ${{ needs.native_popup.result }}
          NATIVE_POPUP_SELECTED: ${{ contains(github.event.pull_request.body, 'PAIA_BOUNDED_POPUP_BROWSER') }}
          CAPTURE_RECOVERY: ${{ needs.capture_recovery.result }}
          CAPTURE_RECOVERY_SELECTED: ${{ contains(github.event.pull_request.body, 'PAIA_CAPTURE_RECOVERY_BROWSER') }}
          AUDIT_BOUNDARIES: ${{ needs.audit_boundaries.result }}
          AUDIT_BOUNDARIES_SELECTED: ${{ contains(github.event.pull_request.body, 'PAIA_AUDIT_BOUNDARIES_BROWSER') }}
          SCALE_PROBE: ${{ needs.scale_probe.result }}
          MACOS_RELOAD_DIAGNOSTIC: ${{ needs.macos_reload_diagnostic.result }}
        run: |
          printf 'unit=%s\ncontracts=%s\nrelease=%s\n' "$UNIT" "$CONTRACTS" "$RELEASE"
          test "$UNIT" = success
          test "$CONTRACTS" = success
          test "$RELEASE" = success
          if [ "$CONTEXT_COMPAT_SELECTED" = true ]; then test "$CONTEXT_COMPAT" = success; elif [ "$CONTEXT_COMPAT" != skipped ]; then test "$CONTEXT_COMPAT" = success; fi
          if [ "$SHELL_CUTOVER_SELECTED" = true ]; then test "$SHELL_CUTOVER" = success; elif [ "$SHELL_CUTOVER" != skipped ]; then test "$SHELL_CUTOVER" = success; fi
          if [ "$DIRECT_EDIT_SELECTED" = true ]; then test "$DIRECT_EDIT" = success; elif [ "$DIRECT_EDIT" != skipped ]; then test "$DIRECT_EDIT" = success; fi
          if [ "$TOPIC_SELECTED" = true ]; then test "$TARGETED_BROWSER" = success; elif [ "$TARGETED_BROWSER" != skipped ]; then test "$TARGETED_BROWSER" = success; fi
          if [ "$NATIVE_POPUP_SELECTED" = true ]; then test "$NATIVE_POPUP" = success; elif [ "$NATIVE_POPUP" != skipped ]; then test "$NATIVE_POPUP" = success; fi
          if [ "$CAPTURE_RECOVERY_SELECTED" = true ]; then test "$CAPTURE_RECOVERY" = success; elif [ "$CAPTURE_RECOVERY" != skipped ]; then test "$CAPTURE_RECOVERY" = success; fi
          if [ "$AUDIT_BOUNDARIES_SELECTED" = true ]; then test "$AUDIT_BOUNDARIES" = success; elif [ "$AUDIT_BOUNDARIES" != skipped ]; then test "$AUDIT_BOUNDARIES" = success; fi
          if [ "$SCALE_PROBE" != skipped ]; then test "$SCALE_PROBE" = success; fi
          if [ "$MACOS_RELOAD_DIAGNOSTIC" != skipped ]; then test "$MACOS_RELOAD_DIAGNOSTIC" = success; fi
