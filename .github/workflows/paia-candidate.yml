name: PAIA Candidate Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'extension/**'
      - '!extension/docs/**'
      - 'native-hosts/**'
      - '.github/workflows/paia-candidate.yml'
      - '.github/workflows/paia-certification.yml'

permissions:
  contents: read

concurrency:
  group: paia-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  PAIA_TEST_CONCURRENCY: '4'
  PLAYWRIGHT_MODULE: 'playwright'

# Draft pushes are intentionally a light engineering gate. The executor owns
# targeted browser tests for the behavior it changes. Full browser/history/
# macOS certification is reserved for explicit slice/high-risk certification.
jobs:
  unit:
    if: github.event.pull_request.draft == true
    name: Candidate unit smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - name: Run owning unit contracts or complete unit suite
        env:
          EVENT_ACTION: ${{ github.event.action }}
          PREVIOUS_HEAD: ${{ github.event.before }}
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'JS'
          import {execFileSync,spawnSync} from 'node:child_process';
          import {group} from './scripts/test-groups.mjs';
          import {semanticLabRouting} from './scripts/semantic-lab-change.mjs';
          const previous=process.env.PREVIOUS_HEAD||'',head=process.env.CANDIDATE_HEAD||'';
          const sha=/^[0-9a-f]{40}$/;
          let changed=[];
          if(process.env.EVENT_ACTION==='synchronize'&&sha.test(previous)&&sha.test(head)){
            // Compare the full synchronized coherent batch, never HEAD^ alone
            // (which could omit earlier commits delivered by the same push).
            changed=execFileSync('git',['diff','--name-only',previous,head],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          }
          const owner='extension/tests/cpv1-07-historical-comparison-chrome-e2e.test.mjs';
          const historyEligible=changed.includes(owner)&&changed.every(path=>
            path===owner||path==='.github/workflows/paia-candidate.yml'||
            /^extension\/docs\/consumer-product-v1\/(STATUS|EXECUTION_PROTOCOL)\.md$/.test(path));
          const calibrationPaths=new Set([
            'extension/experiments/semantic-calibration.mjs',
            'extension/experiments/semantic-lab-index.mjs',
            'extension/tests/fixtures/cpv1-07-calibration-corpus.mjs',
            'extension/tests/cpv1-07-semantic-lab.test.mjs',
            'extension/scripts/run-official-semantic-retrieval-lab.mjs',
            '.github/workflows/paia-vs07-semantic-lab.yml',
            '.github/workflows/paia-candidate.yml',
            'extension/docs/consumer-product-v1/STATUS.md',
            'extension/docs/consumer-product-v1/EXECUTION_PROTOCOL.md'
          ]);
          const calibrationEligible=changed.includes('extension/experiments/semantic-calibration.mjs')
            &&changed.includes('extension/scripts/run-official-semantic-retrieval-lab.mjs')
            &&changed.every(path=>calibrationPaths.has(path));
          let sourceAncestor=false;
          if(process.env.EVENT_ACTION==='synchronize'&&sha.test(previous)&&sha.test(head)&&previous!==head){
            try{execFileSync('git',['merge-base','--is-ancestor',previous,head],{stdio:'pipe'});sourceAncestor=true;}
            catch{/* Unknown/replaced history retains complete original unit suite. */}
          }
          const labRouting=semanticLabRouting({action:process.env.EVENT_ACTION,
            before:previous,head,ancestor:sourceAncestor,paths:changed});
          const sourceEligible=labRouting.sourceOnly,pairedEligible=labRouting.pairedOnly===true,
            embeddingEligible=labRouting.embeddingOnly===true||labRouting.embeddingProbeOnly===true||labRouting.diagnosticOnly===true;
          const revisitPaths=new Set([
            'extension/core/revisit.js',
            'extension/ui/revisit.js',
            'extension/tests/cpv1-07-revisit-selection.test.mjs',
            'extension/tests/ux-r2-reader-revisit-chrome-e2e.test.mjs',
            '.github/workflows/paia-candidate.yml',
            'extension/docs/consumer-product-v1/STATUS.md',
            'extension/docs/consumer-product-v1/EXECUTION_PROTOCOL.md'
          ]);
          const revisitImplementation=['extension/core/revisit.js',
            'extension/tests/cpv1-07-revisit-selection.test.mjs',
            'extension/tests/ux-r2-reader-revisit-chrome-e2e.test.mjs'].every(path=>changed.includes(path));
          const revisitBrowserOnly=changed.includes('extension/tests/ux-r2-reader-revisit-chrome-e2e.test.mjs')
            &&changed.every(path=>path==='extension/tests/ux-r2-reader-revisit-chrome-e2e.test.mjs'
              ||path==='.github/workflows/paia-candidate.yml'
              ||/^extension\/docs\/consumer-product-v1\/(STATUS|EXECUTION_PROTOCOL)\.md$/.test(path));
          const revisitUI=changed.includes('extension/ui/revisit.js')
            &&changed.includes('extension/tests/ux-r2-reader-revisit-chrome-e2e.test.mjs')
            &&changed.every(path=>path==='extension/ui/revisit.js'
              ||path==='extension/tests/ux-r2-reader-revisit-chrome-e2e.test.mjs'
              ||path==='.github/workflows/paia-candidate.yml'
              ||/^extension\/docs\/consumer-product-v1\/(STATUS|EXECUTION_PROTOCOL)\.md$/.test(path));
          const revisitEligible=sourceAncestor&&changed.length>0
            &&new Set(changed).size===changed.length
            &&(revisitImplementation||revisitBrowserOnly||revisitUI)
            &&changed.every(path=>revisitPaths.has(path));
          const indexPaths=new Set([
            'extension/core/semantic-index.js','extension/tests/cpv1-07-semantic-index.test.mjs',
            '.github/workflows/paia-candidate.yml',
            'extension/docs/consumer-product-v1/STATUS.md',
            'extension/docs/consumer-product-v1/EXECUTION_PROTOCOL.md'
          ]);
          const indexEligible=sourceAncestor&&changed.length>0
            &&new Set(changed).size===changed.length
            &&['extension/core/semantic-index.js','extension/tests/cpv1-07-semantic-index.test.mjs']
              .every(path=>changed.includes(path))
            &&changed.every(path=>indexPaths.has(path));
          const eligible=indexEligible||historyEligible||calibrationEligible||sourceEligible||pairedEligible||embeddingEligible||revisitEligible;
          const files=revisitEligible?[
            'cpv1-07-revisit-selection.test.mjs','revisit-round47.test.mjs',
            'ux-r2-reader-revisit.test.mjs','cpv1-07-history-time.test.mjs'
          ]:(indexEligible||calibrationEligible||sourceEligible||pairedEligible||embeddingEligible)?[
            'cpv1-07-semantic-lab.test.mjs','cpv1-07-retrieval-evaluation.test.mjs',
            'cpv1-07-public-model-provenance.test.mjs','cpv1-07-semantic-index.test.mjs',
            'cpv1-07-semantic-material-snapshot.test.mjs'
          ]:[
            'cpv1-07-historical-comparison.test.mjs','cpv1-07-history-time.test.mjs',
            'universal-search-round46.test.mjs','ux-r4-search-history.test.mjs',
            'input-search-v090.test.mjs','search-hardening-v092.test.mjs',
            'search-service-round2.test.mjs','cpv1-02-6-input-search-cache.test.mjs',
            'history-staleness-v090.test.mjs','history-store.test.mjs'
          ];
          if(eligible&&files.some(file=>group(file)!=='unit'))throw Error('owning unit category drift');
          console.log(JSON.stringify({validationScope:indexEligible?'affected complete derived-index/snapshot/lab/evaluation/provenance unit contracts':embeddingEligible?'affected complete official-source/lab/index/evaluation/provenance unit contracts':revisitEligible?'affected complete Revisit/reading/time unit contracts':pairedEligible?'affected complete paired/lab/index/evaluation/provenance unit contracts':sourceEligible?'affected complete public-source/lab/index/evaluation/provenance unit contracts':calibrationEligible?'affected complete semantic lab/index/evaluation/provenance unit contracts':historyEligible?'affected search/history unit contracts':'complete unit suite',changed,completeCertification:false}));
          const run=(command,args)=>{const result=spawnSync(command,args,{stdio:'inherit'});if(result.status!==0)process.exit(result.status||1);};
          if(!eligible)run('npm',['run','test:unit']);
          else{
            run(process.execPath,['--test','--test-concurrency=4','--test-reporter=./scripts/test-report.mjs',...files.map(file=>'tests/'+file)]);
            run('python3',['scripts/check_package.py']);
            run(process.execPath,['scripts/check_development.mjs']);
          }
          JS

  contracts:
    if: github.event.pull_request.draft == true
    name: Candidate contracts and privacy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - name: Install Chromium for adapter contracts
        run: npx playwright install --with-deps chromium
      - name: Adapter contract
        run: node scripts/test.mjs "adapter contract"
      - name: Privacy and security
        run: node scripts/test.mjs "privacy/security"

  release:
    if: github.event.pull_request.draft == true
    name: Candidate release guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and audit release
        run: npm run build:release

  topic_compatibility:
    if: github.event.pull_request.draft == true && contains(github.event.pull_request.body, 'PAIA_DVN_TOPIC_BROWSER')
    name: Candidate Topic creation compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: extension
    env:
      PAIA_TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Select full hosted Chrome for extension CDP
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
      - name: Provide Chinese glyph coverage for paired Thought evidence
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-wqy-zenhei
          fc-list :lang=zh | grep -q .
      - name: Preserve current supplemental Topic ownership selection
        run: |
          set -o pipefail
          mkdir -p work/qa-dvn-topic-compatibility
          xvfb-run -a node --test --test-concurrency=1 --test-reporter=./scripts/test-report.mjs --test-name-pattern="UX-R3 independent today draft|UX-R3 real Reader" tests/ux-r3-thought-chrome-e2e.test.mjs 2>&1 | tee work/qa-dvn-topic-compatibility/acceptance.log
          cp work/test-summary.json work/qa-dvn-topic-compatibility/test-summary.json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';
          const read=path=>JSON.parse(readFileSync(path)),manifest=read('tests/harness/d5-topic-header-manifest.json'),report=read('work/qa-dvn-topic-compatibility/test-summary.json');assert.equal(report.total,22);assert.equal(report.pass,22);assert.equal(report.fail,0);assert.equal(report.skipped,0);assert.deepEqual(Object.keys(report.files),['ux-r3-thought-chrome-e2e.test.mjs']);
          const passed=readFileSync('work/qa-dvn-topic-compatibility/acceptance.log','utf8').split('\n').filter(line=>line.startsWith('PASS ux-r3-thought-chrome-e2e.test.mjs: ')).map(line=>line.slice('PASS ux-r3-thought-chrome-e2e.test.mjs: '.length));assert.deepEqual(passed.sort(),manifest.compatibilityNames);
          const names=['newer-text','reopened-draft','lost-ack','changed-retry','malformed-ack','malformed-success','ime-settlement'].map(name=>'compose-ack-'+name).concat(['compose-topic-owner','compose-relation-digest','compose-add-owner']);
          for(const variant of ['source','release'])for(const name of names){const receipt=read(`work/ux-r3/${name}-${variant}.json`);assert.equal(receipt.stage,'PASS');assert.equal(receipt.head,process.env.PAIA_TESTED_HEAD);}
          JS
      - name: Retain all supplemental ownership evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topic-compatibility-${{ github.event.pull_request.head.sha }}
          path: |
            extension/work/qa-dvn-topic-compatibility/
            extension/work/ux-r3/
          if-no-files-found: error
          retention-days: 7

  targeted_browser:
    if: github.event.pull_request.draft == true && (contains(github.event.pull_request.body, 'PAIA_VS04_TARGETED_BROWSER') || contains(github.event.pull_request.body, 'PAIA_VS05_TARGETED_BROWSER') || contains(github.event.pull_request.body, 'PAIA_VS05_AI_CANDIDATE_BROWSER') || contains(github.event.pull_request.body, 'PAIA_VS05_RUNNING_BROWSER') || contains(github.event.pull_request.body, 'PAIA_VS05_HISTORY_BROWSER') || contains(github.event.pull_request.body, 'PAIA_VS06_MANIFEST_BROWSER') || contains(github.event.pull_request.body, 'PAIA_ANS04_CURSOR_BROWSER') || contains(github.event.pull_request.body, 'PAIA_VS07_REVISIT_BROWSER') || contains(github.event.pull_request.body, 'PAIA_VS07_HISTORY_BROWSER') || contains(github.event.pull_request.body, 'PAIA_VS07_INDEX_BROWSER') || contains(github.event.pull_request.body, 'PAIA_VS07_SEARCH_REGRESSION') || contains(github.event.pull_request.body, 'PAIA_DVN_TOPIC_BROWSER') || contains(github.event.pull_request.body, 'PAIA_DVN_COMPOSE_BROWSER') || contains(github.event.pull_request.body, 'PAIA_DVN_ORGANIZE_BROWSER') || contains(github.event.pull_request.body, 'PAIA_DVN_CONTEXT_BROWSER') || contains(github.event.pull_request.body, 'PAIA_DVN_CONTEXT_PRESENTATION_BROWSER') || contains(github.event.pull_request.body, 'PAIA_DVN_SETTINGS_PRESENTATION_BROWSER') || contains(github.event.pull_request.body, 'PAIA_DVN_SCOPE_ORDER_BROWSER') || contains(github.event.pull_request.body, 'PAIA_DVN_ORGANIZE_NOTICES_BROWSER') || contains(github.event.pull_request.body, 'PAIA_D7_READER_DIALOGS') || contains(github.event.pull_request.body, 'PAIA_D7_CONFIRMATION_UI') || contains(github.event.pull_request.body, 'PAIA_D7_UI_COHERENCE') || contains(github.event.pull_request.body, 'PAIA_CONTENT_RETURN_DIAGNOSTIC'))
    name: Candidate affected browser
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Select full hosted Chrome for extension CDP
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
      - name: Provide Chinese glyph coverage for paired Thought evidence
        if: contains(github.event.pull_request.body, 'PAIA_DVN_TOPIC_BROWSER') || contains(github.event.pull_request.body, 'PAIA_DVN_COMPOSE_BROWSER') || contains(github.event.pull_request.body, 'PAIA_VS05_AI_CANDIDATE_BROWSER') || contains(github.event.pull_request.body, 'PAIA_DVN_CONTEXT_PRESENTATION_BROWSER') || contains(github.event.pull_request.body, 'PAIA_DVN_SETTINGS_PRESENTATION_BROWSER') || contains(github.event.pull_request.body, 'PAIA_DVN_SCOPE_ORDER_BROWSER') || contains(github.event.pull_request.body, 'PAIA_DVN_ORGANIZE_NOTICES_BROWSER') || contains(github.event.pull_request.body, 'PAIA_CONTENT_RETURN_DIAGNOSTIC')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-wqy-zenhei
          fc-list :lang=zh | grep -q .
      - name: Provide approved confirmation title glyphs
        if: contains(github.event.pull_request.body, 'PAIA_D7_CONFIRMATION_UI') || contains(github.event.pull_request.body, 'PAIA_D7_UI_COHERENCE')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match 'Noto Serif CJK SC'
      - name: D7 UI coherence through existing Settings and history owners
        if: contains(github.event.pull_request.body, 'PAIA_D7_UI_COHERENCE')
        env:
          PAIA_TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PLAYWRIGHT_MODULE: playwright
        run: |
          set -o pipefail
          git cat-file -e 96832cd7e07db7f9946648c0079d1c49e2dfd6cc^{commit} 2>/dev/null || git fetch --no-tags --depth=1 origin 96832cd7e07db7f9946648c0079d1c49e2dfd6cc
          test "$(git rev-parse 96832cd7e07db7f9946648c0079d1c49e2dfd6cc^{commit})" = 96832cd7e07db7f9946648c0079d1c49e2dfd6cc
          test "$(git rev-parse HEAD)" = "$PAIA_TESTED_HEAD"
          mkdir -p work/d7-ui-coherence
          xvfb-run -a node --test --test-concurrency=1 --test-reporter=./scripts/test-report.mjs tests/uir-04-settings-chrome-e2e.test.mjs tests/uir-04-data-chrome-e2e.test.mjs scripts/verify-d7-history-import.mjs 2>&1 | tee work/d7-ui-coherence/acceptance.log
          cp work/test-summary.json work/d7-ui-coherence/test-summary.json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';
          const read=path=>JSON.parse(readFileSync(path)),summary=read('work/d7-ui-coherence/test-summary.json');
          assert.equal(summary.total,7);assert.equal(summary.pass,7);assert.equal(summary.fail,0);assert.equal(summary.skipped,0);
          assert.deepEqual(Object.keys(summary.files).sort(),['uir-04-data-chrome-e2e.test.mjs','uir-04-settings-chrome-e2e.test.mjs','verify-d7-history-import.mjs']);
          const ids=['thought-empty','settings-data','selection-light','selection-dark','selection-320-text200','selection-320-text200-details-end','selection-coarse','preview-light','preview-320','importing-dark','paused-320-dark','reselect-light','reselect-light-details-end','completed-light','partial-dark','cancelled-light','error-320','error-320-details-end'];
          for(const variant of ['source','release']){
            const root='work/d7-history-import-appearance/',report=read(root+variant+'-receipt.json');
            assert.equal(report.head,process.env.PAIA_TESTED_HEAD);assert.equal(report.variant,variant);assert.equal(report.evidence,'SYNTHETIC_BROWSER');assert.equal(report.result,'PASS');assert.deepEqual(report.rows.map(row=>row.id),ids);
            for(const key of ['explicitPerFileConsent','previewWritesNoBodies','exactSourceTextAndIdentity','pauseReselectResume','cancelRetainsCommittedMaterial','rejectedFileRetainsMaterial'])assert.equal(report.invariants[key],true,key);
            assert.equal(report.invariants.externalRequests,0);assert.equal(report.invariants.providerRequests,0);assert.deepEqual(report.invariants.pageErrors,[]);
            for(const row of report.rows){const png=readFileSync(root+row.file);assert.ok(png.subarray(0,8).equals(Buffer.from([137,80,78,71,13,10,26,10])));assert.equal(png.readUInt32BE(20),1000);assert.ok([320,1440].includes(png.readUInt32BE(16)));}
          }
          JS
      - name: Retain D7 UI coherence evidence
        if: always() && contains(github.event.pull_request.body, 'PAIA_D7_UI_COHERENCE')
        uses: actions/upload-artifact@v4
        with:
          name: d7-ui-coherence-${{ github.event.pull_request.head.sha }}
          path: |
            extension/work/d7-ui-coherence/
            extension/work/d7-history-import-appearance/
            extension/work/qa-dvn-settings/
            extension/work/ux-r6/
          if-no-files-found: error
          retention-days: 7
      - name: D7 removal and blocked-purge complete owner regressions
        if: contains(github.event.pull_request.body, 'PAIA_D7_CONFIRMATION_UI')
        env:
          PAIA_TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PLAYWRIGHT_MODULE: playwright
        run: |
          set -o pipefail
          test "$(git rev-parse HEAD)" = "$PAIA_TESTED_HEAD"
          mkdir -p work/d7-reader-confirmation
          xvfb-run -a node --test --test-concurrency=1 --test-reporter=./scripts/test-report.mjs tests/cpv1-02-dvn-removal-chrome-e2e.test.mjs tests/cpv1-02-dvn-purge-chrome-e2e.test.mjs 2>&1 | tee work/d7-reader-confirmation/acceptance.log
          cp work/test-summary.json work/d7-reader-confirmation/test-summary.json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import {readFileSync,writeFileSync} from 'node:fs';
          const report=JSON.parse(readFileSync('work/d7-reader-confirmation/test-summary.json'));
          assert.equal(report.total,16);assert.equal(report.pass,16);assert.equal(report.fail,0);assert.equal(report.skipped,0);
          assert.deepEqual(Object.keys(report.files).sort(),['cpv1-02-dvn-purge-chrome-e2e.test.mjs','cpv1-02-dvn-removal-chrome-e2e.test.mjs']);
          for(const variant of ['source','release'])for(const [folder,screen,surface] of [['removal','A11','removal'],['purge','A12','purge-blocked']]){
            const directory=`work/qa-dvn-${folder}/reader-confirmation`,receipt=JSON.parse(readFileSync(`${directory}/${variant}-${screen}-receipt.json`));
            assert.equal(receipt.headSha,process.env.PAIA_TESTED_HEAD);assert.equal(receipt.variant,variant);assert.equal(receipt.screen,screen);assert.equal(receipt.surface,surface);assert.equal(receipt.result,'PASS');assert.equal(receipt.originalOwnerCase,'PASS');
            assert.deepEqual(receipt.rows.map(row=>row.id),['1440-light','1440-dark','320-dark','320-text200','1440-coarse','320-long-copy']);assert.ok(receipt.rows.every(row=>row.status==='PASS'));
            assert.deepEqual(receipt.network,{externalRequests:0,extensionNetworkRequests:0,providerRequests:0,pageErrors:[]});assert.equal(receipt.references.length,2);
            const png=(name,width,height)=>{const bytes=readFileSync(`${directory}/${name}`);assert.ok(bytes.subarray(0,8).equals(Buffer.from([137,80,78,71,13,10,26,10])));assert.equal(bytes.readUInt32BE(16),width);assert.equal(bytes.readUInt32BE(20),height);};
            for(const row of receipt.rows){png(row.capture,row.width,row.height);if(row.text200||row.longCopy)png(row.bottomCapture,row.width,row.height);}
            for(const reference of receipt.references){assert.equal(reference.originalUnchanged,true);png(reference.file,1440,1000);}
          }
          writeFileSync('work/d7-reader-confirmation/owner-receipt.json',JSON.stringify({head:process.env.PAIA_TESTED_HEAD,result:'PASS',...report},null,2));
          JS
      - name: Retain D7 confirmation owner evidence
        if: always() && contains(github.event.pull_request.body, 'PAIA_D7_CONFIRMATION_UI')
