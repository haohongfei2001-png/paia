name: PAIA Candidate Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'extension/**'
      - '!extension/docs/**'
      - 'native-hosts/**'
      - '.github/workflows/paia-candidate.yml'
      - '.github/workflows/paia-certification.yml'

permissions:
  contents: read

concurrency:
  group: paia-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  PAIA_TEST_CONCURRENCY: '4'
  PLAYWRIGHT_MODULE: 'playwright'

# Draft pushes are intentionally a light engineering gate. The executor owns
# targeted browser tests for the behavior it changes. Full browser/history/
# macOS certification is reserved for explicit slice/high-risk certification.
jobs:
  unit:
    if: github.event.pull_request.draft == true
    name: Candidate unit smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - name: Run owning unit contracts or complete unit suite
        env:
          EVENT_ACTION: ${{ github.event.action }}
          PREVIOUS_HEAD: ${{ github.event.before }}
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'JS'
          import {execFileSync,spawnSync} from 'node:child_process';
          import {group} from './scripts/test-groups.mjs';
          import {semanticLabRouting} from './scripts/semantic-lab-change.mjs';
          const previous=process.env.PREVIOUS_HEAD||'',head=process.env.CANDIDATE_HEAD||'';
          const sha=/^[0-9a-f]{40}$/;
          let changed=[];
          if(process.env.EVENT_ACTION==='synchronize'&&sha.test(previous)&&sha.test(head)){
            // Compare the full synchronized coherent batch, never HEAD^ alone
            // (which could omit earlier commits delivered by the same push).
            changed=execFileSync('git',['diff','--name-only',previous,head],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          }
          const owner='extension/tests/cpv1-07-historical-comparison-chrome-e2e.test.mjs';
          const historyEligible=changed.includes(owner)&&changed.every(path=>
            path===owner||path==='.github/workflows/paia-candidate.yml'||
            /^extension\/docs\/consumer-product-v1\/(STATUS|EXECUTION_PROTOCOL)\.md$/.test(path));
          const calibrationPaths=new Set([
            'extension/experiments/semantic-calibration.mjs',
            'extension/experiments/semantic-lab-index.mjs',
            'extension/tests/fixtures/cpv1-07-calibration-corpus.mjs',
            'extension/tests/cpv1-07-semantic-lab.test.mjs',
            'extension/scripts/run-official-semantic-retrieval-lab.mjs',
            '.github/workflows/paia-vs07-semantic-lab.yml',
            '.github/workflows/paia-candidate.yml',
            'extension/docs/consumer-product-v1/STATUS.md',
            'extension/docs/consumer-product-v1/EXECUTION_PROTOCOL.md'
          ]);
          const calibrationEligible=changed.includes('extension/experiments/semantic-calibration.mjs')
            &&changed.includes('extension/scripts/run-official-semantic-retrieval-lab.mjs')
            &&changed.every(path=>calibrationPaths.has(path));
          let sourceAncestor=false;
          if(process.env.EVENT_ACTION==='synchronize'&&sha.test(previous)&&sha.test(head)&&previous!==head){
            try{execFileSync('git',['merge-base','--is-ancestor',previous,head],{stdio:'pipe'});sourceAncestor=true;}
            catch{/* Unknown/replaced history retains complete original unit suite. */}
          }
          const labRouting=semanticLabRouting({action:process.env.EVENT_ACTION,
            before:previous,head,ancestor:sourceAncestor,paths:changed});
          const sourceEligible=labRouting.sourceOnly,pairedEligible=labRouting.pairedOnly===true;
          const eligible=historyEligible||calibrationEligible||sourceEligible||pairedEligible;
          const files=(calibrationEligible||sourceEligible||pairedEligible)?[
            'cpv1-07-semantic-lab.test.mjs','cpv1-07-retrieval-evaluation.test.mjs',
            'cpv1-07-public-model-provenance.test.mjs','cpv1-07-semantic-index.test.mjs',
            'cpv1-07-semantic-material-snapshot.test.mjs'
          ]:[
            'cpv1-07-historical-comparison.test.mjs','cpv1-07-history-time.test.mjs',
            'universal-search-round46.test.mjs','ux-r4-search-history.test.mjs',
            'input-search-v090.test.mjs','search-hardening-v092.test.mjs',
            'search-service-round2.test.mjs','cpv1-02-6-input-search-cache.test.mjs',
            'history-staleness-v090.test.mjs','history-store.test.mjs'
          ];
          if(eligible&&files.some(file=>group(file)!=='unit'))throw Error('owning unit category drift');
          console.log(JSON.stringify({validationScope:pairedEligible?'affected complete paired/lab/index/evaluation/provenance unit contracts':sourceEligible?'affected complete public-source/lab/index/evaluation/provenance unit contracts':calibrationEligible?'affected complete semantic lab/index/evaluation/provenance unit contracts':historyEligible?'affected search/history unit contracts':'complete unit suite',changed,completeCertification:false}));
          const run=(command,args)=>{const result=spawnSync(command,args,{stdio:'inherit'});if(result.status!==0)process.exit(result.status||1);};
          if(!eligible)run('npm',['run','test:unit']);
          else{
            run(process.execPath,['--test','--test-concurrency=4','--test-reporter=./scripts/test-report.mjs',...files.map(file=>'tests/'+file)]);
            run('python3',['scripts/check_package.py']);
            run(process.execPath,['scripts/check_development.mjs']);
          }
          JS

  contracts:
    if: github.event.pull_request.draft == true
    name: Candidate contracts and privacy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - name: Install Chromium for adapter contracts
        run: npx playwright install --with-deps chromium
      - name: Adapter contract
        run: node scripts/test.mjs "adapter contract"
      - name: Privacy and security
        run: node scripts/test.mjs "privacy/security"

  release:
    if: github.event.pull_request.draft == true
    name: Candidate release guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and audit release
        run: npm run build:release

  targeted_browser:
    if: github.event.pull_request.draft == true && (contains(github.event.pull_request.body, 'PAIA_VS04_TARGETED_BROWSER') || contains(github.event.pull_request.body, 'PAIA_VS05_TARGETED_BROWSER') || contains(github.event.pull_request.body, 'PAIA_VS05_AI_CANDIDATE_BROWSER') || contains(github.event.pull_request.body, 'PAIA_VS05_RUNNING_BROWSER') || contains(github.event.pull_request.body, 'PAIA_VS05_HISTORY_BROWSER') || contains(github.event.pull_request.body, 'PAIA_VS06_MANIFEST_BROWSER') || contains(github.event.pull_request.body, 'PAIA_ANS04_CURSOR_BROWSER') || contains(github.event.pull_request.body, 'PAIA_VS07_REVISIT_BROWSER') || contains(github.event.pull_request.body, 'PAIA_VS07_HISTORY_BROWSER') || contains(github.event.pull_request.body, 'PAIA_VS07_INDEX_BROWSER'))
    name: Candidate affected browser
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Select full hosted Chrome for extension CDP
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
      - name: Fixed Context manifest and exact preview release
        if: contains(github.event.pull_request.body, 'PAIA_VS06_MANIFEST_BROWSER')
        run: xvfb-run -a node --test --test-name-pattern="UX-R4 unorganized Input -> exact editable preview|UX-R4 real worker Grant once|VS06 whole-group chooser|VS06 authorized supplements|VS06 budget packages|VS06 workspace permission round-trip|VS06 readable edited preview|VS06 Passport workspace" tests/ux-r4-search-reuse-chrome-e2e.test.mjs
      - name: ANS-04 scoped cursor certification regression
        if: contains(github.event.pull_request.body, 'PAIA_ANS04_CURSOR_BROWSER')
        run: xvfb-run -a node --test tests/ans-04-navigation-query-chrome-e2e.test.mjs

      - name: VS07 finite Revisit priority and exclusion journeys
        if: contains(github.event.pull_request.body, 'PAIA_VS07_REVISIT_BROWSER')
        run: xvfb-run -a node --test --test-name-pattern="VS07 Revisit explains a finite priority set|UX-R2 topic exclusion removes related Input previews|UX-R2 live capture scope" tests/ux-r2-reader-revisit-chrome-e2e.test.mjs


      - name: VS07 native IndexedDB complete snapshot and index lifecycle
        if: contains(github.event.pull_request.body, 'PAIA_VS07_INDEX_BROWSER')
        run: xvfb-run -a node --test tests/cpv1-07-semantic-storage-chrome-e2e.test.mjs

      - name: VS07 historical expression comparison and stale-scope journeys
        if: contains(github.event.pull_request.body, 'PAIA_VS07_HISTORY_BROWSER')
        run: |
          xvfb-run -a node --test tests/cpv1-07-historical-comparison-chrome-e2e.test.mjs
          xvfb-run -a node --test --test-name-pattern="UX-R4 historical Source, comparison, scope, tray and preview responsive matrix" tests/ux-r4-search-reuse-chrome-e2e.test.mjs

      - name: Retain synthetic historical comparison evidence
        if: always() && contains(github.event.pull_request.body, 'PAIA_VS07_HISTORY_BROWSER')
        uses: actions/upload-artifact@v4
        with:
          name: vs07-history-comparison-candidate
          path: extension/work/vs07-history-comparison/*.png
          if-no-files-found: error

      - name: Reader editing and lazy long-entry regression
        if: contains(github.event.pull_request.body, 'PAIA_VS04_TARGETED_BROWSER')
        run: |
          node --test --test-name-pattern="VS-04 lazy long entry" tests/reading-ui-round3-chrome-e2e.test.mjs
          xvfb-run -a node --test tests/cpv1-04-conflict-chrome-e2e.test.mjs
          xvfb-run -a node --test --test-name-pattern="Smart Filter isolated Chrome|VS-04 universal search requires explicit inclusion|VS-04 Reader keeps a filtered Input" tests/smart-filter-ui-e2e.test.mjs
          xvfb-run -a node --test --test-name-pattern="VS-04 search positions a lexical hit|VS-04 direct Input edit stays traceable|VS-04 current-document search saves a live edit|VS-04 undo survives navigation|VS-04 source purge refuses an unfinished Reader IME edit" tests/cpv1-02-4-reader-chrome-e2e.test.mjs
          xvfb-run -a node --test tests/cpv1-02-3-navigator-chrome-e2e.test.mjs
          xvfb-run -a node --test tests/cpv1-02-1-shell-chrome-e2e.test.mjs
          xvfb-run -a node --test --test-name-pattern="VS-04 failed Archive removal" tests/cpv1-01-save-recovery-chrome-e2e.test.mjs

      - name: Thought root, layout choice and original Reader
        if: contains(github.event.pull_request.body, 'PAIA_VS05_TARGETED_BROWSER')
        run: xvfb-run -a node --test tests/uir-03-thought-original-chrome-e2e.test.mjs

      - name: AI candidate comparison, explicit decisions and stale protection
        if: contains(github.event.pull_request.body, 'PAIA_VS05_AI_CANDIDATE_BROWSER')
        run: xvfb-run -a node --test tests/uir-03-ai-candidate-chrome-e2e.test.mjs

      - name: Thought root layout and invalidated history regressions
        if: contains(github.event.pull_request.body, 'PAIA_VS05_HISTORY_BROWSER')
        run: |
          xvfb-run -a node --test --test-concurrency=1 tests/ans-07-library-root-chrome-e2e.test.mjs tests/ux-r3-history-preemption-chrome-e2e.test.mjs
          xvfb-run -a node --test --test-name-pattern="UX-R3 independent today draft" tests/ux-r3-thought-chrome-e2e.test.mjs

      - name: AI running state, interactive long Topic and motion
        if: contains(github.event.pull_request.body, 'PAIA_VS05_RUNNING_BROWSER')
        run: xvfb-run -a node --test tests/uir-03-ai-presentation-chrome-e2e.test.mjs

      - name: Retain Thought root and Reader visual evidence
        if: always() && (contains(github.event.pull_request.body, 'PAIA_VS05_TARGETED_BROWSER') || contains(github.event.pull_request.body, 'PAIA_VS05_AI_CANDIDATE_BROWSER') || contains(github.event.pull_request.body, 'PAIA_VS05_RUNNING_BROWSER'))
        uses: actions/upload-artifact@v4
        with:
          name: vs05-topic-root-candidate
          path: extension/work/ux-r3/*.png
          if-no-files-found: error

  scale_probe:
    if: github.event.pull_request.draft == true && contains(github.event.pull_request.body, 'PAIA_VS04_SCALE_DRAFT')
    name: Candidate VS-04 bounded scale probe
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Use full Chrome for extension CDP
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
      - name: Probe 1k long-content Reader, search and scroll
        env:
          CI: '1'
          PLAYWRIGHT_MODULE: playwright
          PAIA_SCALE_SIZES: '1000'
          PAIA_SCALE_LONG_CONTENT: '1'
        run: node tests/cpv1-02-6-scale-benchmark.mjs

  macos_reload_diagnostic:
    if: github.event.pull_request.draft == true && contains(github.event.pull_request.body, 'PAIA_VS04_TARGETED_MAC')
    name: Candidate hosted Mac extension-reload diagnostic
    runs-on: macos-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install chromium
      - name: Select hosted Mac Chrome
        run: |
          CHROME_BIN="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          if [ ! -x "$CHROME_BIN" ]; then
            CHROME_BIN="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          fi
          test -x "$CHROME_BIN"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
      - name: Diagnose old-tab refresh after extension reload
        env:
          PAIA_HEADLESS: '1'
        run: node --test tests/cpv1-01-2-reconnect-chrome-e2e.test.mjs

  candidate:
    name: Candidate gate
    runs-on: ubuntu-latest
    if: always() && github.event.pull_request.draft == true
    needs: [unit, contracts, release, targeted_browser, scale_probe, macos_reload_diagnostic]
    steps:
      - name: Require light candidate gates
        env:
          UNIT: ${{ needs.unit.result }}
          CONTRACTS: ${{ needs.contracts.result }}
          RELEASE: ${{ needs.release.result }}
          TARGETED_BROWSER: ${{ needs.targeted_browser.result }}
          SCALE_PROBE: ${{ needs.scale_probe.result }}
          MACOS_RELOAD_DIAGNOSTIC: ${{ needs.macos_reload_diagnostic.result }}
        run: |
          printf 'unit=%s\ncontracts=%s\nrelease=%s\n' "$UNIT" "$CONTRACTS" "$RELEASE"
          test "$UNIT" = success
          test "$CONTRACTS" = success
          test "$RELEASE" = success
          if [ "$TARGETED_BROWSER" != skipped ]; then test "$TARGETED_BROWSER" = success; fi
          if [ "$SCALE_PROBE" != skipped ]; then test "$SCALE_PROBE" = success; fi
          if [ "$MACOS_RELOAD_DIAGNOSTIC" != skipped ]; then test "$MACOS_RELOAD_DIAGNOSTIC" = success; fi
