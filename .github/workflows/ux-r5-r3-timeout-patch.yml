name: UX-R5 R3 large fixture timeout patch
on:
  push:
    paths:
      - '.github/workflows/ux-r5-r3-timeout-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-r5
          fetch-depth: 0
      - name: Raise only outer R3 F-LARGE watchdog
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('extension/tests/ux-r3-thought-chrome-e2e.test.mjs')
          s=p.read_text()
          old="test('UX-R3 F-LARGE 100k Inputs / 1000 documents / 300 Topics / 5000 Thoughts: bounded page, real UI, anchor and Back/Forward',{timeout:300000},async()=>{"
          new=old.replace('timeout:300000','timeout:420000')
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          node --check extension/tests/ux-r3-thought-chrome-e2e.test.mjs
      - name: Commit patch and remove staging workflow
        run: |
          rm .github/workflows/ux-r5-r3-timeout-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/tests/ux-r3-thought-chrome-e2e.test.mjs .github/workflows/ux-r5-r3-timeout-patch.yml
          git commit -m 'test(browser): allow shared-runner headroom for R3 F-LARGE'
          git push origin HEAD:ux-r5
