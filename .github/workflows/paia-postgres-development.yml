name: PAIA PostgreSQL Development Evidence

# Isolated storage evidence only. Does not change any mandatory/full gate,
# deploy an application, contact a provider, or use a user database/secret.
on:
  push:
    branches: ['evidence/postgres-ledger-20261018']
    paths:
      - 'services/ai-gateway/**'
      - '.github/workflows/paia-postgres-development.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-ledger:
    if: github.ref == 'refs/heads/evidence/postgres-ledger-20261018'
    name: Real PostgreSQL single-ledger development evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/ai-gateway
    services:
      postgres:
        # Official library/postgres 17.11, index digest verified 2026-10-18.
        image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: paia_ledger_test_development
          # No credentials. Disposable runner-only database, loopback binding.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d paia_ledger_test_development"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: '1'
      PAIA_LEDGER_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/paia_ledger_test_development
      PAIA_LEDGER_TEST_DISPOSABLE: 'yes'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked official PostgreSQL client
        id: install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Record exact development evidence identity
        run: |
          mkdir -p evidence
          node --input-type=module <<'JS'
          import {writeFile} from 'node:fs/promises';
          import {Pool} from 'pg';
          import {disposablePostgresConfig} from './tests/postgres-test-config.mjs';
          const pool = new Pool(disposablePostgresConfig(process.env.PAIA_LEDGER_TEST_DATABASE_URL, process.env.PAIA_LEDGER_TEST_DISPOSABLE));
          try {
            const version = (await pool.query('SHOW server_version')).rows[0].server_version;
            await writeFile('evidence/identity.json', JSON.stringify({head: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT, serverVersion: version, schemaVersion: 1, syntheticDataOnly: true, providerDispatch: false, providerTransport: 'synthetic-https-intercept'}, null, 2));
          } finally { await pool.end(); }
          JS
      - name: Protocol and failure-injection tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p evidence
          npm test 2>&1 | tee evidence/protocol.tap
      - name: Actual multi-connection PostgreSQL tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p evidence
          npm run test:postgres 2>&1 | tee evidence/postgres.tap
      - name: Signed service composition and bounded HTTP tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p evidence
          node --test --test-reporter=tap tests/request-entry.test.mjs tests/reservation-service.test.mjs tests/reservation-cancellation.test.mjs ../../extension/tests/ai-service-identity.test.mjs 2>&1 | tee evidence/service-protocol.tap
      - name: Actual service authority and publication concurrency
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p evidence
          npm run test:service:postgres 2>&1 | tee evidence/service-postgres.tap
      - name: Exact declaration transport and default-off entry protocols
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p evidence
          node --test --test-reporter=tap tests/client-declaration-entry.test.mjs tests/client-declaration-publisher.test.mjs tests/declaration-deployment-bootstrap.test.mjs tests/deployment-bootstrap.test.mjs ../../extension/tests/qwen-client-declaration.test.mjs 2>&1 | tee evidence/declaration-protocol.tap
      - name: Actual declaration publication and terminal-revoke concurrency
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p evidence
          node tests/run-client-declaration-postgres-tests.mjs 2>&1 | tee evidence/declaration-postgres.tap
      - name: Once-send provider owner and bounded decoder protocols
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p evidence
          node --test --test-reporter=tap tests/provider-evidence.test.mjs tests/provider-response.test.mjs tests/provider-runner.test.mjs 2>&1 | tee evidence/provider-protocol.tap
      - name: Actual provider claim and original-ledger concurrency
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p evidence
          node tests/run-provider-postgres-tests.mjs 2>&1 | tee evidence/provider-postgres.tap
      - name: Provider HTTP composition and result finalization protocols
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p evidence
          npm run check:deployment-source 2>&1 | tee evidence/deployment-source.log
          node --test --test-reporter=tap tests/provider-entry.test.mjs tests/provider-deployment.test.mjs tests/provider-settlement.test.mjs ../../extension/tests/ai-cost-02-result-finalization.test.mjs 2>&1 | tee evidence/provider-completion-protocol.tap
      - name: Actual provider usage settlement and historical accounting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p evidence
          node tests/run-provider-settlement-postgres-tests.mjs 2>&1 | tee evidence/provider-settlement-postgres.tap
      - name: Authenticated result and client-owner protocols
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p evidence
          node --test --test-reporter=tap tests/result-entry.test.mjs tests/result-ledger.test.mjs tests/result-service.test.mjs ../../extension/tests/ai-cost-02-client-domain-result.test.mjs ../../extension/tests/qwen-foundation-service-result.test.mjs 2>&1 | tee evidence/result-bridge-protocol.tap
      - name: Actual original-ledger domain result concurrency
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p evidence
          node tests/result-postgres-run.mjs 2>&1 | tee evidence/result-postgres.tap
      - name: Authenticated operation status protocols
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p evidence
          node --test --test-reporter=tap tests/operation-status.test.mjs tests/operation-status-entry.test.mjs 2>&1 | tee evidence/operation-status-protocol.tap
      - name: Actual unknown financial outcome reconciliation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p evidence
          node tests/run-operation-status-postgres-tests.mjs 2>&1 | tee evidence/operation-status-postgres.tap
      - name: Original historical action through synthetic service protocols
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p evidence
          npm run test:historical 2>&1 | tee evidence/historical-client-protocol.tap
      - name: Retain exact-head development test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-development-${{ github.sha }}-${{ github.run_attempt }}
          path: services/ai-gateway/evidence/
          if-no-files-found: error
          retention-days: 7
