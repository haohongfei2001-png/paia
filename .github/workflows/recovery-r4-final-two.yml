name: UX-R4 final two browser races

on:
  push:
    branches: [recovery-r4-1]
    paths:
      - '.github/workflows/recovery-r4-final-two.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery-r4-1
          fetch-depth: 0
      - name: Fix recent-read refresh and Preview activation remount
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new, label):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if old not in text: raise SystemExit(f'{label} target not found')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          replace_one(
            'extension/ui/archive.js',
            "chrome.runtime.onMessage.addListener(m=>{if(m.type==='ARCHIVE_CHANGED'){if(['UPDATE_PREFERENCES','RECORD_TOPIC_READ','SET_ORGANIZER_CONTROLS'].includes(m.cause))return;smartFilter.changed();if(!m.cause)return;$('revision-dialog').close();$('revision-list').replaceChildren();if(view==='thoughts'){if(!['SET_ORGANIZER_CONTROLS','RECORD_TOPIC_READ'].includes(m.cause)||m.cause==='RECORD_TOPIC_READ'&&!thoughts.id)void thoughts.refresh();}else if(view==='memory'){void refresh();}else{memory.invalidate();void refresh();}}});",
            "chrome.runtime.onMessage.addListener(m=>{if(m.type==='ARCHIVE_CHANGED'){if(m.cause==='RECORD_TOPIC_READ'){if(view==='thoughts'&&!thoughts.id)void thoughts.refresh();return;}if(['UPDATE_PREFERENCES','SET_ORGANIZER_CONTROLS'].includes(m.cause))return;smartFilter.changed();if(!m.cause)return;$('revision-dialog').close();$('revision-list').replaceChildren();if(view==='thoughts')void thoughts.refresh();else if(view==='memory'){void refresh();}else{memory.invalidate();void refresh();}}});",
            'Thought recent-read refresh boundary')

          replace_one(
            'extension/ui/material-tray.js',
            "activate(active){this.active=active;if(active){this.advanced=false;this.drawer.hidden=true;document.querySelector('.app-shell').inert=false;this.panel.prepend(this.root);this.root.hidden=false;this.legacyRoot.hidden=true;void this.perform(async()=>{const next=await this.rpc('read');this.data=next;this.rechecking=false;this.render();});}else if(!this.drawer.hidden){this.root.hidden=false;}else this.root.hidden=true;}",
            "activate(active){this.active=active;if(active){this.advanced=false;this.drawer.hidden=true;document.querySelector('.app-shell').inert=false;this.panel.prepend(this.root);this.root.hidden=false;this.legacyRoot.hidden=true;void this.perform(async()=>{const previous=this.data,next=await this.rpc('read');this.data=next;this.rechecking=false;if(!this.root.firstChild||this.visibleChanged(previous,next))this.render();});}else if(!this.drawer.hidden){this.root.hidden=false;}else this.root.hidden=true;}",
            'Material Tray activation remount')

          test=Path('extension/tests/ux-r4-search-reuse-chrome-e2e.test.mjs')
          text=test.read_text(encoding='utf-8')
          old="await p.locator('#material-preview').click();await until(async()=>(await tray(p)).state==='ready');await p.getByRole('button',{name:'修改本次输出',exact:true}).click();"
          new="await p.evaluate(()=>{const send=chrome.runtime.sendMessage.bind(chrome.runtime);let release;globalThis.__uxr4ActivationReadStarted=false;globalThis.__uxr4ActivationGate=new Promise(r=>{release=r;});globalThis.__releaseUXR4ActivationRead=release;chrome.runtime.sendMessage=async(...args)=>{const result=await send(...args);if(!globalThis.__uxr4ActivationReadStarted&&args[0]?.type==='PAIA_CONTEXT_MANUAL'&&args[0].options?.action==='read'&&document.querySelector('#material-output-text')){globalThis.__uxr4ActivationReadStarted=true;await globalThis.__uxr4ActivationGate;}return result;};});await p.locator('#material-preview').click();await until(()=>p.evaluate(()=>globalThis.__uxr4ActivationReadStarted),'Preview activation read');await until(async()=>(await tray(p)).state==='ready');await p.evaluate(()=>{globalThis.__uxr4StableEdit=document.querySelector('#material-workbench button:not([data-output])');globalThis.__uxr4StableEdit=[...document.querySelectorAll('#material-workbench button')].find(b=>b.textContent==='修改本次输出');});await p.evaluate(()=>globalThis.__releaseUXR4ActivationRead());await until(()=>p.evaluate(async()=>{const {getMaterialTray}=await import(chrome.runtime.getURL('ui/material-tray.js'));return !getMaterialTray().busy;}),'Preview activation recheck');assert.equal(await p.evaluate(()=>globalThis.__uxr4StableEdit===[...document.querySelectorAll('#material-workbench button')].find(b=>b.textContent==='修改本次输出')),true,'same-data activation recheck must not remount confirmed Preview');await p.getByRole('button',{name:'修改本次输出',exact:true}).click();"
          if old not in text: raise SystemExit('R4 first Preview edit target not found')
          test.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Syntax check
        run: |
          node --check extension/ui/archive.js
          node --check extension/ui/material-tray.js
          node --check extension/tests/ux-r4-search-reuse-chrome-e2e.test.mjs
      - name: Commit recovery patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/ui/archive.js extension/ui/material-tray.js extension/tests/ux-r4-search-reuse-chrome-e2e.test.mjs
          git rm .github/workflows/recovery-r4-final-two.yml
          git commit -m 'fix(ux-r4): settle final preview and recent-read races'
          git push origin HEAD:refs/heads/recovery-r4-1
