name: PAIA Design Artifact Authoring
on:
  push:
    branches: ['design/continuous-editorial-v1']
    paths: ['design/.transfer/READY']
permissions:
  contents: write
concurrency:
  group: paia-design-editorial-v1
  cancel-in-progress: false
jobs:
  author:
    if: github.repository == 'haohongfei2001-png/paia' && github.ref == 'refs/heads/design/continuous-editorial-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install design-authoring tools only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-ebgaramond fonts-inter fonts-noto-cjk
          python -m pip install Pillow==11.3.0 playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Author static SVG and PNG design deliverables
        run: |
          cat design/.transfer/*.part > /tmp/paia-design-payload.tar.xz
          echo '561a7d9585b44bf085177341a7e6bb2ffaa8eca6365bb868b5886fd7ab245d93  /tmp/paia-design-payload.tar.xz' | sha256sum -c -
          python - <<'PY'
          import tarfile,pathlib,json
          p=pathlib.Path('/tmp/paia-design')
          p.mkdir()
          with tarfile.open('/tmp/paia-design-payload.tar.xz') as t:t.extractall(p,filter='data')
          patch=pathlib.Path('design/.transfer/patches.json')
          if patch.exists():
              for edit in json.loads(patch.read_text()):
                  f=p/edit['file'];s=f.read_text()
                  assert edit['find'] in s,edit['find']
                  f.write_text(s.replace(edit['find'],edit['replace']))
          PY
          mkdir -p design/website-editorial-v1/authoring
          cp -a /tmp/paia-design/package/. design/website-editorial-v1/
          cp /tmp/paia-design/render_design.py /tmp/paia-design/finish.py design/website-editorial-v1/authoring/
          python /tmp/paia-design/render_design.py design/website-editorial-v1 --fetch
          python /tmp/paia-design/finish.py design/website-editorial-v1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: paia-editorial-design-proof
          path: design/website-editorial-v1/
          retention-days: 7
          if-no-files-found: error
      - name: Commit design files only on design branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- design/website-editorial-v1/
          git diff --cached --quiet || git commit -m 'design: publish bilingual editorial artboards and fidelity contract'
          git push origin HEAD:design/continuous-editorial-v1
