name: Website Refoundation Bootstrap
on:
  push:
    branches: [website/refoundation-20260926]
    paths: ['website/.refoundation-transfer/**', '.github/workflows/website-refoundation-bootstrap.yml']
permissions:
  contents: write
jobs:
  materialize-reviewed-website:
    if: github.repository == 'haohongfei2001-png/paia' && github.ref == 'refs/heads/website/refoundation-20260926'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WEBSITE_TEST_OUTPUT: website-test-artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Verify and materialize reviewed text sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, lzma
          root=Path.cwd()
          parts=[root/f'website/.refoundation-transfer/source-{i}.bin' for i in (1,2,3)]
          packed=b''.join(p.read_bytes() for p in parts)
          assert len(packed)==37096
          assert hashlib.sha256(packed).hexdigest()=='1fd621103a5e87071800a4672ad0c6edffab194bf58d746dffc123a8be7bd917'
          raw=lzma.decompress(packed,memlimit=256*1024*1024)
          assert len(raw)==125451
          sources=json.loads(raw)
          allowed={'website/build.py','website/test.py','website/render_social.py','website/requirements.txt','website/README.md','assets/website/site.css','assets/website/site.js','assets/website/demo.js','assets/website/favicon.svg'}
          assert set(sources)==allowed
          for name,text in sources.items():
              assert isinstance(text,str)
              target=root/name
              assert target.resolve().is_relative_to(root)
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(text,encoding='utf-8')
          for p in parts: p.unlink()
          print('Verified source SHA256 and exact website-only path allowlist')
          PY
      - name: Install browser and local fonts
        run: |
          python -m pip install -r website/requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk fonts-liberation
      - name: Build static production website on its owned branch only
        run: |
          python website/build.py
          python website/render_social.py
          python - <<'PY'
          from pathlib import Path
          sources=['website/build.py','website/test.py','website/render_social.py','website/requirements.txt','website/README.md','assets/website/site.css','assets/website/site.js','assets/website/demo.js','assets/website/favicon.svg']
          generated=Path('website/generated-paths.txt').read_text().splitlines()
          roots={'index.html','demo.html','beta.html','principles.html','status.html','about.html','privacy-policy.html','terms.html','thanks.html','404.html'}
          expected=roots|{'en/'+p for p in roots}|{'sitemap.xml','robots.txt'}
          assert set(generated)==expected
          paths=sources+generated+['website/generated-paths.txt','assets/website/og-zh.png','assets/website/og-en.png']+[f'website/.refoundation-transfer/source-{i}.bin' for i in (1,2,3)]
          Path('/tmp/website-stage').write_bytes(b'\0'.join(p.encode() for p in paths)+b'\0')
          PY
          git add --pathspec-from-file=/tmp/website-stage --pathspec-file-nul
          git diff --cached --name-only
          git config user.name 'PAIA Website Build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refound PAIA website around user-owned expression and deliberate reuse'
          git push origin HEAD:refs/heads/website/refoundation-20260926
          echo "REVIEW_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Check the generated head through real local HTTP
        run: |
          git rev-parse HEAD
          python website/build.py --check
          python website/test.py
          git diff --exit-code
      - name: Preserve synthetic review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: website-bootstrap-review-${{ github.run_id }}
          path: website-test-artifacts/
          retention-days: 14
          if-no-files-found: warn
