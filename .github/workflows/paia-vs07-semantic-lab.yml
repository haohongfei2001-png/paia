name: PAIA VS-07 semantic lab
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'extension/experiments/public-embedding-inputs.mjs'
      - 'extension/scripts/run-public-embedding-lab.mjs'
      - 'extension/experiments/public-embedding-provenance.mjs'
      - 'extension/scripts/screen-public-embeddings.mjs'
      - 'extension/experiments/public-paired-text-lab.mjs'
      - 'extension/scripts/run-public-paired-text-lab.mjs'
      - 'extension/experiments/public-reranker-provenance.mjs'
      - 'extension/scripts/screen-public-rerankers.mjs'
      - 'extension/experiments/semantic-lab-index.mjs'
      - 'extension/experiments/semantic-calibration.mjs'
      - 'extension/tests/fixtures/cpv1-07-calibration-corpus.mjs'
      - 'extension/experiments/semantic-lab/package.json'
      - 'extension/scripts/run-semantic-retrieval-lab.mjs'
      - 'extension/scripts/inspect-public-model-provenance.mjs'
      - 'extension/scripts/screen-public-semantic-candidates.mjs'
      - 'extension/scripts/run-official-semantic-retrieval-lab.mjs'
      - 'extension/experiments/official-minilm-pooling.mjs'
      - 'extension/experiments/public-model-provenance.mjs'
      - 'extension/scripts/semantic-lab-change.mjs'
      - '.github/workflows/paia-vs07-semantic-lab.yml'
permissions:
  contents: read
concurrency:
  group: paia-vs07-semantic-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  fixed-public-synthetic-model-probe:
    if: github.head_ref == 'feat/vs07-retrieval-evaluation'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Classify changes to actual semantic inputs
        id: semantic_change
        env:
          PAIA_EVENT_ACTION: ${{ github.event.action }}
          PAIA_BEFORE: ${{ github.event.before }}
          PAIA_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node extension/scripts/semantic-lab-change.mjs
      - name: Read only pinned official embedding source and pooling declarations
        if: steps.semantic_change.outputs.run_embedding_screen == 'true'
        env:
          HF_TOKEN: ''
          HF_ACCESS_TOKEN: ''
        run: |
          node extension/scripts/screen-public-embeddings.mjs > "$RUNNER_TEMP/paia-embedding-source-report.json"
          cat "$RUNNER_TEMP/paia-embedding-source-report.json"
      - name: Retain aggregate-only embedding source contract without tensors
        if: always() && steps.semantic_change.outputs.run_embedding_screen == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vs07-embedding-public-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paia-embedding-source-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Read only pinned public paired-text source metadata
        if: steps.semantic_change.outputs.run_source_screen == 'true'
        env:
          HF_TOKEN: ''
          HF_ACCESS_TOKEN: ''
        run: |
          node extension/scripts/screen-public-rerankers.mjs > "$RUNNER_TEMP/paia-reranker-source-report.json"
          cat "$RUNNER_TEMP/paia-reranker-source-report.json"
      - name: Retain aggregate-only source screening without weights or inference
        if: always() && steps.semantic_change.outputs.run_source_screen == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vs07-reranker-public-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paia-reranker-source-report.json
          if-no-files-found: error
          retention-days: 7
      # Actual36293632404 verified this official repository's exact Apache declaration.
      - name: Install only pinned isolated public lab dependencies
        if: steps.semantic_change.outputs.run_probe == 'true' || steps.semantic_change.outputs.run_paired_probe == 'true' || steps.semantic_change.outputs.run_embedding_probe == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/paia-semantic-lab"
          cp extension/experiments/semantic-lab/package.json "$RUNNER_TEMP/paia-semantic-lab/package.json"
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/paia-semantic-lab"
      - name: One verified official quantized CPU comparison with offline reload
        if: steps.semantic_change.outputs.run_probe == 'true'
        env:
          PAIA_SEMANTIC_LAB_ROOT: ${{ runner.temp }}/paia-semantic-lab
          PAIA_PUBLIC_MODEL_CACHE: ${{ runner.temp }}/paia-public-model-cache
          HF_TOKEN: ''
          HF_ACCESS_TOKEN: ''
        run: |
          if node extension/scripts/run-official-semantic-retrieval-lab.mjs > "$RUNNER_TEMP/paia-semantic-lab-report.json"; then
            cat "$RUNNER_TEMP/paia-semantic-lab-report.json"
          else
            cat "$RUNNER_TEMP/paia-semantic-lab-report.json"
            exit 1
          fi
      - name: Retain aggregate-only fixed-corpus model report and isolated dependency lock
        if: always() && steps.semantic_change.outputs.run_probe == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vs07-semantic-public-lab-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/paia-semantic-lab-report.json
            ${{ runner.temp }}/paia-semantic-lab/package-lock.json
          if-no-files-found: error
          retention-days: 7

      - name: One pinned paired-text CPU measurement with independent development calibration
        if: steps.semantic_change.outputs.run_paired_probe == 'true'
        env:
          PAIA_SEMANTIC_LAB_ROOT: ${{ runner.temp }}/paia-semantic-lab
          PAIA_PUBLIC_MODEL_CACHE: ${{ runner.temp }}/paia-public-paired-cache
          HF_TOKEN: ''
          HF_ACCESS_TOKEN: ''
        run: |
          if node extension/scripts/run-public-paired-text-lab.mjs > "$RUNNER_TEMP/paia-paired-lab-report.json"; then
            cat "$RUNNER_TEMP/paia-paired-lab-report.json"
          else
            cat "$RUNNER_TEMP/paia-paired-lab-report.json"
            exit 1
          fi
      - name: Retain aggregate-only paired measurement and isolated dependency lock
        if: always() && steps.semantic_change.outputs.run_paired_probe == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vs07-paired-public-lab-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/paia-paired-lab-report.json
            ${{ runner.temp }}/paia-semantic-lab/package-lock.json
          if-no-files-found: error
          retention-days: 7


      - name: One new pinned official XLM mean CPU measurement with fixed development gates
        if: steps.semantic_change.outputs.run_embedding_probe == 'true'
        env:
          PAIA_SEMANTIC_LAB_ROOT: ${{ runner.temp }}/paia-semantic-lab
          PAIA_PUBLIC_MODEL_CACHE: ${{ runner.temp }}/paia-public-xlm-cache
          HF_TOKEN: ''
          HF_ACCESS_TOKEN: ''
        run: |
          if node extension/scripts/run-public-embedding-lab.mjs > "$RUNNER_TEMP/paia-xlm-lab-report.json"; then
            cat "$RUNNER_TEMP/paia-xlm-lab-report.json"
          else
            cat "$RUNNER_TEMP/paia-xlm-lab-report.json"
            exit 1
          fi
      - name: Retain aggregate-only new XLM measurement and isolated dependency lock
        if: always() && steps.semantic_change.outputs.run_embedding_probe == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vs07-xlm-public-lab-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/paia-xlm-lab-report.json
            ${{ runner.temp }}/paia-semantic-lab/package-lock.json
          if-no-files-found: error
          retention-days: 7
