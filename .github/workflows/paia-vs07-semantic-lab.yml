name: PAIA VS-07 semantic lab
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'extension/experiments/semantic-lab-index.mjs'
      - 'extension/experiments/semantic-lab/package.json'
      - 'extension/scripts/run-semantic-retrieval-lab.mjs'
      - 'extension/scripts/inspect-public-model-provenance.mjs'
      - 'extension/scripts/screen-public-semantic-candidates.mjs'
      - 'extension/experiments/public-model-provenance.mjs'
      - '.github/workflows/paia-vs07-semantic-lab.yml'
permissions:
  contents: read
concurrency:
  group: paia-vs07-semantic-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  fixed-public-synthetic-model-probe:
    if: github.head_ref == 'feat/vs07-retrieval-evaluation'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Two prior provenance failures: source diagnosis only, no model trial.
      - name: Screen fixed alternative source declarations and exact revisions without weights
        env:
          PAIA_SEMANTIC_LAB_ROOT: ${{ runner.temp }}/paia-semantic-lab
          PAIA_PUBLIC_MODEL_CACHE: ${{ runner.temp }}/paia-public-model-cache
          HF_TOKEN: ''
          HF_ACCESS_TOKEN: ''
        run: |
          if node extension/scripts/screen-public-semantic-candidates.mjs > "$RUNNER_TEMP/paia-semantic-lab-report.json"; then
            cat "$RUNNER_TEMP/paia-semantic-lab-report.json"
          else
            cat "$RUNNER_TEMP/paia-semantic-lab-report.json"
            exit 1
          fi
      - name: Retain fixed-source hashes and non-admission diagnostic receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vs07-semantic-public-lab-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/paia-semantic-lab-report.json
          if-no-files-found: error
          retention-days: 7
