name: Patch topic-scoped AI status

on:
  push:
    branches: [ux-r5]
    paths:
      - .github/workflows/patch-r3-topic-scoped-ai-status.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-r5
          fetch-depth: 0
      - name: Patch scoped AI status and remove workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('extension/core/organizer/ai-presentation.js')
          s=p.read_text()
          marker='function versionInputs(value){'
          assert s.count(marker)==1
          scoped="""async function readAIPresentationTopicStatus(s,topicId){
 if(!idOK(topicId))reject('INVALID_OUTPUT');await migrateAIPresentations(s);return s.run(()=>s.repository.transaction(false,async t=>{
  const cp=await t.get('meta',CHECKPOINT)||{id:CHECKPOINT,view:'ai',version:3,inputVersions:{},topicVersions:{},lastSequence:0},topic=await s.canonicalTopic(t,topicId);if(!validTopicGeneration(topic.activeLayoutGeneration))reject('STALE_BASE');
  const current=await topicSnapshot(s,t,topic),rawPrior=cp.topicVersions?.[topic.id]||{},stored=await t.get('meta',ROW+topic.id),allowed=new Set(current.entries.map(x=>x.id)),readable=stored&&stored.topicId===topic.id&&isStoredAIPresentation(stored,allowed),presentation=readable?stored:null,candidate=readable?publicAIPresentationCandidate(stored,allowed):null,prior=readable||!current.entries.length?rawPrior:{},changed=current.entries.filter(e=>prior[e.id]!==current.versions[e.id]),removed=Object.keys(prior).filter(id=>!allowed.has(id)),pending=changed.length>0||removed.length>0||!!stored&&(!readable||stored.needsUpdate===true),stale=!!stored&&(!readable||stored.needsUpdate===true||changed.length>0||removed.length>0),pointer=await t.get('meta',CURRENT),runtime=pointer?await t.get('meta',REQUEST+pointer.requestId):null;
  const item={topicId:topic.id,name:topic.name,sourceHint:sourceFaithfulSummary(current.entries),userDraft:!readable?userAIDraft(stored):null,presentation:presentation?{...presentationContent(presentation),revision:presentation.revision,schemaVersion:presentation.schemaVersion,protections:presentation.protections||{},updatedAt:presentation.updatedAt,stale}:null,candidate,stale,pending,pendingEntryCount:changed.length+removed.length};
  return {topics:[item],pendingTopics:pending?1:0,nextTopic:pending?{topicId:topic.id,name:topic.name,inputCount:Math.min(changed.length||current.entries.length,8)}:null,approximateBytes:pending?bytes(changed.slice(0,8).map(e=>e.body)):0,runtime:runtime?{phase:runtime.phase,state:runtime.state,errorCode:runtime.errorCode||null,httpStatus:runtime.httpStatus??null,responseBytes:runtime.responseBytes||0,requestCount:runtime.requestCount||0}:null};
 }));}
"""
          s=s.replace(marker,scoped+marker)
          old="export async function aiPresentationStatus(s){\n const result=await readAIPresentationStatus(s),compatibility=await s.libraryCompatibilityStatus?.().catch(()=>null);"
          new="export async function aiPresentationStatus(s,topicId=null){\n const result=topicId?await readAIPresentationTopicStatus(s,topicId):await readAIPresentationStatus(s),compatibility=await s.libraryCompatibilityStatus?.().catch(()=>null);"
          assert s.count(old)==1
          p.write_text(s.replace(old,new))

          p=Path('extension/core/organizer/store.js');s=p.read_text();old=' async aiPresentationStatus(){return aiPresentationStatus(this);}';new=' async aiPresentationStatus(topicId=null){return aiPresentationStatus(this,topicId);}';assert s.count(old)==1;p.write_text(s.replace(old,new))
          p=Path('extension/background/service-worker.js');s=p.read_text();old="    case 'GET_AI_PRESENTATION_STATUS': return store.aiPresentationStatus();";new="    case 'GET_AI_PRESENTATION_STATUS': return store.aiPresentationStatus(request.topicId||null);";assert s.count(old)==1;p.write_text(s.replace(old,new))
          p=Path('extension/ui/thoughts.js');s=p.read_text();old="const result=await readOptionalLibraryStatus(type=>request(type),{isCurrent:()=>attempt===this.statusReadSerial&&epoch===this.statusEpoch&&isCurrent(),includeOriginal});";new="const result=await readOptionalLibraryStatus(type=>request(type,type==='GET_AI_PRESENTATION_STATUS'&&this.id?{topicId:this.id}:{}),{isCurrent:()=>attempt===this.statusReadSerial&&epoch===this.statusEpoch&&isCurrent(),includeOriginal});";assert s.count(old)==1;p.write_text(s.replace(old,new))
          Path('.github/workflows/patch-r3-topic-scoped-ai-status.yml').unlink()
          PY
          node --check extension/core/organizer/ai-presentation.js
          node --check extension/core/organizer/store.js
          node --check extension/background/service-worker.js
          node --check extension/ui/thoughts.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/core/organizer/ai-presentation.js extension/core/organizer/store.js extension/background/service-worker.js extension/ui/thoughts.js .github/workflows/patch-r3-topic-scoped-ai-status.yml
          git diff --cached --check
          git commit -m 'fix(reader): scope passive AI status to current Topic'
          git push origin HEAD:ux-r5
