name: One-time UIS-04 scope recovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/paia-uis04-scope-recovery.yml']
permissions:
  contents: write
concurrency:
  group: paia-uis04-scope-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce the missing contract, repair only presentation scope, and publish a candidate object
        env:
          EXPECTED_RUN_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, json, os, subprocess, urllib.request
          base = 'c7ed2dcec22c0b5e30dbb258724fa21820d286d2'
          runner = '.github/workflows/paia-uis04-scope-recovery.yml'
          status = 'extension/docs/ui-simplification/UI_SIMPLIFICATION_STATUS.md'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          head = git('rev-parse', 'HEAD')
          assert head == os.environ['EXPECTED_RUN_SHA']
          assert git('diff', '--name-only', base, head).splitlines() == [runner], 'Unaudited remote changes'
          assert 'Current round: **UIS-04 — IN_PROGRESS**' in Path(status).read_text()
          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              assert text.count(old) == 1, (path, old[:100], text.count(old))
              p.write_text(text.replace(old, new))
          # First strengthen the regression test against the currently reproduced
          # bad projection. This must be RED before any runtime change is made.
          unit = 'extension/tests/uis-04-cleanup.test.mjs'
          replace(unit, "'thought-recent','syncSearchLauncher'", "'thought-recent','thought-organize-tools','syncSearchLauncher'")
          p = Path(unit)
          p.write_text(p.read_text() + "\ntest('UIS-04 keeps bounded organizer maintenance in the existing Settings AI group',async()=>{\n  const shell=await read('ui/core-loop.js');\n  assert.ok(shell.includes(\"['organizer-reading-actions','deepseek-settings','library-updates-drawer']\"));\n  assert.ok(shell.includes(\"move(id,'ai')\"));\n});\n")
          before = subprocess.run(['node','--test','tests/uis-04-cleanup.test.mjs'],cwd='extension')
          assert before.returncode != 0, 'The new regression must detect the observed root leak'
          # Remove the preference/locale hook that silently reparented the same
          # live Settings controls into a newly created Thought-root details node.
          shell = 'extension/ui/core-loop.js'
          replace(shell, "if(!$('thought-organize-tools')){const details=document.createElement('details');details.id='thought-organize-tools';const summary=document.createElement('summary');summary.textContent='归类工具';details.append(summary,$('organizer-reading-actions'));$('thought-home-tools')?.after(details);}", '')
          replace(shell, "['deepseek-settings','library-updates-drawer']", "['organizer-reading-actions','deepseek-settings','library-updates-drawer']")
          thought = 'extension/ui/thoughts-base.js'
          replace(thought, "document.addEventListener('toggle',event=>{if(event.target.id==='thought-organize-tools'&&event.target.open)this.queueOptionalStatus();},true);", '')
          replace(thought, "&&!$('thought-organize-tools')?.open", '')
          replace(thought, "if($('thought-organize-tools'))$('thought-organize-tools').hidden=!!this.id;", '')
          # The same bounded handlers and consent dialog remain owned by Settings;
          # this test opens and cancels rather than authorizing any Provider work.
          browser = 'extension/tests/uis-04-cleanup-chrome-e2e.test.mjs'
          replace(browser, "'#thought-recent','#core-loop-browse-title'", "'#thought-recent','#thought-organize-tools','#core-loop-browse-title'")
          replace(browser, "assert.equal(await page.locator('#universal-search-dialog').isVisible(),false,'Settings shortcuts do not open the picker');", """assert.equal(await page.locator('#universal-search-dialog').isVisible(),false,'Settings shortcuts do not open the picker');
          await page.locator('.ux-settings-nav [data-settings-group="ai"]').click();
          assert.equal(await page.locator('#ux-settings-ai-group #organizer-reading-actions').count(),1,'the existing organizer has one Settings AI owner');
          assert.equal(await page.locator('#organizer-reading-actions').isVisible(),true);
          await page.locator('#organizer-batch-actions > summary').click();
          assert.equal(await page.locator('#bounded-original-start').isVisible(),true);
          assert.equal(await page.locator('#bounded-ai-start').isVisible(),true);
          await page.locator('#bounded-original-start').click();
          await eventually(()=>page.locator('#library-dialog').isVisible(),'Settings reaches the unchanged bounded confirmation');
          assert.equal(await page.locator('#library-form [name="requests"]').inputValue(),'1');
          await page.locator('#library-dialog-close').click();
          await eventually(async()=>!(await page.locator('#library-dialog').isVisible()),'cancel leaves the Provider unauthorized');
          await page.locator('#organizer-batch-actions > summary').click();
          assert.equal(h.deepSeekRequests.length,0);""")
          replace(browser, "assert.equal(await page.locator('#ai-presentation-toggle').isVisible(),false);", """assert.equal(await page.locator('#ai-presentation-toggle').isVisible(),false);
          assert.equal(await page.locator('#thought-panel #organizer-reading-actions').count(),0,'Thought root cannot own a collapsed AI organizer');
          assert.equal(await page.locator('#organizer-reading-actions').isVisible(),false,'Settings organizer stays outside the Thought root');""")
          replace(status, 'Required next action within UIS-04: certify the exact remote implementation head, recover any reproducible UIS-04 regression, then record final receipts and close this last predefined round.', '''Visual recovery before closure:

          - Candidate `c7ed2dcec22c0b5e30dbb258724fa21820d286d2` passed UI Refresh 10/10 and Current Browser 45/45 in run #351, but review of its built-release Thought-root screenshot exposed a missed contract: `applyPreferences()` recreated `thought-organize-tools` and moved live Settings organizer controls to the Thought root. Passing the existing tests was not accepted as sufficient final certification.
          - Removed that obsolete reparenting hook and its dead toggle/visibility/status references. The same bounded organizer controls now remain in the existing Settings AI group; their Provider/authorization handlers are unchanged.
          - Strengthened source assertions to reproduce the bad projection before the fix, and strengthened Chrome assertions across locale/navigation changes to require no collapsed root organizer, one Settings AI owner, reachable bounded controls, and cancellation without a Provider request.
          - This is recovery within UIS-04, not a new round or reopening of the historical execution queue. Final closure requires a new exact-head complete certification run.

          Required next action within UIS-04: certify the exact recovery head and close only after every required gate passes.''')
          allowed = {shell, thought, unit, browser, status}
          assert set(git('diff','--name-only').splitlines()) == allowed
          subprocess.run(['node','--test','tests/uis-04-cleanup.test.mjs'],cwd='extension',check=True)
          subprocess.run(['npm','run','check'],cwd='extension',check=True)
          subprocess.run(['git','diff','--check'],check=True)
          # The workflow token can publish Git objects but cannot advance a ref
          # containing a workflow deletion. Do not attempt that known-denied push.
          # The authorized GitHub connector will audit and fast-forward this exact
          # candidate, which deletes this one-time workflow in its final tree.
          def post(path, body):
              req = urllib.request.Request('https://api.github.com/repos/haohongfei2001-png/paia/'+path,
                  data=json.dumps(body).encode(), method='POST', headers={
                      'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                      'Accept':'application/vnd.github+json','User-Agent':'PAIA-UIS04-recovery'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  return json.load(response)
          entries = []
          for path in sorted(allowed):
              blob = post('git/blobs', {'encoding':'base64','content':base64.b64encode(Path(path).read_bytes()).decode()})
              entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          entries.append({'path':runner,'mode':'100644','type':'blob','sha':None})
          tree = post('git/trees', {'base_tree':git('rev-parse','HEAD^{tree}'),'tree':entries})
          commit = post('git/commits', {'message':'Keep organizer maintenance out of Thought root in UIS-04','tree':tree['sha'],'parents':[head]})
          print('UIS04_RECOVERY_CANDIDATE='+commit['sha'])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('Recovery candidate: `'+commit['sha']+'`\n\nRegression RED before runtime patch; source contract and package check GREEN after patch. Remote main is not advanced by this job. Audit and fast-forward through the authorized connector, then run full certification.\n')
          PY
