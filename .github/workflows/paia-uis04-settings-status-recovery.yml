name: One-time UIS-04 Settings status recovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/paia-uis04-settings-status-recovery.yml']
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve the relocated organizer's read-only status lifecycle
        env:
          EXPECTED_RUN_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, json, os, subprocess, urllib.request
          base = '45e1395e0bf2197c7511295b4cf9f528c8105289'
          runner = '.github/workflows/paia-uis04-settings-status-recovery.yml'
          status = 'extension/docs/ui-simplification/UI_SIMPLIFICATION_STATUS.md'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          head = git('rev-parse','HEAD')
          assert head == os.environ['EXPECTED_RUN_SHA']
          assert git('diff','--name-only',base,head).splitlines() == [runner]
          assert 'Current round: **UIS-04 — IN_PROGRESS**' in Path(status).read_text()
          def replace(path, old, new):
              p=Path(path); text=p.read_text()
              assert text.count(old)==1, (path,old[:100],text.count(old))
              p.write_text(text.replace(old,new))
          unit='extension/tests/uis-04-cleanup.test.mjs'
          p=Path(unit)
          p.write_text(p.read_text()+'''
          test('UIS-04 relocated Settings controls keep bounded read-only status loading',async()=>{
            const shell=await read('ui/core-loop.js'),thought=await read('ui/thoughts-base.js');
            assert.ok(shell.includes('notifyOrganizerSettings();'));
            assert.ok(shell.includes("new MutationObserver(notifyOrganizerSettings).observe(panel,{attributes:true,attributeFilter:['hidden']})"));
            assert.ok(shell.includes("new CustomEvent('paia:organizer-settings-visible')"));
            assert.ok(thought.includes("document.addEventListener('paia:organizer-settings-visible',()=>this.queueOptionalStatus())"));
            assert.ok(thought.includes('isCurrent:()=>this.organizerSettingsVisible()'));
            assert.ok(thought.includes('this.updateViewStatus({strict:false'));
          });
          ''')
          assert subprocess.run(['node','--test','tests/uis-04-cleanup.test.mjs'],cwd='extension').returncode!=0, 'New lifecycle contract must detect the missing owner notification'
          shell='extension/ui/core-loop.js'
          replace(shell, ' const activateGroup=key=>{', " const notifyOrganizerSettings=()=>{const group=groups.get('ai');if(group&&!panel.hidden&&!group.hidden)document.dispatchEvent(new CustomEvent('paia:organizer-settings-visible'));};\n const activateGroup=key=>{")
          replace(shell, 'if(mobileSelect.value!==key)mobileSelect.value=key;};', 'if(mobileSelect.value!==key)mobileSelect.value=key;notifyOrganizerSettings();};')
          replace(shell, 'layout.append(nav,body);shell.append(head,layout);panel.prepend(shell);', "layout.append(nav,body);shell.append(head,layout);panel.prepend(shell);new MutationObserver(notifyOrganizerSettings).observe(panel,{attributes:true,attributeFilter:['hidden']});")
          thought='extension/ui/thoughts-base.js'
          replace(thought, 'this.homePositions=new Map();', "document.addEventListener('paia:organizer-settings-visible',()=>this.queueOptionalStatus());this.homePositions=new Map();")
          replace(thought, ' queueOptionalStatus(){', " organizerSettingsVisible(){const panel=$('settings-panel'),group=$('ux-settings-ai-group');return !!panel&&!panel.hidden&&!!group&&!group.hidden;}\n queueOptionalStatus(){\n  // Reuse the existing bounded local reads; opening Settings is not AI authorization.\n  if(this.organizerSettingsVisible()){void this.updateViewStatus({strict:false,isCurrent:()=>this.organizerSettingsVisible()}).catch(()=>{});return;}")
          browser='extension/tests/uis-04-cleanup-chrome-e2e.test.mjs'
          replace(browser, "assert.equal(await page.locator('#organizer-reading-actions').isVisible(),true);", """assert.equal(await page.locator('#organizer-reading-actions').isVisible(),true);
          await eventually(()=>page.locator('#original-library-update').isVisible(),'single-pass organizer is reachable after bounded local status loads');
          await eventually(()=>page.locator('#original-library-update').isEnabled(),'the available single-pass action is not left in an unknown-status disabled state');
          assert.equal(h.deepSeekRequests.length,0,'loading Settings organizer status is not authorization');""")
          replace(status, 'Required next action within UIS-04: certify the exact recovery head and close only after every required gate passes.', '''Additional reachability audit of the relocated owner found that the removed root-details toggle had also been the lazy local-status trigger. Without transferring that trigger, the existing single-pass `original-library-update` action could be absent even though batch actions remained reachable.

          - The existing Settings group activation and panel-visible lifecycle now notify the existing Thought workspace only when Settings AI is visible. The workspace reuses its bounded, cancellable-by-current-surface local status reads; no Provider action, authorization, request limit, polling interval, or durable state is added.
          - The same local status path remains available to an already-active bounded operation while Settings AI is visible. Leaving the surface makes pending status results ineligible; no Thought root organizer is restored.
          - A new source contract was proven RED before the lifecycle correction and GREEN afterward. The Chrome journey additionally requires the single-pass organizer action to become visible and enabled while Provider request count remains zero.
          - `45e1395e…` was an intermediate recovery candidate, not final closure. A fresh full certification is required on this completed recovery source.

          Required next action within UIS-04: certify the exact completed recovery head and close only after every required gate passes.''')
          allowed={shell,thought,unit,browser,status}
          assert set(git('diff','--name-only').splitlines())==allowed
          subprocess.run(['node','--test','tests/uis-04-cleanup.test.mjs'],cwd='extension',check=True)
          subprocess.run(['npm','run','check'],cwd='extension',check=True)
          subprocess.run(['git','diff','--check'],check=True)
          def post(path,body):
              req=urllib.request.Request('https://api.github.com/repos/haohongfei2001-png/paia/'+path,data=json.dumps(body).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'PAIA-UIS04-status-recovery'})
              with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          entries=[]
          for path in sorted(allowed):
              blob=post('git/blobs',{'encoding':'base64','content':base64.b64encode(Path(path).read_bytes()).decode()})
              entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          entries.append({'path':runner,'mode':'100644','type':'blob','sha':None})
          tree=post('git/trees',{'base_tree':git('rev-parse','HEAD^{tree}'),'tree':entries})
          commit=post('git/commits',{'message':'Retain single-pass organizer status loading in Settings for UIS-04','tree':tree['sha'],'parents':[head]})
          print('UIS04_STATUS_RECOVERY_CANDIDATE='+commit['sha'])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:summary.write('Candidate `'+commit['sha']+'`: status lifecycle regression RED before runtime patch; all cleanup contracts and package guard GREEN afterward. Audit and advance through the authorized connector, then require full exact-head certification.\n')
          PY
