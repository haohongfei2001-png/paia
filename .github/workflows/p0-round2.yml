name: P0 Round 2 temporary verification

on:
  push:
    branches:
      - p0/thought-library-cold-reload-round2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold-legacy-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run cold legacy regression
        working-directory: extension
        run: node --test tests/reading-cold-legacy-v0111.test.mjs
