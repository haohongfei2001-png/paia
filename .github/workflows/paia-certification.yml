name: PAIA Certification

on:
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - '.github/workflows/paia-certification.yml'
  pull_request:
    paths:
      - 'extension/**'
      - '.github/workflows/paia-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paia-certification-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  PAIA_TEST_CONCURRENCY: '4'

jobs:
  unit:
    name: Unit and package audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npm run test:unit

  contracts:
    name: Adapter and privacy contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - name: Install Chromium for adapter contracts
        run: npx playwright install --with-deps chromium
      - name: Adapter contract
        run: node scripts/test.mjs "adapter contract"
      - name: Privacy and security
        run: node scripts/test.mjs "privacy/security"

  browser:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Prepare portable Chrome test environment
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_BIN"
          echo "PAIA_CHROME=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          sudo mkdir -p '/Applications/Google Chrome.app/Contents/MacOS'
          sudo ln -sf "$CHROME_BIN" '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
          git rev-parse --is-shallow-repository | grep -qx false
          "$CHROME_BIN" --version
      - name: Run browser E2E under virtual display
        run: xvfb-run -a npm run test:browser

  release:
    name: Current release build and guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and audit release
        run: npm run build:release
      - name: Upload release tree
        uses: actions/upload-artifact@v4
        with:
          name: paia-current-release-${{ github.sha }}
          path: extension/work/current-release
          if-no-files-found: error
          retention-days: 7

  certified:
    name: Certification gate
    runs-on: ubuntu-latest
    if: always()
    needs: [unit, contracts, browser, release]
    steps:
      - name: Require every gate
        env:
          UNIT: ${{ needs.unit.result }}
          CONTRACTS: ${{ needs.contracts.result }}
          BROWSER: ${{ needs.browser.result }}
          RELEASE: ${{ needs.release.result }}
        run: |
          printf 'unit=%s\ncontracts=%s\nbrowser=%s\nrelease=%s\n' "$UNIT" "$CONTRACTS" "$BROWSER" "$RELEASE"
          test "$UNIT" = success
          test "$CONTRACTS" = success
          test "$BROWSER" = success
          test "$RELEASE" = success
