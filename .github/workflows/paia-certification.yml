  certified:
    name: Integration / certification gate
    runs-on: ubuntu-latest
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [mode, unit, contracts, current_browser, full_suite, macos_secure_store, macos_discard_lifecycle, release, sync_native_storage]
    steps:
      - name: Require selected verification depth
        env:
          FULL: ${{ needs.mode.outputs.full }}
          UNIT: ${{ needs.unit.result }}
          CONTRACTS: ${{ needs.contracts.result }}
          CURRENT_BROWSER: ${{ needs.current_browser.result }}
          FULL_SUITE: ${{ needs.full_suite.result }}
          SYNC_NATIVE_STORAGE: ${{ needs.sync_native_storage.result }}
          MACOS_SECURE_STORE: ${{ needs.macos_secure_store.result }}
          MACOS_DISCARD: ${{ needs.macos_discard_lifecycle.result }}
          RELEASE: ${{ needs.release.result }}
        run: |
          printf 'full=%s\nunit=%s\ncontracts=%s\ncurrent_browser=%s\nfull_suite=%s\nmacos_secure_store=%s\nmacos_discard=%s\nrelease=%s\n' \
            "$FULL" "$UNIT" "$CONTRACTS" "$CURRENT_BROWSER" "$FULL_SUITE" "$MACOS_SECURE_STORE" "$MACOS_DISCARD" "$RELEASE"
          test "$UNIT" = success
          test "$CONTRACTS" = success
          test "$RELEASE" = success
          if [ "$FULL" = true ]; then
            test "$CURRENT_BROWSER" = success
            test "$FULL_SUITE" = success
            test "$SYNC_NATIVE_STORAGE" = success
            test "$MACOS_SECURE_STORE" = success
            test "$MACOS_DISCARD" = success
          fi
