name: PAIA Certification

on:
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - '!extension/docs/**'
      - 'native-hosts/**'
      - '.github/workflows/paia-certification.yml'
      - '.github/workflows/paia-candidate.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'extension/**'
      - '!extension/docs/**'
      - 'native-hosts/**'
      - '.github/workflows/paia-certification.yml'
      - '.github/workflows/paia-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paia-certification-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  PAIA_TEST_CONCURRENCY: '4'
  PLAYWRIGHT_MODULE: 'playwright'

jobs:
  mode:
    name: Select verification depth
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.depth.outputs.full }}
    steps:
      - id: depth
        name: Select round integration or full certification
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          full=false
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            full=true
          elif printf '%s' "$PR_BODY" | grep -q 'PAIA_FULL_CERTIFICATION'; then
            full=true
          elif printf '%s' "$HEAD_MESSAGE" | grep -q 'PAIA_FULL_CERTIFICATION'; then
            full=true
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "verification_depth=$([ "$full" = true ] && echo full || echo round-integration)"

  unit:
    needs: mode
    if: needs.mode.result == 'success'
    name: Unit ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4','2/4','3/4','4/4']
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - name: Run unit shard
        env:
          PAIA_TEST_SHARD: ${{ matrix.shard }}
          PAIA_TEST_CONCURRENCY: '1'
        run: npm run test:unit

  contracts:
    needs: mode
    if: needs.mode.result == 'success'
    name: Adapter and privacy contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - name: Use signed Ubuntu archive over HTTPS before adapter dependencies
        run: |
          # Run37685485859 exhausted its unchanged budget on the Azure HTTP mirror.
          # Change only that mirror URI; preserve suites, packages and signing keys.
          sudo python3 - <<'PYAPT'
          from pathlib import Path
          paths = [Path('/etc/apt/sources.list'), *Path('/etc/apt').glob('*mirrors*.txt'), *Path('/etc/apt/sources.list.d').glob('*.list'), *Path('/etc/apt/sources.list.d').glob('*.sources')]
          for path in paths:
              if path.is_file():
                  text = path.read_text()
                  updated = text.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu').replace('https://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  if updated != text:
                      path.write_text(updated)
          PYAPT
      - name: Install Chromium for adapter contracts
        run: npx playwright install --with-deps chromium
      - name: Adapter contract
        run: node scripts/test.mjs "adapter contract"
      - name: Privacy and security
        run: node scripts/test.mjs "privacy/security"

  current_browser:
    needs: mode
    if: needs.mode.outputs.full == 'true'
    name: Current Browser ${{ matrix.index }}/9
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - index: 1
            shard: '1/9'
          - index: 2
            shard: '2/9'
          - index: 3
            shard: '3/9'
          - index: 4
            shard: '4/9'
          - index: 5
            shard: '5/9'
          - index: 6
            shard: '6/9'
          - index: 7
            shard: '7/9'
          - index: 8
            shard: '8/9'
          - index: 9
            shard: '9/9'
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - name: Prepare portable Chrome test environment
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_BIN"
          echo "PAIA_CHROME=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
      - name: Use signed Ubuntu archive over HTTPS before browser font dependencies
        run: |
          # Run37687078617 stalled in font setup; prior37685485859 exhausted its adapter budget on this mirror.
          # Change only that mirror URI; preserve suites, packages and signing keys.
          sudo python3 - <<'PYAPT'
          from pathlib import Path
          paths = [Path('/etc/apt/sources.list'), *Path('/etc/apt').glob('*mirrors*.txt'), *Path('/etc/apt/sources.list.d').glob('*.list'), *Path('/etc/apt/sources.list.d').glob('*.sources')]
          for path in paths:
              if path.is_file():
                  text = path.read_text()
                  updated = text.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu').replace('https://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  if updated != text:
                      path.write_text(updated)
          PYAPT
      - name: Provide Chinese glyph coverage for actual visual evidence
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-wqy-zenhei fonts-noto-cjk
          fc-list :lang=zh | grep -q .
          mkdir -p work
          for family in 'Noto Serif CJK SC' 'Noto Sans CJK SC' 'WenQuanYi Zen Hei'; do
            fc-match --format '%{family}: %{file}\n' "$family"
          done | tee work/current-browser-fonts.txt
      - name: Pin verified full Chrome for Settings native evidence
        if: matrix.index == 6
        run: |
          set -euo pipefail
          PAIA_DIAGNOSTIC_ZIP="$RUNNER_TEMP/settings-chrome-155.0.8059.39.zip"
          PAIA_DIAGNOSTIC_CHROME="$RUNNER_TEMP/settings-chrome-155.0.8059.39"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 120 --output "$PAIA_DIAGNOSTIC_ZIP" 'https://storage.googleapis.com/chrome-for-testing-public/155.0.8059.39/linux64/chrome-linux64.zip'
          echo "55672d1f392fd3e7b7a08621b6e804e6bcb39d40cf155504abb74b3a021ea8ea  $PAIA_DIAGNOSTIC_ZIP" | sha256sum --check --status
          unzip -q "$PAIA_DIAGNOSTIC_ZIP" -d "$PAIA_DIAGNOSTIC_CHROME"
          test "$("$PAIA_DIAGNOSTIC_CHROME/chrome-linux64/chrome" --version | awk '{print $NF}')" = '155.0.8059.39'
          echo "PAIA_CHROME=$PAIA_DIAGNOSTIC_CHROME/chrome-linux64/chrome" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$PAIA_DIAGNOSTIC_CHROME/chrome-linux64/chrome" >> "$GITHUB_ENV"
          echo 'PAIA_DIAGNOSTIC_BROWSER_VERSION=155.0.8059.39' >> "$GITHUB_ENV"
          echo "PAIA_DIAGNOSTIC_BROWSER_SHA256=$(sha256sum "$PAIA_DIAGNOSTIC_ZIP" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Verify the installed Chrome actually launches
        run: xvfb-run -a node scripts/check-hosted-chrome.mjs
      - name: Verify current browser coverage contract
        if: matrix.index == 1
        run: node scripts/check-ui-refresh-ci.mjs
      - name: Run current browser shard
        env:
          PAIA_TEST_SHARD: ${{ matrix.shard }}
          PAIA_TEST_CONCURRENCY: '1'
        run: xvfb-run -a npm run test:browser
      - name: Upload current browser shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-browser-evidence-${{ github.sha }}-${{ matrix.index }}
          path: extension/work
          if-no-files-found: warn
          retention-days: 14
      - name: Upload focused synthetic text-size evidence
        if: always() && matrix.index == 5
        uses: actions/upload-artifact@v4
        with:
          name: current-text-size-evidence-${{ github.sha }}
          path: |
            extension/work/qa-dvn-topic-content/d7/source.json
            extension/work/qa-dvn-topic-content/d7/release.json
            extension/work/qa-dvn-topic-content/d7/*-header-*.png
            extension/work/qa-dvn-topic-content/d7/*-1440-light-top-production.png
            extension/work/qa-dvn-topic-content/d7/*-768-light-top-production.png
            extension/work/qa-dvn-topic-content/d7/*-320-light-top-production.png
            extension/work/qa-dvn-topic-content/*-return-diagnostic.json
            extension/work/qa-dvn-topic-content/*-return-paths.json
            extension/work/qa-dvn-topic-content/*-return-failure.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload focused Context source and release evidence
        if: always() && matrix.index == 6
        uses: actions/upload-artifact@v4
        with:
          name: context-cards-evidence-${{ github.sha }}
          path: extension/work/ctx4-01/
          if-no-files-found: error
          retention-days: 14

  full_suite:
    name: Full Suite Certification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [mode, unit, contracts, current_browser]
    if: always() && needs.mode.outputs.full == 'true'
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - name: Run package and development audits once
        run: |
          npm run check
          node scripts/check_development.mjs
      - name: Aggregate exact-SHA current-suite receipt
        env:
          UNIT: ${{ needs.unit.result }}
          CONTRACTS: ${{ needs.contracts.result }}
          CURRENT_BROWSER: ${{ needs.current_browser.result }}
        run: node scripts/write_ci_certification_receipt.mjs
      - name: Upload current full-suite receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paia-current-full-suite-${{ github.sha }}
          path: extension/work/test-summary.json
          if-no-files-found: error
          retention-days: 14

  macos_secure_store:
    needs: mode
    if: needs.mode.outputs.full == 'true'
    name: macOS Secure Store Certification
    runs-on: macos-26-intel
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile native secure-store host
        run: xcrun swiftc -O -framework Security native-hosts/macos/paia-secure-store.swift -o /tmp/paia-secure-store
      - name: Exercise Keychain protocol and Secure Enclave fail-closed path
        run: node native-hosts/macos/test-host.mjs /tmp/paia-secure-store
      - name: Exercise physical lifecycle verifier without pretending CI is physical hardware
        run: node native-hosts/macos/verify-physical.mjs /tmp/paia-secure-store --allow-no-enclave
      - name: Validate macOS distribution scripts
        run: |
          zsh -n native-hosts/macos/install.sh
          zsh -n native-hosts/macos/build-release.sh
          zsh -n native-hosts/macos/notarize-release.sh
          zsh -n native-hosts/macos/uninstall.sh
      - name: Production build fails closed without Apple signing identities
        run: |
          rm -rf /tmp/paia-secure-store-missing-identities
          if env -u PAIA_DEVELOPER_ID_APPLICATION -u PAIA_DEVELOPER_ID_INSTALLER \
            zsh native-hosts/macos/build-release.sh aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa /tmp/paia-secure-store-missing-identities; then
            echo 'production package unexpectedly built without Apple signing identities' >&2
            exit 1
          fi
          test ! -e /tmp/paia-secure-store-missing-identities/PAIA-SecureStore-1.0.0.pkg
      - name: Build universal CI-only installer package
        run: |
          rm -rf /tmp/paia-secure-store-distribution
          zsh native-hosts/macos/build-release.sh aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa /tmp/paia-secure-store-distribution --ci-adhoc
          test -f /tmp/paia-secure-store-distribution/PAIA-SecureStore-1.0.0.pkg
          test -f /tmp/paia-secure-store-distribution/PAIA-SecureStore-1.0.0.pkg.sha256
          test -f /tmp/paia-secure-store-distribution/PAIA-SecureStore-1.0.0.json
          node - <<'NODE'
          const fs=require('node:fs');
          const row=JSON.parse(fs.readFileSync('/tmp/paia-secure-store-distribution/PAIA-SecureStore-1.0.0.json','utf8'));
          if(row.schemaVersion!==1||row.hostName!=='com.paia.secure_store'||row.extensionId!=='aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'||row.signingMode!=='adhoc-ci'||row.notarized!==false)process.exit(1);
          if(!Array.isArray(row.architectures)||!row.architectures.includes('arm64')||!row.architectures.includes('x86_64'))process.exit(1);
          NODE

  macos_discard_lifecycle:
    needs: mode
    if: needs.mode.outputs.full == 'true'
    name: macOS Chrome tab discard lifecycle
    runs-on: macos-26-intel
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - name: Install current Chromium for isolated extension test
        run: npx playwright install chromium
      - name: Select hosted Mac Chrome
        run: |
          CHROME_BIN="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          if [ ! -x "$CHROME_BIN" ]; then
            CHROME_BIN="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          fi
          test -x "$CHROME_BIN"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
      - name: Exercise real discard and restore lifecycle
        env:
          PAIA_HEADLESS: '1'
        run: node --test --test-reporter=./scripts/test-report.mjs tests/cpv1-01-2-reconnect-chrome-e2e.test.mjs

  historical_browser:
    name: Historical Browser Audit ${{ matrix.shard }}
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4','2/4','3/4','4/4']
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Prepare historical Chrome compatibility environment
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_BIN"
          echo "PAIA_CHROME=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          sudo mkdir -p '/Applications/Google Chrome.app/Contents/MacOS'
          sudo ln -sf "$CHROME_BIN" '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
          "$CHROME_BIN" --version
      - name: Run pre-migration browser evidence shard
        env:
          PAIA_TEST_SHARD: ${{ matrix.shard }}
          PAIA_TEST_CONCURRENCY: '1'
        run: xvfb-run -a npm run test:historical-browser

  release:
    needs: mode
    if: needs.mode.result == 'success'
    name: Current release build and guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and audit release
        run: npm run build:release
      - name: Upload release tree
        uses: actions/upload-artifact@v4
        with:
          name: paia-current-release-${{ github.sha }}
          path: extension/work/current-release
          if-no-files-found: error
          retention-days: 7

  sync_native_storage:
    needs: mode
    if: needs.mode.outputs.full == 'true'
    name: Sync native storage partial Core
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mkdir -p work/qa-bns-native-storage
      - run: npm install --no-audit --no-fund
      - name: Use signed Ubuntu archive over HTTPS before Sync native dependencies
        run: |
          # Run37685485859 exhausted its unchanged budget on the Azure HTTP mirror.
          # Change only that mirror URI; preserve suites, packages and signing keys.
          sudo python3 - <<'PYAPT'
          from pathlib import Path
          paths = [Path('/etc/apt/sources.list'), *Path('/etc/apt').glob('*mirrors*.txt'), *Path('/etc/apt/sources.list.d').glob('*.list'), *Path('/etc/apt/sources.list.d').glob('*.sources')]
          for path in paths:
              if path.is_file():
                  text = path.read_text()
                  updated = text.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu').replace('https://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  if updated != text:
                      path.write_text(updated)
          PYAPT
      - run: npx playwright install --with-deps chromium
      - name: Select hosted Chrome for isolated synthetic extension profiles
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version | tee work/qa-bns-native-storage/chrome-version.txt
      - name: Verify whole owning Node files and fixture preflight
        run: |
          set -o pipefail
          node --test tests/browser-native-sync-*.test.mjs tests/cpv1-09-prompt-service.test.mjs tests/cpv1-09-prompt-family.test.mjs tests/cpv1-09-prompt-security.test.mjs tests/native-sync/harness-contract.test.mjs tests/native-sync/input-working-receive-receipt.test.mjs tests/native-sync/source-bootstrap-fixture.test.mjs tests/native-sync/source-bootstrap-receipt.test.mjs tests/native-sync/source-append-fixture.test.mjs tests/native-sync/source-append-receipt.test.mjs tests/native-sync/group-checkpoint-receipt.test.mjs tests/native-sync/group-checkpoint-fixture.test.mjs tests/native-sync/input-working-receive-fixture.test.mjs tests/native-sync/human-library-receipt.test.mjs tests/human-branch-semantic-witness.test.mjs tests/native-sync/human-branch-witness-fixture.test.mjs tests/native-sync/human-branch-witness-receipt.test.mjs 2>&1 | tee work/qa-bns-native-storage/node.log
      - name: Prove source and release native IndexedDB and worker durability
        env:
          CI: '1'
          PLAYWRIGHT_MODULE: playwright
          PAIA_TESTED_HEAD: ${{ github.sha }}
        run: |
          set -o pipefail
          test "$(git rev-parse HEAD)" = "$PAIA_TESTED_HEAD"
          xvfb-run -a node --test --test-concurrency=1 tests/native-sync/storage-chrome.test.mjs tests/native-sync/publication-chrome.test.mjs tests/native-sync/retirement-chrome.test.mjs tests/native-sync/context-info-chrome.test.mjs tests/native-sync/input-working-chrome.test.mjs tests/native-sync/input-working-receive-chrome.test.mjs tests/native-sync/source-bootstrap-chrome.test.mjs tests/native-sync/source-append-chrome.test.mjs tests/native-sync/group-checkpoint-chrome.test.mjs tests/native-sync/human-library-chrome.test.mjs tests/native-sync/human-branch-witness-chrome.test.mjs 2>&1 | tee work/qa-bns-native-storage/native.log
      - name: Require exact-head complete native receipts
        env:
          PAIA_TESTED_HEAD: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {assertReceipt,assertInputWorkingReceipt} from './tests/native-sync/receipt.mjs';
          import {createHash} from 'node:crypto';
          import {assertInputWorkingReceiveReceipt,INPUT_WORKING_RECEIVE_PATHS,INPUT_WORKING_INBOX_PATHS} from './tests/native-sync/input-working-receive-receipt.mjs';
          import {assertSourceBootstrapReceipt,SOURCE_BOOTSTRAP_PATHS} from './tests/native-sync/source-bootstrap-receipt.mjs';
          import {assertSourceAppendReceipt,SOURCE_APPEND_PATHS} from './tests/native-sync/source-append-receipt.mjs';
          import {assertGroupCheckpointReceipt,GROUP_CHECKPOINT_PATHS} from './tests/native-sync/group-checkpoint-receipt.mjs';
          import {assertHumanLibraryReceipt,HUMAN_LIBRARY_PATHS} from './tests/native-sync/human-library-receipt.mjs';
          import {assertHumanBranchWitnessReceipt,HUMAN_WITNESS_PATHS,HUMAN_WITNESS_PROOF_PATHS} from './tests/native-sync/human-branch-witness-receipt.mjs';
          import {assertWorkerLifecycle,assertNetworkLedger} from './tests/native-sync/proof-oracles.mjs';
          const receipts = ['source','release'].map(variant => assertReceipt(JSON.parse(readFileSync(`work/qa-bns-native-storage/${variant}.json`)), {head:process.env.PAIA_TESTED_HEAD,variant,requiredFilterIntent:true}));
          const tree = execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim();
          for (const receipt of receipts) assert.equal(receipt.tree,tree);
          assert.deepEqual(receipts[0].productionHashes,receipts[1].productionHashes);
          assert.deepEqual(receipts[0].filterIntentCases,receipts[1].filterIntentCases);
          assert.deepEqual(receipts[0].filterIntentHashes,receipts[1].filterIntentHashes);
          assert.equal(receipts[0].browserVersion,receipts[1].browserVersion);
          const publications = ['source','release'].map(variant => {
            const receipt=JSON.parse(readFileSync(`work/qa-bns-publication/${variant}.json`));
            assert.equal(receipt.schema,1);assert.equal(receipt.head,process.env.PAIA_TESTED_HEAD);assert.equal(receipt.tree,tree);assert.equal(receipt.variant,variant);assert.equal(receipt.result,'PASS');
            assert.equal(receipt.transport,'synthetic-in-memory');assert.equal(receipt.providerQualification,false);assert.equal(receipt.fullCanonicalRestore,false);
            assert.equal(receipt.restarts.length,3);assert.equal(receipt.isolation.nativeFactory,true);assert.equal(receipt.isolation.networkAttempts,0);assert.equal(receipt.isolation.httpRequests,0);
            assertNetworkLedger(receipt.isolation.networkLedger,receipt.restarts);
