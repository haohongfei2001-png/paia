name: PAIA Certification

on:
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - 'native-hosts/**'
      - '.github/workflows/paia-certification.yml'
  pull_request:
    paths:
      - 'extension/**'
      - 'native-hosts/**'
      - '.github/workflows/paia-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paia-certification-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  PAIA_TEST_CONCURRENCY: '4'
  PLAYWRIGHT_MODULE: 'playwright'

jobs:
  unit:
    name: Unit ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4','2/4','3/4','4/4']
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - name: Run unit shard
        env:
          PAIA_TEST_SHARD: ${{ matrix.shard }}
          PAIA_TEST_CONCURRENCY: '1'
        run: npm run test:unit

  contracts:
    name: Adapter and privacy contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - name: Install Chromium for adapter contracts
        run: npx playwright install --with-deps chromium
      - name: Adapter contract
        run: node scripts/test.mjs "adapter contract"
      - name: Privacy and security
        run: node scripts/test.mjs "privacy/security"

  current_browser:
    name: Current Browser Certification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Prepare portable Chrome test environment
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_BIN"
          echo "PAIA_CHROME=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
      - name: UX-R1 shell, UX-R2 Reader, UX-R3 Thought, UX-R4 reuse and UX-R5 AI organize plus current core product journeys
        run: >-
          xvfb-run -a node --test --test-concurrency=1
          tests/ux-r1-shell-chrome-e2e.test.mjs
          tests/ux-r2-reader-revisit-chrome-e2e.test.mjs
          tests/ux-r3-thought-chrome-e2e.test.mjs
          tests/ux-r4-search-reuse-chrome-e2e.test.mjs
          tests/ux-r5-ai-organize-chrome-e2e.test.mjs
          tests/release-certification-round48-chrome-e2e.test.mjs
          tests/release-certification-round49-chrome-e2e.test.mjs
          tests/activation-return-round410-chrome-e2e.test.mjs
      - name: Run complete current browser suite
        env:
          PAIA_TEST_CONCURRENCY: '1'
        run: xvfb-run -a npm run test:browser
      - name: Package and development guards
        run: |
          npm run check
          node scripts/check_development.mjs
      - name: Upload UX-R1 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-r1-visual-evidence-${{ github.sha }}
          path: extension/work/ux-r1
          if-no-files-found: warn
          retention-days: 14
      - name: Upload UX-R2 visual and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-r2-evidence-${{ github.sha }}
          path: extension/work/ux-r2
          if-no-files-found: warn
          retention-days: 14
      - name: Upload UX-R3 visual and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-r3-evidence-${{ github.sha }}
          path: extension/work/ux-r3
          if-no-files-found: warn
          retention-days: 14
      - name: Upload UX-R4 visual and browser evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-r4-evidence-${{ github.sha }}
          path: extension/work/ux-r4
          if-no-files-found: warn
          retention-days: 14
      - name: Upload UX-R5 visual and browser evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-r5-evidence-${{ github.sha }}
          path: extension/work/ux-r5
          if-no-files-found: warn
          retention-days: 14

  full_suite:
    name: Full Suite Certification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Prepare current full-suite Chrome environment
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_BIN"
          echo "PAIA_CHROME=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
      - name: Run unsharded current full suite
        env:
          PAIA_TEST_CONCURRENCY: '1'
        run: xvfb-run -a npm test
      - name: Require current full-suite receipt
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const row=JSON.parse(fs.readFileSync('work/test-summary.json','utf8'));
          if(row.fullSuite!==true||row.auditPassed!==true||typeof row.inputDigest!=='string'||!row.inputDigest)process.exit(1);
          if(row.historicalBrowserAudit!=='SEPARATE_PRE_MIGRATION_EVIDENCE'||!Number.isInteger(row.historicalBrowserFiles))process.exit(1);
          console.log(`fullSuite=${row.fullSuite} auditPassed=${row.auditPassed} historicalBrowserFiles=${row.historicalBrowserFiles} digest=${row.inputDigest}`);
          NODE
      - name: Upload current full-suite receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paia-current-full-suite-${{ github.sha }}
          path: extension/work/test-summary.json
          if-no-files-found: error
          retention-days: 14

  macos_secure_store:
    name: macOS Secure Store Certification
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile native secure-store host
        run: xcrun swiftc -O -framework Security native-hosts/macos/paia-secure-store.swift -o /tmp/paia-secure-store
      - name: Exercise Keychain protocol and Secure Enclave fail-closed path
        run: node native-hosts/macos/test-host.mjs /tmp/paia-secure-store
      - name: Exercise physical lifecycle verifier without pretending CI is physical hardware
        run: node native-hosts/macos/verify-physical.mjs /tmp/paia-secure-store --allow-no-enclave
      - name: Validate macOS distribution scripts
        run: |
          zsh -n native-hosts/macos/install.sh
          zsh -n native-hosts/macos/build-release.sh
          zsh -n native-hosts/macos/notarize-release.sh
          zsh -n native-hosts/macos/uninstall.sh
      - name: Production build fails closed without Apple signing identities
        run: |
          rm -rf /tmp/paia-secure-store-missing-identities
          if env -u PAIA_DEVELOPER_ID_APPLICATION -u PAIA_DEVELOPER_ID_INSTALLER \
            zsh native-hosts/macos/build-release.sh aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa /tmp/paia-secure-store-missing-identities; then
            echo 'production package unexpectedly built without Apple signing identities' >&2
            exit 1
          fi
          test ! -e /tmp/paia-secure-store-missing-identities/PAIA-SecureStore-1.0.0.pkg
      - name: Build universal CI-only installer package
        run: |
          rm -rf /tmp/paia-secure-store-distribution
          zsh native-hosts/macos/build-release.sh aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa /tmp/paia-secure-store-distribution --ci-adhoc
          test -f /tmp/paia-secure-store-distribution/PAIA-SecureStore-1.0.0.pkg
          test -f /tmp/paia-secure-store-distribution/PAIA-SecureStore-1.0.0.pkg.sha256
          test -f /tmp/paia-secure-store-distribution/PAIA-SecureStore-1.0.0.json
          node - <<'NODE'
          const fs=require('node:fs');
          const row=JSON.parse(fs.readFileSync('/tmp/paia-secure-store-distribution/PAIA-SecureStore-1.0.0.json','utf8'));
          if(row.schemaVersion!==1||row.hostName!=='com.paia.secure_store'||row.extensionId!=='aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'||row.signingMode!=='adhoc-ci'||row.notarized!==false)process.exit(1);
          if(!Array.isArray(row.architectures)||!row.architectures.includes('arm64')||!row.architectures.includes('x86_64'))process.exit(1);
          NODE

  historical_browser:
    name: Historical Browser Audit ${{ matrix.shard }}
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4','2/4','3/4','4/4']
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Prepare historical Chrome compatibility environment
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_BIN"
          echo "PAIA_CHROME=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          sudo mkdir -p '/Applications/Google Chrome.app/Contents/MacOS'
          sudo ln -sf "$CHROME_BIN" '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
          "$CHROME_BIN" --version
      - name: Run pre-migration browser evidence shard
        env:
          PAIA_TEST_SHARD: ${{ matrix.shard }}
          PAIA_TEST_CONCURRENCY: '1'
        run: xvfb-run -a npm run test:historical-browser

  release:
    name: Current release build and guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and audit release
        run: npm run build:release
      - name: Upload release tree
        uses: actions/upload-artifact@v4
        with:
          name: paia-current-release-${{ github.sha }}
          path: extension/work/current-release
          if-no-files-found: error
          retention-days: 7

  certified:
    name: Certification gate
    runs-on: ubuntu-latest
    if: always()
    needs: [unit, contracts, current_browser, full_suite, macos_secure_store, release]
    steps:
      - name: Require every current-release gate
        env:
          UNIT: ${{ needs.unit.result }}
          CONTRACTS: ${{ needs.contracts.result }}
          CURRENT_BROWSER: ${{ needs.current_browser.result }}
          FULL_SUITE: ${{ needs.full_suite.result }}
          MACOS_SECURE_STORE: ${{ needs.macos_secure_store.result }}
          RELEASE: ${{ needs.release.result }}
        run: |
          printf 'unit=%s\ncontracts=%s\ncurrent_browser=%s\nfull_suite=%s\nmacos_secure_store=%s\nrelease=%s\n' "$UNIT" "$CONTRACTS" "$CURRENT_BROWSER" "$FULL_SUITE" "$MACOS_SECURE_STORE" "$RELEASE"
          test "$UNIT" = success
          test "$CONTRACTS" = success
          test "$CURRENT_BROWSER" = success
          test "$FULL_SUITE" = success
          test "$MACOS_SECURE_STORE" = success
          test "$RELEASE" = success
