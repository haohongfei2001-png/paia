name: Patch UX-R5 first-open Topic recovery

on:
  push:
    branches:
      - ux-r5-first-open-recovery

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-r5-first-open-recovery
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/patch-ux-r5-first-open-recovery.py
      - name: Validate JavaScript
        run: |
          node --check extension/ui/thoughts.js
          node --check extension/tests/ux-r3-thought-chrome-e2e.test.mjs
          git diff --check
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/patch-ux-r5-first-open-recovery.py .github/workflows/patch-ux-r5-first-open-recovery.yml
          git add extension/ui/thoughts.js extension/tests/ux-r3-thought-chrome-e2e.test.mjs
          git commit -m 'fix(reader): unblock first-open Topic body restore'
          git push origin HEAD:ux-r5-first-open-recovery
