name: PAIA Paired Panel Latency Diagnostic

# Isolated synthetic measurement, never a replacement for original safety gates.
on:
  push:
    branches: ['codex/prompt-panel-latency-20261019']
    paths:
      - 'extension/tests/diagnostics/panel-latency/**'
      - '.github/workflows/paia-panel-latency-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paia-panel-latency-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-panel-latency:
    if: github.ref == 'refs/heads/codex/prompt-panel-latency-20261019' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: '1'
      PAIA_HEADLESS: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing exact direct versions from the official registry
        working-directory: extension
        # Existing extension dependencies have exact direct versions, no lock.
        # No claim of fully locked transitive dependencies.
        run: npm install --registry=https://registry.npmjs.org --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Record exact original baseline and standard runner Chrome
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          test ! -e extension/package-lock.json
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_MODULE=$GITHUB_WORKSPACE/extension/node_modules/playwright" >> "$GITHUB_ENV"
          echo "PAIA_LATENCY_OUTPUT=$RUNNER_TEMP/panel-latency-evidence.json" >> "$GITHUB_ENV"
          printf 'head=%s\ntree=%s\nrunner=%s/%s\n' "$GITHUB_SHA" "$(git rev-parse HEAD^{tree})" "$RUNNER_OS" "$RUNNER_ARCH"
          "$CHROME_BIN" --version
          node --version
          npm ls --prefix extension --depth=0
          sha256sum extension/core/prompt-reuse-service.js extension/background/prompt-surface.js
      - name: Check diagnostic contracts before starting the browser
        run: |
          set -euo pipefail
          HARNESS=extension/tests/diagnostics/panel-latency
          node --test --test-reporter=tap "$HARNESS/validator-selftest.mjs" "$HARNESS/pair-selftest.mjs"
          python3 "$HARNESS/instrument-selftest.py" --baseline extension
          python3 "$HARNESS/pair-selftest.py" --baseline extension
          python3 "$HARNESS/instrument.py" --extension extension --check
      - name: Measure fixed baseline then candidate in independent browser contexts
        run: |
          set -euo pipefail
          HARNESS="$GITHUB_WORKSPACE/extension/tests/diagnostics/panel-latency"
          PARENT="$(mktemp -d "$RUNNER_TEMP/paia-panel-pair-XXXX")"
          RUN="$PARENT/run"
          echo "PAIA_LATENCY_PAIR_OUTPUT=$RUN" >> "$GITHUB_ENV"
          python3 "$HARNESS/prepare-pair.py" --baseline extension --candidate-runtime "$HARNESS/candidate" --output "$RUN"
          python3 "$HARNESS/instrument.py" --extension "$RUN/baseline/extension" --check
          python3 "$HARNESS/instrument-candidate.py" --extension "$RUN/candidate/extension" --check
          # Fixed order is disclosed; no claim that ordering or this CI host is a user's Mac.
          python3 "$HARNESS/instrument.py" --extension "$RUN/baseline/extension"
          PAIA_LATENCY_AUTORUN=1 PAIA_LATENCY_EXTENSION_PATH="$RUN/baseline/extension" PAIA_LATENCY_OUTPUT="$RUN/baseline-evidence.json" node "$HARNESS/panel-latency.mjs"
          node "$HARNESS/check-result.mjs" "$RUN/baseline-evidence.json"
          python3 "$HARNESS/instrument-candidate.py" --extension "$RUN/candidate/extension"
          PAIA_LATENCY_AUTORUN=1 PAIA_LATENCY_EXTENSION_PATH="$RUN/candidate/extension" PAIA_LATENCY_OUTPUT="$RUN/candidate-evidence.json" node "$HARNESS/panel-latency.mjs"
          node "$HARNESS/check-result.mjs" "$RUN/candidate-evidence.json"
          node "$HARNESS/compare-pair.mjs" "$RUN/baseline-evidence.json" "$RUN/candidate-evidence.json" "$RUN/assembly.json"
          git diff --exit-code
      - name: Preserve complete or failed body-free evidence in the job log
        if: always()
        run: |
          for NAME in baseline candidate; do
            if test -n "${PAIA_LATENCY_PAIR_OUTPUT:-}" && test -f "$PAIA_LATENCY_PAIR_OUTPUT/$NAME-evidence.json"; then
              printf '\nvariant=%s\n' "$NAME"
              cat "$PAIA_LATENCY_PAIR_OUTPUT/$NAME-evidence.json"
            else
              printf 'variant=%s: no native measurement evidence was produced.\n' "$NAME"
            fi
          done
      # No artifacts, cache, secrets, service containers, provider or deployment.
