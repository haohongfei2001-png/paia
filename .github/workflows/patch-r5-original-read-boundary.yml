name: Patch R5 original read boundary

on:
  push:
    branches: [ux-r5-history-resume-fix]
    paths:
      - .github/workflows/patch-r5-original-read-boundary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-r5-history-resume-fix
          fetch-depth: 0
      - name: Restore cheap Original reader boundary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('extension/ui/thoughts.js')
          s=p.read_text()
          old="if(!this.id&&this.view==='original'&&!$('thought-organize-tools')?.open&&!this.aiPending&&!this.originalPending&&!this.boundedPending){$('library-unplaced').parentElement.hidden=!this.homePage?.page.entryCountHint;return;}"
          new="if(this.view==='original'&&!$('thought-organize-tools')?.open&&!this.aiPending&&!this.originalPending&&!this.boundedPending){if(!this.id)$('library-unplaced').parentElement.hidden=!this.homePage?.page.entryCountHint;return;}"
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new))
          Path('.github/workflows/patch-r5-original-read-boundary.yml').unlink()
          PY
          node --check extension/ui/thoughts.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/ui/thoughts.js .github/workflows/patch-r5-original-read-boundary.yml
          git diff --cached --check
          git commit -m 'fix(reader): keep passive AI planning out of Original reading'
          git push origin HEAD:ux-r5-history-resume-fix
