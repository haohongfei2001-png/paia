name: UX-R5 Topic AI toggle patch

on:
  push:
    branches: [ux-r5]
    paths:
      - '.github/workflows/ux-r5-toggle-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-r5
          fetch-depth: 0
      - name: Fix Topic-scoped AI switch status bootstrap
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'extension/ui/thoughts.js',
              "if(this.view==='original'&&!$('thought-organize-tools')?.open&&!this.aiPending&&!this.originalPending&&!this.boundedPending){if(!this.id)$('library-unplaced').parentElement.hidden=!this.homePage?.page.entryCountHint;return;}",
              "if(!this.id&&this.view==='original'&&!$('thought-organize-tools')?.open&&!this.aiPending&&!this.originalPending&&!this.boundedPending){$('library-unplaced').parentElement.hidden=!this.homePage?.page.entryCountHint;return;}"
          )
          replace_once(
              'extension/tests/ux-r5-ai-organize-chrome-e2e.test.mjs',
              "const toggle=p.locator('#ai-presentation-toggle');await toggle.check();await p.locator('[data-ai-first-generation]').waitFor();assert.equal(h.deepSeekRequests.length,0,'switching to Organized must not call DeepSeek');",
              "const toggle=p.locator('#ai-presentation-toggle');await eventually(()=>toggle.isEnabled(),'Topic AI switch enabled with zero provider calls');assert.equal(h.deepSeekRequests.length,0);await toggle.check();await p.locator('[data-ai-first-generation]').waitFor();assert.equal(h.deepSeekRequests.length,0,'switching to Organized must not call DeepSeek');"
          )
          PY
      - name: Syntax guard
        run: |
          node --check extension/ui/thoughts.js
          node --check extension/tests/ux-r5-ai-organize-chrome-e2e.test.mjs
      - name: Commit patch and remove staging workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ux-r5-toggle-patch.yml
          git add extension/ui/thoughts.js extension/tests/ux-r5-ai-organize-chrome-e2e.test.mjs
          git commit -m 'fix(ux-r5): enable Topic AI switch from Original view'
          git push origin HEAD:ux-r5
