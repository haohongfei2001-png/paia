name: UX-R4 output DOM recovery

on:
  push:
    branches: [recovery-r4-1]
    paths:
      - '.github/workflows/recovery-r4-output-dom.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery-r4-1
          fetch-depth: 0
      - name: Preserve fail-closed output removal without remounting tray
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('extension/ui/material-tray.js')
          text=p.read_text(encoding='utf-8')
          old="this.invalidateOutput();void this.refresh(epoch);"
          new="this.invalidateOutput();if(this.rechecking){this.root.querySelector('#material-output-text')?.remove();this.root.querySelector('.material-output-actions')?.remove();}void this.refresh(epoch);"
          if old not in text: raise SystemExit('material tray output-removal target not found')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Syntax check
        run: node --check extension/ui/material-tray.js
      - name: Commit recovery patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/ui/material-tray.js
          git rm .github/workflows/recovery-r4-output-dom.yml
          git commit -m 'fix(ux-r4): remove stale output DOM during recheck'
          git push origin HEAD:refs/heads/recovery-r4-1
