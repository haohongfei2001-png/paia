name: UX-R5 candidate refresh patch

on:
  push:
    branches:
      - ux-r5
    paths:
      - '.github/workflows/ux-r5-candidate-refresh-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-r5
          fetch-depth: 0
      - run: python3 scripts/ux_r5_candidate_refresh_patch.py
      - run: node --check extension/core/organizer/ai-presentation.js
      - name: Commit patch and remove staging files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ux-r5-candidate-refresh-patch.yml scripts/ux_r5_candidate_refresh_patch.py
          git add extension/core/organizer/ai-presentation.js
          git commit -m 'fix(ux-r5): allow stale candidates to be refreshed'
          git push origin HEAD:ux-r5
