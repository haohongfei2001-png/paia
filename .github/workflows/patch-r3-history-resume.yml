name: Patch R3 history resume

on:
  push:
    branches: [ux-r5-history-resume-fix]
    paths:
      - .github/workflows/patch-r3-history-resume.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-r5-history-resume-fix
          fetch-depth: 0
      - name: Patch first-page same-session resume
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('extension/ui/thoughts.js')
          s = p.read_text()
          old = "sameSessionResume=!!id&&!!saved?.cursor&&(!saved.sort||saved.sort===this.readingSort)"
          new = "sameSessionResume=!!id&&!!saved&&(!saved.sort||saved.sort===this.readingSort)"
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new))
          Path('.github/workflows/patch-r3-history-resume.yml').unlink()
          PY
          node --check extension/ui/thoughts.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/ui/thoughts.js .github/workflows/patch-r3-history-resume.yml
          git diff --cached --check
          git commit -m 'fix(reader): resume first Topic page from session state'
          git push origin HEAD:ux-r5-history-resume-fix
