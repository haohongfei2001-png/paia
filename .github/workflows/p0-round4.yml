name: P0 Round 4 AI migration verification

on:
  push:
    branches:
      - p0/ai-presentation-migration-round4

permissions:
  contents: write

jobs:
  integrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded source replacement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('extension/core/organizer/ai-presentation.js')
          text=p.read_text()
          anchor="import {planDelta} from '../dual-view.js';\n"
          assert text.count(anchor)==1
          text=text.replace(anchor,anchor+"import {migrateAIPresentationProductization} from './ai-presentation-migration.js';\n")
          start=text.index('const migrations=new WeakMap();')
          end=text.index('async function aiJournal',start)
          old=text[start:end]
          assert 'aiProductizationMigration' in old and 'foundationWrite' in old
          new="""const migrations=new WeakMap(),completedMigrations=new WeakMap();
export async function migrateAIPresentations(s){
 if(completedMigrations.has(s))return completedMigrations.get(s);
 if(!migrations.has(s)){
  const task=migrateAIPresentationProductization(s).then(marker=>{if(marker.complete)completedMigrations.set(s,marker);return marker;}).finally(()=>{if(migrations.get(s)===task)migrations.delete(s);});
  migrations.set(s,task);
 }
 return migrations.get(s);
}
"""
          p.write_text(text[:start]+new+text[end:])
          PY
          git diff --check
      - name: Install development dependencies
        working-directory: extension
        run: npm install --ignore-scripts
      - name: Run migration and related regressions
        working-directory: extension
        run: node --test tests/ai-migration-round4.test.mjs tests/ai-product-v080.test.mjs tests/ai-presentation-v072c.test.mjs tests/reading-cold-legacy-v0111.test.mjs tests/thought-m1.test.mjs tests/thought-m2.test.mjs tests/backup-v081.test.mjs tests/memory-safety-v0100.test.mjs
      - name: Static package audit and release build
        working-directory: extension
        run: |
          npm run check
          npm run build:release
      - name: Commit verified candidate and remove temporary verification files
        run: |
          set -euo pipefail
          rm -f .github/round4-ai-migration.patch .github/workflows/p0-round4.yml
          git diff --check
          branch='p0/ai-presentation-migration-round4'
          remote=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git add -- extension/core/organizer/ai-presentation.js
          git add -u -- .github/round4-ai-migration.patch .github/workflows/p0-round4.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'P0 Round 4: make AI presentation migration resumable'
          git push origin "HEAD:refs/heads/$branch"
