name: P0 Round 4 AI migration verification

on:
  push:
    branches: [p0/ai-presentation-migration-round4]

permissions:
  contents: read

concurrency:
  group: p0-round4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-candidate:
    if: github.event.head_commit.message == 'Retry Round 4 integration with guarded source replacement'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply guarded source replacement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('extension/core/organizer/ai-presentation.js')
          text=p.read_text()
          anchor="import {planDelta} from '../dual-view.js';\n"
          assert text.count(anchor)==1
          text=text.replace(anchor,anchor+"import {migrateAIPresentationProductization} from './ai-presentation-migration.js';\n")
          start=text.index('const migrations=new WeakMap();')
          end=text.index('async function aiJournal',start)
          old=text[start:end]
          assert "aiProductizationMigration" in old and "foundationWrite" in old
          new="""const migrations=new WeakMap(),completedMigrations=new WeakMap();
export async function migrateAIPresentations(s){
 if(completedMigrations.has(s))return completedMigrations.get(s);
 if(!migrations.has(s)){
  const task=migrateAIPresentationProductization(s).then(marker=>{if(marker.complete)completedMigrations.set(s,marker);return marker;}).finally(()=>{if(migrations.get(s)===task)migrations.delete(s);});
  migrations.set(s,task);
 }
 return migrations.get(s);
}
"""
          text=text[:start]+new+text[end:]
          p.write_text(text)
          patch=Path('.github/round4-ai-migration.patch')
          if patch.exists():patch.unlink()
          PY
          git diff --check
      - name: Commit candidate on review branch only
        id: commit
        run: |
          set -euo pipefail
          branch='p0/ai-presentation-migration-round4'
          remote=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git add -- extension/core/organizer/ai-presentation.js .github/round4-ai-migration.patch
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'P0 Round 4: make AI presentation migration resumable'
          git push origin "HEAD:refs/heads/$branch"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: apply-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.apply-candidate.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record tested revision
        run: mkdir -p artifacts; git rev-parse HEAD | tee artifacts/tested-sha.txt
      - name: Run migration and related regressions
        working-directory: extension
        run: |
          set -o pipefail
          node --test tests/ai-migration-round4.test.mjs tests/ai-product-v080.test.mjs tests/ai-presentation-v072c.test.mjs tests/reading-cold-legacy-v0111.test.mjs tests/thought-m1.test.mjs tests/thought-m2.test.mjs tests/backup-v081.test.mjs tests/memory-safety-v0100.test.mjs | tee ../artifacts/node.tap
      - name: Static package audit and release build
        working-directory: extension
        run: |
          set -o pipefail
          npm run check | tee ../artifacts/package.txt
          npm run build:release | tee ../artifacts/build.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round4-evidence
          path: artifacts/
          retention-days: 14
