name: Round 7 design verification
on:
  push:
    branches: ['round7/evolution-recomposition']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: round7-design-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Publish one-time allowlisted integration on this candidate branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'round7/evolution-recomposition'
          if [ -f .github/apply-round7.py ]; then
            python3 .github/apply-round7.py
            while IFS= read -r path; do git add -- "$path"; done < .github/round7-changed.txt
            rm .github/round7-changed.txt
            git rm .github/apply-round7.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat: integrate thought evolution and ordered frosted reading experience'
            git push origin HEAD:refs/heads/round7/evolution-recomposition
          fi
          echo "REVIEW_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependencies and browser
        working-directory: extension
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify actual candidate source
        working-directory: extension
        env:
          PAIA_HEADLESS: '1'
        run: node scripts/verify-round7.mjs
      - name: Package public source for isolated review
        if: always()
        run: |
          tar --exclude='./.git' --exclude='./.github' --exclude='./extension/work' --exclude='./extension/outputs' -czf "$RUNNER_TEMP/paia-round7-source.tgz" .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paia-round7-source-${{ env.REVIEW_SHA || github.sha }}
          path: ${{ runner.temp }}/paia-round7-source.tgz
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paia-round7-evidence-${{ env.REVIEW_SHA || github.sha }}
          path: extension/work/round7/**
          if-no-files-found: ignore
          retention-days: 7
