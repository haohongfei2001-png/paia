name: One-time UIS-04 cleanup application
on:
  push:
    branches: [main]
    paths: ['.github/workflows/paia-uis04-apply.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paia-uis04-apply
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply the immutable reviewed UIS-04 transformation
        env:
          EXPECTED_RUN_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, textwrap
          # The full reviewed transformation is pinned in Git history. Its own
          # remote-HEAD, canonical-round, baseline and exact-file guards all run.
          staged = '8895b4f307abdc7b8668370c5f1a012512c23b9e'
          runner = '.github/workflows/paia-uis04-apply.yml'
          text = subprocess.check_output(['git','show',staged+':'+runner],text=True)
          start = "          python3 - <<'PY'\n"
          end = '\n          PY\n'
          assert text.count(start) == 1 and text.count(end) == 1
          code = textwrap.dedent(text.split(start,1)[1].split(end,1)[0])
          exec(compile(code, staged+':'+runner, 'exec'))
          # Correct a directional prose reference without changing any contract.
          product = Path('extension/PRODUCT.md')
          product.write_text(product.read_text().replace('normal content surfaces follow the page-scoped search contract below.', 'normal content surfaces follow the page-scoped search contract above.'))
          subprocess.run(['git','diff','--check'],check=True)
          PY
      - name: Commit and fast-forward remote main
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git add -- extension .github/workflows/paia-certification.yml .github/workflows/paia-uis04-apply.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Clean UIS-04 presentation wiring and align current contracts'
          git push origin HEAD:main
          echo "Implementation head: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'UIS-04 remains IN_PROGRESS pending exact-head PAIA Certification. No subsequent round is authorized.' >> "$GITHUB_STEP_SUMMARY"
