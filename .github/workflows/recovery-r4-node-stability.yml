name: UX-R4 stable interactive nodes

on:
  push:
    branches: [recovery-r4-1]
    paths:
      - '.github/workflows/recovery-r4-node-stability.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery-r4-1
          fetch-depth: 0
      - name: Preserve stable interactive nodes across duplicate refreshes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new, label):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if old not in text: raise SystemExit(f'{label} target not found')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          archive='extension/ui/archive.js'
          replace_one(
            archive,
            "const docs=state.documents||[];$('document-list').replaceChildren();$('result-count').textContent=`${docs.length} 个聊天窗口`;for(const d of docs){",
            "const docs=state.documents||[],list=$('document-list'),signature=JSON.stringify([view,docs.map(d=>[d.id,d.userTitle,d.originalConversationTitle,d.sourceConversationId,d.firstSourceSentAt,d.lastSourceSentAt,d.messageCount,d.unknownCount])]),stable=list.dataset.collectionSignature===signature&&!list.querySelector('.search-input')&&list.querySelectorAll('.conversation-document').length===docs.length;$('result-count').textContent=`${docs.length} 个聊天窗口`;if(!stable){list.replaceChildren();list.dataset.collectionSignature=signature;for(const d of docs){",
            'stable collection start')
          replace_one(
            archive,
            "$('document-list').append(b);}$('empty-list').hidden=docs.length>0;",
            "list.append(b);}}$('empty-list').hidden=docs.length>0;",
            'stable collection end')
          replace_one(
            archive,
            "chrome.runtime.onMessage.addListener(m=>{if(m.type==='ARCHIVE_CHANGED'){smartFilter.changed();if(!m.cause)return;$('revision-dialog').close();",
            "chrome.runtime.onMessage.addListener(m=>{if(m.type==='ARCHIVE_CHANGED'){if(['UPDATE_PREFERENCES','RECORD_TOPIC_READ','SET_ORGANIZER_CONTROLS'].includes(m.cause))return;smartFilter.changed();if(!m.cause)return;$('revision-dialog').close();",
            'late non-content notification')

          revisit='extension/ui/revisit.js'
          replace_one(revisit,
            "let windowId=null,serial=0,active=false,snapshot=null,opener=null;",
            "let windowId=null,serial=0,active=false,snapshot=null,opener=null,renderSignature=null;",
            'revisit signature state')
          replace_one(revisit,
            "snapshot=data;\n  const body=$('revisit-body');body.replaceChildren();$('revisit-status').textContent='';$('revisit-old-toggle').checked=data.oldContent;",
            "const body=$('revisit-body'),nextSignature=JSON.stringify([windowId,reading,data]),preserve=nextSignature===renderSignature&&body.childNodes.length>0;snapshot=data;$('revisit-status').textContent='';$('revisit-old-toggle').checked=data.oldContent;if(!preserve){renderSignature=nextSignature;body.replaceChildren();",
            'revisit stable render start')
          replace_one(revisit,
            "if(!data.newInputs.items.length&&!data.topicUpdates.length&&!data.resurface.length)body.append(element('p','revisit-quiet',copy('可以继续阅读，或在需要时找回以前的内容。','Continue reading, or find earlier material when you need it.')));\n  if(visit.status==='rejected')",
            "if(!data.newInputs.items.length&&!data.topicUpdates.length&&!data.resurface.length)body.append(element('p','revisit-quiet',copy('可以继续阅读，或在需要时找回以前的内容。','Continue reading, or find earlier material when you need it.')));}\n  if(visit.status==='rejected')",
            'revisit stable render end')
          replace_one(revisit,
            "const invalidate=()=>{++serial;snapshot=snapshot?{oldContent:snapshot.oldContent}:null;$('revisit-body').replaceChildren();void revisitPage.refresh();};document.addEventListener('paia:reader-policy',invalidate);\n chrome.runtime.onMessage.addListener(m=>{if(['ARCHIVE_CHANGED','PAIA_READER_POLICY_CHANGED'].includes(m.type)&&active)invalidate();});",
            "const invalidate=(clear=true)=>{++serial;snapshot=snapshot?{oldContent:snapshot.oldContent}:null;if(clear){renderSignature=null;$('revisit-body').replaceChildren();}void revisitPage.refresh();};document.addEventListener('paia:reader-policy',()=>invalidate(true));\n chrome.runtime.onMessage.addListener(m=>{if(!active)return;if(m.type==='PAIA_READER_POLICY_CHANGED'){invalidate(true);return;}if(m.type==='ARCHIVE_CHANGED'){if(!m.cause)return;invalidate(/PURGE|REMOVE|DELETE|EXCLUDE/.test(m.cause));}});",
            'revisit event boundary')

          r48='extension/tests/release-certification-round48-chrome-e2e.test.mjs'
          p=Path(r48); text=p.read_text(encoding='utf-8')
          old="const newCard=p.locator('.revisit-card').filter({hasText:'ROUND48_REVISIT_NEW'});await eventually(async()=>await newCard.count()===1,'Revisit UI renders the service-visible new Input');await newCard.locator('.revisit-card-open').click();"
          new="const newCard=p.locator('.revisit-card').filter({hasText:'ROUND48_REVISIT_NEW'});await eventually(async()=>await newCard.count()===1,'Revisit UI renders the service-visible new Input');await newCard.locator('.revisit-card-open').evaluate(el=>{globalThis.__round48StableRevisit=el;});const worker=h.context.serviceWorkers()[0];await worker.evaluate(()=>{void chrome.runtime.sendMessage({type:'ARCHIVE_CHANGED',cause:'CAPTURE'}).catch(()=>{});});await pause(250);assert.equal(await newCard.locator('.revisit-card-open').evaluate(el=>el===globalThis.__round48StableRevisit),true,'duplicate capture refresh keeps the same Revisit action node');await newCard.locator('.revisit-card-open').click();"
          if old not in text: raise SystemExit('round48 revisit target not found')
          p.write_text(text.replace(old,new,1),encoding='utf-8')

          r49='extension/tests/release-certification-round49-chrome-e2e.test.mjs'
          p=Path(r49); text=p.read_text(encoding='utf-8')
          text=text.replace("import {FakeChatGPT,eventually} from './harness/fake-chatgpt.mjs';","import {FakeChatGPT,eventually,pause} from './harness/fake-chatgpt.mjs';",1)
          old="await eventually(async()=>await p.locator('#core-loop-home').isVisible(),'return to Archive home');\n  await p.locator('#universal-search-open').click();"
          new="await eventually(async()=>await p.locator('#core-loop-home').isVisible(),'return to Archive home');\n  await p.locator('.conversation-document').first().evaluate(el=>{globalThis.__round49StableDocument=el;});const worker=h.context.serviceWorkers()[0];await worker.evaluate(()=>{void chrome.runtime.sendMessage({type:'ARCHIVE_CHANGED',cause:'CAPTURE'}).catch(()=>{});});await pause(250);assert.equal(await p.locator('.conversation-document').first().evaluate(el=>el===globalThis.__round49StableDocument),true,'same Archive data keeps the same document action node');\n  await p.locator('#universal-search-open').click();"
          if old not in text: raise SystemExit('round49 archive stability target not found')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Syntax check patched modules
        run: |
          node --check extension/ui/archive.js
          node --check extension/ui/revisit.js
          node --check extension/tests/release-certification-round48-chrome-e2e.test.mjs
          node --check extension/tests/release-certification-round49-chrome-e2e.test.mjs
      - name: Commit recovery patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/ui/archive.js extension/ui/revisit.js extension/tests/release-certification-round48-chrome-e2e.test.mjs extension/tests/release-certification-round49-chrome-e2e.test.mjs
          git rm .github/workflows/recovery-r4-node-stability.yml
          git commit -m 'fix(ux-r4): preserve interactive nodes across refreshes'
          git push origin HEAD:refs/heads/recovery-r4-1
