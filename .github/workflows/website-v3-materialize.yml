name: PAIA Website v3 Materialize
# retry after fragment binding fix
on:
  push:
    branches: [website/fragments-context-v3-20260926]
    paths:
      - '.github/workflows/website-v3-materialize.yml'

permissions:
  contents: write

concurrency:
  group: website-v3-materialize
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install browser and fonts
        run: |
          python -m pip install -r website/requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk fonts-liberation
      - name: Generate and verify v3
        env:
          WEBSITE_TEST_OUTPUT: /tmp/website-v3-review
        run: |
          set -euo pipefail
          python website/build.py
          python website/build.py --check
          python website/test.py
          if git diff --name-only 4427ce636bd86f0a584011da6834c6f588f9cade | grep '^extension/'; then
            echo 'Unexpected extension change' >&2
            exit 1
          fi
      - name: Commit generated website pages only
        run: |
          set -euo pipefail
          git config user.name 'PAIA Website Build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' en zh sitemap.xml robots.txt website/generated-paths.txt
          git diff --cached --name-only
          if git diff --cached --quiet; then
            echo 'No generated drift'
            exit 0
          fi
          git commit -m 'Generate PAIA website v3 pages'
          git push origin HEAD:refs/heads/website/fragments-context-v3-20260926
