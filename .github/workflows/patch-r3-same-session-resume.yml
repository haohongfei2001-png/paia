name: Patch R3 same-session resume

on:
  push:
    branches: [ux-r5]
    paths:
      - .github/workflows/patch-r3-same-session-resume.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-r5
          fetch-depth: 0
      - name: Apply exact patch
        run: python .github/patches/patch-r3-same-session-resume.py
      - name: Verify and publish
        shell: bash
        run: |
          node --check extension/ui/thoughts.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/ui/thoughts.js .github/workflows/patch-r3-same-session-resume.yml .github/patches/patch-r3-same-session-resume.py
          git diff --cached --check
          git commit -m 'fix(reader): resume saved Topic page before position metadata'
          git push origin HEAD:ux-r5
