function render(){document.body.dataset.screen=screen;document.documentElement.lang=t('zh-CN','en');renderNav();$('settings-layout').hidden=!!route;$('boundary').hidden=!route;if(!route)renderGroup();$('prototype-note').textContent=t('最终设计样机 · 记录、容量、连接与故障均为示例','Final design prototype · Records, storage, connections and faults are illustrative');}
function resize(){const large=document.body.dataset.scale==='2'&&innerWidth<1360;document.body.classList.toggle('large-navigation',large);}
function setGroup(k,push=true){groupAnchors[group]=scrollY;group=k;route=null;screen='group';if(push){try{history.pushState({group:k},'',`#${k}`)}catch{}}render();requestAnimationFrame(()=>{window.scrollTo(0,groupAnchors[group]||0);$('group-heading').focus({preventScroll:true})});}
function notify(msg,error=false){clearTimeout(toastTimer);$('notice').textContent=msg;$('notice').dataset.error=String(error);if(!error)toastTimer=setTimeout(()=>{$('notice').textContent=''},3200);}
function apply(key,value){if(state.failNext){state.failNext=false;notify(t('未保存，仍使用之前的设置。请重试。','Not saved. Your previous setting is still active. Try again.'),true);return false;}state[key]=value;state.revision++;if(key==='appearance')document.documentElement.dataset.paiaTheme=value==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):value;render();notify(t('已应用','Applied'));return true;}
function openDialog(title,body,footer=''){if(!$('sheet').open)dialogOpener=document.activeElement===document.body?null:document.activeElement;$('dialog-title').textContent=title;$('dialog-body').innerHTML=body;$('dialog-actions').innerHTML=footer;$('dialog-close').textContent=t('关闭','Close');if(!$('sheet').open)$('sheet').showModal();$('dialog-title').focus();}
function closeDialog(){if($('sheet').open)$('sheet').close();requestAnimationFrame(()=>{if(dialogOpener?.isConnected)dialogOpener.focus();else $('group-heading').focus({preventScroll:true})});}
function btn(text,act,cls='',disabled=false){return `<button type="button" class="btn ${cls}" data-action="${act}" ${disabled?'disabled':''}>${text}</button>`}
function closeBtn(){return btn(t('取消','Cancel'),'close')}
function choices(key){const d=prefDefs[key];selectionContext=key;openDialog(label(d.name),`<div role="radiogroup" class="choice-list" aria-label="${esc(label(d.name))}">${d.options.map(([v,z,e])=>`<button role="radio" aria-checked="${state[key]===v}" class="choice" data-action="choose:${key}:${v}" type="button"><span>${esc(t(z,e))}</span>${state[key]===v?icon('check'):''}</button>`).join('')}</div>`+(key==='font'||key==='width'?`<p class="small" style="margin-top:20px">${t('用于档案与思想库正文，不改变设置页的字号。','Applies to Archive and Thought Library text, not to Settings text size.')}</p>`:''));requestAnimationFrame(()=>document.querySelector('.choice[aria-checked="true"]')?.focus());}
function askSuggestions(){openDialog(t('开启下一句建议？','Enable next-reply suggestions?'),`<p>${t('开启后，PAIA 只在当前支持的 AI 对话中，临时读取新完成的最新回复，在本机寻找明确的下一步。','PAIA will temporarily read only newly completed replies in the current supported AI conversation and look for an explicit next action locally.')}</p><p>${t('不会读取旧回复，不会保存回复正文，也不会上传给其他 AI。点击建议只会填入输入框，不会发送。','It will not read old replies, store reply bodies or upload them to another AI. Clicking a suggestion only fills the composer; it never sends.')}</p>`,closeBtn()+btn(t('开启','Enable'),'confirm-suggest','primary'));}
function restore(stage='choose'){

 if(stage==='invalid')return openDialog(t('这份备份无法恢复','This backup cannot be restored'),`<p>${t('文件校验未通过。请选择完整、未损坏的 PAIA 备份。','File validation failed. Choose a complete, undamaged PAIA backup.')}</p><p class="small">${t('当前档案没有改变。','Your current archive has not changed.')}</p>`,btn(t('返回设置','Back to Settings'),'close')+btn(t('重新选择','Choose another file'),'restore','primary'));
 if(stage==='preview')return openDialog(t('预览恢复内容','Preview restoration'),`<p class="small">PAIA-example-2025.paia-backup</p><div class="preview-lines"><div class="preview-line"><span>${t('可新增输入','New inputs')}</span><span>286</span></div><div class="preview-line"><span>${t('当前的人工修改','Your current edits')}</span><span>${t('保留','Preserved')}</span></div><div class="preview-line"><span>${t('永久删除的来源','Permanently deleted sources')}</span><span>${t('3 项不会恢复','3 will remain deleted')}</span></div></div><label class="small" for="restore-mode">${t('恢复方式','Restoration method')}</label><p><select id="restore-mode"><option value="merge">${t('合并互不冲突的数据','Merge non-conflicting data')}</option><option value="replace">${t('替换当前档案','Replace current archive')}</option></select></p><p class="small">${t('恢复不会重新开启 AI 访问或下一句建议。','Restoration will not re-enable AI access or next-reply suggestions.')}</p>`,closeBtn()+btn(t('继续','Continue'),'restore-confirm','primary'));
 if(stage==='confirm'){restoreMode=$('restore-mode')?.value||restoreMode;return openDialog(t('确认恢复','Confirm restoration'),`<p>${restoreMode==='replace'?t('将用备份替换当前档案。当前档案中的内容和修改可能丢失。','This replaces the current archive with the backup. Current content and edits may be lost.'):t('将新增 286 条输入，保留当前人工修改。若实际写入前发现冲突，本次合并不写入。','This adds 286 inputs and preserves current edits. If a conflict is found before writing, the merge will not be committed.')}</p>${restoreMode==='replace'?`<label class="check-label"><input id="confirm-destructive" type="checkbox"><span>${t('我了解替换会清除当前档案内容','I understand replacement clears the current archive')}</span></label>`:''}`,closeBtn()+btn(restoreMode==='replace'?t('替换并恢复','Replace and restore'):t('确认恢复','Confirm restore'),'restore-done',restoreMode==='replace'?'destructive':'primary',restoreMode==='replace'));}
}
function importDialog(){openDialog(t('导入历史输入','Import earlier inputs'),`<p>${t('从 ChatGPT 官方导出文件补全过去的输入。文件只在本机处理，不会调用 AI。','Bring in earlier inputs from an official ChatGPT export. Processing stays on this device and does not call AI.')}</p><p class="small">${t('可以选择官方 ZIP 或聊天 JSON。先预览，再确认导入。','Choose the official ZIP or chat JSON. Preview before importing.')}</p>`,closeBtn()+btn(t('选择历史文件','Choose history file'),'import-preview','primary'));}

function handle(act){if(act.startsWith('restore-item:')){removedItems.splice(Number(act.split(':')[1]),1);state.removed=removedItems.length;closeDialog();render();notify(t('示例内容已恢复，AI 权限未改变。','Example content restored. AI access is unchanged.'));return;}if(act.startsWith('toggle:')){const key=act.split(':')[1];if(key==='suggest'&&!state.suggestAvailable)return;if(key==='suggest'&&!state.suggest)return askSuggestions();if(key==='capture'&&!state.capture&&!state.consent)return openDialog(t('开始保存 AI 输入','Start saving AI inputs'),`<p>${t('只保存普通聊天中已发送、已显示的用户文字。不会保存草稿、完整 AI 回复或附件正文，临时聊天不自动保存。','Only sent, visible user text in ordinary chats is saved. Drafts, full AI replies, attachment bodies and temporary chats are excluded.')}</p><p class="small">${t('开始或恢复保存时，当前页面已显示的旧输入也可能被收录。','Starting or resuming may also save older inputs currently visible on the page.')}</p>`,closeBtn()+btn(t('同意并开启','Agree and enable'),'confirm-capture','primary'));const id='toggle-'+key;apply(key,!state[key]);$(id)?.focus();return;}

 switch(act){case 'close':closeDialog();break;case 'confirm-suggest':if(!state.suggestAvailable)return;closeDialog();apply('suggest',true);requestAnimationFrame(()=>$('toggle-suggest')?.focus());break;case 'confirm-capture':closeDialog();if(apply('capture',true))state.consent=true;requestAnimationFrame(()=>$('toggle-capture')?.focus());break;
 case 'settings':route=null;screen=innerWidth<1024?'index':'group';render();window.scrollTo(0,0);break;

 case 'reset-done':{const saved=apply('promptPosition',null);closeDialog();if(saved)notify(t('悬浮按钮位置已重置。','Floating button position reset.'));requestAnimationFrame(()=>document.querySelector('#group-content [data-action="reset-position"]')?.focus());break;}
 case 'storage':openDialog(t('存储空间','Storage space'),`<div class="preview-lines"><div class="preview-line"><span>${t('已使用约','Approximate usage')}</span><span>124 MB</span></div></div><p>${t('当前档案保存在此浏览器的 PAIA 扩展空间中。','The archive is stored in PAIA’s extension storage in this browser.')}</p><p class="small">${t('数值由浏览器估算。卸载扩展会清除本机档案；这里没有云同步或备份生成。','Figures are browser estimates. Uninstalling removes local data. This is not cloud sync or backup creation.')}</p>`);break;
 case 'sites':openDialog(t('支持的网站','Supported websites'),`<div class="preview-lines"><div class="preview-line"><span>ChatGPT</span><span>${t('保存输入 · 提示词复用','Capture · Prompt reuse')}</span></div></div><p class="small">${t('网站支持不等于 AI 已连接。允许外部 AI 读取档案范围，请到 AI 上下文管理。','Site support does not mean an AI connection exists. External AI reading is managed in AI Context.')}</p>`);break;
 case 'privacy-help':openDialog(t('隐私与存储','Privacy and storage'),`<p>${t('隐藏预览只影响列表和搜索摘句；打开内容后仍可阅读。','Hiding previews affects list and search excerpts only. Content can still be read when opened.')}</p><p class="small">${t('这不是加密或截图保护。本机档案保存在此浏览器的扩展空间；卸载扩展会清除本机档案。存储容量是浏览器估算值。','This is not encryption or screenshot protection. The local archive resides in this browser’s extension storage. Uninstalling removes it. Storage figures are browser estimates.')}</p>`);break;
 case 'restore':restore();break;case 'restore-check':openDialog(t('正在检查文件','Checking file'),`<p>${t('正在校验示例备份，当前档案没有改变。','Validating the example backup. The current archive is unchanged.')}</p>`);setTimeout(()=>{if($('sheet').open)restore('preview')},650);break;case 'restore-confirm':restore('confirm');break;case 'restore-done':state.suggest=false;state.access=false;closeDialog();render();notify(t('示例恢复完成。AI 访问和下一句建议保持关闭。','Example restoration complete. AI access and suggestions remain off.'));break;

 case 'repair':openDialog(t('修复搜索','Repair search'),`<p>${t('根据现有正文重新建立搜索索引，不修改输入、主题或版本历史。','Rebuild search from existing text without modifying inputs, topics or version history.')}</p>`,closeBtn()+btn(t('开始修复','Repair'),'repair-done','primary'));break;case 'repair-done':state.warning=false;closeDialog();render();notify(t('示例修复完成，已恢复搜索。','Example repair complete. Search restored.'));break;

document.addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(a){e.preventDefault();handle(a.dataset.action);return;}const n=e.target.closest('[data-group]');if(n){e.preventDefault();setGroup(n.dataset.group);}});

document.body.dataset.scale=params.get('text')==='200'?'2':'1';document.documentElement.dataset.paiaTheme=params.get('theme')==='dark'?'dark':'light';if(params.get('theme')==='dark')state.appearance='dark';resize();render();
