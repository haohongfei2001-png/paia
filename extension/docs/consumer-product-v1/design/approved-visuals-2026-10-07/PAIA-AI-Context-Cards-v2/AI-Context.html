function toast(text,undo){const el=document.getElementById('toast');clearTimeout(window.toastTimer);el.replaceChildren();const span=document.createElement('span');span.textContent=text;el.append(span);if(undo){const b=document.createElement('button');b.textContent='撤销';b.onclick=()=>{undo();el.hidden=true};el.append(b)}el.hidden=false;window.toastTimer=setTimeout(()=>el.hidden=true,5000)}
function navMarkup(view,label,glyph){return `<button type="button" data-view="${view}" aria-label="${label}" title="${label}" ${view==='memory'?'aria-current="page"':''}>${icon(glyph,'ux-nav-icon')}<span class="paia-icon-label ux-nav-label">${label}</span></button>`}
const nav=document.getElementById('primary-nav'),bottom=document.querySelector('.sidebar-bottom'),menu=document.getElementById('archive-compact-nav-items');
nav.innerHTML=navMarkup('library','档案','archive')+navMarkup('thoughts','思想库','thoughts')+navMarkup('memory','用于 AI','context');bottom.innerHTML=navMarkup('settings','设置','settings');
document.getElementById('archive-compact-nav-label').innerHTML='<span>用于 AI</span>'+icon('chevron-down');
const navNodes=[...document.querySelectorAll('.sidebar [data-view]')];
function positionNav(){if(matchMedia('(max-width:767px)').matches)navNodes.forEach(el=>menu.append(el));else navNodes.forEach(el=>(el.dataset.view==='settings'?bottom:nav).append(el));document.getElementById('archive-compact-navigation').open=false}
positionNav();window.addEventListener('resize',positionNav);document.getElementById('archive-compact-navigation').addEventListener('keydown',e=>{if(e.key==='Escape'){e.currentTarget.open=false;e.currentTarget.querySelector('summary').focus()}});
navNodes.forEach(el=>el.onclick=()=>{if(el.dataset.view==='memory')go('home');else toast('此设计稿仅包含 AI 上下文；其他页面保留现有 PAIA。');document.getElementById('archive-compact-navigation').open=false});
function access(key){const isGlobal=key==='global',on=isGlobal?S.global:S.groups[key],paused=!isGlobal&&on&&!S.global;
const text=isGlobal?`AI 访问 · ${on?'开':'关'}`:on?(paused?'已开放':'AI 可读'):'仅自己';
return `<button type="button" class="access ${isGlobal?'global':''}" data-key="${key}" data-on="${on}" data-paused="${paused}" aria-pressed="${on}" aria-label="${isGlobal?'AI 访问':names[key]}：${isGlobal?(on?'开启':'关闭'):(on?'已开放':'仅自己')}${paused?'，全局访问已暂停':''}，点击${on?'关闭':'开启'}"><span class="state-dot" aria-hidden="true"></span><span>${text}</span></button>`}
const back=()=>`<button class="context-back" data-back="true">${icon('back')}<span>AI 上下文</span></button>`;
function home(){return `<section class="context-page"><header class="context-head"><h1 tabindex="-1">AI 上下文</h1>${access('global')}</header>${!S.global?'<p class="global-note">'+(scenario==='empty'?'AI 访问尚未开启。':'AI 访问已暂停，开放设置已保留。')+'</p>':''}<div class="context-cards">${Object.keys(names).map(k=>{
const desc={info:'基本信息 · 背景 · 经历<br>语言 · 长期习惯',rules:'回答方式 · 语言 · 表达偏好<br>工作方式',now:'当前项目 · 当前目标<br>最近关注'};
const allowed=S.topics.filter(t=>t.allowed),summary=k==='inputs'?(allowed.length?escapeHTML(allowed.slice(0,5).map(t=>t.name).join(' · '))+(allowed.length>5?` <span class="more-topics">+${allowed.length-5}</span>`:''):'还没有开放的主题'):desc[k];
const count=k==='inputs'?`${allowed.length} 个主题开放${S.groups.inputs?'':' · 读取已暂停'}`:`${S.items[k].length} 项`;
return `<article class="context-card" data-card="${k}"><h2 class="card-title">${names[k]}</h2>${access(k)}<p class="card-summary ${k==='inputs'?'input-summary':''}">${summary}</p><div class="card-footer"><span>${count}</span>${icon('forward')}</div><a class="card-link" href="#${k}" aria-label="打开${names[k]}"></a></article>`}).join('')}</div><button class="connections-link" data-route="connections"><span>已连接的 AI</span><span class="connection-number">${S.connections.filter(x=>x.connected).length}</span>${icon('chevron-right')}</button></section>`}
function detail(k){const groups=[...new Set(S.items[k].map(it=>it.section))];return `<section class="context-page context-detail">${back()}<header class="context-head"><h1 tabindex="-1">${names[k]}</h1>${access(k)}</header><p class="maintenance">PAIA 会根据你的输入自动补充，人工修改始终优先。</p>${!S.global?'<p class="global-note">AI 访问已暂停，开放设置已保留。</p>':''}<div class="detail-content">${groups.map(sec=>`<section class="context-section"><h2>${escapeHTML(sec)}</h2>${S.items[k].filter(it=>it.section===sec).map(it=>itemHTML(it,k)).join('')}</section>`).join('')}${!groups.length?'<p class="empty-detail">还没有内容，可以先写一条。</p>':''}<button class="add-item" data-add="${k}"><span class="add-sign" aria-hidden="true">＋</span>添加${k==='info'?'信息':k==='rules'?'规则':'当前状态'}</button></div></section>`}
function itemHTML(it,k){return `<div class="context-item" data-item="${it.id}"><div class="item-text" contenteditable="plaintext-only" role="textbox" aria-multiline="true" aria-label="${names[k]}：${escapeHTML(it.text.slice(0,28))}" data-id="${it.id}" data-placeholder="写下一条${k==='rules'?'规则':k==='now'?'当前状态':'信息'}…" spellcheck="false">${escapeHTML(pending.get(it.id)??it.text)}</div><details class="item-menu"><summary aria-label="此条内容的更多操作">${icon('more')}</summary><div class="menu-items"><button data-evidence="${it.id}">查看依据</button><button class="danger" data-delete="${it.id}">删除</button></div></details><div class="item-feedback ${failed.has(it.id)?'error':''}" role="status" data-feedback="${it.id}">${failed.has(it.id)?'未保存，文字已保留。 <button data-retry="'+it.id+'">重试</button>':''}</div></div>`}
function inputs(){const paused=!S.global||!S.groups.inputs;return `<section class="context-page context-detail">${back()}<header class="context-head"><h1 tabindex="-1">我的输入</h1>${access('inputs')}</header><p class="topics-note">${!S.global?'AI 访问已暂停，主题选择已保留。':!S.groups.inputs?'此类内容仅自己可见，主题选择已保留。':'选择 AI 可以继续读取的主题。'}</p><div class="topic-field" aria-label="主题访问">${S.topics.map((t,i)=>`<button class="topic-access" data-topic="${t.id}" data-on="${t.allowed}" data-paused="${paused}" aria-pressed="${t.allowed}" aria-label="${escapeHTML(t.name)}：${t.allowed?'已开放':'仅自己'}${paused?'，读取暂停':''}，点击${t.allowed?'关闭':'开放'}" tabindex="${i===0?'0':'-1'}"><span>${escapeHTML(t.name)}</span>${t.isNew?'<span class="new-topic-mark">新</span>':''}<span class="state-dot" aria-hidden="true"></span></button>`).join('')}</div>${S.topics.length?'':'<p class="empty-detail">思想库有主题后，会出现在这里。</p>'}<p class="topics-note">新主题默认仅自己可见。</p></section>`}
function connectionHTML(c,i){return `<section class="connection-row"><div class="connection-person"><h2>${escapeHTML(c.name)}</h2><p>${c.connected?(S.global?(c.active?'已连接 · 可以读取 PAIA':'已连接 · 已暂停读取'):'已连接 · 随全局暂停'):'已断开'}</p></div>${c.connected?`<button class="access" data-connection="${i}" data-on="${c.active}" data-paused="${!S.global}" aria-pressed="${c.active}" aria-label="${c.name} 的读取许可，点击${c.active?'暂停':'开启'}"><span class="state-dot" aria-hidden="true"></span>${c.active?(S.global?'AI 可读':'已开放'):'已暂停'}</button><details class="item-menu"><summary aria-label="${c.name} 更多操作">${icon('more')}</summary><div class="menu-items"><button class="danger" data-disconnect="${i}">断开连接</button></div></details>`:`<button class="standard-button" data-reconnect="${i}">重新连接</button>`}</section>`}
function connections(){return `<section class="context-page context-detail">${back()}<header class="context-head"><h1 tabindex="-1">已连接的 AI</h1><button class="standard-button" data-route="connect">＋ 连接 AI</button></header>${!S.global?'<p class="global-note">AI 访问已暂停，连接和开放设置已保留。</p>':''}<div class="connection-list">${S.connections.map(connectionHTML).join('')||'<p class="empty-detail">还没有连接的 AI。</p>'}</div><p class="quiet-footnote">只读访问。断开不会删除你的内容。</p></section>`}
function connect(){return `<section class="context-page context-detail"><button class="context-back" data-route="connections">${icon('back')}<span>已连接的 AI</span></button><header class="context-head"><h1 tabindex="-1">连接 AI</h1></header><div class="connect-consent"><h2>允许 ChatGPT 读取 PAIA？</h2><p>读取已开放的个人上下文，以及你选择开放的主题。</p><p class="consent-detail">只读，不会修改你的内容。以后读取无需逐次确认，你可以随时暂停。</p>${!S.global?'<p class="consent-detail">全局访问仍保持关闭。连接后不会自动开启。</p>':''}<div class="consent-actions"><button class="standard-button primary" data-allow="true">允许连接</button><button class="standard-button" data-route="connections">取消</button></div><p class="quiet-footnote">设计演示：不进行真实登录或连接。</p></div></section>`}
function commitItem(id,force=false){clearTimeout(saveTimers.get(id));if(composing.has(id))return false;const value=pending.get(id);if(value===undefined)return true;const it=Object.values(S.items).flat().find(it=>it.id===id);if(!it)return false;const f=document.querySelector(`[data-feedback="${id}"]`);
if((scenario==='save-failed'&&!force)||!store()){failed.add(id);if(f){f.className='item-feedback error';f.innerHTML=`未保存，文字已保留。 <button data-retry="${id}">重试</button>`;f.querySelector('button').onclick=()=>commitItem(id,true)}return false}
const old=it.text;if(old!==value){undoStack.push({type:'edit',id,old});it.text=value;it.userEdited=true}pending.delete(id);failed.delete(id);store();if(f){f.className='item-feedback';f.textContent='已保存'}return true}
function flush(){if(composing.size)return false;let okay=true;for(const id of pending.keys())okay=commitItem(id)&&okay;return okay}
function render(){const main=document.getElementById('paia-main');main.innerHTML=current==='home'?home():names[current]&&current!=='inputs'?detail(current):current==='inputs'?inputs():current==='connections'?connections():connect();bind();document.title=(names[current]||({home:'AI 上下文',connections:'已连接的 AI',connect:'连接 AI'})[current])+' · PAIA';}
function go(page,record=true){if(!flush()){toast('文字尚未保存，已保留在当前页。');return false}scrollPositions[current]=window.scrollY;if(record)navStack.push(current);current=page;render();window.scrollTo(0,scrollPositions[page]||0);const h=document.querySelector('h1');if(h)h.focus({preventScroll:true});return true}
function bind(){document.querySelectorAll('.access[data-key]').forEach(b=>b.onclick=e=>{e.stopPropagation();const key=b.dataset.key;if(key==='global')S.global=!S.global;else S.groups[key]=!S.groups[key];store();const pos=window.scrollY;render();window.scrollTo(0,pos);document.querySelector(`.access[data-key="${key}"]`)?.focus({preventScroll:true});});
document.querySelectorAll('.card-link').forEach(a=>a.onclick=e=>{e.preventDefault();go(a.hash.slice(1))});document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>go(b.dataset.route));document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>go('home'));
document.querySelectorAll('[data-topic]').forEach(b=>{b.onclick=()=>{const t=S.topics.find(t=>t.id===b.dataset.topic);t.allowed=!t.allowed;store();b.dataset.on=String(t.allowed);b.setAttribute('aria-pressed',t.allowed);b.setAttribute('aria-label',`${t.name}：${t.allowed?'已开放':'仅自己'}${!S.global||!S.groups.inputs?'，读取暂停':''}，点击${t.allowed?'关闭':'开放'}`)};b.onfocus=()=>{document.querySelectorAll('[data-topic]').forEach(x=>x.tabIndex=x===b?0:-1)};b.onkeydown=e=>topicKeys(e,b)});
document.querySelectorAll('.item-text').forEach(el=>{const id=el.dataset.id;el.addEventListener('compositionstart',()=>{composing.add(id);clearTimeout(saveTimers.get(id))});el.addEventListener('compositionend',()=>{composing.delete(id);pending.set(id,el.innerText);schedule(id)});el.oninput=()=>{pending.set(id,el.innerText);const f=document.querySelector(`[data-feedback="${id}"]`);f.textContent='';if(!composing.has(id))schedule(id)};el.onblur=()=>{if(!composing.has(id))commitItem(id)};el.onkeydown=e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();commitItem(id)}if(e.key==='Escape'&&!composing.has(id)){e.preventDefault();commitItem(id);el.blur()}}});
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{if(!flush())return;const k=b.dataset.add,id='u'+(++newId),section=k==='info'?'补充信息':k==='rules'?'补充规则':'补充状态';S.items[k].push({id,section,text:'',userCreated:true});store();render();const el=document.querySelector(`[data-id="${id}"]`);el.focus();el.scrollIntoView({block:'nearest'})});
document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{const id=b.dataset.delete,arr=S.items[current],index=arr.findIndex(it=>it.id===id);if(index<0)return;const item=arr.splice(index,1)[0];S.removed.push({id,text:item.text,group:current});const k=current;pending.delete(id);failed.delete(id);store();render();toast('已删除，不会自动加回。',()=>{S.items[k].splice(index,0,item);S.removed=S.removed.filter(r=>r.id!==id);store();render()})});
document.querySelectorAll('[data-evidence]').forEach(b=>b.onclick=()=>{const id=b.dataset.evidence,it=S.items[current].find(x=>x.id===id),row=document.querySelector(`[data-item="${id}"]`);b.closest('details').open=false;const old=row.querySelector('.item-evidence');if(old){old.remove();return}const p=document.createElement('div');p.className='item-evidence';p.textContent=it.userCreated?'由你添加。':it.userEdited?'已按你的修改保存。自动补充不会覆盖这条内容。':'根据你的相关表达整理。此设计稿使用示例内容，不包含真实来源。';row.append(p)});
document.querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>commitItem(b.dataset.retry,true));
document.querySelectorAll('[data-connection]').forEach(b=>b.onclick=()=>{S.connections[+b.dataset.connection].active=!S.connections[+b.dataset.connection].active;store();render()});
document.querySelectorAll('[data-disconnect]').forEach(b=>b.onclick=()=>{const c=S.connections[+b.dataset.disconnect];c.connected=false;c.active=false;store();render();toast('已断开 '+c.name+'（设计演示）。')});document.querySelectorAll('[data-reconnect]').forEach(b=>b.onclick=()=>go('connect'));
document.querySelector('[data-allow]')?.addEventListener('click',()=>{let c=S.connections.find(c=>c.name==='ChatGPT');if(c){c.connected=true;c.active=true}else S.connections.push({name:'ChatGPT',connected:true,active:true});store();go('connections');toast('连接状态已更新（设计演示，不是真实授权）。')});
}
function schedule(id){clearTimeout(saveTimers.get(id));saveTimers.set(id,setTimeout(()=>commitItem(id),650))}
function topicKeys(e,b){const all=[...document.querySelectorAll('[data-topic]')],idx=all.indexOf(b);let next=-1;const r=b.getBoundingClientRect();if(e.key==='ArrowRight')next=Math.min(idx+1,all.length-1);if(e.key==='ArrowLeft')next=Math.max(0,idx-1);if(e.key==='Home')next=0;if(e.key==='End')next=all.length-1;if(['ArrowDown','ArrowUp'].includes(e.key)){const dir=e.key==='ArrowDown'?1:-1;const options=all.map((el,i)=>({i,r:el.getBoundingClientRect()})).filter(x=>dir*(x.r.top-r.top)>5);options.sort((a,c)=>Math.abs(a.r.top-r.top)-Math.abs(c.r.top-r.top)||Math.abs(a.r.left-r.left)-Math.abs(c.r.left-r.left));if(options.length)next=options[0].i;}if(next>=0){e.preventDefault();all[next].focus()}}
window.addEventListener('beforeunload',e=>{if(pending.size||composing.size){e.preventDefault();e.returnValue=''}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='z'&&!e.target.isContentEditable&&undoStack.length){e.preventDefault();const u=undoStack.pop(),it=Object.values(S.items).flat().find(x=>x.id===u.id);if(it){it.text=u.old;it.userEdited=true;store();render();toast('已撤销上次修改。')}}if(e.key==='Escape'){document.querySelectorAll('details[open]').forEach(d=>{d.open=false;d.querySelector('summary')?.focus()})}});
current=params.get('page')||'home';render();
window.design={get state(){return S},get page(){return current},get pending(){return [...pending.keys()]},get composing(){return [...composing]},go,flush,fixtureNotice,toggleTheme(){document.documentElement.dataset.paiaTheme=document.documentElement.dataset.paiaTheme==='dark'?'light':'dark'}};
</script></body></html>
