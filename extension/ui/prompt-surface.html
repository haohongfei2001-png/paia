<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAIA 常用输入</title><link rel="stylesheet" href="prompt-surface.css"></head><body>
<main id="card" aria-label="常用输入"><header><button id="leave-search" aria-label="返回常用输入" hidden>‹</button><span>常用输入</span><button id="open-search" aria-label="搜索全部档案">搜索</button><div id="search-bar" hidden><input id="search-query" type="search" maxlength="1000" aria-label="搜索全部档案" placeholder="搜索全部档案"></div><button id="search-clear" aria-label="清除搜索" hidden>×</button><button id="close" aria-label="关闭卡片">⌄</button></header><div id="list" aria-label="Prompt 列表"></div><section id="editor" hidden></section><section id="check-text" aria-label="核对完整表达" hidden></section><p id="status" role="status" aria-live="polite"></p><nav aria-label="列表操作"><button id="open-paia">打开 PAIA</button><button id="surface-more" aria-label="更多列表操作" aria-expanded="false" aria-controls="surface-tools">⋯</button></nav><div id="surface-tools" aria-label="列表操作" hidden><button id="new" aria-label="新建 Prompt">＋</button><button id="refresh" aria-label="刷新列表">↻</button><button id="hidden" aria-label="显示隐藏的 Prompt">隐藏项</button><button id="search-previous" aria-label="上一页" hidden>上一页</button><button id="search-next" aria-label="下一页" hidden>下一页</button></div></main><script type="module" src="prompt-surface.js"></script></body></html>
