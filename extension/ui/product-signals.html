<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>隐私与授权记录 · PAIA</title>
  <link rel="icon" href="../icons/icon32.png">
  <link rel="stylesheet" href="icons.css">
  <link rel="stylesheet" href="product-signals.css">
  <script type="module" src="product-signals.js"></script>
</head>
<body>
<main>
  <header class="local-tools-header"><a id="local-tools-back" href="archive.html">回到 PAIA</a><button id="signals-refresh" type="button">刷新记录</button></header>
  <p class="eyebrow">PAIA · PRIVACY</p>
  <h1>隐私与授权记录</h1>
  <p class="intro">查看已有本机记录、撤销权限，或清空历史统计与审计。本页不创建新权限；清空操作需要你明确确认。</p>
  <section class="privacy">
    <h2>已有聚合统计</h2>
    <p id="signals-collection">正在读取记录状态…</p>
    <div class="actions"><button id="signals-disable" type="button" disabled>关闭旧记录开关</button><button id="signals-clear" class="danger" type="button" disabled>清空已有统计</button></div>
    <p class="muted">只涉及本机历史聚合记录，不影响档案、思想、授权记录或版本历史。</p>
    <p id="signals-status" role="status"></p>
  </section>
  <section id="passport-section" class="passport">
    <h2>已有授权记录</h2>
    <p class="muted">原有权限记录继续保留，内容处理功能目前不可用。撤销会阻止后续受控使用，不能收回之前已带出的文字。</p>
    <p id="passport-status" role="status"></p>
    <div id="passport-grants"></div>
    <details id="passport-audit"><summary>已有访问审计</summary><p class="muted">保留的记录包括使用方、用途、范围引用、时间和历史操作；不含正文。</p><div id="passport-audit-list"></div><button id="passport-clear-audits" class="danger" type="button" disabled>清空访问审计</button></details>
  </section>
</main>
</body>
</html>
