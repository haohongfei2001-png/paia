<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PAIA</title>
  <link rel="icon" href="../icons/icon32.png">
  <link rel="stylesheet" href="icons.css">
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header>
    <img class="brand-mark" src="assets/paia-logo-32.png" width="32" height="32" alt="">
    <h1>PAIA</h1>
  </header>
  <main>
    <div class="capture-overview">
      <div class="capture-summary">
        <div class="status-row"><span class="status-dot" id="status-dot" aria-hidden="true"></span><strong id="enabled-state">读取状态中…</strong></div>
        <div class="count"><strong id="record-count">—</strong><span>条已保存输入</span></div>
      </div>
      <button id="toggle-capture" class="quiet" type="button" disabled>暂停捕获</button>
    </div>
    <p id="first-use" hidden>默认关闭。阅读完整说明并主动同意后，才会收录已显示的 ChatGPT 用户文字。</p>
    <p class="subtle" id="resume-note" hidden>恢复后，会补收当前已显示的普通聊天用户文字。</p>
    <button id="open-archive" class="primary" type="button">打开 PAIA</button>
    <p class="error" id="error" role="alert" hidden></p>
    <section id="recovery-card" class="recovery-card" aria-labelledby="recovery-title" hidden>
      <h2 id="recovery-title"></h2>
      <p id="recovery-detail"></p>
      <button id="recovery-action" class="secondary" type="button"></button>
    </section>
    <section class="update-status" aria-labelledby="update-heading">
      <h2 id="update-heading" class="visually-hidden">版本与更新</h2>
      <div class="update-row">
        <span id="update-version">正在读取版本…</span>
        <button id="check-update" class="quiet" type="button">检查更新</button>
      </div>
      <p id="update-message" role="status" hidden></p>
      <details id="update-details"><summary>更新方式</summary><p>仅检查此安装来源的更新；其他来源的版本需另行核对。不会自动重启或删除资料。</p></details>
    </section>

  </main>
</body>
</html>
