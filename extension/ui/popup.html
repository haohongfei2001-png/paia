<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal AI Input Archive</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header><div class="brand-mark" aria-hidden="true">A</div><div><p class="eyebrow">PERSONAL ARCHIVE</p><h1>我的输入档案</h1></div></header>
  <main>
    <div class="status-row"><span class="status-dot" id="status-dot"></span><strong id="enabled-state">读取状态中…</strong><span class="local-tag">仅本机</span></div>
    <div class="count"><strong id="record-count">—</strong><span>条记录<span class="subtle">本机原始输入档案</span></span></div>
    <p id="first-use" hidden>默认关闭。阅读完整说明并主动同意后，才会收录已显示的 ChatGPT 用户文字。</p>
    <button id="open-archive" class="primary" type="button">打开 Input Archive <span aria-hidden="true">↗</span></button>
    <button id="toggle-capture" class="secondary" type="button" disabled>暂停捕获</button>
    <p class="subtle" id="resume-note" hidden>恢复后，会补收当前已显示的普通聊天用户文字。</p>
    <p class="subtle"><a href="product-signals.html" target="_blank" rel="noopener">本机工具 · 产品验证 / Passport</a></p>
    <p class="error" id="error" role="alert" hidden></p>
    <details><summary>捕获诊断</summary><p id="diagnostic-status">等待读取</p><p class="subtle" id="diagnostic-time"></p><p class="subtle" id="diagnostic-version"></p><p class="subtle" id="diagnostic-error"></p><p id="diagnostic-structure">结构概览：暂无</p><p class="subtle">v0.6.2 Light Filter Coverage · 保留已验证的捕获规则。<a href="response-time.html" target="_blank" rel="noopener">打开响应时间诊断</a></p></details>
  </main>
  <footer>不读草稿 · 跳过临时聊天 · 无网络请求</footer>
</body>
</html>
