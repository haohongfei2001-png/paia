<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1978" viewBox="0 0 1440 1978"><title>PAIA — terms-zh-1440 — design only</title><desc>Static authored design specification. Fictional examples; not implemented UI or product evidence.</desc><defs><filter id="paper-shadow" x="-45%" y="-35%" width="195%" height="200%"><feDropShadow dx="0" dy="15" stdDeviation="19" flood-color="#232e24" flood-opacity=".13"/></filter><filter id="source-shadow" x="-40%" y="-35%" width="180%" height="185%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#283127" flood-opacity=".09"/></filter><filter id="photo-shadow" x="-35%" y="-30%" width="170%" height="175%"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#283127" flood-opacity=".12"/></filter></defs><rect id="terms-zh-1440.001" x="0" y="0" width="1440" height="1978" rx="0" fill="#fdfdfb"/><text id="terms-zh-1440.002" font-family="Noto Serif CJK SC" font-size="43" font-weight="400" font-style="normal" letter-spacing="1.2" text-anchor="start" fill="#171c19"><tspan x="76" y="55.69">PAIA</tspan></text><path id="terms-zh-1440.003" d="M181 25 L181 57" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="terms-zh-1440.004" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="197" y="39.38">你的 AI 上下文，</tspan><tspan x="197" y="56.38">也是下一步的起点。</tspan></text><text id="terms-zh-1440.005" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="475" y="44.79">首页</tspan></text><path id="terms-zh-1440.006" d="M475 54 L511.58125 54" fill="none" stroke="#808981" stroke-width="1.4"/><text id="terms-zh-1440.007" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="553" y="44.79">使用方式</tspan></text><text id="terms-zh-1440.008" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="687" y="44.79">使用场景</tspan></text><text id="terms-zh-1440.009" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="799" y="44.79">我们的故事</tspan></text><text id="terms-zh-1440.010" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="909" y="44.79">手记</tspan></text><rect id="terms-zh-1440.011" x="1192" y="18" width="176" height="42" rx="21.0" fill="#343e35" stroke="#343e35" stroke-width=".8"/><text id="terms-zh-1440.012" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#fdfdfb"><tspan x="1216" y="43.29">申请内测</tspan></text><path id="terms-zh-1440.013" d="M1329 39.0h14m-5 -5 5 5-5 5" fill="none" stroke="#fdfdfb" stroke-width="1.2"/><text id="terms-zh-1440.014" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="76" y="158.88">PAIA / 法律说明</tspan></text><text id="terms-zh-1440.015" font-family="Noto Serif CJK SC" font-size="66" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="504" y="270.78">使用条款</tspan></text><text id="terms-zh-1440.016" font-family="Noto Sans CJK SC" font-size="12" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="504" y="393.96">保留现有公开页面的政策内容与日期。</tspan></text><text id="terms-zh-1440.017" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="76" y="485.88">本页内容</tspan></text><text id="terms-zh-1440.018" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="76" y="540.45">原则</tspan><tspan x="76" y="579.45">数据使用</tspan><tspan x="76" y="618.45">你的控制</tspan><tspan x="76" y="657.45">联系</tspan></text><text id="terms-zh-1440.019" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="491.28">PAIA · PRIVATE BETA</tspan></text><text id="terms-zh-1440.020" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="546.28">政策内容最后更新: 2026-09-10 · 页面呈现更新: 2026-09-26</tspan></text><text id="terms-zh-1440.021" font-family="Noto Serif CJK SC" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="504" y="610.41">1. Beta 状态</tspan></text><text id="terms-zh-1440.022" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="664.28">PAIA 当前处于 Private Beta。功能、数据结构、界面和支持范围可能持续变化，部分能力可能不稳</tspan><tspan x="504" y="691.28">定或暂时不可用。</tspan></text><text id="terms-zh-1440.023" font-family="Noto Serif CJK SC" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="504" y="755.41">2. 用户数据</tspan></text><text id="terms-zh-1440.024" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="809.28">用户对自己输入、编辑和导入的内容保留相应权利。PAIA 的产品目标是让这些内容保持可查看、可</tspan><tspan x="504" y="836.28">管理和可导出，而不是通过锁定用户数据建立使用门槛。</tspan></text><text id="terms-zh-1440.025" font-family="Noto Serif CJK SC" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="504" y="900.41">3. 备份责任</tspan></text><text id="terms-zh-1440.026" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="954.28">在 Beta 阶段，用户不应把 PAIA 作为自己重要数据的唯一副本。对于需要长期保存的内容，请同时</tspan><tspan x="504" y="981.28">保留独立备份。</tspan></text><text id="terms-zh-1440.027" font-family="Noto Serif CJK SC" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="504" y="1045.41">4. 合理使用</tspan></text><text id="terms-zh-1440.028" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="1099.28">请勿利用 PAIA 进行违法活动、未经授权的数据收集、侵犯他人隐私或知识产权，或规避第三方平台</tspan><tspan x="504" y="1126.28">的访问和使用限制。</tspan></text><text id="terms-zh-1440.029" font-family="Noto Serif CJK SC" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="504" y="1190.41">5. 第三方服务</tspan></text><text id="terms-zh-1440.030" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="1244.28">PAIA 可能与浏览器、AI 服务或其他第三方平台配合使用。第三方服务的可用性、条款和技术变化不</tspan><tspan x="504" y="1271.28">由 PAIA 控制，相关功能可能因此调整。</tspan></text><text id="terms-zh-1440.031" font-family="Noto Serif CJK SC" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="504" y="1335.41">6. 可用性与责任边界</tspan></text><text id="terms-zh-1440.032" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="1389.28">Beta 版本按当前状态提供，不承诺持续、无错误或永久可用。产品会尽力降低数据风险，但用户仍</tspan><tspan x="504" y="1416.28">应为重要资料保留独立备份。</tspan></text><text id="terms-zh-1440.033" font-family="Noto Serif CJK SC" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="504" y="1480.41">7. 联系</tspan></text><text id="terms-zh-1440.034" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="1534.28">有关本政策、Beta 或申请信息删除的问题，请联系 haohongfei2001@gmail.com。</tspan></text><path id="terms-zh-1440.035" d="M76 1646 L1364 1646" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="terms-zh-1440.036" font-family="Noto Serif CJK SC" font-size="43" font-weight="400" font-style="normal" letter-spacing="1.2" text-anchor="start" fill="#171c19"><tspan x="76" y="1719.69">PAIA</tspan></text><text id="terms-zh-1440.037" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="76" y="1757.45">让你的思考，拥有更长的明天。</tspan></text><text id="terms-zh-1440.038" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="710" y="1698.88">探索</tspan></text><text id="terms-zh-1440.039" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="710" y="1739.38">使用方式</tspan></text><text id="terms-zh-1440.040" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="710" y="1768.38">使用场景</tspan></text><text id="terms-zh-1440.041" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="710" y="1797.38">体验示例</tspan></text><text id="terms-zh-1440.042" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="940" y="1698.88">观点</tspan></text><text id="terms-zh-1440.043" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="940" y="1739.38">我们的故事</tspan></text><text id="terms-zh-1440.044" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="940" y="1768.38">手记</tspan></text><text id="terms-zh-1440.045" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="940" y="1797.38">申请内测</tspan></text><text id="terms-zh-1440.046" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="1170" y="1698.88">信任</tspan></text><text id="terms-zh-1440.047" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="1170" y="1739.38">你的数据</tspan></text><text id="terms-zh-1440.048" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="1170" y="1768.38">当前状态</tspan></text><text id="terms-zh-1440.049" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="1170" y="1797.38">隐私 · 条款</tspan></text><text id="terms-zh-1440.050" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="1170" y="1826.38">联系</tspan></text><path id="terms-zh-1440.051" d="M76 1890 L1364 1890" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="terms-zh-1440.052" font-family="Noto Sans CJK SC" font-size="10.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="76" y="1923.71">© 2026 PAIA · 内测阶段</tspan></text><text id="terms-zh-1440.053" font-family="Noto Sans CJK SC" font-size="11" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="end" fill="#707975"><tspan x="1364" y="1924.13">EN   /   中文</tspan></text><text id="terms-zh-1440.054" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="76" y="1949.88">摄影署名 · 所有材料均为示例，并非真实档案</tspan></text></svg>