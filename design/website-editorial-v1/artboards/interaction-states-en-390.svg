<svg xmlns="http://www.w3.org/2000/svg" width="390" height="3430" viewBox="0 0 390 3430"><title>PAIA — interaction-states-en-390 — design only</title><desc>Static authored design specification. Fictional examples; not implemented UI or product evidence.</desc><defs><filter id="paper-shadow" x="-45%" y="-35%" width="195%" height="200%"><feDropShadow dx="0" dy="15" stdDeviation="19" flood-color="#232e24" flood-opacity=".13"/></filter><filter id="source-shadow" x="-40%" y="-35%" width="180%" height="185%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#283127" flood-opacity=".09"/></filter><filter id="photo-shadow" x="-35%" y="-30%" width="170%" height="175%"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#283127" flood-opacity=".12"/></filter></defs><rect id="interaction-states-en-390.001" x="0" y="0" width="390" height="3430" rx="0" fill="#fdfdfb"/><text id="interaction-states-en-390.002" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="49.88">PAIA / INTERACTION SPECIMENS</tspan></text><text id="interaction-states-en-390.003" font-family="EB Garamond 12" font-size="43" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="134.69">The quiet details</tspan><tspan x="24" y="182.69">are part of the</tspan><tspan x="24" y="230.69">design.</tspan></text><text id="interaction-states-en-390.004" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="284.88">01 / REST, HOVER, KEYBOARD FOCUS</tspan></text><rect id="interaction-states-en-390.005" x="24" y="326" width="208" height="56" rx="28.0" fill="#343e35" stroke="#343e35" stroke-width=".8"/><text id="interaction-states-en-390.006" font-family="Inter" font-size="15.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#fdfdfb"><tspan x="48" y="359.12">Get early access</tspan></text><path id="interaction-states-en-390.007" d="M193 354.0h14m-5 -5 5 5-5 5" fill="none" stroke="#fdfdfb" stroke-width="1.2"/><rect id="interaction-states-en-390.008" x="19" y="321" width="218" height="66" rx="33" fill="none" stroke="#536b54" stroke-width=".8"/><text id="interaction-states-en-390.009" font-family="Inter" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="429.79">2 px focus ring, 4 px offset. Hover lifts 2 px; no</tspan><tspan x="24" y="448.64">geometry shift.</tspan></text><path id="interaction-states-en-390.010" d="M24 617 L366 617" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="interaction-states-en-390.011" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="649.88">02 / NAVIGATION, OPEN</tspan></text><text id="interaction-states-en-390.012" font-family="EB Garamond 12" font-size="22" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="703.26">Home    /    How it works    /    Use</tspan><tspan x="24" y="742.26">cases</tspan><tspan x="24" y="781.26">Our story    /    Journal    /    Your data</tspan></text><text id="interaction-states-en-390.013" font-family="Inter" font-size="12" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="805.96">Escape closes; focus returns to the menu control. No</tspan><tspan x="24" y="823.36">off-screen links.</tspan></text><path id="interaction-states-en-390.014" d="M24 982 L366 982" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="interaction-states-en-390.015" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="1014.88">03 / FAQ, OPEN</tspan></text><text id="interaction-states-en-390.016" font-family="EB Garamond 12" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="1072.41">Does everything get sent to AI?</tspan></text><text id="interaction-states-en-390.017" font-family="Inter" font-size="14" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1113.62">No. Ordinary archive use is local-first. Optional</tspan><tspan x="24" y="1133.92">external AI processing and context reuse are</tspan><tspan x="24" y="1154.22">separate, explicit actions with their own</tspan><tspan x="24" y="1174.52">boundaries.</tspan></text><path id="interaction-states-en-390.018" d="M24 1347 L366 1347" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="interaction-states-en-390.019" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="1379.88">04 / FORM, NEEDS ATTENTION</tspan></text><rect id="interaction-states-en-390.020" x="24" y="1419" width="334" height="54" rx="3" fill="#fdfdfb" stroke="#8c5748" stroke-width=".8"/><text id="interaction-states-en-390.021" font-family="Inter" font-size="14" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#854d40"><tspan x="39" y="1447.62">Please enter a valid email address.</tspan></text><text id="interaction-states-en-390.022" font-family="Inter" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1508.79">Keep the text entered. Focus the error summary.</tspan><tspan x="24" y="1527.64">Never auto-submit consent.</tspan></text><path id="interaction-states-en-390.023" d="M24 1712 L366 1712" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="interaction-states-en-390.024" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="1744.88">05 / NOTHING SELECTED</tspan></text><text id="interaction-states-en-390.025" font-family="EB Garamond 12" font-size="28" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="1810.24">Select material to prepare</tspan><tspan x="24" y="1847.24">context.</tspan></text><text id="interaction-states-en-390.026" font-family="Inter" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1880.79">No automatic replacement. Preview and copy are</tspan><tspan x="24" y="1899.64">unavailable.</tspan></text><path id="interaction-states-en-390.027" d="M24 2077 L366 2077" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="interaction-states-en-390.028" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="2109.89">06 / CHANGED MATERIAL, STALE PREVIEW</tspan></text><text id="interaction-states-en-390.029" font-family="EB Garamond 12" font-size="28" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="2175.24">This preview is out of date.</tspan></text><text id="interaction-states-en-390.030" font-family="Inter" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2245.79">Review the updated selection before copying. Keep</tspan><tspan x="24" y="2264.64">the previous text visibly marked, not silently</tspan><tspan x="24" y="2283.49">actionable.</tspan></text><path id="interaction-states-en-390.031" d="M24 2442 L366 2442" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="interaction-states-en-390.032" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="2474.89">07 / COPY NOT AVAILABLE</tspan></text><text id="interaction-states-en-390.033" font-family="EB Garamond 12" font-size="28" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="2540.24">Copy was not completed.</tspan></text><text id="interaction-states-en-390.034" font-family="Inter" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2610.79">The text remains selectable. Offer manual copying</tspan><tspan x="24" y="2629.64">without pretending success.</tspan></text><path id="interaction-states-en-390.035" d="M24 2807 L366 2807" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="interaction-states-en-390.036" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="2839.89">08 / IMAGE FAILURE &amp; REDUCED MOTION</tspan></text><text id="interaction-states-en-390.037" font-family="EB Garamond 12" font-size="28" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="2905.24">The composition remains.</tspan></text><text id="interaction-states-en-390.038" font-family="Inter" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2975.79">Use the pinned local fallback image, not a blank grid</tspan><tspan x="24" y="2994.64">cell. Reduced motion shows the final composition</tspan><tspan x="24" y="3013.49">immediately.</tspan></text><path id="interaction-states-en-390.039" d="M24 3172 L366 3172" fill="none" stroke="#dfe2dc" stroke-width="1"/></svg>