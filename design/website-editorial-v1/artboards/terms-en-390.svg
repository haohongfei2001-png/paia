<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2870" viewBox="0 0 390 2870"><title>PAIA — terms-en-390 — design only</title><desc>Static authored design specification. Fictional examples; not implemented UI or product evidence.</desc><defs><filter id="paper-shadow" x="-45%" y="-35%" width="195%" height="200%"><feDropShadow dx="0" dy="15" stdDeviation="19" flood-color="#232e24" flood-opacity=".13"/></filter><filter id="source-shadow" x="-40%" y="-35%" width="180%" height="185%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#283127" flood-opacity=".09"/></filter><filter id="photo-shadow" x="-35%" y="-30%" width="170%" height="175%"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#283127" flood-opacity=".12"/></filter></defs><rect id="terms-en-390.001" x="0" y="0" width="390" height="2870" rx="0" fill="#fdfdfb"/><text id="terms-en-390.002" font-family="EB Garamond 12" font-size="34" font-weight="400" font-style="normal" letter-spacing="1.2" text-anchor="start" fill="#171c19"><tspan x="24" y="50.22">PAIA</tspan></text><rect id="terms-en-390.003" x="203" y="22" width="127" height="39" rx="19.5" fill="#343e35" stroke="#343e35" stroke-width=".8"/><text id="terms-en-390.004" font-family="Inter" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#fdfdfb"><tspan x="227" y="45.79">Join beta</tspan></text><path id="terms-en-390.005" d="M291 41.5h14m-5 -5 5 5-5 5" fill="none" stroke="#fdfdfb" stroke-width="1.2"/><path id="terms-en-390.006" d="M350 34 L369 34" fill="none" stroke="#171c19" stroke-width="1"/><path id="terms-en-390.007" d="M350 43 L369 43" fill="none" stroke="#171c19" stroke-width="1"/><text id="terms-en-390.008" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="128.88">PAIA / LEGAL</tspan></text><text id="terms-en-390.009" font-family="EB Garamond 12" font-size="48" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="225.84">Terms of use</tspan></text><text id="terms-en-390.010" font-family="Inter" font-size="12" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="24" y="322.96">Policy substance and dates retained from the existing</tspan><tspan x="24" y="340.36">public page.</tspan></text><text id="terms-en-390.011" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="420.28">PAIA · PRIVATE BETA</tspan></text><text id="terms-en-390.012" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="475.28">Terms</tspan></text><text id="terms-en-390.013" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="530.28">Policy content last updated: 2026-09-10 ·</tspan><tspan x="24" y="557.28">Presentation updated: 2026-09-26</tspan></text><text id="terms-en-390.014" font-family="EB Garamond 12" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="621.41">1. Beta status</tspan></text><text id="terms-en-390.015" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="675.28">PAIA is currently in private beta. Features,</tspan><tspan x="24" y="702.28">data structures, interfaces and support</tspan><tspan x="24" y="729.28">scope may change. Some capabilities may</tspan><tspan x="24" y="756.28">be unstable or temporarily unavailable.</tspan></text><text id="terms-en-390.016" font-family="EB Garamond 12" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="820.41">2. User data</tspan></text><text id="terms-en-390.017" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="874.28">Users retain the relevant rights in content</tspan><tspan x="24" y="901.28">they enter, edit and import. PAIA aims to</tspan><tspan x="24" y="928.28">make this material viewable, manageable</tspan><tspan x="24" y="955.28">and exportable, rather than create barriers</tspan><tspan x="24" y="982.28">by locking in user data.</tspan></text><text id="terms-en-390.018" font-family="EB Garamond 12" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="1046.41">3. Backups</tspan></text><text id="terms-en-390.019" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1100.28">During beta, do not use PAIA as the only</tspan><tspan x="24" y="1127.28">copy of important data. Keep independent</tspan><tspan x="24" y="1154.28">backups of material that needs long-term</tspan><tspan x="24" y="1181.28">preservation.</tspan></text><text id="terms-en-390.020" font-family="EB Garamond 12" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="1245.41">4. Acceptable use</tspan></text><text id="terms-en-390.021" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1299.28">Do not use PAIA for unlawful activity,</tspan><tspan x="24" y="1326.28">unauthorized data collection, violations of</tspan><tspan x="24" y="1353.28">others’ privacy or intellectual property, or</tspan><tspan x="24" y="1380.28">circumvention of third-party access and</tspan><tspan x="24" y="1407.28">usage restrictions.</tspan></text><text id="terms-en-390.022" font-family="EB Garamond 12" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="1471.41">5. Third-party services</tspan></text><text id="terms-en-390.023" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1525.28">PAIA may work with browsers, AI services</tspan><tspan x="24" y="1552.28">and other third-party platforms. PAIA does</tspan><tspan x="24" y="1579.28">not control their availability, terms or</tspan><tspan x="24" y="1606.28">technical changes, which may require</tspan><tspan x="24" y="1633.28">changes to related features.</tspan></text><text id="terms-en-390.024" font-family="EB Garamond 12" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="1697.41">6. Availability and limitations</tspan></text><text id="terms-en-390.025" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1751.28">The beta is provided in its current state,</tspan><tspan x="24" y="1778.28">without a promise of continuous, error-free</tspan><tspan x="24" y="1805.28">or permanent availability. The product</tspan><tspan x="24" y="1832.28">seeks to reduce data risks, but users should</tspan><tspan x="24" y="1859.28">keep independent backups of important</tspan><tspan x="24" y="1886.28">material.</tspan></text><text id="terms-en-390.026" font-family="EB Garamond 12" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="1950.41">7. Contact</tspan></text><text id="terms-en-390.027" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2004.28">For policy, beta or application-deletion</tspan><tspan x="24" y="2031.28">questions, contact</tspan><tspan x="24" y="2058.28">haohongfei2001@gmail.com.</tspan></text><path id="terms-en-390.028" d="M24 2170 L366 2170" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="terms-en-390.029" font-family="EB Garamond 12" font-size="36" font-weight="400" font-style="normal" letter-spacing="1.2" text-anchor="start" fill="#171c19"><tspan x="24" y="2237.88">PAIA</tspan></text><text id="terms-en-390.030" font-family="Inter" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2281.45">Your thinking has a longer tomorrow.</tspan></text><text id="terms-en-390.031" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="2353.89">EXPLORE</tspan></text><text id="terms-en-390.032" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2394.38">How it works</tspan></text><text id="terms-en-390.033" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2423.38">Use cases</tspan></text><text id="terms-en-390.034" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2452.38">Explore an example</tspan></text><text id="terms-en-390.035" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="204" y="2353.89">PERSPECTIVES</tspan></text><text id="terms-en-390.036" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="204" y="2394.38">Our story</tspan></text><text id="terms-en-390.037" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="204" y="2423.38">Journal</tspan></text><text id="terms-en-390.038" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="204" y="2452.38">Get early access</tspan></text><text id="terms-en-390.039" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="2529.89">TRUST</tspan></text><text id="terms-en-390.040" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2570.38">Your data</tspan></text><text id="terms-en-390.041" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2599.38">Current status</tspan></text><text id="terms-en-390.042" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2628.38">Privacy · Terms</tspan></text><text id="terms-en-390.043" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2657.38">Contact</tspan></text><path id="terms-en-390.044" d="M24 2740 L366 2740" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="terms-en-390.045" font-family="Inter" font-size="10.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="24" y="2773.72">© 2026 PAIA · Private beta</tspan></text><text id="terms-en-390.046" font-family="Inter" font-size="11" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="end" fill="#707975"><tspan x="366" y="2774.13">EN   /   中文</tspan></text><text id="terms-en-390.047" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="24" y="2799.89">Photography credits · Illustrative material, not a live archive</tspan></text></svg>