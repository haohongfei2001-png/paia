<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2125" viewBox="0 0 390 2125"><title>PAIA — beta-en-390 — design only</title><desc>Static authored design specification. Fictional examples; not implemented UI or product evidence.</desc><defs><filter id="paper-shadow" x="-45%" y="-35%" width="195%" height="200%"><feDropShadow dx="0" dy="15" stdDeviation="19" flood-color="#232e24" flood-opacity=".13"/></filter><filter id="source-shadow" x="-40%" y="-35%" width="180%" height="185%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#283127" flood-opacity=".09"/></filter><filter id="photo-shadow" x="-35%" y="-30%" width="170%" height="175%"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#283127" flood-opacity=".12"/></filter></defs><rect id="beta-en-390.001" x="0" y="0" width="390" height="2125" rx="0" fill="#fdfdfb"/><text id="beta-en-390.002" font-family="EB Garamond 12" font-size="34" font-weight="400" font-style="normal" letter-spacing="1.2" text-anchor="start" fill="#171c19"><tspan x="24" y="50.22">PAIA</tspan></text><rect id="beta-en-390.003" x="203" y="22" width="127" height="39" rx="19.5" fill="#343e35" stroke="#343e35" stroke-width=".8"/><text id="beta-en-390.004" font-family="Inter" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#fdfdfb"><tspan x="227" y="45.79">Join beta</tspan></text><path id="beta-en-390.005" d="M291 41.5h14m-5 -5 5 5-5 5" fill="none" stroke="#fdfdfb" stroke-width="1.2"/><path id="beta-en-390.006" d="M350 34 L369 34" fill="none" stroke="#171c19" stroke-width="1"/><path id="beta-en-390.007" d="M350 43 L369 43" fill="none" stroke="#171c19" stroke-width="1"/><text id="beta-en-390.008" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="126.89">PRIVATE BETA / AN INVITATION</tspan></text><text id="beta-en-390.009" font-family="EB Garamond 12" font-size="42" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="205.86">A little more</tspan><tspan x="24" y="252.86">continuity.</tspan><tspan x="24" y="299.86">A place to begin.</tspan></text><text id="beta-en-390.010" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="360.28">PAIA is an invitation-only Chrome extension</tspan><tspan x="24" y="383.48">beta. Apply to help shape a more useful</tspan><tspan x="24" y="406.68">relationship with your own words.</tspan></text><text id="beta-en-390.011" font-family="EB Garamond 12" font-size="32" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="531.56">Request an invitation</tspan></text><text id="beta-en-390.012" font-family="Inter" font-size="13.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="590.21">Email *</tspan></text><rect id="beta-en-390.013" x="24" y="609" width="342" height="53" rx="3" fill="#fdfdfb" stroke="#b8c0b6" stroke-width=".8"/><text id="beta-en-390.014" font-family="Inter" font-size="14" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="40" y="637.62">you@example.com</tspan></text><text id="beta-en-390.015" font-family="Inter" font-size="13.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="702.21">What would you like to return to?</tspan></text><rect id="beta-en-390.016" x="24" y="721" width="342" height="118" rx="3" fill="#fdfdfb" stroke="#b8c0b6" stroke-width=".8"/><text id="beta-en-390.017" font-family="Inter" font-size="14" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="40" y="749.62">An ongoing project, a question, a decision…</tspan></text><text id="beta-en-390.018" font-family="Inter" font-size="12" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="24" y="877.96">The second field is optional. Do not include private archive</tspan><tspan x="24" y="895.36">text or sensitive information.</tspan></text><rect id="beta-en-390.019" x="24" y="955" width="18" height="18" rx="2" fill="#fdfdfb" stroke="#8d978e" stroke-width=".8"/><text id="beta-en-390.020" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="56" y="963.38">I agree that FormSubmit forwards the information I</tspan><tspan x="56" y="983.38">enter to the PAIA project contact for beta</tspan><tspan x="56" y="1003.38">recruitment and contact.</tspan></text><rect id="beta-en-390.021" x="24" y="1045" width="233" height="56" rx="28.0" fill="#343e35" stroke="#343e35" stroke-width=".8"/><text id="beta-en-390.022" font-family="Inter" font-size="15.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#fdfdfb"><tspan x="48" y="1078.12">Request an invitation</tspan></text><path id="beta-en-390.023" d="M218 1073.0h14m-5 -5 5 5-5 5" fill="none" stroke="#fdfdfb" stroke-width="1.2"/><text id="beta-en-390.024" font-family="Inter" font-size="11.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="24" y="1136.55">Submitting is not admission or a verified delivery receipt.</tspan><tspan x="24" y="1153.22">Privacy policy  →</tspan></text><text id="beta-en-390.025" font-family="Inter" font-size="11" font-weight="400" font-style="normal" letter-spacing="2" text-anchor="start" fill="#707975"><tspan x="24" y="1279.13">CURRENT SCOPE</tspan></text><text id="beta-en-390.026" font-family="Inter" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1322.45">Chrome + consented ChatGPT input capture.</tspan><tspan x="24" y="1344.20">No mobile installation or universal-AI</tspan><tspan x="24" y="1365.95">integration promised.</tspan></text><path id="beta-en-390.027" d="M24 1410 L366 1410" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="beta-en-390.028" font-family="EB Garamond 12" font-size="36" font-weight="400" font-style="normal" letter-spacing="1.2" text-anchor="start" fill="#171c19"><tspan x="24" y="1477.88">PAIA</tspan></text><text id="beta-en-390.029" font-family="Inter" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1521.45">Your thinking has a longer tomorrow.</tspan></text><text id="beta-en-390.030" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="1593.88">EXPLORE</tspan></text><text id="beta-en-390.031" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1634.38">How it works</tspan></text><text id="beta-en-390.032" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1663.38">Use cases</tspan></text><text id="beta-en-390.033" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1692.38">Explore an example</tspan></text><text id="beta-en-390.034" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="204" y="1593.88">PERSPECTIVES</tspan></text><text id="beta-en-390.035" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="204" y="1634.38">Our story</tspan></text><text id="beta-en-390.036" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="204" y="1663.38">Journal</tspan></text><text id="beta-en-390.037" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="204" y="1692.38">Get early access</tspan></text><text id="beta-en-390.038" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="1769.88">TRUST</tspan></text><text id="beta-en-390.039" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1810.38">Your data</tspan></text><text id="beta-en-390.040" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1839.38">Current status</tspan></text><text id="beta-en-390.041" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1868.38">Privacy · Terms</tspan></text><text id="beta-en-390.042" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1897.38">Contact</tspan></text><path id="beta-en-390.043" d="M24 1980 L366 1980" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="beta-en-390.044" font-family="Inter" font-size="10.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="24" y="2013.71">© 2026 PAIA · Private beta</tspan></text><text id="beta-en-390.045" font-family="Inter" font-size="11" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="end" fill="#707975"><tspan x="366" y="2014.13">EN   /   中文</tspan></text><text id="beta-en-390.046" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="24" y="2039.88">Photography credits · Illustrative material, not a live archive</tspan></text></svg>