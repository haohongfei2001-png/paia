<svg xmlns="http://www.w3.org/2000/svg" width="390" height="3430" viewBox="0 0 390 3430"><title>PAIA — interaction-states-zh-390 — design only</title><desc>Static authored design specification. Fictional examples; not implemented UI or product evidence.</desc><defs><filter id="paper-shadow" x="-45%" y="-35%" width="195%" height="200%"><feDropShadow dx="0" dy="15" stdDeviation="19" flood-color="#232e24" flood-opacity=".13"/></filter><filter id="source-shadow" x="-40%" y="-35%" width="180%" height="185%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#283127" flood-opacity=".09"/></filter><filter id="photo-shadow" x="-35%" y="-30%" width="170%" height="175%"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#283127" flood-opacity=".12"/></filter></defs><rect id="interaction-states-zh-390.001" x="0" y="0" width="390" height="3430" rx="0" fill="#fdfdfb"/><text id="interaction-states-zh-390.002" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="49.88">PAIA / 交互状态</tspan></text><text id="interaction-states-zh-390.003" font-family="Noto Serif CJK SC" font-size="43" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="134.69">安静的细节，</tspan><tspan x="24" y="182.69">也是设计的一部</tspan><tspan x="24" y="230.69">分。</tspan></text><text id="interaction-states-zh-390.004" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="284.88">01 / 常态、悬停、键盘焦点</tspan></text><rect id="interaction-states-zh-390.005" x="24" y="326" width="208" height="56" rx="28.0" fill="#343e35" stroke="#343e35" stroke-width=".8"/><text id="interaction-states-zh-390.006" font-family="Noto Sans CJK SC" font-size="15.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#fdfdfb"><tspan x="48" y="359.12">申请内测</tspan></text><path id="interaction-states-zh-390.007" d="M193 354.0h14m-5 -5 5 5-5 5" fill="none" stroke="#fdfdfb" stroke-width="1.2"/><rect id="interaction-states-zh-390.008" x="19" y="321" width="218" height="66" rx="33" fill="none" stroke="#536b54" stroke-width=".8"/><text id="interaction-states-zh-390.009" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="429.79">2 px 焦点环，4 px 间距。悬停上移 2 px，不改变布局。</tspan></text><path id="interaction-states-zh-390.010" d="M24 617 L366 617" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="interaction-states-zh-390.011" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="649.88">02 / 展开的导航</tspan></text><text id="interaction-states-zh-390.012" font-family="Noto Serif CJK SC" font-size="22" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="703.26">首页 / 使用方式 / 使用场景</tspan><tspan x="24" y="742.26">我们的故事 / 手记 / 你的数据</tspan></text><text id="interaction-states-zh-390.013" font-family="Noto Sans CJK SC" font-size="12" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="805.96">Esc 关闭，焦点回到菜单按钮；不保留屏幕外的可聚焦链接。</tspan></text><path id="interaction-states-zh-390.014" d="M24 982 L366 982" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="interaction-states-zh-390.015" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="1014.88">03 / 展开的问答</tspan></text><text id="interaction-states-zh-390.016" font-family="Noto Serif CJK SC" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="1072.41">全部档案都会被发送给 AI </tspan><tspan x="24" y="1101.57">吗？</tspan></text><text id="interaction-states-zh-390.017" font-family="Noto Sans CJK SC" font-size="14" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1113.62">不会。普通档案使用以本地为先。外部 AI 处理和上下</tspan><tspan x="24" y="1136.72">文复用是分别授权、明确触发的操作。</tspan></text><path id="interaction-states-zh-390.018" d="M24 1347 L366 1347" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="interaction-states-zh-390.019" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="1379.88">04 / 需要处理的表单</tspan></text><rect id="interaction-states-zh-390.020" x="24" y="1419" width="334" height="54" rx="3" fill="#fdfdfb" stroke="#8c5748" stroke-width=".8"/><text id="interaction-states-zh-390.021" font-family="Noto Sans CJK SC" font-size="14" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#854d40"><tspan x="39" y="1447.62">请输入有效的邮箱地址。</tspan></text><text id="interaction-states-zh-390.022" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1508.79">保留已输入内容，聚焦错误摘要，不自动勾选或提交同意</tspan><tspan x="24" y="1530.24">项。</tspan></text><path id="interaction-states-zh-390.023" d="M24 1712 L366 1712" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="interaction-states-zh-390.024" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="1744.88">05 / 未选择材料</tspan></text><text id="interaction-states-zh-390.025" font-family="Noto Serif CJK SC" font-size="28" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="1810.24">选择材料后，才能准备上</tspan><tspan x="24" y="1847.24">下文。</tspan></text><text id="interaction-states-zh-390.026" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1880.79">不自动补入其他材料。预览和复制均不可用。</tspan></text><path id="interaction-states-zh-390.027" d="M24 2077 L366 2077" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="interaction-states-zh-390.028" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="2109.89">06 / 材料改变，预览失效</tspan></text><text id="interaction-states-zh-390.029" font-family="Noto Serif CJK SC" font-size="28" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="2175.24">这份预览已经过时。</tspan></text><text id="interaction-states-zh-390.030" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2245.79">复制前审阅更新后的选择；旧文本应明确标示失效，不能</tspan><tspan x="24" y="2267.24">悄悄继续使用。</tspan></text><path id="interaction-states-zh-390.031" d="M24 2442 L366 2442" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="interaction-states-zh-390.032" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="2474.89">07 / 无法完成复制</tspan></text><text id="interaction-states-zh-390.033" font-family="Noto Serif CJK SC" font-size="28" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="2540.24">未完成复制。</tspan></text><text id="interaction-states-zh-390.034" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2610.79">文字仍可选中。提供手动复制方式，不假装已经成功。</tspan></text><path id="interaction-states-zh-390.035" d="M24 2807 L366 2807" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="interaction-states-zh-390.036" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="2839.89">08 / 图片加载失败与减少动态效果</tspan></text><text id="interaction-states-zh-390.037" font-family="Noto Serif CJK SC" font-size="28" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="2905.24">构图仍然完整。</tspan></text><text id="interaction-states-zh-390.038" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2975.79">使用已固定的本地备用图，而非空白格子。减少动态效果</tspan><tspan x="24" y="2997.24">时立即呈现最终构图。</tspan></text><path id="interaction-states-zh-390.039" d="M24 3172 L366 3172" fill="none" stroke="#dfe2dc" stroke-width="1"/></svg>