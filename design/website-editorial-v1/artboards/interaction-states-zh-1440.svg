<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="3030" viewBox="0 0 1440 3030"><title>PAIA — interaction-states-zh-1440 — design only</title><desc>Static authored design specification. Fictional examples; not implemented UI or product evidence.</desc><defs><filter id="paper-shadow" x="-45%" y="-35%" width="195%" height="200%"><feDropShadow dx="0" dy="15" stdDeviation="19" flood-color="#232e24" flood-opacity=".13"/></filter><filter id="source-shadow" x="-40%" y="-35%" width="180%" height="185%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#283127" flood-opacity=".09"/></filter><filter id="photo-shadow" x="-35%" y="-30%" width="170%" height="175%"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#283127" flood-opacity=".12"/></filter></defs><rect id="interaction-states-zh-1440.001" x="0" y="0" width="1440" height="3030" rx="0" fill="#fdfdfb"/><text id="interaction-states-zh-1440.002" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="76" y="49.88">PAIA / 交互状态</tspan></text><text id="interaction-states-zh-1440.003" font-family="Noto Serif CJK SC" font-size="65" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="76" y="152.95">安静的细节，</tspan><tspan x="76" y="221.95">也是设计的一部分。</tspan></text><text id="interaction-states-zh-1440.004" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="76" y="284.88">01 / 常态、悬停、键盘焦点</tspan></text><rect id="interaction-states-zh-1440.005" x="76" y="326" width="208" height="56" rx="28.0" fill="#343e35" stroke="#343e35" stroke-width=".8"/><text id="interaction-states-zh-1440.006" font-family="Noto Sans CJK SC" font-size="15.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#fdfdfb"><tspan x="100" y="359.12">申请内测</tspan></text><path id="interaction-states-zh-1440.007" d="M245 354.0h14m-5 -5 5 5-5 5" fill="none" stroke="#fdfdfb" stroke-width="1.2"/><rect id="interaction-states-zh-1440.008" x="71" y="321" width="218" height="66" rx="33" fill="none" stroke="#536b54" stroke-width=".8"/><text id="interaction-states-zh-1440.009" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="76" y="429.79">2 px 焦点环，4 px 间距。悬停上移 2 px，不改变布局。</tspan></text><path id="interaction-states-zh-1440.010" d="M76 582 L1364 582" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="interaction-states-zh-1440.011" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="76" y="614.88">02 / 展开的导航</tspan></text><text id="interaction-states-zh-1440.012" font-family="Noto Serif CJK SC" font-size="30" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="76" y="674.90">首页 / 使用方式 / 使用场景</tspan><tspan x="76" y="713.90">我们的故事 / 手记 / 你的数据</tspan></text><text id="interaction-states-zh-1440.013" font-family="Noto Sans CJK SC" font-size="12" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="76" y="770.96">Esc 关闭，焦点回到菜单按钮；不保留屏幕外的可聚焦链接。</tspan></text><path id="interaction-states-zh-1440.014" d="M76 912 L1364 912" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="interaction-states-zh-1440.015" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="76" y="944.88">03 / 展开的问答</tspan></text><text id="interaction-states-zh-1440.016" font-family="Noto Serif CJK SC" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="76" y="1002.41">全部档案都会被发送给 AI 吗？</tspan></text><text id="interaction-states-zh-1440.017" font-family="Noto Sans CJK SC" font-size="14" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="76" y="1043.62">不会。普通档案使用以本地为先。外部 AI 处理和上下文复用是分别授权、明确触发的操作。</tspan></text><path id="interaction-states-zh-1440.018" d="M76 1242 L1364 1242" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="interaction-states-zh-1440.019" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="76" y="1274.88">04 / 需要处理的表单</tspan></text><rect id="interaction-states-zh-1440.020" x="76" y="1314" width="470" height="54" rx="3" fill="#fdfdfb" stroke="#8c5748" stroke-width=".8"/><text id="interaction-states-zh-1440.021" font-family="Noto Sans CJK SC" font-size="14" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#854d40"><tspan x="91" y="1342.62">请输入有效的邮箱地址。</tspan></text><text id="interaction-states-zh-1440.022" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="76" y="1403.79">保留已输入内容，聚焦错误摘要，不自动勾选或提交同意项。</tspan></text><path id="interaction-states-zh-1440.023" d="M76 1572 L1364 1572" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="interaction-states-zh-1440.024" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="76" y="1604.88">05 / 未选择材料</tspan></text><text id="interaction-states-zh-1440.025" font-family="Noto Serif CJK SC" font-size="35" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="76" y="1676.05">选择材料后，才能准备上下文。</tspan></text><text id="interaction-states-zh-1440.026" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="76" y="1740.79">不自动补入其他材料。预览和复制均不可用。</tspan></text><path id="interaction-states-zh-1440.027" d="M76 1902 L1364 1902" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="interaction-states-zh-1440.028" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="76" y="1934.88">06 / 材料改变，预览失效</tspan></text><text id="interaction-states-zh-1440.029" font-family="Noto Serif CJK SC" font-size="35" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="76" y="2006.05">这份预览已经过时。</tspan></text><text id="interaction-states-zh-1440.030" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="76" y="2070.79">复制前审阅更新后的选择；旧文本应明确标示失效，不能悄悄继续使用。</tspan></text><path id="interaction-states-zh-1440.031" d="M76 2232 L1364 2232" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="interaction-states-zh-1440.032" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="76" y="2264.89">07 / 无法完成复制</tspan></text><text id="interaction-states-zh-1440.033" font-family="Noto Serif CJK SC" font-size="35" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="76" y="2336.05">未完成复制。</tspan></text><text id="interaction-states-zh-1440.034" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="76" y="2400.79">文字仍可选中。提供手动复制方式，不假装已经成功。</tspan></text><path id="interaction-states-zh-1440.035" d="M76 2562 L1364 2562" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="interaction-states-zh-1440.036" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="76" y="2594.89">08 / 图片加载失败与减少动态效果</tspan></text><text id="interaction-states-zh-1440.037" font-family="Noto Serif CJK SC" font-size="35" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="76" y="2666.05">构图仍然完整。</tspan></text><text id="interaction-states-zh-1440.038" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="76" y="2730.79">使用已固定的本地备用图，而非空白格子。减少动态效果时立即呈现最终构图。</tspan></text><path id="interaction-states-zh-1440.039" d="M76 2892 L1364 2892" fill="none" stroke="#dfe2dc" stroke-width="1"/></svg>