<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2141" viewBox="0 0 1440 2141"><title>PAIA — terms-en-1440 — design only</title><desc>Static authored design specification. Fictional examples; not implemented UI or product evidence.</desc><defs><filter id="paper-shadow" x="-45%" y="-35%" width="195%" height="200%"><feDropShadow dx="0" dy="15" stdDeviation="19" flood-color="#232e24" flood-opacity=".13"/></filter><filter id="source-shadow" x="-40%" y="-35%" width="180%" height="185%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#283127" flood-opacity=".09"/></filter><filter id="photo-shadow" x="-35%" y="-30%" width="170%" height="175%"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#283127" flood-opacity=".12"/></filter></defs><rect id="terms-en-1440.001" x="0" y="0" width="1440" height="2141" rx="0" fill="#fdfdfb"/><text id="terms-en-1440.002" font-family="EB Garamond 12" font-size="43" font-weight="400" font-style="normal" letter-spacing="1.2" text-anchor="start" fill="#171c19"><tspan x="76" y="55.69">PAIA</tspan></text><path id="terms-en-1440.003" d="M181 25 L181 57" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="terms-en-1440.004" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="197" y="39.38">Your AI context,</tspan><tspan x="197" y="56.38">for what’s next.</tspan></text><text id="terms-en-1440.005" font-family="Inter" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="475" y="44.79">Home</tspan></text><path id="terms-en-1440.006" d="M475 54 L511.4234375 54" fill="none" stroke="#808981" stroke-width="1.4"/><text id="terms-en-1440.007" font-family="Inter" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="553" y="44.79">How it works</tspan></text><text id="terms-en-1440.008" font-family="Inter" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="687" y="44.79">Use cases</tspan></text><text id="terms-en-1440.009" font-family="Inter" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="799" y="44.79">Our story</tspan></text><text id="terms-en-1440.010" font-family="Inter" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="909" y="44.79">Journal</tspan></text><rect id="terms-en-1440.011" x="1192" y="18" width="176" height="42" rx="21.0" fill="#343e35" stroke="#343e35" stroke-width=".8"/><text id="terms-en-1440.012" font-family="Inter" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#fdfdfb"><tspan x="1216" y="43.29">Get early access</tspan></text><path id="terms-en-1440.013" d="M1329 39.0h14m-5 -5 5 5-5 5" fill="none" stroke="#fdfdfb" stroke-width="1.2"/><text id="terms-en-1440.014" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="76" y="158.88">PAIA / LEGAL</tspan></text><text id="terms-en-1440.015" font-family="EB Garamond 12" font-size="66" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="504" y="270.78">Terms of use</tspan></text><text id="terms-en-1440.016" font-family="Inter" font-size="12" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="504" y="393.96">Policy substance and dates retained from the existing public page.</tspan></text><text id="terms-en-1440.017" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="76" y="485.88">ON THIS PAGE</tspan></text><text id="terms-en-1440.018" font-family="Inter" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="76" y="540.45">Principles</tspan><tspan x="76" y="579.45">Data use</tspan><tspan x="76" y="618.45">Your control</tspan><tspan x="76" y="657.45">Contact</tspan></text><text id="terms-en-1440.019" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="491.28">PAIA · PRIVATE BETA</tspan></text><text id="terms-en-1440.020" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="546.28">Terms</tspan></text><text id="terms-en-1440.021" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="601.28">Policy content last updated: 2026-09-10 · Presentation updated: 2026-09-26</tspan></text><text id="terms-en-1440.022" font-family="EB Garamond 12" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="504" y="665.41">1. Beta status</tspan></text><text id="terms-en-1440.023" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="719.28">PAIA is currently in private beta. Features, data structures, interfaces and support scope</tspan><tspan x="504" y="746.28">may change. Some capabilities may be unstable or temporarily unavailable.</tspan></text><text id="terms-en-1440.024" font-family="EB Garamond 12" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="504" y="810.41">2. User data</tspan></text><text id="terms-en-1440.025" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="864.28">Users retain the relevant rights in content they enter, edit and import. PAIA aims to make this</tspan><tspan x="504" y="891.28">material viewable, manageable and exportable, rather than create barriers by locking in user</tspan><tspan x="504" y="918.28">data.</tspan></text><text id="terms-en-1440.026" font-family="EB Garamond 12" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="504" y="982.41">3. Backups</tspan></text><text id="terms-en-1440.027" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="1036.28">During beta, do not use PAIA as the only copy of important data. Keep independent backups</tspan><tspan x="504" y="1063.28">of material that needs long-term preservation.</tspan></text><text id="terms-en-1440.028" font-family="EB Garamond 12" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="504" y="1127.41">4. Acceptable use</tspan></text><text id="terms-en-1440.029" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="1181.28">Do not use PAIA for unlawful activity, unauthorized data collection, violations of others’</tspan><tspan x="504" y="1208.28">privacy or intellectual property, or circumvention of third-party access and usage</tspan><tspan x="504" y="1235.28">restrictions.</tspan></text><text id="terms-en-1440.030" font-family="EB Garamond 12" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="504" y="1299.41">5. Third-party services</tspan></text><text id="terms-en-1440.031" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="1353.28">PAIA may work with browsers, AI services and other third-party platforms. PAIA does not</tspan><tspan x="504" y="1380.28">control their availability, terms or technical changes, which may require changes to related</tspan><tspan x="504" y="1407.28">features.</tspan></text><text id="terms-en-1440.032" font-family="EB Garamond 12" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="504" y="1471.41">6. Availability and limitations</tspan></text><text id="terms-en-1440.033" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="1525.28">The beta is provided in its current state, without a promise of continuous, error-free or</tspan><tspan x="504" y="1552.28">permanent availability. The product seeks to reduce data risks, but users should keep</tspan><tspan x="504" y="1579.28">independent backups of important material.</tspan></text><text id="terms-en-1440.034" font-family="EB Garamond 12" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="504" y="1643.41">7. Contact</tspan></text><text id="terms-en-1440.035" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="1697.28">For policy, beta or application-deletion questions, contact haohongfei2001@gmail.com.</tspan></text><path id="terms-en-1440.036" d="M76 1809 L1364 1809" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="terms-en-1440.037" font-family="EB Garamond 12" font-size="43" font-weight="400" font-style="normal" letter-spacing="1.2" text-anchor="start" fill="#171c19"><tspan x="76" y="1882.69">PAIA</tspan></text><text id="terms-en-1440.038" font-family="Inter" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="76" y="1920.45">Your thinking has a longer tomorrow.</tspan></text><text id="terms-en-1440.039" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="710" y="1861.88">EXPLORE</tspan></text><text id="terms-en-1440.040" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="710" y="1902.38">How it works</tspan></text><text id="terms-en-1440.041" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="710" y="1931.38">Use cases</tspan></text><text id="terms-en-1440.042" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="710" y="1960.38">Explore an example</tspan></text><text id="terms-en-1440.043" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="940" y="1861.88">PERSPECTIVES</tspan></text><text id="terms-en-1440.044" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="940" y="1902.38">Our story</tspan></text><text id="terms-en-1440.045" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="940" y="1931.38">Journal</tspan></text><text id="terms-en-1440.046" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="940" y="1960.38">Get early access</tspan></text><text id="terms-en-1440.047" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="1170" y="1861.88">TRUST</tspan></text><text id="terms-en-1440.048" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="1170" y="1902.38">Your data</tspan></text><text id="terms-en-1440.049" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="1170" y="1931.38">Current status</tspan></text><text id="terms-en-1440.050" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="1170" y="1960.38">Privacy · Terms</tspan></text><text id="terms-en-1440.051" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="1170" y="1989.38">Contact</tspan></text><path id="terms-en-1440.052" d="M76 2053 L1364 2053" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="terms-en-1440.053" font-family="Inter" font-size="10.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="76" y="2086.72">© 2026 PAIA · Private beta</tspan></text><text id="terms-en-1440.054" font-family="Inter" font-size="11" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="end" fill="#707975"><tspan x="1364" y="2087.13">EN   /   中文</tspan></text><text id="terms-en-1440.055" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="76" y="2112.89">Photography credits · Illustrative material, not a live archive</tspan></text></svg>