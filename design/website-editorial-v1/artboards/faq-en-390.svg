<svg xmlns="http://www.w3.org/2000/svg" width="390" height="4005.15" viewBox="0 0 390 4005.15"><title>PAIA — faq-en-390 — design only</title><desc>Static authored design specification. Fictional examples; not implemented UI or product evidence.</desc><defs><filter id="paper-shadow" x="-45%" y="-35%" width="195%" height="200%"><feDropShadow dx="0" dy="15" stdDeviation="19" flood-color="#232e24" flood-opacity=".13"/></filter><filter id="source-shadow" x="-40%" y="-35%" width="180%" height="185%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#283127" flood-opacity=".09"/></filter><filter id="photo-shadow" x="-35%" y="-30%" width="170%" height="175%"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#283127" flood-opacity=".12"/></filter></defs><rect id="faq-en-390.001" x="0" y="0" width="390" height="4005.15" rx="0" fill="#fdfdfb"/><text id="faq-en-390.002" font-family="EB Garamond 12" font-size="34" font-weight="400" font-style="normal" letter-spacing="1.2" text-anchor="start" fill="#171c19"><tspan x="24" y="50.22">PAIA</tspan></text><rect id="faq-en-390.003" x="203" y="22" width="127" height="39" rx="19.5" fill="#343e35" stroke="#343e35" stroke-width=".8"/><text id="faq-en-390.004" font-family="Inter" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#fdfdfb"><tspan x="227" y="45.79">Join beta</tspan></text><path id="faq-en-390.005" d="M291 41.5h14m-5 -5 5 5-5 5" fill="none" stroke="#fdfdfb" stroke-width="1.2"/><path id="faq-en-390.006" d="M350 34 L369 34" fill="none" stroke="#171c19" stroke-width="1"/><path id="faq-en-390.007" d="M350 43 L369 43" fill="none" stroke="#171c19" stroke-width="1"/><text id="faq-en-390.008" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="119.89">QUESTIONS / ANSWERS</tspan></text><text id="faq-en-390.009" font-family="EB Garamond 12" font-size="44" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="195.52">A few things</tspan><tspan x="24" y="244.52">worth knowing.</tspan></text><text id="faq-en-390.010" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="300.28">What PAIA keeps, what you control, and</tspan><tspan x="24" y="323.48">what the beta does not promise.</tspan></text><path id="faq-en-390.011" d="M24 403.4 L366 403.4" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="faq-en-390.012" font-family="EB Garamond 12" font-size="25" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="451.15">What does PAIA keep?</tspan></text><text id="faq-en-390.013" font-family="Inter" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="502.85">PAIA focuses on your own submitted inputs</tspan><tspan x="24" y="524.60">and the provenance needed to revisit them. It</tspan><tspan x="24" y="546.35">is not a promise to copy every assistant reply</tspan><tspan x="24" y="568.10">or every file.</tspan></text><path id="faq-en-390.014" d="M24 624.4 L366 624.4" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="faq-en-390.015" font-family="EB Garamond 12" font-size="25" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="672.15">Do I need to organize everything?</tspan></text><text id="faq-en-390.016" font-family="Inter" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="723.85">No. Reading, finding, editing and copying</tspan><tspan x="24" y="745.60">useful words should already be valuable.</tspan><tspan x="24" y="767.35">Topics and optional AI organization are ways</tspan><tspan x="24" y="789.10">to go further, not admission requirements.</tspan></text><path id="faq-en-390.017" d="M24 845.4 L366 845.4" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="faq-en-390.018" font-family="EB Garamond 12" font-size="25" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="893.15">Does everything get sent to AI?</tspan></text><text id="faq-en-390.019" font-family="Inter" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="944.85">No. Ordinary archive use is local-first.</tspan><tspan x="24" y="966.60">Optional external AI processing and context</tspan><tspan x="24" y="988.35">reuse are separate, explicit actions with their</tspan><tspan x="24" y="1010.10">own boundaries.</tspan></text><path id="faq-en-390.020" d="M24 1066.4 L366 1066.4" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="faq-en-390.021" font-family="EB Garamond 12" font-size="25" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="1114.15">Which platforms can I use today?</tspan></text><text id="faq-en-390.022" font-family="Inter" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1165.85">The current invitation-only beta is a Chrome</tspan><tspan x="24" y="1187.60">extension with consented ChatGPT input</tspan><tspan x="24" y="1209.35">capture. Other providers, mobile apps and an</tspan><tspan x="24" y="1231.10">external AI-reader connector are not</tspan><tspan x="24" y="1252.85">promised as available installations.</tspan></text><path id="faq-en-390.023" d="M24 1309.15 L366 1309.15" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="faq-en-390.024" font-family="EB Garamond 12" font-size="25" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="1356.90">Why use this alongside chat</tspan><tspan x="24" y="1389.90">history?</tspan></text><text id="faq-en-390.025" font-family="Inter" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1441.60">PAIA is a separate working layer for your own</tspan><tspan x="24" y="1463.35">words: revisit, edit, trace the original and</tspan><tspan x="24" y="1485.10">select what to reuse. It can help even when</tspan><tspan x="24" y="1506.85">you use only one AI product.</tspan></text><path id="faq-en-390.026" d="M24 1563.15 L366 1563.15" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="faq-en-390.027" font-family="EB Garamond 12" font-size="25" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="1610.90">Can I change the wording?</tspan></text><text id="faq-en-390.028" font-family="Inter" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1662.60">You can work with an editable version without</tspan><tspan x="24" y="1684.35">making today’s changes look like yesterday’s</tspan><tspan x="24" y="1706.10">original expression. The original and the</tspan><tspan x="24" y="1727.85">working version have different roles.</tspan></text><path id="faq-en-390.029" d="M24 1784.15 L366 1784.15" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="faq-en-390.030" font-family="EB Garamond 12" font-size="25" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="1831.90">Is this a backup of my entire AI</tspan><tspan x="24" y="1864.90">account?</tspan></text><text id="faq-en-390.031" font-family="Inter" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1916.60">No. Capture, supported history import and</tspan><tspan x="24" y="1938.35">PAIA backup have different scopes. The beta</tspan><tspan x="24" y="1960.10">does not promise complete recovery of an</tspan><tspan x="24" y="1981.85">external AI account.</tspan></text><path id="faq-en-390.032" d="M24 2038.15 L366 2038.15" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="faq-en-390.033" font-family="EB Garamond 12" font-size="25" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="2085.90">Does local-first mean no network</tspan><tspan x="24" y="2118.90">traffic?</tspan></text><text id="faq-en-390.034" font-family="Inter" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2170.60">No. The website is hosted online, the beta</tspan><tspan x="24" y="2192.35">application uses a disclosed forwarding</tspan><tspan x="24" y="2214.10">service, and optional external AI has a</tspan><tspan x="24" y="2235.85">separate network boundary. Local-first is not</tspan><tspan x="24" y="2257.60">an encryption certification.</tspan></text><path id="faq-en-390.035" d="M24 2313.9 L366 2313.9" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="faq-en-390.036" font-family="EB Garamond 12" font-size="25" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="2361.65">Is a copied passage one of my</tspan><tspan x="24" y="2394.65">beliefs?</tspan></text><text id="faq-en-390.037" font-family="Inter" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2446.35">Not necessarily. It might be a quotation, a job</tspan><tspan x="24" y="2468.10">description, a draft, a question or a role-play.</tspan><tspan x="24" y="2489.85">PAIA should preserve that distinction instead</tspan><tspan x="24" y="2511.60">of inventing a personal profile.</tspan></text><path id="faq-en-390.038" d="M24 2567.9 L366 2567.9" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="faq-en-390.039" font-family="EB Garamond 12" font-size="25" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="2615.65">Can PAIA recall something I sent</tspan><tspan x="24" y="2648.65">elsewhere?</tspan></text><text id="faq-en-390.040" font-family="Inter" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2700.35">No. PAIA can stop future access that it</tspan><tspan x="24" y="2722.10">controls, but cannot recall a copy you have</tspan><tspan x="24" y="2743.85">already sent to another system or exported.</tspan></text><path id="faq-en-390.041" d="M24 2800.15 L366 2800.15" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="faq-en-390.042" font-family="EB Garamond 12" font-size="25" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="2847.90">Is the website example my actual</tspan><tspan x="24" y="2880.90">archive?</tspan></text><text id="faq-en-390.043" font-family="Inter" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2932.60">No. It uses fictional material. It does not</tspan><tspan x="24" y="2954.35">connect to your archive or run a live AI model.</tspan><tspan x="24" y="2976.10">Refreshing clears temporary example</tspan><tspan x="24" y="2997.85">changes.</tspan></text><path id="faq-en-390.044" d="M24 3054.15 L366 3054.15" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="faq-en-390.045" font-family="EB Garamond 12" font-size="25" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="3101.90">How do I get access?</tspan></text><text id="faq-en-390.046" font-family="Inter" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="3153.60">Apply for the invitation-only private beta.</tspan><tspan x="24" y="3175.35">Submitting a form is not an installation,</tspan><tspan x="24" y="3197.10">admission decision or verified email-delivery</tspan><tspan x="24" y="3218.85">receipt.</tspan></text><path id="faq-en-390.047" d="M24 3305.15 L366 3305.15" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="faq-en-390.048" font-family="EB Garamond 12" font-size="36" font-weight="400" font-style="normal" letter-spacing="1.2" text-anchor="start" fill="#171c19"><tspan x="24" y="3373.03">PAIA</tspan></text><text id="faq-en-390.049" font-family="Inter" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="3416.60">Your thinking has a longer tomorrow.</tspan></text><text id="faq-en-390.050" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="3489.04">EXPLORE</tspan></text><text id="faq-en-390.051" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="3529.53">How it works</tspan></text><text id="faq-en-390.052" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="3558.53">Use cases</tspan></text><text id="faq-en-390.053" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="3587.53">Explore an example</tspan></text><text id="faq-en-390.054" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="204" y="3489.04">PERSPECTIVES</tspan></text><text id="faq-en-390.055" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="204" y="3529.53">Our story</tspan></text><text id="faq-en-390.056" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="204" y="3558.53">Journal</tspan></text><text id="faq-en-390.057" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="204" y="3587.53">Get early access</tspan></text><text id="faq-en-390.058" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="3665.04">TRUST</tspan></text><text id="faq-en-390.059" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="3705.53">Your data</tspan></text><text id="faq-en-390.060" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="3734.53">Current status</tspan></text><text id="faq-en-390.061" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="3763.53">Privacy · Terms</tspan></text><text id="faq-en-390.062" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="3792.53">Contact</tspan></text><path id="faq-en-390.063" d="M24 3875.15 L366 3875.15" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="faq-en-390.064" font-family="Inter" font-size="10.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="24" y="3908.87">© 2026 PAIA · Private beta</tspan></text><text id="faq-en-390.065" font-family="Inter" font-size="11" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="end" fill="#707975"><tspan x="366" y="3909.28">EN   /   中文</tspan></text><text id="faq-en-390.066" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="24" y="3935.04">Photography credits · Illustrative material, not a live archive</tspan></text></svg>