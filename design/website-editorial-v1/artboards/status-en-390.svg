009" font-family="EB Garamond 12" font-size="44" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="195.52">An honest picture</tspan><tspan x="24" y="244.52">of where PAIA is.</tspan></text><text id="status-en-390.010" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="300.28">A design intention, an implemented feature</tspan><tspan x="24" y="323.48">and a release are not the same thing.</tspan></text><path id="status-en-390.011" d="M24 403.4 L366 403.4" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="status-en-390.012" font-family="EB Garamond 12" font-size="24" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="452.32">Invitation-only Chrome beta</tspan></text><text id="status-en-390.013" font-family="Inter" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="486.11">Current access model</tspan></text><path id="status-en-390.014" d="M24 549.3199999999999 L366 549.3199999999999" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="status-en-390.015" font-family="EB Garamond 12" font-size="24" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="598.24">Consented ChatGPT input capture</tspan></text><text id="status-en-390.016" font-family="Inter" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="632.03">Current beta scope</tspan></text><path id="status-en-390.017" d="M24 695.24 L366 695.24" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="status-en-390.018" font-family="EB Garamond 12" font-size="24" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="744.16">Readable, editable archive;