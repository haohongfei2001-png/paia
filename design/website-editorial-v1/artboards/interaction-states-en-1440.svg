<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="3030" viewBox="0 0 1440 3030"><title>PAIA — interaction-states-en-1440 — design only</title><desc>Static authored design specification. Fictional examples; not implemented UI or product evidence.</desc><defs><filter id="paper-shadow" x="-45%" y="-35%" width="195%" height="200%"><feDropShadow dx="0" dy="15" stdDeviation="19" flood-color="#232e24" flood-opacity=".13"/></filter><filter id="source-shadow" x="-40%" y="-35%" width="180%" height="185%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#283127" flood-opacity=".09"/></filter><filter id="photo-shadow" x="-35%" y="-30%" width="170%" height="175%"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#283127" flood-opacity=".12"/></filter></defs><rect id="interaction-states-en-1440.001" x="0" y="0" width="1440" height="3030" rx="0" fill="#fdfdfb"/><text id="interaction-states-en-1440.002" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="76" y="49.88">PAIA / INTERACTION SPECIMENS</tspan></text><text id="interaction-states-en-1440.003" font-family="EB Garamond 12" font-size="65" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="76" y="152.95">The quiet details</tspan><tspan x="76" y="221.95">are part of the design.</tspan></text><text id="interaction-states-en-1440.004" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="76" y="284.88">01 / REST, HOVER, KEYBOARD FOCUS</tspan></text><rect id="interaction-states-en-1440.005" x="76" y="326" width="208" height="56" rx="28.0" fill="#343e35" stroke="#343e35" stroke-width=".8"/><text id="interaction-states-en-1440.006" font-family="Inter" font-size="15.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#fdfdfb"><tspan x="100" y="359.12">Get early access</tspan></text><path id="interaction-states-en-1440.007" d="M245 354.0h14m-5 -5 5 5-5 5" fill="none" stroke="#fdfdfb" stroke-width="1.2"/><rect id="interaction-states-en-1440.008" x="71" y="321" width="218" height="66" rx="33" fill="none" stroke="#536b54" stroke-width=".8"/><text id="interaction-states-en-1440.009" font-family="Inter" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="76" y="429.79">2 px focus ring, 4 px offset. Hover lifts 2 px; no geometry shift.</tspan></text><path id="interaction-states-en-1440.010" d="M76 582 L1364 582" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="interaction-states-en-1440.011" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="76" y="614.88">02 / NAVIGATION, OPEN</tspan></text><text id="interaction-states-en-1440.012" font-family="EB Garamond 12" font-size="30" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="76" y="674.90">Home    /    How it works    /    Use cases</tspan><tspan x="76" y="713.90">Our story    /    Journal    /    Your data</tspan></text><text id="interaction-states-en-1440.013" font-family="Inter" font-size="12" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="76" y="770.96">Escape closes; focus returns to the menu control. No off-screen links.</tspan></text><path id="interaction-states-en-1440.014" d="M76 912 L1364 912" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="interaction-states-en-1440.015" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="76" y="944.88">03 / FAQ, OPEN</tspan></text><text id="interaction-states-en-1440.016" font-family="EB Garamond 12" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="76" y="1002.41">Does everything get sent to AI?</tspan></text><text id="interaction-states-en-1440.017" font-family="Inter" font-size="14" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="76" y="1043.62">No. Ordinary archive use is local-first. Optional external AI processing and context reuse are separate, explicit actions with their own</tspan><tspan x="76" y="1063.92">boundaries.</tspan></text><path id="interaction-states-en-1440.018" d="M76 1242 L1364 1242" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="interaction-states-en-1440.019" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="76" y="1274.88">04 / FORM, NEEDS ATTENTION</tspan></text><rect id="interaction-states-en-1440.020" x="76" y="1314" width="470" height="54" rx="3" fill="#fdfdfb" stroke="#8c5748" stroke-width=".8"/><text id="interaction-states-en-1440.021" font-family="Inter" font-size="14" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#854d40"><tspan x="91" y="1342.62">Please enter a valid email address.</tspan></text><text id="interaction-states-en-1440.022" font-family="Inter" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="76" y="1403.79">Keep the text entered. Focus the error summary. Never auto-submit consent.</tspan></text><path id="interaction-states-en-1440.023" d="M76 1572 L1364 1572" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="interaction-states-en-1440.024" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="76" y="1604.88">05 / NOTHING SELECTED</tspan></text><text id="interaction-states-en-1440.025" font-family="EB Garamond 12" font-size="35" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="76" y="1676.05">Select material to prepare context.</tspan></text><text id="interaction-states-en-1440.026" font-family="Inter" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="76" y="1740.79">No automatic replacement. Preview and copy are unavailable.</tspan></text><path id="interaction-states-en-1440.027" d="M76 1902 L1364 1902" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="interaction-states-en-1440.028" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="76" y="1934.88">06 / CHANGED MATERIAL, STALE PREVIEW</tspan></text><text id="interaction-states-en-1440.029" font-family="EB Garamond 12" font-size="35" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="76" y="2006.05">This preview is out of date.</tspan></text><text id="interaction-states-en-1440.030" font-family="Inter" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="76" y="2070.79">Review the updated selection before copying. Keep the previous text visibly marked, not silently actionable.</tspan></text><path id="interaction-states-en-1440.031" d="M76 2232 L1364 2232" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="interaction-states-en-1440.032" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="76" y="2264.89">07 / COPY NOT AVAILABLE</tspan></text><text id="interaction-states-en-1440.033" font-family="EB Garamond 12" font-size="35" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="76" y="2336.05">Copy was not completed.</tspan></text><text id="interaction-states-en-1440.034" font-family="Inter" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="76" y="2400.79">The text remains selectable. Offer manual copying without pretending success.</tspan></text><path id="interaction-states-en-1440.035" d="M76 2562 L1364 2562" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="interaction-states-en-1440.036" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="76" y="2594.89">08 / IMAGE FAILURE &amp; REDUCED MOTION</tspan></text><text id="interaction-states-en-1440.037" font-family="EB Garamond 12" font-size="35" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="76" y="2666.05">The composition remains.</tspan></text><text id="interaction-states-en-1440.038" font-family="Inter" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="76" y="2730.79">Use the pinned local fallback image, not a blank grid cell. Reduced motion shows the final composition immediately.</tspan></text><path id="interaction-states-en-1440.039" d="M76 2892 L1364 2892" fill="none" stroke="#dfe2dc" stroke-width="1"/></svg>