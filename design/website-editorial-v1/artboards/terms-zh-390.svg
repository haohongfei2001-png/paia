<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2518" viewBox="0 0 390 2518"><title>PAIA — terms-zh-390 — design only</title><desc>Static authored design specification. Fictional examples; not implemented UI or product evidence.</desc><defs><filter id="paper-shadow" x="-45%" y="-35%" width="195%" height="200%"><feDropShadow dx="0" dy="15" stdDeviation="19" flood-color="#232e24" flood-opacity=".13"/></filter><filter id="source-shadow" x="-40%" y="-35%" width="180%" height="185%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#283127" flood-opacity=".09"/></filter><filter id="photo-shadow" x="-35%" y="-30%" width="170%" height="175%"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#283127" flood-opacity=".12"/></filter></defs><rect id="terms-zh-390.001" x="0" y="0" width="390" height="2518" rx="0" fill="#fdfdfb"/><text id="terms-zh-390.002" font-family="Noto Serif CJK SC" font-size="34" font-weight="400" font-style="normal" letter-spacing="1.2" text-anchor="start" fill="#171c19"><tspan x="24" y="50.22">PAIA</tspan></text><rect id="terms-zh-390.003" x="203" y="22" width="127" height="39" rx="19.5" fill="#343e35" stroke="#343e35" stroke-width=".8"/><text id="terms-zh-390.004" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#fdfdfb"><tspan x="227" y="45.79">申请内测</tspan></text><path id="terms-zh-390.005" d="M291 41.5h14m-5 -5 5 5-5 5" fill="none" stroke="#fdfdfb" stroke-width="1.2"/><path id="terms-zh-390.006" d="M350 34 L369 34" fill="none" stroke="#171c19" stroke-width="1"/><path id="terms-zh-390.007" d="M350 43 L369 43" fill="none" stroke="#171c19" stroke-width="1"/><text id="terms-zh-390.008" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="128.88">PAIA / 法律说明</tspan></text><text id="terms-zh-390.009" font-family="Noto Serif CJK SC" font-size="48" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="225.84">使用条款</tspan></text><text id="terms-zh-390.010" font-family="Noto Sans CJK SC" font-size="12" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="24" y="322.96">保留现有公开页面的政策内容与日期。</tspan></text><text id="terms-zh-390.011" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="420.28">PAIA · PRIVATE BETA</tspan></text><text id="terms-zh-390.012" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="475.28">政策内容最后更新: 2026-09-10 · 页面呈现更新</tspan><tspan x="24" y="502.28">: 2026-09-26</tspan></text><text id="terms-zh-390.013" font-family="Noto Serif CJK SC" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="566.41">1. Beta 状态</tspan></text><text id="terms-zh-390.014" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="620.28">PAIA 当前处于 Private Beta。功能、数据结构</tspan><tspan x="24" y="647.28">、界面和支持范围可能持续变化，部分能力可</tspan><tspan x="24" y="674.28">能不稳定或暂时不可用。</tspan></text><text id="terms-zh-390.015" font-family="Noto Serif CJK SC" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="738.41">2. 用户数据</tspan></text><text id="terms-zh-390.016" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="792.28">用户对自己输入、编辑和导入的内容保留相应</tspan><tspan x="24" y="819.28">权利。PAIA 的产品目标是让这些内容保持可查</tspan><tspan x="24" y="846.28">看、可管理和可导出，而不是通过锁定用户数</tspan><tspan x="24" y="873.28">据建立使用门槛。</tspan></text><text id="terms-zh-390.017" font-family="Noto Serif CJK SC" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="937.41">3. 备份责任</tspan></text><text id="terms-zh-390.018" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="991.28">在 Beta 阶段，用户不应把 PAIA 作为自己重要</tspan><tspan x="24" y="1018.28">数据的唯一副本。对于需要长期保存的内容，</tspan><tspan x="24" y="1045.28">请同时保留独立备份。</tspan></text><text id="terms-zh-390.019" font-family="Noto Serif CJK SC" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="1109.41">4. 合理使用</tspan></text><text id="terms-zh-390.020" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1163.28">请勿利用 PAIA 进行违法活动、未经授权的数据</tspan><tspan x="24" y="1190.28">收集、侵犯他人隐私或知识产权，或规避第三</tspan><tspan x="24" y="1217.28">方平台的访问和使用限制。</tspan></text><text id="terms-zh-390.021" font-family="Noto Serif CJK SC" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="1281.41">5. 第三方服务</tspan></text><text id="terms-zh-390.022" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1335.28">PAIA 可能与浏览器、AI 服务或其他第三方平台</tspan><tspan x="24" y="1362.28">配合使用。第三方服务的可用性、条款和技术</tspan><tspan x="24" y="1389.28">变化不由 PAIA 控制，相关功能可能因此调整。</tspan></text><text id="terms-zh-390.023" font-family="Noto Serif CJK SC" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="1453.41">6. 可用性与责任边界</tspan></text><text id="terms-zh-390.024" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1507.28">Beta 版本按当前状态提供，不承诺持续、无错</tspan><tspan x="24" y="1534.28">误或永久可用。产品会尽力降低数据风险，但</tspan><tspan x="24" y="1561.28">用户仍应为重要资料保留独立备份。</tspan></text><text id="terms-zh-390.025" font-family="Noto Serif CJK SC" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="1625.41">7. 联系</tspan></text><text id="terms-zh-390.026" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1679.28">有关本政策、Beta 或申请信息删除的问题，请</tspan><tspan x="24" y="1706.28">联系 haohongfei2001@gmail.com。</tspan></text><path id="terms-zh-390.027" d="M24 1818 L366 1818" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="terms-zh-390.028" font-family="Noto Serif CJK SC" font-size="36" font-weight="400" font-style="normal" letter-spacing="1.2" text-anchor="start" fill="#171c19"><tspan x="24" y="1885.88">PAIA</tspan></text><text id="terms-zh-390.029" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1929.45">让你的思考，拥有更长的明天。</tspan></text><text id="terms-zh-390.030" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="2001.88">探索</tspan></text><text id="terms-zh-390.031" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2042.38">使用方式</tspan></text><text id="terms-zh-390.032" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2071.38">使用场景</tspan></text><text id="terms-zh-390.033" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2100.38">体验示例</tspan></text><text id="terms-zh-390.034" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="204" y="2001.88">观点</tspan></text><text id="terms-zh-390.035" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="204" y="2042.38">我们的故事</tspan></text><text id="terms-zh-390.036" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="204" y="2071.38">手记</tspan></text><text id="terms-zh-390.037" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="204" y="2100.38">申请内测</tspan></text><text id="terms-zh-390.038" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="2177.89">信任</tspan></text><text id="terms-zh-390.039" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2218.38">你的数据</tspan></text><text id="terms-zh-390.040" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2247.38">当前状态</tspan></text><text id="terms-zh-390.041" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2276.38">隐私 · 条款</tspan></text><text id="terms-zh-390.042" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2305.38">联系</tspan></text><path id="terms-zh-390.043" d="M24 2388 L366 2388" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="terms-zh-390.044" font-family="Noto Sans CJK SC" font-size="10.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="24" y="2421.72">© 2026 PAIA · 内测阶段</tspan></text><text id="terms-zh-390.045" font-family="Noto Sans CJK SC" font-size="11" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="end" fill="#707975"><tspan x="366" y="2422.13">EN   /   中文</tspan></text><text id="terms-zh-390.046" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="24" y="2447.89">摄影署名 · 所有材料均为示例，并非真实档案</tspan></text></svg>