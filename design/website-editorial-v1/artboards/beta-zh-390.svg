<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2125" viewBox="0 0 390 2125"><title>PAIA — beta-zh-390 — design only</title><desc>Static authored design specification. Fictional examples; not implemented UI or product evidence.</desc><defs><filter id="paper-shadow" x="-45%" y="-35%" width="195%" height="200%"><feDropShadow dx="0" dy="15" stdDeviation="19" flood-color="#232e24" flood-opacity=".13"/></filter><filter id="source-shadow" x="-40%" y="-35%" width="180%" height="185%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#283127" flood-opacity=".09"/></filter><filter id="photo-shadow" x="-35%" y="-30%" width="170%" height="175%"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#283127" flood-opacity=".12"/></filter></defs><rect id="beta-zh-390.001" x="0" y="0" width="390" height="2125" rx="0" fill="#fdfdfb"/><text id="beta-zh-390.002" font-family="Noto Serif CJK SC" font-size="34" font-weight="400" font-style="normal" letter-spacing="1.2" text-anchor="start" fill="#171c19"><tspan x="24" y="50.22">PAIA</tspan></text><rect id="beta-zh-390.003" x="203" y="22" width="127" height="39" rx="19.5" fill="#343e35" stroke="#343e35" stroke-width=".8"/><text id="beta-zh-390.004" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#fdfdfb"><tspan x="227" y="45.79">申请内测</tspan></text><path id="beta-zh-390.005" d="M291 41.5h14m-5 -5 5 5-5 5" fill="none" stroke="#fdfdfb" stroke-width="1.2"/><path id="beta-zh-390.006" d="M350 34 L369 34" fill="none" stroke="#171c19" stroke-width="1"/><path id="beta-zh-390.007" d="M350 43 L369 43" fill="none" stroke="#171c19" stroke-width="1"/><text id="beta-zh-390.008" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="126.89">内测 / 一份邀请</tspan></text><text id="beta-zh-390.009" font-family="Noto Serif CJK SC" font-size="42" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="205.86">多一点连贯，</tspan><tspan x="24" y="252.86">从这里开始。</tspan></text><text id="beta-zh-390.010" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="313.28">PAIA 目前是邀请制 Chrome 扩展内测。申请参</tspan><tspan x="24" y="339.68">与，一起探索怎样更好地使用自己的表达。</tspan></text><text id="beta-zh-390.011" font-family="Noto Serif CJK SC" font-size="32" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="531.56">申请内测邀请</tspan></text><text id="beta-zh-390.012" font-family="Noto Sans CJK SC" font-size="13.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="590.21">邮箱 *</tspan></text><rect id="beta-zh-390.013" x="24" y="609" width="342" height="53" rx="3" fill="#fdfdfb" stroke="#b8c0b6" stroke-width=".8"/><text id="beta-zh-390.014" font-family="Noto Sans CJK SC" font-size="14" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="40" y="637.62">you@example.com</tspan></text><text id="beta-zh-390.015" font-family="Noto Sans CJK SC" font-size="13.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="702.21">你最想重新接上的是什么？</tspan></text><rect id="beta-zh-390.016" x="24" y="721" width="342" height="118" rx="3" fill="#fdfdfb" stroke="#b8c0b6" stroke-width=".8"/><text id="beta-zh-390.017" font-family="Noto Sans CJK SC" font-size="14" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="40" y="749.62">一个长期项目、一个问题、一次选择……</tspan></text><text id="beta-zh-390.018" font-family="Noto Sans CJK SC" font-size="12" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="24" y="877.96">第二项为选填。请勿填写私人档案正文或敏感信息。</tspan></text><rect id="beta-zh-390.019" x="24" y="955" width="18" height="18" rx="2" fill="#fdfdfb" stroke="#8d978e" stroke-width=".8"/><text id="beta-zh-390.020" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="56" y="963.38">我同意由 FormSubmit 将填写的信息转发给 PAIA 项目</tspan><tspan x="56" y="983.38">联系人，用于内测招募与联系。</tspan></text><rect id="beta-zh-390.021" x="24" y="1025" width="233" height="56" rx="28.0" fill="#343e35" stroke="#343e35" stroke-width=".8"/><text id="beta-zh-390.022" font-family="Noto Sans CJK SC" font-size="15.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#fdfdfb"><tspan x="48" y="1058.12">申请内测邀请</tspan></text><path id="beta-zh-390.023" d="M218 1053.0h14m-5 -5 5 5-5 5" fill="none" stroke="#fdfdfb" stroke-width="1.2"/><text id="beta-zh-390.024" font-family="Noto Sans CJK SC" font-size="11.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="24" y="1116.55">提交不代表获得资格，也不代表已经核验送达。隐私说明  →</tspan></text><text id="beta-zh-390.025" font-family="Noto Sans CJK SC" font-size="11" font-weight="400" font-style="normal" letter-spacing="2" text-anchor="start" fill="#707975"><tspan x="24" y="1279.13">当前范围</tspan></text><text id="beta-zh-390.026" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1322.45">Chrome + 经同意捕获 ChatGPT 输入。</tspan><tspan x="24" y="1347.20">不承诺移动端安装或接入全部 AI 平台。</tspan></text><path id="beta-zh-390.027" d="M24 1410 L366 1410" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="beta-zh-390.028" font-family="Noto Serif CJK SC" font-size="36" font-weight="400" font-style="normal" letter-spacing="1.2" text-anchor="start" fill="#171c19"><tspan x="24" y="1477.88">PAIA</tspan></text><text id="beta-zh-390.029" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1521.45">让你的思考，拥有更长的明天。</tspan></text><text id="beta-zh-390.030" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="1593.88">探索</tspan></text><text id="beta-zh-390.031" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1634.38">使用方式</tspan></text><text id="beta-zh-390.032" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1663.38">使用场景</tspan></text><text id="beta-zh-390.033" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1692.38">体验示例</tspan></text><text id="beta-zh-390.034" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="204" y="1593.88">观点</tspan></text><text id="beta-zh-390.035" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="204" y="1634.38">我们的故事</tspan></text><text id="beta-zh-390.036" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="204" y="1663.38">手记</tspan></text><text id="beta-zh-390.037" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="204" y="1692.38">申请内测</tspan></text><text id="beta-zh-390.038" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="1769.88">信任</tspan></text><text id="beta-zh-390.039" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1810.38">你的数据</tspan></text><text id="beta-zh-390.040" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1839.38">当前状态</tspan></text><text id="beta-zh-390.041" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1868.38">隐私 · 条款</tspan></text><text id="beta-zh-390.042" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1897.38">联系</tspan></text><path id="beta-zh-390.043" d="M24 1980 L366 1980" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="beta-zh-390.044" font-family="Noto Sans CJK SC" font-size="10.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="24" y="2013.71">© 2026 PAIA · 内测阶段</tspan></text><text id="beta-zh-390.045" font-family="Noto Sans CJK SC" font-size="11" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="end" fill="#707975"><tspan x="366" y="2014.13">EN   /   中文</tspan></text><text id="beta-zh-390.046" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="24" y="2039.88">摄影署名 · 所有材料均为示例，并非真实档案</tspan></text></svg>