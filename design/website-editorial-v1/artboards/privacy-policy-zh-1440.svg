<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2169" viewBox="0 0 1440 2169"><title>PAIA — privacy-policy-zh-1440 — design only</title><desc>Static authored design specification. Fictional examples; not implemented UI or product evidence.</desc><defs><filter id="paper-shadow" x="-45%" y="-35%" width="195%" height="200%"><feDropShadow dx="0" dy="15" stdDeviation="19" flood-color="#232e24" flood-opacity=".13"/></filter><filter id="source-shadow" x="-40%" y="-35%" width="180%" height="185%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#283127" flood-opacity=".09"/></filter><filter id="photo-shadow" x="-35%" y="-30%" width="170%" height="175%"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#283127" flood-opacity=".12"/></filter></defs><rect id="privacy-policy-zh-1440.001" x="0" y="0" width="1440" height="2169" rx="0" fill="#fdfdfb"/><text id="privacy-policy-zh-1440.002" font-family="Noto Serif CJK SC" font-size="43" font-weight="400" font-style="normal" letter-spacing="1.2" text-anchor="start" fill="#171c19"><tspan x="76" y="55.69">PAIA</tspan></text><path id="privacy-policy-zh-1440.003" d="M181 25 L181 57" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="privacy-policy-zh-1440.004" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="197" y="39.38">你的 AI 上下文，</tspan><tspan x="197" y="56.38">也是下一步的起点。</tspan></text><text id="privacy-policy-zh-1440.005" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="475" y="44.79">首页</tspan></text><path id="privacy-policy-zh-1440.006" d="M475 54 L511.58125 54" fill="none" stroke="#808981" stroke-width="1.4"/><text id="privacy-policy-zh-1440.007" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="553" y="44.79">使用方式</tspan></text><text id="privacy-policy-zh-1440.008" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="687" y="44.79">使用场景</tspan></text><text id="privacy-policy-zh-1440.009" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="799" y="44.79">我们的故事</tspan></text><text id="privacy-policy-zh-1440.010" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="909" y="44.79">手记</tspan></text><rect id="privacy-policy-zh-1440.011" x="1192" y="18" width="176" height="42" rx="21.0" fill="#343e35" stroke="#343e35" stroke-width=".8"/><text id="privacy-policy-zh-1440.012" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#fdfdfb"><tspan x="1216" y="43.29">申请内测</tspan></text><path id="privacy-policy-zh-1440.013" d="M1329 39.0h14m-5 -5 5 5-5 5" fill="none" stroke="#fdfdfb" stroke-width="1.2"/><text id="privacy-policy-zh-1440.014" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="76" y="158.88">PAIA / 法律说明</tspan></text><text id="privacy-policy-zh-1440.015" font-family="Noto Serif CJK SC" font-size="66" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="504" y="270.78">隐私政策</tspan></text><text id="privacy-policy-zh-1440.016" font-family="Noto Sans CJK SC" font-size="12" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="504" y="393.96">保留现有公开页面的政策内容与日期。</tspan></text><text id="privacy-policy-zh-1440.017" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="76" y="485.88">本页内容</tspan></text><text id="privacy-policy-zh-1440.018" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="76" y="540.45">原则</tspan><tspan x="76" y="579.45">数据使用</tspan><tspan x="76" y="618.45">你的控制</tspan><tspan x="76" y="657.45">联系</tspan></text><text id="privacy-policy-zh-1440.019" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="491.28">PAIA · PRIVATE BETA</tspan></text><text id="privacy-policy-zh-1440.020" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="546.28">政策内容最后更新: 2026-09-11 · 页面呈现更新: 2026-09-26</tspan></text><text id="privacy-policy-zh-1440.021" font-family="Noto Serif CJK SC" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="504" y="610.41">1. 核心原则</tspan></text><text id="privacy-policy-zh-1440.022" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="664.28">PAIA 当前以本地优先方式运行。核心档案数据默认保存在用户设备上，产品设计优先让保存、检索</tspan><tspan x="504" y="691.28">、备份和多数组织逻辑在本地完成。</tspan></text><text id="privacy-policy-zh-1440.023" font-family="Noto Serif CJK SC" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="504" y="755.41">2. AI 相关数据使用</tspan></text><text id="privacy-policy-zh-1440.024" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="809.28">PAIA 不默认把完整档案交给外部 AI。需要调用外部 AI 的功能，应由用户明确触发，并尽量只处理完</tspan><tspan x="504" y="836.28">成当前任务所必要的内容。AI Context 的授权、排除和预览应当先由用户确认。</tspan></text><text id="privacy-policy-zh-1440.025" font-family="Noto Serif CJK SC" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="504" y="900.41">3. 本网站</tspan></text><text id="privacy-policy-zh-1440.026" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="954.28">当前公开展示网站不连接用户的 PAIA 档案，也不设置分析脚本或行为跟踪器。网站仅用于说明产品</tspan><tspan x="504" y="981.28">理念、交互与当前开发状态。</tspan></text><text id="privacy-policy-zh-1440.027" font-family="Noto Serif CJK SC" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="504" y="1045.41">4. Private Beta 申请</tspan></text><text id="privacy-policy-zh-1440.028" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="1099.28">Private Beta 申请表通过第三方表单转发服务 FormSubmit 将你主动填写的信息发送到项目联系邮</tspan><tspan x="504" y="1126.28">箱 haohongfei2001@gmail.com。申请信息仅用于当前 Beta 的招募、筛选与联系，并会在不再需</tspan><tspan x="504" y="1153.28">要用于 Beta 招募后删除。你可以随时通过项目联系邮箱要求提前删除已提交的申请信息。请不要提</tspan><tspan x="504" y="1180.28">交敏感信息。</tspan></text><text id="privacy-policy-zh-1440.029" font-family="Noto Serif CJK SC" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="504" y="1244.41">5. Private Beta</tspan></text><text id="privacy-policy-zh-1440.030" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="1298.28">PAIA 仍处于 Private Beta。具体数据结构、同步方式和可选 AI 功能可能继续调整。若未来引入云同</tspan><tspan x="504" y="1325.28">步、账户系统或新的外部服务，会在正式启用前更新本政策并说明相应数据边界。</tspan></text><text id="privacy-policy-zh-1440.031" font-family="Noto Serif CJK SC" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="504" y="1389.41">6. 用户控制与删除</tspan></text><text id="privacy-policy-zh-1440.032" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="1443.28">产品目标是让用户保留对自己档案的最终控制权，包括查看、编辑、导出和删除。具体能力以当前 </tspan><tspan x="504" y="1470.28">Beta 版本实际提供的功能为准。</tspan></text><text id="privacy-policy-zh-1440.033" font-family="Noto Serif CJK SC" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="504" y="1534.41">7. 联系</tspan></text><text id="privacy-policy-zh-1440.034" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="1588.28">有关本政策、Beta 或申请信息删除的问题，请联系 haohongfei2001@gmail.com。</tspan></text><text id="privacy-policy-zh-1440.035" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="1643.28">网站示例补充说明：示例输入只在当前页面内存中使用，不上传或持久保存；刷新即清除。网站托</tspan><tspan x="504" y="1670.28">管和 FormSubmit 仍有各自的数据处理边界。</tspan></text><text id="privacy-policy-zh-1440.036" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="1725.28">查看具体的数据与授权边界</tspan></text><path id="privacy-policy-zh-1440.037" d="M76 1837 L1364 1837" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="privacy-policy-zh-1440.038" font-family="Noto Serif CJK SC" font-size="43" font-weight="400" font-style="normal" letter-spacing="1.2" text-anchor="start" fill="#171c19"><tspan x="76" y="1910.69">PAIA</tspan></text><text id="privacy-policy-zh-1440.039" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="76" y="1948.45">让你的思考，拥有更长的明天。</tspan></text><text id="privacy-policy-zh-1440.040" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="710" y="1889.88">探索</tspan></text><text id="privacy-policy-zh-1440.041" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="710" y="1930.38">使用方式</tspan></text><text id="privacy-policy-zh-1440.042" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="710" y="1959.38">使用场景</tspan></text><text id="privacy-policy-zh-1440.043" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="710" y="1988.38">体验示例</tspan></text><text id="privacy-policy-zh-1440.044" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="940" y="1889.88">观点</tspan></text><text id="privacy-policy-zh-1440.045" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="940" y="1930.38">我们的故事</tspan></text><text id="privacy-policy-zh-1440.046" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="940" y="1959.38">手记</tspan></text><text id="privacy-policy-zh-1440.047" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="940" y="1988.38">申请内测</tspan></text><text id="privacy-policy-zh-1440.048" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="1170" y="1889.88">信任</tspan></text><text id="privacy-policy-zh-1440.049" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="1170" y="1930.38">你的数据</tspan></text><text id="privacy-policy-zh-1440.050" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="1170" y="1959.38">当前状态</tspan></text><text id="privacy-policy-zh-1440.051" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="1170" y="1988.38">隐私 · 条款</tspan></text><text id="privacy-policy-zh-1440.052" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="1170" y="2017.38">联系</tspan></text><path id="privacy-policy-zh-1440.053" d="M76 2081 L1364 2081" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="privacy-policy-zh-1440.054" font-family="Noto Sans CJK SC" font-size="10.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="76" y="2114.72">© 2026 PAIA · 内测阶段</tspan></text><text id="privacy-policy-zh-1440.055" font-family="Noto Sans CJK SC" font-size="11" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="end" fill="#707975"><tspan x="1364" y="2115.13">EN   /   中文</tspan></text><text id="privacy-policy-zh-1440.056" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="76" y="2140.89">摄影署名 · 所有材料均为示例，并非真实档案</tspan></text></svg>