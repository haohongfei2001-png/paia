<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2844" viewBox="0 0 390 2844"><title>PAIA — privacy-policy-zh-390 — design only</title><desc>Static authored design specification. Fictional examples; not implemented UI or product evidence.</desc><defs><filter id="paper-shadow" x="-45%" y="-35%" width="195%" height="200%"><feDropShadow dx="0" dy="15" stdDeviation="19" flood-color="#232e24" flood-opacity=".13"/></filter><filter id="source-shadow" x="-40%" y="-35%" width="180%" height="185%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#283127" flood-opacity=".09"/></filter><filter id="photo-shadow" x="-35%" y="-30%" width="170%" height="175%"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#283127" flood-opacity=".12"/></filter></defs><rect id="privacy-policy-zh-390.001" x="0" y="0" width="390" height="2844" rx="0" fill="#fdfdfb"/><text id="privacy-policy-zh-390.002" font-family="Noto Serif CJK SC" font-size="34" font-weight="400" font-style="normal" letter-spacing="1.2" text-anchor="start" fill="#171c19"><tspan x="24" y="50.22">PAIA</tspan></text><rect id="privacy-policy-zh-390.003" x="203" y="22" width="127" height="39" rx="19.5" fill="#343e35" stroke="#343e35" stroke-width=".8"/><text id="privacy-policy-zh-390.004" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#fdfdfb"><tspan x="227" y="45.79">申请内测</tspan></text><path id="privacy-policy-zh-390.005" d="M291 41.5h14m-5 -5 5 5-5 5" fill="none" stroke="#fdfdfb" stroke-width="1.2"/><path id="privacy-policy-zh-390.006" d="M350 34 L369 34" fill="none" stroke="#171c19" stroke-width="1"/><path id="privacy-policy-zh-390.007" d="M350 43 L369 43" fill="none" stroke="#171c19" stroke-width="1"/><text id="privacy-policy-zh-390.008" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="128.88">PAIA / 法律说明</tspan></text><text id="privacy-policy-zh-390.009" font-family="Noto Serif CJK SC" font-size="48" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="225.84">隐私政策</tspan></text><text id="privacy-policy-zh-390.010" font-family="Noto Sans CJK SC" font-size="12" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="24" y="322.96">保留现有公开页面的政策内容与日期。</tspan></text><text id="privacy-policy-zh-390.011" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="420.28">PAIA · PRIVATE BETA</tspan></text><text id="privacy-policy-zh-390.012" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="475.28">政策内容最后更新: 2026-09-11 · 页面呈现更新</tspan><tspan x="24" y="502.28">: 2026-09-26</tspan></text><text id="privacy-policy-zh-390.013" font-family="Noto Serif CJK SC" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="566.41">1. 核心原则</tspan></text><text id="privacy-policy-zh-390.014" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="620.28">PAIA 当前以本地优先方式运行。核心档案数据</tspan><tspan x="24" y="647.28">默认保存在用户设备上，产品设计优先让保存</tspan><tspan x="24" y="674.28">、检索、备份和多数组织逻辑在本地完成。</tspan></text><text id="privacy-policy-zh-390.015" font-family="Noto Serif CJK SC" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="738.41">2. AI 相关数据使用</tspan></text><text id="privacy-policy-zh-390.016" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="792.28">PAIA 不默认把完整档案交给外部 AI。需要调用</tspan><tspan x="24" y="819.28">外部 AI 的功能，应由用户明确触发，并尽量只</tspan><tspan x="24" y="846.28">处理完成当前任务所必要的内容。AI Context </tspan><tspan x="24" y="873.28">的授权、排除和预览应当先由用户确认。</tspan></text><text id="privacy-policy-zh-390.017" font-family="Noto Serif CJK SC" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="937.41">3. 本网站</tspan></text><text id="privacy-policy-zh-390.018" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="991.28">当前公开展示网站不连接用户的 PAIA 档案，也</tspan><tspan x="24" y="1018.28">不设置分析脚本或行为跟踪器。网站仅用于说</tspan><tspan x="24" y="1045.28">明产品理念、交互与当前开发状态。</tspan></text><text id="privacy-policy-zh-390.019" font-family="Noto Serif CJK SC" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="1109.41">4. Private Beta 申请</tspan></text><text id="privacy-policy-zh-390.020" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1163.28">Private Beta 申请表通过第三方表单转发服务 F</tspan><tspan x="24" y="1190.28">ormSubmit 将你主动填写的信息发送到项目联</tspan><tspan x="24" y="1217.28">系邮箱 haohongfei2001@gmail.com。申请信</tspan><tspan x="24" y="1244.28">息仅用于当前 Beta 的招募、筛选与联系，并会</tspan><tspan x="24" y="1271.28">在不再需要用于 Beta 招募后删除。你可以随时</tspan><tspan x="24" y="1298.28">通过项目联系邮箱要求提前删除已提交的申请</tspan><tspan x="24" y="1325.28">信息。请不要提交敏感信息。</tspan></text><text id="privacy-policy-zh-390.021" font-family="Noto Serif CJK SC" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="1389.41">5. Private Beta</tspan></text><text id="privacy-policy-zh-390.022" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1443.28">PAIA 仍处于 Private Beta。具体数据结构、同</tspan><tspan x="24" y="1470.28">步方式和可选 AI 功能可能继续调整。若未来引</tspan><tspan x="24" y="1497.28">入云同步、账户系统或新的外部服务，会在正</tspan><tspan x="24" y="1524.28">式启用前更新本政策并说明相应数据边界。</tspan></text><text id="privacy-policy-zh-390.023" font-family="Noto Serif CJK SC" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="1588.41">6. 用户控制与删除</tspan></text><text id="privacy-policy-zh-390.024" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1642.28">产品目标是让用户保留对自己档案的最终控制</tspan><tspan x="24" y="1669.28">权，包括查看、编辑、导出和删除。具体能力</tspan><tspan x="24" y="1696.28">以当前 Beta 版本实际提供的功能为准。</tspan></text><text id="privacy-policy-zh-390.025" font-family="Noto Serif CJK SC" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="1760.41">7. 联系</tspan></text><text id="privacy-policy-zh-390.026" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1814.28">有关本政策、Beta 或申请信息删除的问题，请</tspan><tspan x="24" y="1841.28">联系 haohongfei2001@gmail.com。</tspan></text><text id="privacy-policy-zh-390.027" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1896.28">网站示例补充说明：示例输入只在当前页面内</tspan><tspan x="24" y="1923.28">存中使用，不上传或持久保存；刷新即清除。</tspan><tspan x="24" y="1950.28">网站托管和 FormSubmit 仍有各自的数据处理</tspan><tspan x="24" y="1977.28">边界。</tspan></text><text id="privacy-policy-zh-390.028" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2032.28">查看具体的数据与授权边界</tspan></text><path id="privacy-policy-zh-390.029" d="M24 2144 L366 2144" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="privacy-policy-zh-390.030" font-family="Noto Serif CJK SC" font-size="36" font-weight="400" font-style="normal" letter-spacing="1.2" text-anchor="start" fill="#171c19"><tspan x="24" y="2211.88">PAIA</tspan></text><text id="privacy-policy-zh-390.031" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2255.45">让你的思考，拥有更长的明天。</tspan></text><text id="privacy-policy-zh-390.032" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="2327.89">探索</tspan></text><text id="privacy-policy-zh-390.033" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2368.38">使用方式</tspan></text><text id="privacy-policy-zh-390.034" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2397.38">使用场景</tspan></text><text id="privacy-policy-zh-390.035" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2426.38">体验示例</tspan></text><text id="privacy-policy-zh-390.036" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="204" y="2327.89">观点</tspan></text><text id="privacy-policy-zh-390.037" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="204" y="2368.38">我们的故事</tspan></text><text id="privacy-policy-zh-390.038" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="204" y="2397.38">手记</tspan></text><text id="privacy-policy-zh-390.039" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="204" y="2426.38">申请内测</tspan></text><text id="privacy-policy-zh-390.040" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="2503.89">信任</tspan></text><text id="privacy-policy-zh-390.041" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2544.38">你的数据</tspan></text><text id="privacy-policy-zh-390.042" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2573.38">当前状态</tspan></text><text id="privacy-policy-zh-390.043" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2602.38">隐私 · 条款</tspan></text><text id="privacy-policy-zh-390.044" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2631.38">联系</tspan></text><path id="privacy-policy-zh-390.045" d="M24 2714 L366 2714" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="privacy-policy-zh-390.046" font-family="Noto Sans CJK SC" font-size="10.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="24" y="2747.72">© 2026 PAIA · 内测阶段</tspan></text><text id="privacy-policy-zh-390.047" font-family="Noto Sans CJK SC" font-size="11" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="end" fill="#707975"><tspan x="366" y="2748.13">EN   /   中文</tspan></text><text id="privacy-policy-zh-390.048" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="24" y="2773.89">摄影署名 · 所有材料均为示例，并非真实档案</tspan></text></svg>