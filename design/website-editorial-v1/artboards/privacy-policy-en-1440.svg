<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2304" viewBox="0 0 1440 2304"><title>PAIA — privacy-policy-en-1440 — design only</title><desc>Static authored design specification. Fictional examples; not implemented UI or product evidence.</desc><defs><filter id="paper-shadow" x="-45%" y="-35%" width="195%" height="200%"><feDropShadow dx="0" dy="15" stdDeviation="19" flood-color="#232e24" flood-opacity=".13"/></filter><filter id="source-shadow" x="-40%" y="-35%" width="180%" height="185%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#283127" flood-opacity=".09"/></filter><filter id="photo-shadow" x="-35%" y="-30%" width="170%" height="175%"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#283127" flood-opacity=".12"/></filter></defs><rect id="privacy-policy-en-1440.001" x="0" y="0" width="1440" height="2304" rx="0" fill="#fdfdfb"/><text id="privacy-policy-en-1440.002" font-family="EB Garamond 12" font-size="43" font-weight="400" font-style="normal" letter-spacing="1.2" text-anchor="start" fill="#171c19"><tspan x="76" y="55.69">PAIA</tspan></text><path id="privacy-policy-en-1440.003" d="M181 25 L181 57" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="privacy-policy-en-1440.004" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="197" y="39.38">Your AI context,</tspan><tspan x="197" y="56.38">for what’s next.</tspan></text><text id="privacy-policy-en-1440.005" font-family="Inter" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="475" y="44.79">Home</tspan></text><path id="privacy-policy-en-1440.006" d="M475 54 L511.4234375 54" fill="none" stroke="#808981" stroke-width="1.4"/><text id="privacy-policy-en-1440.007" font-family="Inter" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="553" y="44.79">How it works</tspan></text><text id="privacy-policy-en-1440.008" font-family="Inter" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="687" y="44.79">Use cases</tspan></text><text id="privacy-policy-en-1440.009" font-family="Inter" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="799" y="44.79">Our story</tspan></text><text id="privacy-policy-en-1440.010" font-family="Inter" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="909" y="44.79">Journal</tspan></text><rect id="privacy-policy-en-1440.011" x="1192" y="18" width="176" height="42" rx="21.0" fill="#343e35" stroke="#343e35" stroke-width=".8"/><text id="privacy-policy-en-1440.012" font-family="Inter" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#fdfdfb"><tspan x="1216" y="43.29">Get early access</tspan></text><path id="privacy-policy-en-1440.013" d="M1329 39.0h14m-5 -5 5 5-5 5" fill="none" stroke="#fdfdfb" stroke-width="1.2"/><text id="privacy-policy-en-1440.014" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="76" y="158.88">PAIA / LEGAL</tspan></text><text id="privacy-policy-en-1440.015" font-family="EB Garamond 12" font-size="66" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="504" y="270.78">Privacy policy</tspan></text><text id="privacy-policy-en-1440.016" font-family="Inter" font-size="12" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="504" y="393.96">Policy substance and dates retained from the existing public page.</tspan></text><text id="privacy-policy-en-1440.017" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="76" y="485.88">ON THIS PAGE</tspan></text><text id="privacy-policy-en-1440.018" font-family="Inter" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="76" y="540.45">Principles</tspan><tspan x="76" y="579.45">Data use</tspan><tspan x="76" y="618.45">Your control</tspan><tspan x="76" y="657.45">Contact</tspan></text><text id="privacy-policy-en-1440.019" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="491.28">PAIA · PRIVATE BETA</tspan></text><text id="privacy-policy-en-1440.020" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="546.28">Policy content last updated: 2026-09-11 · Presentation updated: 2026-09-26</tspan></text><text id="privacy-policy-en-1440.021" font-family="EB Garamond 12" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="504" y="610.41">1. Core principles</tspan></text><text id="privacy-policy-en-1440.022" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="664.28">PAIA currently operates local-first. Core archive data is stored on the user’s device by</tspan><tspan x="504" y="691.28">default. The product prioritizes local capture, retrieval, backup and most organization logic.</tspan></text><text id="privacy-policy-en-1440.023" font-family="EB Garamond 12" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="504" y="755.41">2. AI-related data use</tspan></text><text id="privacy-policy-en-1440.024" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="809.28">PAIA does not give external AI the complete archive by default. Features that call external AI</tspan><tspan x="504" y="836.28">should be explicitly triggered by the user and process only what is needed for the task. AI</tspan><tspan x="504" y="863.28">Context permissions, exclusions and previews should be confirmed by the user first.</tspan></text><text id="privacy-policy-en-1440.025" font-family="EB Garamond 12" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="504" y="927.41">3. This website</tspan></text><text id="privacy-policy-en-1440.026" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="981.28">This public website does not connect to a user’s PAIA archive or install analytics scripts or</tspan><tspan x="504" y="1008.28">behavioral trackers. It explains the product, interactions and current development status.</tspan></text><text id="privacy-policy-en-1440.027" font-family="EB Garamond 12" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="504" y="1072.41">4. Private beta applications</tspan></text><text id="privacy-policy-en-1440.028" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="1126.28">The private beta form uses the third-party forwarding service FormSubmit to send the</tspan><tspan x="504" y="1153.28">information you enter to haohongfei2001@gmail.com. Application information is used only</tspan><tspan x="504" y="1180.28">for current beta recruitment, selection and contact, and is deleted when no longer needed</tspan><tspan x="504" y="1207.28">for recruitment. You can request earlier deletion through the project email at any time. Do not</tspan><tspan x="504" y="1234.28">submit sensitive information.</tspan></text><text id="privacy-policy-en-1440.029" font-family="EB Garamond 12" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="504" y="1298.41">5. Private beta</tspan></text><text id="privacy-policy-en-1440.030" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="1352.28">PAIA remains in private beta. Data structures, synchronization approaches and optional AI</tspan><tspan x="504" y="1379.28">features may change. If cloud sync, accounts or new external services are introduced, this</tspan><tspan x="504" y="1406.28">policy will be updated and their data boundaries explained before activation.</tspan></text><text id="privacy-policy-en-1440.031" font-family="EB Garamond 12" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="504" y="1470.41">6. User control and deletion</tspan></text><text id="privacy-policy-en-1440.032" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="1524.28">The product aims to keep users in control of their archives, including viewing, editing,</tspan><tspan x="504" y="1551.28">exporting and deleting. Specific capabilities depend on what the current beta build actually</tspan><tspan x="504" y="1578.28">provides.</tspan></text><text id="privacy-policy-en-1440.033" font-family="EB Garamond 12" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="504" y="1642.41">7. Contact</tspan></text><text id="privacy-policy-en-1440.034" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="1696.28">For policy, beta or application-deletion questions, contact haohongfei2001@gmail.com.</tspan></text><text id="privacy-policy-en-1440.035" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="1751.28">Website sample clarification: inputs are used only in current-page memory, not uploaded or</tspan><tspan x="504" y="1778.28">persisted, and clear on reload. Website hosting and FormSubmit have their own</tspan><tspan x="504" y="1805.28">data-processing boundaries.</tspan></text><text id="privacy-policy-en-1440.036" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="504" y="1860.28">Read the practical data boundaries</tspan></text><path id="privacy-policy-en-1440.037" d="M76 1972 L1364 1972" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="privacy-policy-en-1440.038" font-family="EB Garamond 12" font-size="43" font-weight="400" font-style="normal" letter-spacing="1.2" text-anchor="start" fill="#171c19"><tspan x="76" y="2045.69">PAIA</tspan></text><text id="privacy-policy-en-1440.039" font-family="Inter" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="76" y="2083.45">Your thinking has a longer tomorrow.</tspan></text><text id="privacy-policy-en-1440.040" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="710" y="2024.88">EXPLORE</tspan></text><text id="privacy-policy-en-1440.041" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="710" y="2065.38">How it works</tspan></text><text id="privacy-policy-en-1440.042" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="710" y="2094.38">Use cases</tspan></text><text id="privacy-policy-en-1440.043" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="710" y="2123.38">Explore an example</tspan></text><text id="privacy-policy-en-1440.044" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="940" y="2024.88">PERSPECTIVES</tspan></text><text id="privacy-policy-en-1440.045" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="940" y="2065.38">Our story</tspan></text><text id="privacy-policy-en-1440.046" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="940" y="2094.38">Journal</tspan></text><text id="privacy-policy-en-1440.047" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="940" y="2123.38">Get early access</tspan></text><text id="privacy-policy-en-1440.048" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="1170" y="2024.88">TRUST</tspan></text><text id="privacy-policy-en-1440.049" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="1170" y="2065.38">Your data</tspan></text><text id="privacy-policy-en-1440.050" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="1170" y="2094.38">Current status</tspan></text><text id="privacy-policy-en-1440.051" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="1170" y="2123.38">Privacy · Terms</tspan></text><text id="privacy-policy-en-1440.052" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="1170" y="2152.38">Contact</tspan></text><path id="privacy-policy-en-1440.053" d="M76 2216 L1364 2216" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="privacy-policy-en-1440.054" font-family="Inter" font-size="10.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="76" y="2249.72">© 2026 PAIA · Private beta</tspan></text><text id="privacy-policy-en-1440.055" font-family="Inter" font-size="11" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="end" fill="#707975"><tspan x="1364" y="2250.13">EN   /   中文</tspan></text><text id="privacy-policy-en-1440.056" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="76" y="2275.89">Photography credits · Illustrative material, not a live archive</tspan></text></svg>