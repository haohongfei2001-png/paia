<svg xmlns="http://www.w3.org/2000/svg" width="390" height="3303" viewBox="0 0 390 3303"><title>PAIA — privacy-policy-en-390 — design only</title><desc>Static authored design specification. Fictional examples; not implemented UI or product evidence.</desc><defs><filter id="paper-shadow" x="-45%" y="-35%" width="195%" height="200%"><feDropShadow dx="0" dy="15" stdDeviation="19" flood-color="#232e24" flood-opacity=".13"/></filter><filter id="source-shadow" x="-40%" y="-35%" width="180%" height="185%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#283127" flood-opacity=".09"/></filter><filter id="photo-shadow" x="-35%" y="-30%" width="170%" height="175%"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#283127" flood-opacity=".12"/></filter></defs><rect id="privacy-policy-en-390.001" x="0" y="0" width="390" height="3303" rx="0" fill="#fdfdfb"/><text id="privacy-policy-en-390.002" font-family="EB Garamond 12" font-size="34" font-weight="400" font-style="normal" letter-spacing="1.2" text-anchor="start" fill="#171c19"><tspan x="24" y="50.22">PAIA</tspan></text><rect id="privacy-policy-en-390.003" x="203" y="22" width="127" height="39" rx="19.5" fill="#343e35" stroke="#343e35" stroke-width=".8"/><text id="privacy-policy-en-390.004" font-family="Inter" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#fdfdfb"><tspan x="227" y="45.79">Join beta</tspan></text><path id="privacy-policy-en-390.005" d="M291 41.5h14m-5 -5 5 5-5 5" fill="none" stroke="#fdfdfb" stroke-width="1.2"/><path id="privacy-policy-en-390.006" d="M350 34 L369 34" fill="none" stroke="#171c19" stroke-width="1"/><path id="privacy-policy-en-390.007" d="M350 43 L369 43" fill="none" stroke="#171c19" stroke-width="1"/><text id="privacy-policy-en-390.008" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="128.88">PAIA / LEGAL</tspan></text><text id="privacy-policy-en-390.009" font-family="EB Garamond 12" font-size="48" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="225.84">Privacy policy</tspan></text><text id="privacy-policy-en-390.010" font-family="Inter" font-size="12" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="24" y="322.96">Policy substance and dates retained from the existing</tspan><tspan x="24" y="340.36">public page.</tspan></text><text id="privacy-policy-en-390.011" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="420.28">PAIA · PRIVATE BETA</tspan></text><text id="privacy-policy-en-390.012" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="475.28">Policy content last updated: 2026-09-11 ·</tspan><tspan x="24" y="502.28">Presentation updated: 2026-09-26</tspan></text><text id="privacy-policy-en-390.013" font-family="EB Garamond 12" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="566.41">1. Core principles</tspan></text><text id="privacy-policy-en-390.014" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="620.28">PAIA currently operates local-first. Core</tspan><tspan x="24" y="647.28">archive data is stored on the user’s device</tspan><tspan x="24" y="674.28">by default. The product prioritizes local</tspan><tspan x="24" y="701.28">capture, retrieval, backup and most</tspan><tspan x="24" y="728.28">organization logic.</tspan></text><text id="privacy-policy-en-390.015" font-family="EB Garamond 12" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="792.41">2. AI-related data use</tspan></text><text id="privacy-policy-en-390.016" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="846.28">PAIA does not give external AI the complete</tspan><tspan x="24" y="873.28">archive by default. Features that call</tspan><tspan x="24" y="900.28">external AI should be explicitly triggered by</tspan><tspan x="24" y="927.28">the user and process only what is needed</tspan><tspan x="24" y="954.28">for the task. AI Context permissions,</tspan><tspan x="24" y="981.28">exclusions and previews should be</tspan><tspan x="24" y="1008.28">confirmed by the user first.</tspan></text><text id="privacy-policy-en-390.017" font-family="EB Garamond 12" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="1072.41">3. This website</tspan></text><text id="privacy-policy-en-390.018" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1126.28">This public website does not connect to a</tspan><tspan x="24" y="1153.28">user’s PAIA archive or install analytics</tspan><tspan x="24" y="1180.28">scripts or behavioral trackers. It explains</tspan><tspan x="24" y="1207.28">the product, interactions and current</tspan><tspan x="24" y="1234.28">development status.</tspan></text><text id="privacy-policy-en-390.019" font-family="EB Garamond 12" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="1298.41">4. Private beta applications</tspan></text><text id="privacy-policy-en-390.020" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1352.28">The private beta form uses the third-party</tspan><tspan x="24" y="1379.28">forwarding service FormSubmit to send the</tspan><tspan x="24" y="1406.28">information you enter to</tspan><tspan x="24" y="1433.28">haohongfei2001@gmail.com. Application</tspan><tspan x="24" y="1460.28">information is used only for current beta</tspan><tspan x="24" y="1487.28">recruitment, selection and contact, and is</tspan><tspan x="24" y="1514.28">deleted when no longer needed for</tspan><tspan x="24" y="1541.28">recruitment. You can request earlier</tspan><tspan x="24" y="1568.28">deletion through the project email at any</tspan><tspan x="24" y="1595.28">time. Do not submit sensitive information.</tspan></text><text id="privacy-policy-en-390.021" font-family="EB Garamond 12" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="1659.41">5. Private beta</tspan></text><text id="privacy-policy-en-390.022" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1713.28">PAIA remains in private beta. Data</tspan><tspan x="24" y="1740.28">structures, synchronization approaches and</tspan><tspan x="24" y="1767.28">optional AI features may change. If cloud</tspan><tspan x="24" y="1794.28">sync, accounts or new external services are</tspan><tspan x="24" y="1821.28">introduced, this policy will be updated and</tspan><tspan x="24" y="1848.28">their data boundaries explained before</tspan><tspan x="24" y="1875.28">activation.</tspan></text><text id="privacy-policy-en-390.023" font-family="EB Garamond 12" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="1939.41">6. User control and deletion</tspan></text><text id="privacy-policy-en-390.024" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1993.28">The product aims to keep users in control of</tspan><tspan x="24" y="2020.28">their archives, including viewing, editing,</tspan><tspan x="24" y="2047.28">exporting and deleting. Specific capabilities</tspan><tspan x="24" y="2074.28">depend on what the current beta build</tspan><tspan x="24" y="2101.28">actually provides.</tspan></text><text id="privacy-policy-en-390.025" font-family="EB Garamond 12" font-size="27" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="2165.41">7. Contact</tspan></text><text id="privacy-policy-en-390.026" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2219.28">For policy, beta or application-deletion</tspan><tspan x="24" y="2246.28">questions, contact</tspan><tspan x="24" y="2273.28">haohongfei2001@gmail.com.</tspan></text><text id="privacy-policy-en-390.027" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2328.28">Website sample clarification: inputs are</tspan><tspan x="24" y="2355.28">used only in current-page memory, not</tspan><tspan x="24" y="2382.28">uploaded or persisted, and clear on reload.</tspan><tspan x="24" y="2409.28">Website hosting and FormSubmit have their</tspan><tspan x="24" y="2436.28">own data-processing boundaries.</tspan></text><text id="privacy-policy-en-390.028" font-family="Inter" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2491.28">Read the practical data boundaries</tspan></text><path id="privacy-policy-en-390.029" d="M24 2603 L366 2603" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="privacy-policy-en-390.030" font-family="EB Garamond 12" font-size="36" font-weight="400" font-style="normal" letter-spacing="1.2" text-anchor="start" fill="#171c19"><tspan x="24" y="2670.88">PAIA</tspan></text><text id="privacy-policy-en-390.031" font-family="Inter" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2714.45">Your thinking has a longer tomorrow.</tspan></text><text id="privacy-policy-en-390.032" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="2786.89">EXPLORE</tspan></text><text id="privacy-policy-en-390.033" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2827.38">How it works</tspan></text><text id="privacy-policy-en-390.034" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2856.38">Use cases</tspan></text><text id="privacy-policy-en-390.035" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2885.38">Explore an example</tspan></text><text id="privacy-policy-en-390.036" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="204" y="2786.89">PERSPECTIVES</tspan></text><text id="privacy-policy-en-390.037" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="204" y="2827.38">Our story</tspan></text><text id="privacy-policy-en-390.038" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="204" y="2856.38">Journal</tspan></text><text id="privacy-policy-en-390.039" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="204" y="2885.38">Get early access</tspan></text><text id="privacy-policy-en-390.040" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="2962.89">TRUST</tspan></text><text id="privacy-policy-en-390.041" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="3003.38">Your data</tspan></text><text id="privacy-policy-en-390.042" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="3032.38">Current status</tspan></text><text id="privacy-policy-en-390.043" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="3061.38">Privacy · Terms</tspan></text><text id="privacy-policy-en-390.044" font-family="Inter" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="3090.38">Contact</tspan></text><path id="privacy-policy-en-390.045" d="M24 3173 L366 3173" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="privacy-policy-en-390.046" font-family="Inter" font-size="10.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="24" y="3206.72">© 2026 PAIA · Private beta</tspan></text><text id="privacy-policy-en-390.047" font-family="Inter" font-size="11" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="end" fill="#707975"><tspan x="366" y="3207.13">EN   /   中文</tspan></text><text id="privacy-policy-en-390.048" font-family="Inter" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="24" y="3232.89">Photography credits · Illustrative material, not a live archive</tspan></text></svg>