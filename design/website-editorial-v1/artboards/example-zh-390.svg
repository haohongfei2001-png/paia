><tspan x="24" y="1472.25">这是官网演示区域，不是扩展内部界面的重新设计</tspan><tspan x="24" y="1497.00">。原始记录与工作版本的区别、安全的文本处理，</tspan><tspan x="24" y="1521.75">以及明确触发的复制与导出，必须保留。</tspan></text><path id="example-zh-390.039" d="M24 1666.8 L366 1666.8" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="example-zh-390.040" font-family="Noto Serif CJK SC" font-size="38" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="1746.34">带上更多语境，</tspan><tspan x="24" y="1789.34">迈出下一步。</tspan></text><rect id="example-zh-390.041" x="24" y="1838.8" width="208" height="56" rx="28.0" fill="#343e35" stroke="#343e35" stroke-width=".8"/><text id="example-zh-390.042" font-family="Noto Sans CJK SC" font-size="15.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#fdfdfb"><tspan x="48" y="1871.91">申请内测</tspan></text><path id="example-zh-390.043" d="M193 1866.8h14m-5 -5 5 5-5 5" fill="none" stroke="#fdfdfb" stroke-width="1.2"/><path id="example-zh-390.044" d="M24 1968.8 L366 1968.8" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="example-zh-390.045" font-family="Noto Serif CJK SC" font-size="36" font-weight="400" font-style="normal" letter-spacing="1.2" text-anchor="start" fill="#171c19"><tspan x="24" y="2036.68">PAIA</tspan></text><text id="example-zh-390.046" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2080.25">让你的思考，拥有更长的明天。</tspan></text><text id="example-zh-390.047" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="2152.69">探索</tspan></text><text id="example-zh-390.048" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2193.18">使用方式</tspan></text><text id="example-zh-390.049" font-