<svg xmlns="http://www.w3.org/2000/svg" width="390" height="3746.05" viewBox="0 0 390 3746.05"><title>PAIA — faq-zh-390 — design only</title><desc>Static authored design specification. Fictional examples; not implemented UI or product evidence.</desc><defs><filter id="paper-shadow" x="-45%" y="-35%" width="195%" height="200%"><feDropShadow dx="0" dy="15" stdDeviation="19" flood-color="#232e24" flood-opacity=".13"/></filter><filter id="source-shadow" x="-40%" y="-35%" width="180%" height="185%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#283127" flood-opacity=".09"/></filter><filter id="photo-shadow" x="-35%" y="-30%" width="170%" height="175%"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#283127" flood-opacity=".12"/></filter></defs><rect id="faq-zh-390.001" x="0" y="0" width="390" height="3746.05" rx="0" fill="#fdfdfb"/><text id="faq-zh-390.002" font-family="Noto Serif CJK SC" font-size="34" font-weight="400" font-style="normal" letter-spacing="1.2" text-anchor="start" fill="#171c19"><tspan x="24" y="50.22">PAIA</tspan></text><rect id="faq-zh-390.003" x="203" y="22" width="127" height="39" rx="19.5" fill="#343e35" stroke="#343e35" stroke-width=".8"/><text id="faq-zh-390.004" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#fdfdfb"><tspan x="227" y="45.79">申请内测</tspan></text><path id="faq-zh-390.005" d="M291 41.5h14m-5 -5 5 5-5 5" fill="none" stroke="#fdfdfb" stroke-width="1.2"/><path id="faq-zh-390.006" d="M350 34 L369 34" fill="none" stroke="#171c19" stroke-width="1"/><path id="faq-zh-390.007" d="M350 43 L369 43" fill="none" stroke="#171c19" stroke-width="1"/><text id="faq-zh-390.008" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="119.89">问题 / 回答</tspan></text><text id="faq-zh-390.009" font-family="Noto Serif CJK SC" font-size="44" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="195.52">一些</tspan><tspan x="24" y="244.52">值得了解的事。</tspan></text><text id="faq-zh-390.010" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="300.28">PAIA 保存什么、你可以控制什么，以及内测阶</tspan><tspan x="24" y="326.68">段不作哪些承诺。</tspan></text><path id="faq-zh-390.011" d="M24 409.8 L366 409.8" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="faq-zh-390.012" font-family="Noto Serif CJK SC" font-size="25" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="457.55">PAIA 保存什么？</tspan></text><text id="faq-zh-390.013" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="509.25">PAIA 主要保存你已发送的输入，以及回看所需的</tspan><tspan x="24" y="534.00">来源信息；这并不意味着复制全部 AI 回复或所有</tspan><tspan x="24" y="558.75">文件。</tspan></text><path id="faq-zh-390.014" d="M24 618.05 L366 618.05" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="faq-zh-390.015" font-family="Noto Serif CJK SC" font-size="25" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="665.80">我需要把所有内容都整理好吗</tspan><tspan x="24" y="698.80">？</tspan></text><text id="faq-zh-390.016" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="750.50">不需要。阅读、找回、编辑和复制有用的话，本</tspan><tspan x="24" y="775.25">身就应该有价值。主题与可选的 AI 整理是增强能</tspan><tspan x="24" y="800.00">力，不是使用前提。</tspan></text><path id="faq-zh-390.017" d="M24 859.3 L366 859.3" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="faq-zh-390.018" font-family="Noto Serif CJK SC" font-size="25" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="907.05">全部档案都会被发送给 AI 吗</tspan><tspan x="24" y="940.05">？</tspan></text><text id="faq-zh-390.019" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="991.75">不会。普通档案使用以本地为先。外部 AI 处理和</tspan><tspan x="24" y="1016.50">上下文复用是分别授权、明确触发的操作。</tspan></text><path id="faq-zh-390.020" d="M24 1075.8 L366 1075.8" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="faq-zh-390.021" font-family="Noto Serif CJK SC" font-size="25" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="1123.55">现在可以在哪些平台上使用？</tspan></text><text id="faq-zh-390.022" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1175.25">当前邀请制内测为 Chrome 扩展，可在同意后捕</tspan><tspan x="24" y="1200.00">获 ChatGPT 输入。其他平台、移动应用和外部 AI </tspan><tspan x="24" y="1224.75">读取连接器，不作为现在已可安装的能力承诺。</tspan></text><path id="faq-zh-390.023" d="M24 1284.05 L366 1284.05" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="faq-zh-390.024" font-family="Noto Serif CJK SC" font-size="25" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="1331.80">有了聊天历史，为什么还需要</tspan><tspan x="24" y="1364.80">它？</tspan></text><text id="faq-zh-390.025" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1416.50">PAIA 为你自己的话提供一个独立的工作层：回看</tspan><tspan x="24" y="1441.25">、编辑、核对原话，再选择复用哪些内容。只使</tspan><tspan x="24" y="1466.00">用一个 AI 产品，也可能有这样的需要。</tspan></text><path id="faq-zh-390.026" d="M24 1525.3 L366 1525.3" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="faq-zh-390.027" font-family="Noto Serif CJK SC" font-size="25" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="1573.05">我可以修改文字吗？</tspan></text><text id="faq-zh-390.028" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1624.75">可以编辑工作版本，而不让今天的修改冒充昨天</tspan><tspan x="24" y="1649.50">的原始表达。原始记录和工作版本承担不同职责</tspan><tspan x="24" y="1674.25">。</tspan></text><path id="faq-zh-390.029" d="M24 1733.55 L366 1733.55" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="faq-zh-390.030" font-family="Noto Serif CJK SC" font-size="25" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="1781.30">这是整个 AI 账号的备份吗？</tspan></text><text id="faq-zh-390.031" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="1833.00">不是。捕获、受支持的历史导入和 PAIA 备份各有</tspan><tspan x="24" y="1857.75">范围；内测产品不承诺完整恢复外部 AI 账号。</tspan></text><path id="faq-zh-390.032" d="M24 1917.05 L366 1917.05" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="faq-zh-390.033" font-family="Noto Serif CJK SC" font-size="25" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="1964.80">本地优先意味着完全不联网吗</tspan><tspan x="24" y="1997.80">？</tspan></text><text id="faq-zh-390.034" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2049.50">不意味着。官网需要在线托管，申请内测使用已</tspan><tspan x="24" y="2074.25">说明的转发服务，外部 AI 也有独立的联网边界。</tspan><tspan x="24" y="2099.00">本地优先并不是加密认证。</tspan></text><path id="faq-zh-390.035" d="M24 2158.3 L366 2158.3" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="faq-zh-390.036" font-family="Noto Serif CJK SC" font-size="25" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="2206.05">我复制发送的文字，就是我的</tspan><tspan x="24" y="2239.05">观点吗？</tspan></text><text id="faq-zh-390.037" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2290.75">不一定。它可能是引用、岗位描述、草稿、问题</tspan><tspan x="24" y="2315.50">或角色扮演。PAIA 应保留这种区别，而不是据此</tspan><tspan x="24" y="2340.25">编造个人画像。</tspan></text><path id="faq-zh-390.038" d="M24 2399.55 L366 2399.55" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="faq-zh-390.039" font-family="Noto Serif CJK SC" font-size="25" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="2447.30">发给外部的内容，还能收回吗</tspan><tspan x="24" y="2480.30">？</tspan></text><text id="faq-zh-390.040" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2532.00">不能。PAIA 可以停止由它控制的后续提供，但不</tspan><tspan x="24" y="2556.75">能收回已经发送到外部系统或导出的副本。</tspan></text><path id="faq-zh-390.041" d="M24 2616.05 L366 2616.05" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="faq-zh-390.042" font-family="Noto Serif CJK SC" font-size="25" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="2663.80">官网示例展示的是我的真实档</tspan><tspan x="24" y="2696.80">案吗？</tspan></text><text id="faq-zh-390.043" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2748.50">不是。示例使用虚构材料，不连接你的档案，也</tspan><tspan x="24" y="2773.25">不调用实时 AI 模型。刷新会清除临时修改。</tspan></text><path id="faq-zh-390.044" d="M24 2832.55 L366 2832.55" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="faq-zh-390.045" font-family="Noto Serif CJK SC" font-size="25" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#171c19"><tspan x="24" y="2880.30">怎样获得使用资格？</tspan></text><text id="faq-zh-390.046" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="2932.00">申请邀请制内测。提交表单不代表已安装、已被</tspan><tspan x="24" y="2956.75">录取，也不代表已核验邮件送达。</tspan></text><path id="faq-zh-390.047" d="M24 3046.05 L366 3046.05" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="faq-zh-390.048" font-family="Noto Serif CJK SC" font-size="36" font-weight="400" font-style="normal" letter-spacing="1.2" text-anchor="start" fill="#171c19"><tspan x="24" y="3113.93">PAIA</tspan></text><text id="faq-zh-390.049" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="3157.50">让你的思考，拥有更长的明天。</tspan></text><text id="faq-zh-390.050" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="3229.94">探索</tspan></text><text id="faq-zh-390.051" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="3270.43">使用方式</tspan></text><text id="faq-zh-390.052" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="3299.43">使用场景</tspan></text><text id="faq-zh-390.053" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="3328.43">体验示例</tspan></text><text id="faq-zh-390.054" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="204" y="3229.94">观点</tspan></text><text id="faq-zh-390.055" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="204" y="3270.43">我们的故事</tspan></text><text id="faq-zh-390.056" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="204" y="3299.43">手记</tspan></text><text id="faq-zh-390.057" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="204" y="3328.43">申请内测</tspan></text><text id="faq-zh-390.058" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="2.4" text-anchor="start" fill="#707975"><tspan x="24" y="3405.94">信任</tspan></text><text id="faq-zh-390.059" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="3446.43">你的数据</tspan></text><text id="faq-zh-390.060" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="3475.43">当前状态</tspan></text><text id="faq-zh-390.061" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="3504.43">隐私 · 条款</tspan></text><text id="faq-zh-390.062" font-family="Noto Sans CJK SC" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#616969"><tspan x="24" y="3533.43">联系</tspan></text><path id="faq-zh-390.063" d="M24 3616.05 L366 3616.05" fill="none" stroke="#dfe2dc" stroke-width="1"/><text id="faq-zh-390.064" font-family="Noto Sans CJK SC" font-size="10.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="24" y="3649.77">© 2026 PAIA · 内测阶段</tspan></text><text id="faq-zh-390.065" font-family="Noto Sans CJK SC" font-size="11" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="end" fill="#707975"><tspan x="366" y="3650.18">EN   /   中文</tspan></text><text id="faq-zh-390.066" font-family="Noto Sans CJK SC" font-size="9.5" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start" fill="#707975"><tspan x="24" y="3675.94">摄影署名 · 所有材料均为示例，并非真实档案</tspan></text></svg>