<text x="454" y="150" font-size="42" font-weight="700" fill="#20251f">Product research &amp; decisions</text>
<text x="454" y="204" font-size="15" fill="#687267">September 8, 2026</text>

<text x="454" y="278" font-size="15" fill="#727c70">21:48</text>
<text x="454" y="320" font-size="25" fill="#20251f">I want to solve the problems users repeatedly encounter before adding more features.</text>
<text x="454" y="390" font-size="15" fill="#727c70">22:13</text>
<text x="454" y="432" font-size="25" fill="#20251f">Version one should show value quickly, without making users learn complex settings first.</text>
<text x="454" y="502" font-size="15" fill="#727c70">22:27</text>
<text x="454" y="544" font-size="25" fill="#20251f">Important history should stay traceable to its source while preserving the user’s own edits.</text>
<text x="454" y="614" font-size="15" fill="#727c70">23:05</text>
<text x="454" y="656" font-size="25" fill="#20251f">The reading view should stay quiet, with the content more prominent than system status.</text>

<line x1="454" y1="720" x2="1320" y2="720" stroke="#e1e5de"/>
<text x="454" y="764" font-size="14" fill="#687267">Continuous reading · Autosave · Traceable sources</text>
<circle cx="1320" cy="756" r="16" fill="#eef2eb"/>
