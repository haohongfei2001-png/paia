<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980">
  <rect width="720" height="980" fill="#fbfcf9"/>
  <g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="44" y="56" font-size="13" font-weight="700" letter-spacing="1.7" fill="#657b59">AI CONTEXT · PREVIEW</text>
    <text x="44" y="112" font-size="34" font-weight="700" fill="#20251f">发送之前，先看清</text>
    <text x="44" y="154" font-size="34" font-weight="700" fill="#20251f">AI 会知道什么。</text>
    <text x="44" y="194" font-size="15" fill="#687267">授权范围、来源和当前问题保持可见，</text>
    <text x="44" y="220" font-size="15" fill="#687267">复制前可以移除任何内容。</text>

    <text x="44" y="278" font-size="14" fill="#657b59">当前问题</text>
    <rect x="44" y="300" width="632" height="112" rx="16" fill="#ffffff" stroke="#dfe4dc"/>
    <text x="68" y="340" font-size="20" fill="#20251f">我应该怎样调整自己的长期学习系统，</text>
    <text x="68" y="374" font-size="20" fill="#20251f">让回看旧内容更容易？</text>

    <text x="44" y="468" font-size="14" fill="#657b59">已授权主题</text>
    <rect x="44" y="490" width="182" height="42" rx="11" fill="#eef2eb"/>
    <text x="65" y="517" font-size="15" fill="#344130">长期学习系统</text>
    <rect x="238" y="490" width="168" height="42" rx="11" fill="#eef2eb"/>
    <text x="259" y="517" font-size="15" fill="#344130">阅读与研究</text>
    <rect x="418" y="490" width="126" height="42" rx="11" fill="#eef2eb"/>
    <text x="439" y="517" font-size="15" fill="#344130">工作流</text>

    <text x="44" y="590" font-size="14" fill="#657b59">Context Preview</text>
    <rect x="44" y="612" width="632" height="282" rx="18" fill="#ffffff" stroke="#dfe4dc"/>
    <text x="68" y="648" font-size="12.5" fill="#727c70">高度相关 · 来自「长期学习系统」</text>
    <text x="68" y="686" font-size="18" fill="#20251f">过去几个月的判断逐渐从“收集更多”</text>
    <text x="68" y="716" font-size="18" fill="#20251f">转向“降低重新阅读旧内容的成本”。</text>
    <line x1="68" y1="752" x2="652" y2="752" stroke="#e7eae5"/>
    <text x="68" y="788" font-size="12.5" fill="#727c70">人工确认 · 来自「工作流」</text>
    <text x="68" y="826" font-size="18" fill="#20251f">希望减少持续手工整理，把更多注意力</text>
    <text x="68" y="856" font-size="18" fill="#20251f">留给真正的阅读和判断。</text>

    <text x="44" y="938" font-size="13" fill="#7a8378">发送前预览 · 最小授权 · 来源可追溯</text>
  </g>
</svg>