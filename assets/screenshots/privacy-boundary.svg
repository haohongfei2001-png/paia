<svg xmlns="http://www.w3.org/2000/svg" width="1512" height="840" viewBox="0 0 1512 840">
  <rect width="1512" height="840" fill="#fbfcf9"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
    <text x="86" y="88" font-size="14" font-weight="600" letter-spacing="1.2" fill="#657b59">PRIVACY BOUNDARY</text>
    <text x="86" y="143" font-size="34" font-weight="700" fill="#20251f">私人数据先留在本地，授权之后才形成最小上下文。</text>

    <rect x="86" y="218" width="520" height="430" rx="16" fill="#ffffff" stroke="#dbe2d9"/>
    <rect x="86" y="218" width="5" height="430" rx="2.5" fill="#e4ebe2"/>
    <text x="126" y="270" font-size="13" font-weight="600" letter-spacing="1.1" fill="#657b59">LOCAL DEVICE</text>
    <text x="126" y="322" font-size="30" font-weight="700" fill="#20251f">PAIA</text>

    <rect x="126" y="360" width="440" height="68" rx="11" fill="#fbfcf9" stroke="#e1e6df"/>
    <text x="152" y="402" font-size="18" fill="#465244">Input Archive</text>
    <rect x="126" y="450" width="440" height="68" rx="11" fill="#fbfcf9" stroke="#e1e6df"/>
    <text x="152" y="492" font-size="18" fill="#465244">Thought Library</text>
    <rect x="126" y="540" width="440" height="68" rx="11" fill="#fbfcf9" stroke="#e1e6df"/>
    <text x="152" y="582" font-size="18" fill="#465244">Local retrieval &amp; preview</text>

    <path d="M606 430 H656" stroke="#aeb8af" stroke-width="1.6" fill="none"/>
    <path d="M644 422 L656 430 L644 438" fill="none" stroke="#aeb8af" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="672" y="322" width="210" height="216" rx="14" fill="#f6f8f4" stroke="#dce3d9"/>
    <text x="698" y="365" font-size="12" font-weight="600" letter-spacing="1" fill="#657b59">AUTHORIZATION GATE</text>
    <circle cx="777" cy="430" r="27" fill="#657b59"/>
    <path d="M765 430 l8 8 17-20" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="712" y="496" font-size="15" fill="#5f695e">用户明确允许</text>

    <path d="M882 430 H930" stroke="#aeb8af" stroke-width="1.6" fill="none"/>
    <path d="M918 422 L930 430 L918 438" fill="none" stroke="#aeb8af" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="946" y="270" width="474" height="320" rx="16" fill="#ffffff" stroke="#dbe2d9"/>
    <text x="986" y="322" font-size="13" font-weight="600" letter-spacing="1.1" fill="#657b59">MINIMAL CONTEXT</text>
    <text x="986" y="376" font-size="28" font-weight="700" fill="#20251f">External AI</text>
    <line x1="986" y1="408" x2="1376" y2="408" stroke="#e2e6df"/>
    <text x="986" y="454" font-size="17" fill="#5f695e">只包含与当前问题相关、</text>
    <text x="986" y="486" font-size="17" fill="#5f695e">且位于授权范围内的内容。</text>
    <text x="986" y="540" font-size="14" fill="#737d76">可预览 · 可排除 · 可撤销</text>

    <text x="86" y="726" font-size="14" fill="#7d877f">“能被保存”与“能被外部 AI 使用”始终是两件不同的事。</text>
  </g>
