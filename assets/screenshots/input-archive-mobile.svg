<svg xmlns="http://www.w3.org/2000/svg" width="720" height="940" viewBox="0 0 720 940">
  <rect width="720" height="940" fill="#ffffff"/>
  <g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="44" y="58" font-size="15" fill="#768074">← 聊天窗口</text>
    <text x="544" y="58" font-size="14" fill="#657b59">版本历史</text>

    <text x="44" y="126" font-size="38" font-weight="700" fill="#20251f">产品研究与决策</text>
    <text x="44" y="164" font-size="14" fill="#8c958a">2026年9月8日 · 连续阅读</text>

    <line x1="44" y1="204" x2="676" y2="204" stroke="#e6e9e3"/>

    <text x="44" y="250" font-size="14" fill="#9aa198">21:48</text>
    <text x="44" y="292" font-size="23" fill="#20251f">我更想先解决用户真正会反复遇到的问题，</text>
    <text x="44" y="326" font-size="23" fill="#20251f">而不是一次塞进很多功能。</text>

    <text x="44" y="390" font-size="14" fill="#9aa198">22:13</text>
    <text x="44" y="432" font-size="23" fill="#20251f">第一版应该让新用户很快看到价值，</text>
    <text x="44" y="466" font-size="23" fill="#20251f">而不是要求他们先学习复杂的设置。</text>

    <text x="44" y="530" font-size="14" fill="#9aa198">22:27</text>
    <text x="44" y="572" font-size="23" fill="#20251f">重要的历史信息需要能追溯来源，</text>
    <text x="44" y="606" font-size="23" fill="#20251f">也要允许用户保留自己的修改。</text>

    <text x="44" y="670" font-size="14" fill="#9aa198">23:05</text>
    <text x="44" y="712" font-size="23" fill="#20251f">阅读界面应该尽量安静，</text>
    <text x="44" y="746" font-size="23" fill="#20251f">让正文比系统状态更突出。</text>

    <line x1="44" y1="814" x2="676" y2="814" stroke="#e1e5de"/>
    <text x="44" y="856" font-size="14" fill="#7d867b">连续阅读 · 自动保存 · 来源可追溯</text>
    <rect x="44" y="884" width="122" height="34" rx="17" fill="#eef2eb"/>
    <text x="67" y="906" font-size="13" font-weight="700" fill="#53684b">INPUT ARCHIVE</text>
