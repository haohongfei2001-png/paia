<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980">
  <rect width="720" height="980" fill="#fbfcf9"/>
  <g font-family="Arial,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="44" y="58" font-size="14" fill="#687267">← Thought Library</text>
    <text x="44" y="120" font-size="36" font-weight="700" fill="#20251f">Long-term Learning System</text>
    <rect x="502" y="86" width="174" height="46" rx="23" fill="#f2f4f0" stroke="#cfd7cc"/>
    <text x="520" y="115" font-size="14" fill="#667163">AI Organized</text>
    <rect x="614" y="94" width="48" height="30" rx="15" fill="#d9ded6"/>
    <circle cx="629" cy="109" r="11" fill="#ffffff" stroke="#c6cdc2"/>

    <rect x="44" y="164" width="632" height="46" rx="11" fill="#f8f9f6" stroke="#e0e5dd"/>
    <text x="66" y="193" font-size="14" fill="#727c70">Search within this topic…</text>

    <text x="44" y="274" font-size="23" font-weight="700" fill="#20251f">Information capture</text>
    <text x="44" y="306" font-size="13" fill="#727c70">July 2026</text>
    <text x="44" y="350" font-size="18" fill="#20251f">Putting every resource into one system does not</text>
    <text x="44" y="380" font-size="18" fill="#20251f">automatically improve how I learn.</text>
    <text x="44" y="418" font-size="18" fill="#20251f">The real problem may be that I rarely return</text>
    <text x="44" y="448" font-size="18" fill="#20251f">to notes I made months ago.</text>

    <line x1="44" y1="498" x2="676" y2="498" stroke="#e7eae5"/>

    <text x="44" y="554" font-size="23" font-weight="700" fill="#20251f">Review and organization</text>
    <text x="44" y="586" font-size="13" fill="#727c70">August 2026</text>
    <text x="44" y="630" font-size="18" fill="#20251f">Instead of generating more summaries, I want</text>
    <text x="44" y="660" font-size="18" fill="#20251f">to preserve the understanding I had at the time.</text>
    <text x="44" y="698" font-size="18" fill="#20251f">Lower review friction may be enough for</text>
    <text x="44" y="728" font-size="18" fill="#20251f">structure to emerge through long-term use.</text>

    <line x1="44" y1="778" x2="676" y2="778" stroke="#e7eae5"/>

    <text x="44" y="834" font-size="23" font-weight="700" fill="#20251f">Open question</text>
    <text x="44" y="866" font-size="13" fill="#727c70">September 2026</text>
    <text x="44" y="910" font-size="18" fill="#20251f">How can long-term topics stay stable without losing</text>
    <text x="44" y="940" font-size="18" fill="#20251f">detail through overly broad grouping?</text>
  </g>
</svg>