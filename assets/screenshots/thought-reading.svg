<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" preserveAspectRatio="xMidYMid meet">
  <rect width="1440" height="960" fill="#fbfcf9"/>
  <rect width="218" height="960" fill="#f5f7f3"/>
  <line x1="218" y1="0" x2="218" y2="960" stroke="#e4e8e1"/>
  <g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="34" y="62" font-size="34" font-weight="700" fill="#20251f">PAIA</text>
    <text x="34" y="164" font-size="18" fill="#798276">Input Archive</text>
    <text x="34" y="214" font-size="18" font-weight="700" fill="#243024">Thought Library</text>
    <text x="34" y="264" font-size="18" fill="#798276">AI Context</text>

    <text x="270" y="72" font-size="16" fill="#768373">← 思想库</text>
    <text x="342" y="150" font-size="42" font-weight="700" fill="#20251f">长期学习系统</text>

    <rect x="1080" y="98" width="176" height="54" rx="27" fill="#f2f4f0" stroke="#cfd7cc"/>
    <text x="1104" y="132" font-size="16" fill="#667163">AI整理</text>
    <rect x="1203" y="108" width="42" height="34" rx="17" fill="#d9ded6"/>
    <circle cx="1220" cy="125" r="13" fill="#ffffff" stroke="#c6cdc2"/>

    <rect x="342" y="190" width="604" height="48" rx="11" fill="#f8f9f6" stroke="#e0e5dd"/>
    <text x="367" y="220" font-size="15" fill="#8a9388">在当前主题中查找…</text>
    <text x="1000" y="220" font-size="14" fill="#7d877b">时间</text>
    <rect x="1040" y="192" width="70" height="44" rx="10" fill="#eef2eb"/>
    <text x="1059" y="220" font-size="14" fill="#42513f">正序</text>
    <text x="1130" y="220" font-size="14" fill="#8a9388">倒序</text>
    <text x="1204" y="220" font-size="14" fill="#74806f">目录</text>

    <text x="342" y="306" font-size="25" font-weight="700" fill="#20251f">信息获取</text>
    <text x="342" y="344" font-size="13" fill="#919991">2026年7月</text>
    <text x="342" y="392" font-size="20" fill="#20251f">我发现把所有资料都塞进一个系统，并不会自然提高学习效率。</text>
    <text x="342" y="434" font-size="20" fill="#20251f">真正的问题可能不是收集得不够，而是很少重新回到过去的笔记。</text>

    <line x1="342" y1="478" x2="1260" y2="478" stroke="#e7eae5"/>

    <text x="342" y="536" font-size="25" font-weight="700" fill="#20251f">回看与整理</text>
    <text x="342" y="574" font-size="13" fill="#919991">2026年8月</text>
    <text x="342" y="622" font-size="20" fill="#20251f">比起自动生成更多摘要，我更希望保留当时的理解，再把相近内容放到一起。</text>
    <text x="342" y="664" font-size="20" fill="#20251f">如果回看成本足够低，长期积累本身就会慢慢形成结构。</text>

    <line x1="342" y1="708" x2="1260" y2="708" stroke="#e7eae5"/>

    <text x="342" y="766" font-size="25" font-weight="700" fill="#20251f">还在形成的问题</text>
    <text x="342" y="804" font-size="13" fill="#919991">2026年9月</text>
    <text x="342" y="852" font-size="20" fill="#20251f">怎样让长期主题保持稳定，又不会因为分类过粗而失去细节？</text>

    <text x="342" y="914" font-size="13" fill="#969e95">原始表达、时间和思考过程保持在同一条阅读脉络中。</text>
  </g>
</svg>
