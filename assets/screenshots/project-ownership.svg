<svg xmlns="http://www.w3.org/2000/svg" width="1512" height="910" viewBox="0 0 1512 910">
  <rect width="1512" height="910" fill="#fbfcf9"/>
  <text x="92" y="82" font-family="Arial,sans-serif" font-size="14" letter-spacing="3" fill="#657b59">WHAT I OWNED</text>
  <text x="92" y="136" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#20251f">从产品判断，到结构，再到真实落地。</text>
  <text x="92" y="174" font-family="Arial,sans-serif" font-size="17" fill="#7b8479">AI 协同用于加速实现，但产品方向、边界和验收由产品判断驱动。</text>

  <g font-family="Arial,sans-serif">
    <rect x="92" y="248" width="632" height="230" rx="18" fill="#ffffff" stroke="#dfe4dc"/>
    <text x="124" y="286" font-size="13" fill="#657b59">01 · PRODUCT DEFINITION</text>
    <text x="124" y="334" font-size="27" font-weight="700" fill="#20251f">问题与产品定义</text>
    <text x="124" y="380" font-size="17" fill="#596357">从长期使用 AI 的真实痛点出发，定义 PAIA 要解决什么，</text>
    <text x="124" y="412" font-size="17" fill="#596357">以及它不应该变成什么。</text>

    <rect x="788" y="248" width="632" height="230" rx="18" fill="#ffffff" stroke="#dfe4dc"/>
    <text x="820" y="286" font-size="13" fill="#657b59">02 · INFORMATION ARCHITECTURE</text>
    <text x="820" y="334" font-size="27" font-weight="700" fill="#20251f">信息架构</text>
    <text x="820" y="380" font-size="17" fill="#596357">持续区分 Source、Input、Thought 与 AI Context，</text>
    <text x="820" y="412" font-size="17" fill="#596357">避免事实、用户工作和 AI 派生内容互相覆盖。</text>

    <rect x="92" y="516" width="632" height="230" rx="18" fill="#ffffff" stroke="#dfe4dc"/>
    <text x="124" y="554" font-size="13" fill="#657b59">03 · AI CAPABILITY BOUNDARY</text>
    <text x="124" y="602" font-size="27" font-weight="700" fill="#20251f">AI 能力边界</text>
    <text x="124" y="648" font-size="17" fill="#596357">判断哪些任务交给规则，哪些需要模型理解，</text>
    <text x="124" y="680" font-size="17" fill="#596357">以及何时必须由用户明确授权和确认。</text>

    <rect x="788" y="516" width="632" height="230" rx="18" fill="#eef2eb" stroke="#cfD8ca"/>
    <text x="820" y="554" font-size="13" fill="#657b59">04 · DELIVERY &amp; VALIDATION</text>
    <text x="820" y="602" font-size="27" font-weight="700" fill="#20251f">落地与验证</text>
    <text x="820" y="648" font-size="17" fill="#596357">使用 Codex 协同推进 Chrome Extension 实现、测试、</text>
    <text x="820" y="680" font-size="17" fill="#596357">真实环境部署和持续产品迭代。</text>
  </g>

  <line x1="92" y1="804" x2="1420" y2="804" stroke="#dfe4dc"/>
  <text x="92" y="848" font-family="Arial,sans-serif" font-size="15" fill="#7b8479">Independent Product Design / AI-assisted Development</text>
  <text x="1420" y="848" text-anchor="end" font-family="Arial,sans-serif" font-size="15" fill="#657b59">2026.08 — Present</text>
</svg>
