<svg xmlns="http://www.w3.org/2000/svg" width="1512" height="900" viewBox="0 0 1512 900">
  <rect width="1512" height="900" fill="#fbfcf9"/>
  <text x="92" y="96" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" letter-spacing="3" fill="#7b8479">PAIA PRODUCT STRUCTURE</text>
  <text x="92" y="154" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="42" font-weight="700" fill="#20251f">从事实，到思想，再到可授权的 AI 上下文</text>
  <text x="92" y="196" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#6f796e">每一层回答不同的问题，后层不能静默改写前层。</text>

  <g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="92" y="274" width="285" height="360" rx="22" fill="#f2f5ef" stroke="#d9e0d5"/>
    <text x="122" y="322" font-size="13" letter-spacing="1.5" fill="#74806f">FACT LAYER</text>
    <text x="122" y="372" font-size="30" font-weight="700" fill="#20251f">Source Record</text>
    <text x="122" y="420" font-size="18" fill="#5f6b5d">发生过什么？</text>
    <line x1="122" y1="458" x2="347" y2="458" stroke="#d7ddd3"/>
    <text x="122" y="500" font-size="17" fill="#667063">不可变来源事实</text>
    <text x="122" y="536" font-size="17" fill="#667063">来源身份与原始时间</text>
    <text x="122" y="572" font-size="17" fill="#667063">永久删除遵循 tombstone</text>

    <rect x="420" y="274" width="285" height="360" rx="22" fill="#fff" stroke="#d9e0d5"/>
    <text x="450" y="322" font-size="13" letter-spacing="1.5" fill="#74806f">WORKING LAYER</text>
    <text x="450" y="372" font-size="30" font-weight="700" fill="#20251f">Input Archive</text>
    <text x="450" y="420" font-size="18" fill="#5f6b5d">我现在怎么表达？</text>
    <line x1="450" y1="458" x2="675" y2="458" stroke="#d7ddd3"/>
    <text x="450" y="500" font-size="17" fill="#667063">连续阅读与直接编辑</text>
    <text x="450" y="536" font-size="17" fill="#667063">搜索、版本与来源追溯</text>
    <text x="450" y="572" font-size="17" fill="#667063">同步不覆盖用户工作</text>

    <rect x="748" y="274" width="285" height="360" rx="22" fill="#fff" stroke="#d9e0d5"/>
    <text x="778" y="322" font-size="13" letter-spacing="1.5" fill="#74806f">THOUGHT LAYER</text>
    <text x="778" y="372" font-size="30" font-weight="700" fill="#20251f">Thought Library</text>
    <text x="778" y="420" font-size="18" fill="#5f6b5d">我长期在想什么？</text>
    <line x1="778" y1="458" x2="1003" y2="458" stroke="#d7ddd3"/>
    <text x="778" y="500" font-size="17" fill="#667063">跨会话长期 Topic</text>
    <text x="778" y="536" font-size="17" fill="#667063">默认原话优先</text>
    <text x="778" y="572" font-size="17" fill="#667063">AI 整理是可切换派生层</text>

    <rect x="1076" y="274" width="344" height="360" rx="22" fill="#edf2e9" stroke="#cdd8c8"/>
    <text x="1106" y="322" font-size="13" letter-spacing="1.5" fill="#647b58">AUTHORIZED LAYER</text>
    <text x="1106" y="372" font-size="30" font-weight="700" fill="#20251f">AI Context</text>
    <text x="1106" y="420" font-size="18" fill="#50604b">这一次允许 AI 知道什么？</text>
    <line x1="1106" y1="458" x2="1388" y2="458" stroke="#cfd9ca"/>
    <text x="1106" y="500" font-size="17" fill="#5d6d58">显式授权与排除</text>
    <text x="1106" y="536" font-size="17" fill="#5d6d58">本地检索与上下文预算</text>
    <text x="1106" y="572" font-size="17" fill="#5d6d58">发送前 Preview，可撤销</text>
  </g>

  <g fill="none" stroke="#aab4a6" stroke-width="2">
    <path d="M377 454 H407"/>
    <path d="M705 454 H735"/>
    <path d="M1033 454 H1063"/>
  </g>
  <g fill="#74806f">
    <path d="M407 454 l-10 -7 v14 z"/>
    <path d="M735 454 l-10 -7 v14 z"/>
    <path d="M1063 454 l-10 -7 v14 z"/>
  </g>

  <rect x="92" y="704" width="1328" height="88" rx="18" fill="#f6f8f4" stroke="#e0e5dd"/>
  <text x="122" y="742" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" letter-spacing="1.2" fill="#647b58">CORE PRINCIPLE</text>
  <text x="122" y="775" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#455143">同步只补充事实，不重置用户工作；AI 可以组织和解释，但不能静默改写用户历史。</text>
</svg>
