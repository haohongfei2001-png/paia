<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980">
  <rect width="720" height="980" fill="#fbfcf9"/>
  <g font-family="Arial,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="44" y="58" font-size="14" fill="#687267">← Thought Library</text>
    <text x="44" y="120" font-size="36" font-weight="700" fill="#20251f">Long-term Learning System</text>
    <rect x="502" y="86" width="174" height="46" rx="23" fill="#e4ece0" stroke="#a7b99f"/>
    <text x="520" y="115" font-size="14" font-weight="700" fill="#40513b">AI Organized</text>
    <rect x="614" y="94" width="48" height="30" rx="15" fill="#718967"/>
    <circle cx="647" cy="109" r="11" fill="#ffffff"/>

    <rect x="44" y="172" width="632" height="206" rx="18" fill="#f3f7f1" stroke="#d7e2d3"/>
    <text x="68" y="208" font-size="12.5" font-weight="700" letter-spacing="1.4" fill="#6b825f">CURRENT VIEW</text>
    <text x="68" y="252" font-size="23" font-weight="700" fill="#20251f">Current understanding</text>
    <text x="68" y="294" font-size="17" fill="#20251f">The system does not mainly need more capture.</text>
    <text x="68" y="324" font-size="17" fill="#20251f">It needs to reduce the cost of returning to older material</text>
    <text x="68" y="354" font-size="17" fill="#20251f">while preserving the original understanding and its changes.</text>

    <text x="44" y="438" font-size="12.5" font-weight="700" letter-spacing="1.4" fill="#6b825f">KEY PRINCIPLES</text>

    <rect x="44" y="462" width="632" height="112" rx="16" fill="#f7f9f5" stroke="#dbe5d7"/>
    <text x="68" y="496" font-size="15" font-weight="700" fill="#52634d">Review first</text>
    <text x="68" y="532" font-size="17" fill="#20251f">Lower the friction of opening old material before adding more inputs.</text>

    <rect x="44" y="592" width="632" height="112" rx="16" fill="#f7f9f5" stroke="#dbe5d7"/>
    <text x="68" y="626" font-size="15" font-weight="700" fill="#52634d">Preserve sources</text>
    <text x="68" y="662" font-size="17" fill="#20251f">Interpretation may evolve, but original wording and time remain.</text>

    <rect x="44" y="722" width="632" height="112" rx="16" fill="#f7f9f5" stroke="#dbe5d7"/>
    <text x="68" y="756" font-size="15" font-weight="700" fill="#52634d">Low maintenance</text>
    <text x="68" y="792" font-size="17" fill="#20251f">Structure should emerge through use, not constant manual cleanup.</text>

    <text x="44" y="892" font-size="12.5" font-weight="700" letter-spacing="1.4" fill="#6b825f">THOUGHT EVOLUTION</text>
    <line x1="68" y1="930" x2="646" y2="930" stroke="#dce4d8" stroke-width="2"/>
    <circle cx="92" cy="930" r="6" fill="#8fa286"/>
    <circle cx="360" cy="930" r="6" fill="#7e9673"/>
    <circle cx="622" cy="930" r="6" fill="#657b59"/>
  </g>
</svg>