<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760">
  <rect width="1320" height="760" fill="#fbfcf9"/>
  <g font-family="Arial,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="74" y="72" font-size="13" font-weight="700" letter-spacing="1.8" fill="#657b59">AI CONTEXT · PREVIEW</text>
    <text x="74" y="124" font-size="34" font-weight="700" fill="#20251f">See exactly what AI will know before you send it.</text>
    <text x="74" y="162" font-size="16" fill="#687267">Authorization scope, sources, and the current question stay visible. Remove anything before copying.</text>

    <text x="74" y="224" font-size="14" fill="#657b59">Current question</text>
    <rect x="74" y="246" width="1172" height="76" rx="15" fill="#ffffff" stroke="#dfe4dc"/>
    <text x="102" y="293" font-size="19" fill="#20251f">How should I redesign my learning system so older material is easier to revisit?</text>

    <text x="74" y="372" font-size="14" fill="#657b59">Authorized topics</text>
    <rect x="74" y="392" width="214" height="46" rx="12" fill="#eef2eb"/><text x="98" y="421" font-size="16" fill="#344130">Learning system</text>
    <rect x="304" y="392" width="208" height="46" rx="12" fill="#eef2eb"/><text x="328" y="421" font-size="16" fill="#344130">Reading &amp; research</text>
    <rect x="528" y="392" width="148" height="46" rx="12" fill="#eef2eb"/><text x="552" y="421" font-size="16" fill="#344130">Workflows</text>

    <text x="74" y="494" font-size="14" fill="#657b59">Context Preview</text>
    <rect x="74" y="516" width="1172" height="164" rx="18" fill="#ffffff" stroke="#dfe4dc"/>
    <text x="102" y="550" font-size="12.5" fill="#727c70">Highly relevant · from “Learning system”</text>
    <text x="102" y="586" font-size="18" fill="#20251f">Over the past few months, the goal has shifted from “capture more” to “make old material easier to revisit.”</text>
    <line x1="102" y1="612" x2="1218" y2="612" stroke="#e7eae5"/>
    <text x="102" y="642" font-size="12.5" fill="#727c70">Manually confirmed · from “Workflows”</text>
    <text x="102" y="670" font-size="18" fill="#20251f">Reduce constant manual organization so more attention can go to reading and judgment.</text>
  </g>
</svg>
